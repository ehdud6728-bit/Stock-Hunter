behavior_tests:
  actual_ohlcv_execution:
  - G.gap_min
  - G.gap_max
  - G.vol50
  - L.amount
  - L.close_loc
  system_contract:
  - primary_priority
  - IT_I_unique
  note: Complex strategies are audited on deterministic positive/negative historical
    samples. Boundary OHLCV synthesis is currently provided for simple G/L families.
operation_lock:
  mode: PAPER
  real_orders: 0
  auto_live_change: false
  auto_runner: false
  auto_fail_cutoff: false
  auto_big_cluster: false
legacy_policy: The prior duplicated backtest evaluator is retained only for migration
  delta diagnostics and is excluded from current performance population.
thread_safety_contract:
  explicit_hist_parameter_required: true
  global_load_df_monkeypatch_forbidden: true
  input_frame_mutation_forbidden: true
  concurrent_cross_frame_mismatch_allowed: 0
  determinism_mismatch_allowed: 0
