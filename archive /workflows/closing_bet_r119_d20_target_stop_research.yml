name: Closing Bet R1.19 D20 Target Hits and Stop-First x v49.76 (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closebet-r119-d20-target-stop-readonly-provenance
  cancel-in-progress: false

jobs:
  r119_research:
    name: R118 verified cohort and 1907 KRX date pins + D20 first touch (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      R117_RUN: '38856340802'
      R117_ARTIFACT: 'closebet-r117-integrated-source-limited-audit-38856340802'
      R171_RUN: '38664095610'

    steps:
      - name: Checkout research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned analysis dependencies only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6' 'pandas==2.2.3'
      - name: Strict fail-closed research tests before any downloading
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r118_partial_market_wave_geometry.py closebet_research/r119_d20_first_touch_research.py tests/test_r118_partial_market_wave_geometry.py tests/test_r119_d20_first_touch_research.py
          python -m unittest discover -s tests -p 'test_r118_partial_market_wave_geometry.py' -v
          python -m unittest discover -s tests -p 'test_r119_d20_first_touch_research.py' -v
          python -m closebet_research.r118_partial_market_wave_geometry --help >/dev/null
          python -m closebet_research.r119_d20_first_touch_research --help >/dev/null
          echo 'R119_PY310_23_TESTS_PASS'
      - name: Download immutable historical inputs (no market refetch, no LIVE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/r117 evidence/raw0 evidence/raw1 evidence/raw2 evidence/raw3 evidence/history_archives
          gh run download "$R117_RUN" --repo "$GITHUB_REPOSITORY" --name "$R117_ARTIFACT" --dir evidence/r117
          for i in 0 1 2 3; do
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" --name "r171-history-$i" --dir "evidence/raw$i"
            test "$(find "evidence/raw$i" -maxdepth 1 -name '*manifest*.json' | wc -l)" -eq 1
            test "$(find "evidence/raw$i" -maxdepth 1 -name '*.csv.gz' | wc -l)" -ge 450
          done
          test -s evidence/r117/r117_integrity_manifest.json
          test -s evidence/r117/r117_covered_cohort_d0_features_d1open_d5close.csv
          echo 'R118_PINNED_SOURCE_DOWNLOADED'
      - name: Download SHA-pinned original 8-shard v49.76 raw predicate and opportunity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/original_shards
          for i in 0 1 2 3 4 5 6 7; do
            mkdir -p "evidence/rawshard_$i"
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" --name "r17-krx-shard-$i" --dir "evidence/rawshard_$i"
            test "$(find "evidence/rawshard_$i" -maxdepth 1 -name 'shard_*_manifest.json' | wc -l)" -eq 1
            test "$(find "evidence/rawshard_$i" -maxdepth 1 -name 'shard_*_raw.csv' | wc -l)" -eq 1
            test "$(find "evidence/rawshard_$i" -maxdepth 1 -name 'shard_*_opportunity_census.csv' | wc -l)" -eq 1
          done
          python - <<'PY_ORIGINAL'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(8):
              d=Path(f'evidence/rawshard_{i}')
              members=sorted(x for x in d.iterdir() if x.is_file())
              assert len(members)>=10,(i,len(members))
              p=Path(f'evidence/original_shards/pinned_{i}.zip')
              with ZipFile(p,'w',compression=ZIP_STORED) as z:
                  for f in members:z.write(f,arcname=f.name)
          print('R118_EIGHT_UNMODIFIED_RAW_PREDICATE_SHARDS_READY')
          PY_ORIGINAL
      - name: Materialize four archives WITHOUT rewriting gz member bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(4):
              d=Path(f'evidence/raw{i}')
              members=sorted(x for x in d.iterdir() if x.is_file())
              assert len(members)>=451, (i,len(members))
              p=Path(f'evidence/history_archives/krx_immutable_{i}.zip')
              with ZipFile(p,'w',compression=ZIP_STORED) as z:
                  for f in members:z.write(f,arcname=f.name)
          print('R118_FOUR_UNMODIFIED_GZ_ARCHIVES_READY')
          PY
      - name: Verify 1907 exact KRX day hashes and 45-day wave geometry
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r118_partial_market_wave_geometry \
            --r117-root evidence/r117 \
            --history-dir evidence/history_archives \
            --original-shards-dir evidence/original_shards \
            --out reports/r118
      - name: Strict scope and result hash assertions (not a full market backtest)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('reports/r118/r118_integrity_manifest.json').read_text())
          assert m['status']=='PASS_FULL_MARKET_GAP_AND_BROAD_WAVE_COVERED_COHORT_ONLY_NOT_FULL_PIT_RECALL'
          assert m['research_only'] and m['never_live_or_orders']
          assert m['source_r117_run']==38856340802 and m['source_r171_run']==38664095610
          assert m['krx_daily_sha_days_verified']==1907
          assert m['source_date_count']==45 and m['stored_code_day_count']==40305
          assert m['source_selected_code_days']==1059
          assert m['v4976_original_shard_verification']['raw_rows']==8742
          assert m['v4976_original_shard_verification']['raw_unique_code_days']==7925
          assert m['v4976_original_shard_verification']['opportunity_census_rows']==15190
          assert m['true_market_rows_sum_45days']==129247
          assert m['stored_rows_sum_45days']==40305 and m['unobserved_rows_sum_45days']==88942
          assert m['limitations']['true_historical_whole_market_eligible_denominator']=='UNKNOWN'
          assert m['limitations']['genuine_trading_signal_or_claim']=='NOT_APPROVED'
          for name,expected in m['file_sha256'].items():
              got=hashlib.sha256((Path('reports/r118')/name).read_bytes()).hexdigest()
              assert got==expected,(name,'OUTPUT_SHA_MISMATCH')
          print('R118_STRICT_RESEARCH_PASS; FULL_MARKET_PIT_UNAVAILABLE; LIVE_AUTHORITY=NONE')
          PY
      - name: Compute D+5/10/15/20 high touches and D+20 TP5 vs STOP3/5/7 first-touch
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r119_d20_first_touch_research \
            --r118-root reports/r118 \
            --history-dir evidence/history_archives \
            --output reports/r119
      - name: Fail closed on source scope, censoring, simulated fills and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_R119'
          from pathlib import Path
          import json,hashlib,pandas as pd
          root=Path('reports/r119')
          m=json.loads((root/'r119_integrity_manifest.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS_LIMITED_COHORT_D20_DESCRIPTIVE_NOT_TRADE_APPROVED',m
          assert m['research_only'] and not m['live_search_changed'] and not m['orders_changed'] and not m['shadow_board_changed']
          assert m['source_rows']==40305 and m['selected_unique_code_days']==1059
          assert m['krx_source_daily_sha_days_verified']==1907
          assert m['d20_complete_rows']==22897 and m['d20_incomplete_right_censored_rows']==17408
          assert m['limits']['pit_full_market_denominator']=='UNKNOWN_NOT_AVAILABLE'
          assert m['limits']['live_trading_approval'] is False
          for name,sha in m['file_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          d=pd.read_csv(root/'r119_target_high_touch_rates_d5_d10_d15_d20.csv')
          row=d[(d.panel=='all')&(d.group=='V4976_SELECTED')&(d.quality=='ASOF_ELIGIBLE_NO_POSTD0_SUSPECT_JUMP')&(d.horizon==20)&(d.target_pct==5)]
          assert len(row)==1 and int(row.iloc[0].complete_horizon_n)>0
          print('R119_STRICT_D20_EVENT_RESEARCH_PASS; NO_LIVE_AUTHORITY; NOT_TRADE_APPROVED')
          PY_R119
      - name: Upload verified D20 research only; no market refetch or LIVE effect
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r119-d20-target-stop-research-${{ github.run_id }}
          path: reports/r119/
          if-no-files-found: error
          retention-days: 45
