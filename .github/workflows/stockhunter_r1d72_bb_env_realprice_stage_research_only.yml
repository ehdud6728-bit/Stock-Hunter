name: StockHunter R1-D72 BB Env Real-Price Stage Review (RESEARCH ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only analysis dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Fail-closed frozen input check and 15 tests
        run: |
          set -euo pipefail
          test -f research_inputs/r1d71/SHA256SUMS.txt
          sha256sum --check research_inputs/r1d71/SHA256SUMS.txt
          python -m unittest discover -s tests -p 'test_r1d72.py' -v
      - name: Download pinned historical R1-D71 report and eight KRX price archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/r1d72_source
          while read -r label artifact sha; do
            file="reports/r1d72_source/${label}.zip"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ehdud6728-bit/Stock-Hunter/actions/artifacts/${artifact}/zip" -o "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum --check -
          done <<'FROZEN_ARTIFACTS'
          r1d71 13010684887 fd5bb5d6adf3b622bcf4bdd8a864041a38b8891486d996a17ad3ee474aa20f1d
          shard_0 12208596109 84dd5aa62f0c9538cd9c2d0ed0540c8f74063b21be49d9ecfc81e4b1583368b5
          shard_1 12207608558 3d372eebf915c870badf103356c3700d5fa914a32d79ce8057ef1f4c4f89295b
          shard_2 12209930511 5c49df64ad10bafbc09dd7ea78b9377804735fda6ad861018750b396ab2a27cb
          shard_3 12209696204 7a359f5959e2374622c40d068920adf9d695142b61b540d0752a8cb9bb4dd8
          shard_4 12208882046 88b35ea4c9a8a6a0ed4b61250a8018d49ee7ba4489c7345f04012915bb60f997
          shard_5 12208443687 eb503f7cabcc40991037092c6463437c8a8b71d43fb26fe646ea4f56885b3814
          shard_6 12211336402 b3cc055d919c7ab92d7f27b1b3ce6d3e56df787b107af961eaa43dedb885d6cd
          shard_7 12212241289 9563747eb8b27928ba0a0d2b7d3cf02e787acd2e9e4a656d410c286139321478
          FROZEN_ARTIFACTS
      - name: Execute independent actual KRX price / band / entry stage replay
        run: |
          set -euo pipefail
          python research_formulas/r1d72_source_price_replay.py \
            --r1d71 reports/r1d72_source/r1d71.zip \
            --shards reports/r1d72_source/shard_{0..7}.zip \
            --out reports/r1d72
      - name: Assert zero tracked LIVE modifications
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload research-only audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R1D72_BB_ENV_REALPRICE_STAGE_RESEARCH_ONLY
          path: reports/r1d72/
          if-no-files-found: warn
          retention-days: 30
