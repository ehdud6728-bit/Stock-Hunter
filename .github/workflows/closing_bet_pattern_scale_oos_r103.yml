name: Closing Bet Pattern + Scale OOS R1.0.3

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "v49.76 backtest source run"
        required: true
        default: "35295676895"
        type: string
      r102_run_id:
        description: "Successful R1.0.2 run"
        required: true
        default: "35308434562"
        type: string
      discovery_end:
        required: true
        default: "2026-08-18"
        type: string
      oos_start:
        required: true
        default: "2026-08-19"
        type: string
      oos_end:
        required: true
        default: "2026-09-18"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
      R102_HISTORY_WORKERS: "6"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pykrx finance-datareader

      - name: Download v49.76 source artifact
        run: |
          mkdir -p source_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts

      - name: Download successful R1.0.2 artifact
        run: |
          mkdir -p r102_artifacts
          gh run download "${{ inputs.r102_run_id }}" -D r102_artifacts

      - name: Restore R1.0.2 causal OHLCV cache
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/closebet_structure_env_oos_r102
          key: closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-${{ inputs.r102_run_id }}
          restore-keys: |
            closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-

      - name: Rebuild R1.0.2 causal OHLCV only if cache is absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv ]; then
            echo "R102 history cache absent -> rebuilding through R1.0.2"
            python -u closing_bet_structure_env_oos_r102_causal_history.py \
              --source-root source_artifacts \
              --discovery-end "${{ inputs.discovery_end }}" \
              --oos-start "${{ inputs.oos_start }}" \
              --oos-end "${{ inputs.oos_end }}"
          else
            echo "R102 history cache restored"
          fi

      - name: Run Pattern + Profile + Scale-in + Environment OOS R1.0.3
        shell: bash
        run: |
          set -euo pipefail
          python -u closing_bet_pattern_scale_oos_r103.py \
            --r102-root r102_artifacts \
            --history-cache .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv \
            --output-dir reports/closebet_pattern_scale_oos_r103 \
            --discovery-end "${{ inputs.discovery_end }}" \
            --oos-start "${{ inputs.oos_start }}" \
            --oos-end "${{ inputs.oos_end }}"

      - name: Validate R1.0.3 research-only invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_pattern_scale_oos_r103/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] is True and m['production_eligible'] is False
          assert m['selection_logic_changed'] is False
          assert m['score_rank_changed'] is False
          assert m['order_logic_changed'] is False
          assert m['same_sample_retuning'] is False
          assert m['discovery_end']=='2026-08-18'
          assert m['oos_start']=='2026-08-19'
          assert m['oos_end']=='2026-09-18'
          assert int(m['oos_rows'])>0
          assert int(m['scale_event_rows'])>0
          print('R103_PATTERN_SCALE_OOS PASS',m['oos_rows'],m['scale_event_rows'],m['patterns'])
          PY

      - name: Upload R1.0.3 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-pattern-scale-oos-r103-${{ github.run_id }}
          path: reports/closebet_pattern_scale_oos_r103/**
          if-no-files-found: warn
          retention-days: 30
