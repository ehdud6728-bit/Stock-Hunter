name: REAL_FULL R1C1 R1.4.3 Path Integrity

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful run_scanner run id; blank = latest valid R1.4.2 artifact"
        required: false
        default: ""
        type: string
  schedule:
    # KST 17:10 weekdays. Separate research lane; never invokes main7_bugfix_2.py.
    - cron: '10 08 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: real-full-r143-path-integrity-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  r143-path-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      R143_STATE_DIR: reports/.cache/real_full_trust_r1/r143
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install R1.4.3 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader

      - name: Restore R1.4.3 append-only ledger
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/real_full_trust_r1/r143
          key: stockhunter-real-full-r143-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-real-full-r143-${{ github.ref_name }}-

      - name: Run R1.4.3 prospective path integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        run: |
          set -euo pipefail
          args=(--github-repo "$GITHUB_REPOSITORY")
          if [ -n "${SOURCE_RUN_ID}" ]; then args+=(--source-run-id "${SOURCE_RUN_ID}"); fi
          python -u real_full_r1c1_path_integrity_r143.py "${args[@]}"

      - name: Validate R1.4.3 research-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/real_full_r1c1_r143/real_full_r1c1_r143_meta.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          assert m['status']=='PASS', m
          assert m['research_only'] is True
          assert m['production_eligible'] is False
          assert m['selection_logic_changed'] is False
          assert m['score_rank_changed'] is False
          assert m['order_logic_changed'] is False
          assert m['new_gate_added'] is False
          assert m['threshold_changed'] is False
          assert m['same_sample_retuning'] is False
          assert m['predictor_refetch_used'] is False
          print('R143_INVARIANTS PASS', m.get('seed_rows'), m.get('outcome_rows_by_horizon'))
          PY

      - name: Save R1.4.3 append-only ledger
        if: success()
        uses: actions/cache/save@v4
        with:
          path: reports/.cache/real_full_trust_r1/r143
          key: stockhunter-real-full-r143-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload R1.4.3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-r143-path-integrity-${{ github.run_id }}
          path: |
            reports/real_full_r1c1_r143/**
          if-no-files-found: warn
          retention-days: 30
