  # Five independent 100-name GitHub runners; the legacy R118 200-stock
  # job above is deliberately SKIPPED for auto500 to prevent recomputation.
  r118-parallel500-shard:
    if: ${{ inputs.study == 'r1d118' && inputs.r118_mode == 'auto500' }}
    name: R118 500 parallel shard ${{ matrix.shard }} of 5 (100 stocks)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout frozen sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research-only pinned Parquet decoder
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'pyarrow>=15,<25'

      - name: Regression tests for R118 500 parallel partition and shard identity
        run: |
          set -euo pipefail
          python -m unittest discover -s research_projects/r1d118/tests -v

      - name: Validate auto500 uses only immutable auto sources
        shell: bash
        env:
          SHARD_INDEX_INPUT: ${{ inputs.r118_shard_index }}
          SHARD_COUNT_INPUT: ${{ inputs.r118_shard_count }}
          LINE_INPUT: ${{ inputs.r118_line_states }}
          ROLE_INPUT: ${{ inputs.r118_role_events }}
          MARKET_INPUT: ${{ inputs.r118_market_daily }}
          SECTOR_INPUT: ${{ inputs.r118_sector_pit }}
        run: |
          set -euo pipefail
          if [[ "$SHARD_INDEX_INPUT" != '0' || "$SHARD_COUNT_INPUT" != '1' ]]; then
            echo '::error::auto500 uses internal 5-way matrix; leave user shard inputs at 0/1'; exit 2
          fi
          if [[ -n "$LINE_INPUT" || -n "$ROLE_INPUT" || -n "$MARKET_INPUT" || -n "$SECTOR_INPUT" ]]; then
            echo '::error::auto500 requires frozen auto historical data sources only'; exit 2
          fi

      - name: Recompute R111-R117 and R118 on exactly 100 stocks
        shell: bash
        run: |
          set -euo pipefail
          python -u research_projects/r1d118/parallel500_shard.py \
            --shard-index ${{ matrix.shard }} \
            | tee research_projects/r1d118/R118_PARALLEL500_SHARD_${{ matrix.shard }}.log

      - name: Persist the atomic shard independently, including when others fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R118500_SHARD_${{ matrix.shard }}
          path: research_projects/r1d118/.auto_parallel500_artifacts/shard_${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  # When all five receipts exist, verify exact 500-code partition and merge
  # already materialized R118 event rows WITHOUT re-running signal detection.
  r118-parallel500-merge:
    if: ${{ inputs.study == 'r1d118' && inputs.r118_mode == 'auto500' }}
    needs: r118-parallel500-shard
    name: R118 merge-only 500 and 5 win / 5 loss actual OHLCV charts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout unchanged research sources
        uses: actions/checkout@v4
