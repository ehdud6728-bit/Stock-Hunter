            test -f research_projects/r1d115/research_r1d115.py
            test -f research_projects/r1d115/tests/test_r1d115.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d116/recent_turn.py
            test -f research_projects/r1d116/research_r1d116.py
            test -f research_projects/r1d116/tests/test_r1d116.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d117/stable_roles.py
            test -f research_projects/r1d117/research_r1d117.py
            test -f research_projects/r1d117/tests/test_r1d117.py
          fi
          (cd research_projects/r1d97 && sha256sum --check SHA256_INPUTS.txt)

      - name: Install research-only Python dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' matplotlib

      - name: Install R1-D115 SciPy for independent ATR pivot baseline
        if: ${{ inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
