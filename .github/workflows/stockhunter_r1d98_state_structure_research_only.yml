            test -f research_projects/r1d106/tests/test_r1d106.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d107/quality.py
            test -f research_projects/r1d107/research_r1d107.py
            test -f research_projects/r1d107/tests/test_r1d107.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d108/candle_context.py
            test -f research_projects/r1d108/lifecycle.py
            test -f research_projects/r1d108/research_r1d108.py
            test -f research_projects/r1d108/tests/test_r1d108.py
