            test -f research_projects/r1d112/research_r1d112.py
            test -f research_projects/r1d112/tests/test_r1d112.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d113/structures.py
            test -f research_projects/r1d113/research_r1d113.py
            test -f research_projects/r1d113/tests/test_r1d113.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d114/structure_audit.py
            test -f research_projects/r1d114/full_context.py
            test -f research_projects/r1d114/research_r1d114.py
            test -f research_projects/r1d114/tests/test_r1d114.py
            test -f research_projects/r1d112/research_r1d112.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
