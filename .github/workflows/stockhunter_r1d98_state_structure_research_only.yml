      - name: Install research-only Python dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' matplotlib

      - name: Install Korean font for R1-D100 research charts
        if: ${{ inputs.study == 'r1d100' || inputs.study == 'r1d101' || inputs.study == 'r1d102' || inputs.study == 'r1d103' || inputs.study == 'r1d104' || inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'all' }}
        run: |
          sudo apt-get update -qq
