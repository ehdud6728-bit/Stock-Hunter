          if [[ "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
