            test -f research_projects/r1d117/tests/test_r1d117.py
          fi
          (cd research_projects/r1d97 && sha256sum --check SHA256_INPUTS.txt)

      - name: Install research-only Python dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' matplotlib

      - name: Install R1-D115 SciPy for independent ATR pivot baseline
        if: ${{ inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
        run: python -m pip install 'scipy>=1.13,<2'

      - name: Install Korean font for R1-D100 research charts
