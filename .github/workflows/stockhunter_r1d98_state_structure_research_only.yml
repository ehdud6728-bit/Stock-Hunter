        if: ${{ inputs.study == 'r1d102' || inputs.study == 'r1d103' || inputs.study == 'r1d104' || inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'r1d114' || inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
        run: python -m unittest discover -s research_projects/r1d102/tests -v

      - name: Check R1-D103 MA role interaction and no-lookahead tests
        if: ${{ inputs.study == 'r1d103' || inputs.study == 'r1d104' || inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'r1d114' || inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
        run: python -m unittest discover -s research_projects/r1d103/tests -v

      - name: Check R1-D104 integrated trendline MA BB ENV PIT tests
        if: ${{ inputs.study == 'r1d104' || inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'r1d114' || inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
        run: python -m unittest discover -s research_projects/r1d104/tests -v

      - name: Check R1-D105 all-source event inventory and PIT tests
        if: ${{ inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'r1d114' || inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
        run: python -m unittest discover -s research_projects/r1d105/tests -v

