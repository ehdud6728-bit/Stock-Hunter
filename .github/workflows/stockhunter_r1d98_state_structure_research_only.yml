            test -f research_projects/r1d115/tests/test_r1d115.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
