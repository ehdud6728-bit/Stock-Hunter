name: StockHunter R1-D98 through D113 Shared Trendline Research (RESEARCH ONLY)
run-name: "Trendline Research ${{ inputs.study }}"

on:
  workflow_dispatch:
    inputs:
      study:
        description: 'Choose which research version to run'
        type: choice
        required: true
        default: r1d113
        options:
          - r1d98
          - r1d99
          - both
          - r1d100
          - r1d101
          - r1d102
          - r1d103
          - r1d104
          - r1d105
          - r1d106
          - r1d107
          - r1d108
          - r1d109
          - r1d110
          - r1d111
          - r1d112
          - r1d113
          - all

permissions:
  contents: read

jobs:
  trendline-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen sources and CSV input hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f research_projects/r1d97/research_r1d96.py
          test -f research_projects/r1d97/research_r1d97.py
          test -f research_projects/r1d98/research_r1d98.py
          test -f research_projects/r1d98/state_machine.py
          test "$(git rev-parse HEAD:research_projects/r1d97/research_r1d96.py)" = b3476db4b204b19344a2e1d3c8693bfca52df094
          test "$(git rev-parse HEAD:research_projects/r1d97/research_r1d97.py)" = 861a025a6775f03a14d2516655204c20749c52ea
          if [[ "${{ inputs.study }}" == 'r1d99' || "${{ inputs.study }}" == 'both' || "${{ inputs.study }}" == 'r1d100' || "${{ inputs.study }}" == 'r1d101' || "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d99/research_r1d99.py
            test -f research_projects/r1d99/recency_dedup.py
            test -f research_projects/r1d99/tests/test_r1d99.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d100' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d100/research_r1d100.py
            test -f research_projects/r1d100/dynamic_structure.py
            test -f research_projects/r1d100/tests/test_r1d100.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d101' || "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d101/pre_rise.py
            test -f research_projects/r1d101/research_r1d101.py
            test -f research_projects/r1d101/tests/test_r1d101.py
            test -f research_projects/r1d100/dynamic_structure.py
