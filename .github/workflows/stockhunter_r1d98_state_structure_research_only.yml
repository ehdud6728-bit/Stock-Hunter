            test -f research_projects/r1d111/tests/test_r1d111.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d112' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d112/multiscale.py
            test -f research_projects/r1d112/research_r1d112.py
            test -f research_projects/r1d112/tests/test_r1d112.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d113/structures.py
            test -f research_projects/r1d113/research_r1d113.py
            test -f research_projects/r1d113/tests/test_r1d113.py
            test -f research_projects/r1d112/research_r1d112.py
          fi
