          if [[ "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d110/episodes.py
            test -f research_projects/r1d110/research_r1d110.py
            test -f research_projects/r1d110/tests/test_r1d110.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d111/algorithms.py
            test -f research_projects/r1d111/lifecycle.py
            test -f research_projects/r1d111/patterns.py
            test -f research_projects/r1d111/research_r1d111.py
            test -f research_projects/r1d111/tests/test_r1d111.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d112' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
