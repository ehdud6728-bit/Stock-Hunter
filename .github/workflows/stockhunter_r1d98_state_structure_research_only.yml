        run: python -m unittest discover -s research_projects/r1d97/tests -v

      - name: Check R1-D98 state-machine tests
        run: python -m unittest discover -s research_projects/r1d98/tests -v

      - name: Check R1-D99 WATCH history tests
        if: ${{ inputs.study == 'r1d99' || inputs.study == 'both' || inputs.study == 'r1d100' || inputs.study == 'r1d101' || inputs.study == 'r1d102' || inputs.study == 'r1d103' || inputs.study == 'r1d104' || inputs.study == 'r1d105' || inputs.study == 'r1d106' || inputs.study == 'r1d107' || inputs.study == 'r1d108' || inputs.study == 'r1d109' || inputs.study == 'r1d110' || inputs.study == 'r1d111' || inputs.study == 'r1d112' || inputs.study == 'r1d113' || inputs.study == 'r1d114' || inputs.study == 'r1d115' || inputs.study == 'r1d116' || inputs.study == 'r1d117' || inputs.study == 'all' }}
