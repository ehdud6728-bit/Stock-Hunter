name: StockHunter R1-D98 through D117 Shared Trendline Research (RESEARCH ONLY)
run-name: "Trendline Research ${{ inputs.study }}"

on:
  workflow_dispatch:
    inputs:
      study:
        description: 'Choose which research version to run'
        type: choice
        required: true
        default: r1d117
        options:
          - r1d98
          - r1d99
          - both
          - r1d100
          - r1d101
          - r1d102
          - r1d103
          - r1d104
          - r1d105
          - r1d106
          - r1d107
          - r1d108
          - r1d109
          - r1d110
          - r1d111
          - r1d112
          - r1d113
          - r1d114
          - r1d115
          - r1d116
          - r1d117
          - r1d118
          - blue20_rsi_delay
          - blue20_multifactor
          - blue20_ma_structure
          - blue20_candle_exhaustion
          - blue20_profile_cloud_avwap
          - blue20_repeated_resistance
          - blue20_price_interaction
          - blue20_structure_validation
          - blue20_trend_stop
          - blue20_vp_signal_audit
          - all
      r118_mode:
        description: 'R118: auto=200 stocks, auto500=500 stocks+10 audited charts; smoke=sample, manifest=manual'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - auto500
          - smoke
          - manifest
      r118_manifest:
        description: 'R118 manifest relative path (SHA-pinned code,path,sha256)'
        type: string
        required: false
        default: 'research_projects/r1d118/inputs/manifest.csv'
      r118_shard_index:
        description: 'R118 0-based shard index'
        type: number
        default: 0
      r118_shard_count:
        description: 'R118 number of shards'
        type: number
        default: 1
      r118_line_states:
        description: 'Optional full PIT line state CSV path (no MA line substitutes)'
        type: string
        default: ''
      r118_line_mode:
        description: 'R112, R116, or R117 historical PIT schema'
        type: choice
        default: R117
        options:
          - R112
          - R116
          - R117
      r118_role_events:
        description: 'Optional R112 exact broken-line retest event CSV'
        type: string
        default: ''
      r118_market_daily:
        description: 'Optional market,date,close,amount CSV'
        type: string
        default: ''
      r118_sector_pit:
        description: 'Optional code,date,sector,market PIT CSV'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  trendline-research-only:
    # auto500 uses a separate 5-runner matrix below; do not double-compute.
    if: ${{ inputs.study != 'blue20_rsi_delay' && inputs.study != 'blue20_multifactor' && inputs.study != 'blue20_ma_structure' && inputs.study != 'blue20_candle_exhaustion' && inputs.study != 'blue20_profile_cloud_avwap' && inputs.study != 'blue20_repeated_resistance' && inputs.study != 'blue20_price_interaction' && inputs.study != 'blue20_structure_validation' && inputs.study != 'blue20_trend_stop' && inputs.study != 'blue20_vp_signal_audit' && (inputs.study != 'r1d118' || inputs.r118_mode != 'auto500') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen sources and CSV input hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f research_projects/r1d97/research_r1d96.py
          test -f research_projects/r1d97/research_r1d97.py
          test -f research_projects/r1d98/research_r1d98.py
          test -f research_projects/r1d98/state_machine.py
          test "$(git rev-parse HEAD:research_projects/r1d97/research_r1d96.py)" = b3476db4b204b19344a2e1d3c8693bfca52df094
          test "$(git rev-parse HEAD:research_projects/r1d97/research_r1d97.py)" = 861a025a6775f03a14d2516655204c20749c52ea
          if [[ "${{ inputs.study }}" == 'r1d99' || "${{ inputs.study }}" == 'both' || "${{ inputs.study }}" == 'r1d100' || "${{ inputs.study }}" == 'r1d101' || "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d99/research_r1d99.py
            test -f research_projects/r1d99/recency_dedup.py
            test -f research_projects/r1d99/tests/test_r1d99.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d100' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d100/research_r1d100.py
            test -f research_projects/r1d100/dynamic_structure.py
            test -f research_projects/r1d100/tests/test_r1d100.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d101' || "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d101/pre_rise.py
            test -f research_projects/r1d101/research_r1d101.py
            test -f research_projects/r1d101/tests/test_r1d101.py
            test -f research_projects/r1d100/dynamic_structure.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d102/research_r1d102.py
            test -f research_projects/r1d102/cloud_geometry.py
            test -f research_projects/r1d102/tests/test_r1d102.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d103/research_r1d103.py
            test -f research_projects/r1d103/ma_roles.py
            test -f research_projects/r1d103/tests/test_r1d103.py
          fi
          if [[ "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'r1d114' || "${{ inputs.study }}" == 'r1d115' || "${{ inputs.study }}" == 'r1d116' || "${{ inputs.study }}" == 'r1d117' || "${{ inputs.study }}" == 'all' ]]; then
