          if [[ "${{ inputs.study }}" == 'r1d102' || "${{ inputs.study }}" == 'r1d103' || "${{ inputs.study }}" == 'r1d104' || "${{ inputs.study }}" == 'r1d105' || "${{ inputs.study }}" == 'r1d106' || "${{ inputs.study }}" == 'r1d107' || "${{ inputs.study }}" == 'r1d108' || "${{ inputs.study }}" == 'r1d109' || "${{ inputs.study }}" == 'r1d110' || "${{ inputs.study }}" == 'r1d111' || "${{ inputs.study }}" == 'r1d113' || "${{ inputs.study }}" == 'all' ]]; then
            test -f research_projects/r1d102/research_r1d102.py
            test -f research_projects/r1d102/cloud_geometry.py
