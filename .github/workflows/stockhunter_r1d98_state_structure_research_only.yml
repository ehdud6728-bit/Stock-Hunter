        with:
          python-version: '3.11'

      - name: Install merger and chart dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'matplotlib>=3.8,<4'

      - name: Download all five immutable shard artifacts
        uses: actions/download-artifact@v4
