          assert hashlib.sha256(dest.read_bytes()).hexdigest()==p['r1d26e_sha256'],'PRICE_OUTCOME_SOURCE_SHA_CHANGED'
          print('R1D26H_OUTCOME_ARCHIVE_ADMITTED_ONLY_AFTER_NEW200_SOURCE_SEAL')
          PY_OUTCOME
          python -m unittest discover -s tests -p 'test_stockhunter_r1d26h_holdout.py' -v
      - name: Only after full raw source seal, evaluate ONE predeclared new-D-holdout feature
        run: |
