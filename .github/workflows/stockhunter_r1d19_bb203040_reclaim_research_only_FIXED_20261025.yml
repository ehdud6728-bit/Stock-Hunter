      - name: Reject partial collection or missing predeclared primary while retaining diagnostic artifact
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY_FINAL'
          import json,pathlib
          s=pathlib.Path('reports/r1d26h/result/source/R1D26H_COLLECTION_MANIFEST.json')
          t=pathlib.Path('reports/r1d26h/result/locked_primary/R1D26H_QA_MANIFEST.json')
          assert s.exists(),'R1D26H_NO_SOURCE_MANIFEST'
          m=json.loads(s.read_text())
          assert m['mode']=='collect' and m['holdout_new_completed']==200 and m['combined_rows']==6000,'R1D26H_SOURCE_NOT_FULL_DO_NOT_CLAIM_SUCCESS'
          assert t.exists(),'R1D26H_NO_LOCKED_HOLDOUT_EVALUATION'
          x=json.loads(t.read_text())
          assert x['holdout_events']==200 and not x['strategy_ready'] and x['orders_placed']==0
          print('R1D26H_VERIFIED_SOURCE_300_OF_300_AND_UNTOUCHED_200_HOLDOUT_EVALUATION_COMPLETE_NOT_PIT')
          PY_FINAL

  # R1-D26I audits the already-frozen G exploratory and H disjoint historical holdout.
