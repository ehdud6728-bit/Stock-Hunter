name: StockHunter Research Hub R1-D19 to R1-D27B (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "One hub for historical research through R1D27B (NO LIVE)"
        type: choice
        required: true
        default: r1d19_protocol_lock
        options:
          - r1d19_protocol_lock
          - r1d19_historical_reclaim
          - r1d20_protocol_lock
          - r1d20_historical_validation
          - r1d22_historical_supplemental
          - r1d23_thesis_lock
          - r1d23_fullmarket_four_thesis
          - r1d24_historical_D_breakout_audit
          - r1d25_protocol_lock_only
          - r1d25_historical_validate
          - r1d26_true_investor_source_probe
          - r1d26b_single_source_diagnostic
          - r1d26c_historical_20x20_investor_krw
          - r1d26d_historical_flow_d30_descriptive_qa
          - r1d26e_historical_hit_ladder_descriptive
          - r1d26f_staged_100_investor_krw
          - r1d26g_historical_100_flow_hit_ladder
          - r1d26h_new200_ticker_disjoint_institution_accel_test
          - r1d26i_g_vs_h_holdout_failure_official_crosscheck_qa
          - r1d26k_same_month_success_failure_matched_risk_audit
          - r1d26l_daily_ohlcv_chronological_exit_pilot
          - r1d26m_first3day_fast_stop_audit
          - r1d26n_static_structural_support_stop_research
          - r1d26o_frozen_support_reclaim_reentry_research
          - r1d26p_reclaim_rebreak_investor_net_flow_research
          - r1d26q_new_d125_ticker_disjoint_reclaim_flow_holdout
          - r1d26r_new_a_d200_repeated_break_entry_filter_research
          - r1d26u_new_a_d200_entry_location_historical_holdout
          - r1d26v_new_a_d200_corrected_entry_fill_historical_holdout
          - r1d27a_fullmarket_bb_ma_width_d30_investor_sample
          - r1d27b_krx_secret_auth_http_diagnostic

permissions:
  contents: read
  actions: read

concurrency:
  group: stockhunter-r1d19-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RESEARCH_ONLY: '1'
  STOCKHUNTER_LIVE_ENABLE: '0'
  STOCKHUNTER_ORDER_ENABLE: '0'
  STOCKHUNTER_SCORE_RANK_ENABLE: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: Asia/Seoul

jobs:
  # R1-D19 adds only historical exploratory research; no production scanner, scores, rank, or orders.
  r1d19_protocol_lock:
    name: R1-D19 lock BB20/30/40 reclaim definitions [RESEARCH ONLY; NO OUTCOMES]
    if: ${{ inputs.scope == 'r1d19_protocol_lock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved R1-D18 immutable protocol
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('R1D18_PREDECLARED_PROTOCOL.json',encoding='utf-8'))
          assert p['training_cutoff']=='2026-10-23' and p['effective_signal_date_min']=='2026-10-26'
          assert p['baseline_pin']['run_id']==40141210428 and p['primary_horizon_trading_days']==5
          print('R1D18_FROZEN_PROSPECTIVE_PROTOCOL_UNCHANGED')
          PY
      - name: Install isolated numerical dependencies and run fail-closed unit tests
        run: |
          set -euo pipefail
          pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
          python -m unittest discover -s tests -p test_stockhunter_r1d19_bb_reclaim.py -v
          python -m research_formulas.stockhunter_r1d19_bb_reclaim --mode protocol \
            --protocol R1D19_PREDECLARED_PROTOCOL.json --out reports/r1d19/result/lock
      - name: Upload R1-D19 locked exploratory protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d19-PREDECLARED-BB203040-HISTORIC-PROTOCOL-NOT-OOS
          path: |
            R1D19_PREDECLARED_PROTOCOL.json
            reports/r1d19/result/lock/**
          retention-days: 90
          if-no-files-found: warn

  r1d19_historical_reclaim:
    name: R1-D19 BB20/BB30/BB40 historical source-verified 224 PROXY cohort (NOT NEW OOS)
    if: ${{ inputs.scope == 'r1d19_historical_reclaim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original source code blobs, protocol and isolation tests
        run: |
          set -euo pipefail
          pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
          python -m unittest discover -s tests -p test_stockhunter_r1d19_bb_reclaim.py -v
          python - <<'PY'
          from research_formulas.stockhunter_r1d19_bb_reclaim import source_protocol
          from pathlib import Path
          import hashlib, json
          p=source_protocol('R1D19_PREDECLARED_PROTOCOL.json')
          d18=json.loads(Path('R1D18_PREDECLARED_PROTOCOL.json').read_text())
          assert d18['training_cutoff']=='2026-10-23' and d18['effective_signal_date_min']=='2026-10-26'
          frozen={
            'research_formulas/formula66_r1d6_oos_holdout.py':'00c78a26117670768b70772f578edcb5995e48a5',
            'research_formulas/formula66_r1d7_path_risk_audit.py':'4efbb3edd5d5e50786cc90420292b7854eb8e203',
          }
          for path,expected in frozen.items():
            b=Path(path).read_bytes()
            x=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
            assert x==expected, 'FROZEN_ORIGINAL_CODE_BLOB_DRIFT_'+path
          print('R1D19_SOURCES_PROTOCOL_FROZEN')
          PY
      - name: Verify three immutable GitHub runs and their source artifact hashes BEFORE download
        run: |
          set -euo pipefail
          mkdir -p reports/r1d19/pins
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197" > reports/r1d19/pins/krx_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197/artifacts?per_page=100" > reports/r1d19/pins/krx_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39941707036" > reports/r1d19/pins/d6_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39941707036/artifacts?per_page=100" > reports/r1d19/pins/d6_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39948595864" > reports/r1d19/pins/d7_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39948595864/artifacts?per_page=100" > reports/r1d19/pins/d7_artifacts.json
          python - <<'PYPIN'
          import json,pathlib
          from research_formulas import formula66_r1d6_oos_holdout as d6
          p=json.load(open('R1D19_PREDECLARED_PROTOCOL.json'))['historical_source']
          root=pathlib.Path('reports/r1d19/pins')
          def run(k,id_,sha):
            r=json.loads((root/f'{k}_run.json').read_text())
            assert r['id']==id_ and r['conclusion']=='success' and r['head_sha']==sha,'RUN_PIN_DRIFT_'+k
          def artifacts(k):return json.loads((root/f'{k}_artifacts.json').read_text())['artifacts']
          def one(rows,name,id_,digest):
            matches=[a for a in rows if a['id']==id_ and a['name']==name and not a['expired']]
            assert len(matches)==1 and matches[0]['digest']=='sha256:'+digest,'ARTIFACT_PIN_DRIFT_'+name
          run('krx',p['krx_run'],p['krx_head_sha'])
          run('d6',p['r1d6_run'],p['r1d6_head_sha'])
          run('d7',p['r1d7_run'],p['r1d7_head_sha'])
          aa=artifacts('krx')
          for i,digest in d6.EXPECTED_SHARD_DIGESTS.items():
            matched=[a for a in aa if a['name']==f'stockhunter-allkrx-price-shard-{i}' and not a['expired']]
            assert len(matched)==1 and matched[0]['digest']=='sha256:'+digest,'KRX_SHARD_DRIFT_'+str(i)
          one(artifacts('d6'),'stockhunter-r1d6-OOS-ASOF-ONLY-NO-FUTURE',p['r1d6_asof_artifact_id'],p['r1d6_asof_artifact_zip_sha256'])
          one(artifacts('d7'),'stockhunter-r1d7-FROZEN-D6-RETROSPECTIVE-PATH-RISK-NOT-OOS',p['r1d7_artifact_id'],p['r1d7_artifact_zip_sha256'])
          print('R1D19_ORIGINAL_ALL_8_SHARDS_R1D6_R1D7_DIGESTS_VERIFIED')
          PYPIN
      - name: Download original unchanged 1907 KRX price sessions (eight verified shards)
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          merge-multiple: true
          path: reports/r1d19/input/krx
      - name: Download immutable R1-D6 5247 frozen ASOF event keys, no outcomes
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d6-OOS-ASOF-ONLY-NO-FUTURE
          run-id: 39941707036
          github-token: ${{ github.token }}
          path: reports/r1d19/input/d6asof
      - name: Download exact R1-D7 sealed historical path outcomes, not recomputed
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d7-FROZEN-D6-RETROSPECTIVE-PATH-RISK-NOT-OOS
          run-id: 39948595864
          github-token: ${{ github.token }}
          path: reports/r1d19/input/d7
      - name: ASOF-first BB20/30/40 reclaim, SHA seal, THEN retrospective path comparison
        run: |
          set -euo pipefail
          python -m research_formulas.stockhunter_r1d19_bb_reclaim \
            --mode historical --protocol R1D19_PREDECLARED_PROTOCOL.json \
            --krx-root reports/r1d19/input/krx \
            --d6-asof reports/r1d19/input/d6asof \
            --d7 reports/r1d19/input/d7 \
            --out reports/r1d19/result/historical
          python - <<'PY'
          import json
          m=json.load(open('reports/r1d19/result/historical/R1D19_MANIFEST.json'))
          assert m['historical_signals']==5247 and m['d7_original_path_rows']==5247*4
          assert m['krx_daily_sha_verified']==1907 and m['complete_d20_original']==5214
          assert not m['future_independent_oos'] and not m['strategy_ready']
          assert m['orders_placed']==0 and m['production_unchanged']
          print('R1D19_HISTORIC_BB_COMPARISON_RESEARCH_ONLY_PASS')
          PY
      - name: Upload full ASOF-only features, separate outcome scorecards, all provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d19-BB203040-224PROXY-RETROSPECTIVE-NOT-OOS
          if-no-files-found: warn
          retention-days: 90
          path: |
            reports/r1d19/result/historical/**
            reports/r1d19/pins/**
            R1D19_PREDECLARED_PROTOCOL.json
  # R1-D20: historical-only, data-verified causality audit of displayed Ichimoku
  # cloud + BB20/30/40 on immutable 2021-23 vs 2024-25 cohorts.
  r1d20_protocol_lock:
    name: R1-D20 predeclare cloud/BB hypotheses, no returns [RESEARCH ONLY]
    if: ${{ inputs.scope == 'r1d20_protocol_lock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock hypotheses and verify 15 causality and quality tests
        run: |
          set -euo pipefail
          pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
          python -m unittest discover -s tests -p test_stockhunter_r1d20_ichimoku_qa.py -v
          python -m research_formulas.stockhunter_r1d20_ichimoku_qa \
            --mode lock --protocol R1D20_PREDECLARED_PROTOCOL.json \
            --out reports/r1d20/result/lock
      - name: Upload only immutable predeclared research hypotheses
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d20-PREDECLARED-CLOUD-BB-NO-OUTCOMES
          retention-days: 90
          path: |
            R1D20_PREDECLARED_PROTOCOL.json
            reports/r1d20/result/lock/**

  r1d20_historical_validation:
    name: R1-D20 1907 SHA KRX QA x original 2021-23 retrospective vs 2024-25 [NOT NEW OOS]
    if: ${{ inputs.scope == 'r1d20_historical_validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated libraries, lock hypotheses before inputs, test causal shift
        run: |
          set -euo pipefail
          pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
          python -m unittest discover -s tests -p test_stockhunter_r1d20_ichimoku_qa.py -v
          python -m research_formulas.stockhunter_r1d20_ichimoku_qa \
            --mode lock --protocol R1D20_PREDECLARED_PROTOCOL.json \
            --out reports/r1d20/result/lock
          python - <<'PY'
          import hashlib,pathlib
          original={
           'research_formulas/formula66_r1d6_oos_holdout.py':'00c78a26117670768b70772f578edcb5995e48a5',
           'research_formulas/formula66_r1d7_path_risk_audit.py':'4efbb3edd5d5e50786cc90420292b7854eb8e203'
          }
          for file,sha in original.items():
           b=pathlib.Path(file).read_bytes()
           assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,'ORIGINAL_HISTORIC_LOADER_DRIFT_'+file
          print('R1D20_FROZEN_OLDER_SOURCE_BLOBS_PASS')
          PY
      - name: Fail-closed GitHub run identity + artifact ZIP SHA256 preflight
        run: |
          set -euo pipefail
          mkdir -p reports/r1d20/pins
          python - <<'PY'
          import json,os,pathlib,subprocess
          p=json.load(open('R1D20_PREDECLARED_PROTOCOL.json',encoding='utf-8'))['source']
          root=pathlib.Path('reports/r1d20/pins');repo=os.environ['GITHUB_REPOSITORY']
          pins={
            'krx':(p['krx_run'],p['krx_head_sha']),
            'r1d9':(p['r1d9_run'],p['r1d9_head_sha']),
            'r1d6':(p['r1d6_run'],p['r1d6_head_sha']),
            'r1d7':(p['r1d7_run'],p['r1d7_head_sha']),
            'r1d19':(p['r1d19_run'],p['r1d19_head_sha']),
          }
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],text=True))
          artifacts={}
          for name,(id_,head) in pins.items():
           run=api('actions/runs/'+str(id_))
           assert run['id']==id_ and run['conclusion']=='success' and run['head_sha']==head,'SOURCE_RUN_SHA_DRIFT_'+name
           aa=api(f'actions/runs/{id_}/artifacts?per_page=100')['artifacts']
           (root/f'{name}_run.json').write_text(json.dumps(run))
           (root/f'{name}_artifacts.json').write_text(json.dumps(aa))
           artifacts[name]=aa
          def pin(which,name,id_,digest):
           match=[a for a in artifacts[which] if a['name']==name and a['id']==id_ and not a['expired']]
           assert len(match)==1 and match[0]['digest']=='sha256:'+digest,'ZIP_OR_IDENTITY_DRIFT_'+which+'_'+name
          for shard,digest in p['krx_shard_digests'].items():
           name=f'stockhunter-allkrx-price-shard-{shard}'
           x=[a for a in artifacts['krx'] if a['name']==name]
           assert len(x)==1,'SOURCE_SHARD_NOT_UNIQUE'
           pin('krx',name,x[0]['id'],digest)
          pin('r1d9','stockhunter-r1d9-2021-23-INDEPENDENT-ASOF-ONLY',p['r1d9_asof_artifact_id'],p['r1d9_asof_zip_sha256'])
          pin('r1d9','stockhunter-r1d9-2021-23-INDEPENDENT-SEALED-RESULTS',p['r1d9_outcomes_artifact_id'],p['r1d9_outcomes_zip_sha256'])
          pin('r1d6','stockhunter-r1d6-OOS-ASOF-ONLY-NO-FUTURE',p['r1d6_asof_artifact_id'],p['r1d6_asof_zip_sha256'])
          pin('r1d7','stockhunter-r1d7-FROZEN-D6-RETROSPECTIVE-PATH-RISK-NOT-OOS',p['r1d7_artifact_id'],p['r1d7_zip_sha256'])
          pin('r1d19','stockhunter-r1d19-BB203040-224PROXY-RETROSPECTIVE-NOT-OOS',p['r1d19_asof_artifact_id'],p['r1d19_zip_sha256'])
          print('R1D20_ALL_5_RUNS_AND_8_KRX_SHARDS_IMMUTABLE_PINS_PASS')
          PY
      - name: Download original full KRX raw 8 shards (do not refetch prices)
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d20/input/krx
          merge-multiple: true
      - name: Download frozen 2021-23 original R1-D9 signal-time ASOF
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d9-2021-23-INDEPENDENT-ASOF-ONLY
          run-id: 40051036811
          github-token: ${{ github.token }}
          path: reports/r1d20/input/r1d9asof
      - name: Download frozen 2021-23 D5-D20 source outcomes (no reprice)
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d9-2021-23-INDEPENDENT-SEALED-RESULTS
          run-id: 40051036811
          github-token: ${{ github.token }}
          path: reports/r1d20/input/r1d9out
      - name: Download frozen 2024-25 R1-D6 signal-time price/amount factors
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d6-OOS-ASOF-ONLY-NO-FUTURE
          run-id: 39941707036
          github-token: ${{ github.token }}
          path: reports/r1d20/input/r1d6asof
      - name: Download fixed 2024-25 R1-D19 BB20/30/40 signal-time features
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d19-BB203040-224PROXY-RETROSPECTIVE-NOT-OOS
          run-id: 40197991636
          github-token: ${{ github.token }}
          path: reports/r1d20/input/r1d19
      - name: Download frozen 2024-25 R1-D7 D5-D20 price outcomes
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d7-FROZEN-D6-RETROSPECTIVE-PATH-RISK-NOT-OOS
          run-id: 39948595864
          github-token: ${{ github.token }}
          path: reports/r1d20/input/r1d7
      - name: Audit every original KRX day SHA, technical causality and frozen close-price parity then score
        run: |
          set -euo pipefail
          python -m research_formulas.stockhunter_r1d20_ichimoku_qa \
            --mode validate --protocol R1D20_PREDECLARED_PROTOCOL.json \
            --inputs reports/r1d20/input --krx-root reports/r1d20/input/krx \
            --out reports/r1d20/result/historical
          python - <<'PY'
          import json
          p=json.load(open('reports/r1d20/result/historical/R1D20_MANIFEST.json'))
          assert p['krx_sha256_daily_validated']==1907
          assert (p['original_2021_23_signals'],p['original_2024_25_signals'])==(7096,5247)
          assert (p['original_2021_23_path_rows'],p['original_2024_25_path_rows'])==(28384,20988)
          assert (p['original_2021_23_D20_complete'],p['original_2024_25_D20_complete'])==(7047,5214)
          assert p['future_candle_read'] is False and not p['outcomes_loaded_at_capture']
          assert p['orders_placed']==0 and p['no_live_changes'] and not p['strategy_ready']
          assert not p['corporate_actions_pit_certified'] and not p['future_independent_oos']
          print('R1D20_FULL_HISTORICAL_ORIGINAL_KRX_QA_BB_CLOUD_COMPLETE_NOT_PROSPECTIVE')
          PY
      - name: Upload complete verified signal-time features, blocked rows and descriptive outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d20-ICHIMOKU-BB-HISTORIC-DATE-DISJOINT-DATA-QA-NOT-OOS
          retention-days: 90
          if-no-files-found: warn
          path: |
            reports/r1d20/result/**
            reports/r1d20/pins/**
            R1D20_PREDECLARED_PROTOCOL.json

  # R1-D22 preserves all prior LIVE and historical algorithms; no production calls.
  r1d22_historical_supplemental:
    name: R1-D22 historical BB x RSI ADX ATR MFI CMF volume flow, 1907 KRX SHA [NOT NEW OOS]
    if: ${{ inputs.scope == 'r1d22_historical_supplemental' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies, run deterministic numerical tests, lock thresholds
        run: |
          set -euo pipefail
          pip install 'numpy>=1.24,<3' 'pandas>=2.0,<3'
          python -m unittest discover -s tests -p 'test_stockhunter_r1d22_indicators.py' -v
          python -m research_formulas.stockhunter_r1d22_indicators --mode lock \
            --protocol R1D22_PREDECLARED_PROTOCOL.json --out reports/r1d22/result/lock
      - name: Verify 6 immutable GitHub source runs and ZIP digests before any download
        run: |
          set -euo pipefail
          mkdir -p reports/r1d22/pins
          python - <<'PYPIN'
          import json,os,pathlib,subprocess
