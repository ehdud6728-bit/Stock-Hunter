          python - <<'PY_SEAL'
          import json
          p='reports/r1d26h/result/source/R1D26H_COLLECTION_MANIFEST.json'
          m=json.load(open(p))
          if m['mode']!='collect' or m['holdout_new_completed']!=200 or m['combined_rows']!=6000:
              print('::error::R1D26H_HOLDOUT_INCOMPLETE_NO_OUTCOME_ANALYSIS: research artifact will still be uploaded')
              raise SystemExit(2)
          print('R1D26H_200_NEW_SOURCE_20X20_COMPLETE_SEALED')
