          assert a['holdout_events']==200 and a['holdout_distinct_tickers']==200 and a['control_training_ticker_overlap']==0
          assert not a['strategy_ready'] and a['orders_placed']==0 and a['source_amount_PIT']=='NOT_VERIFIED'
          print('R1D26H_NEW_TICKER_HISTORICAL_HOLDOUT_DESCRIPTIVE_QA_PASS_NOT_PIT_NOT_OOS')
          PY_END
