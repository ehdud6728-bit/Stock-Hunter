          m=json.load(open('reports/r1d26h/result/source/R1D26H_COLLECTION_MANIFEST.json'))
          assert m['mode']=='collect' and m['holdout_new_completed']==200 and m['combined_rows']==6000,'HOLDOUT_COLLECTION_NOT_SEALED'
          p=json.load(open('R1D26H_PREDECLARED_PROTOCOL.json'))
