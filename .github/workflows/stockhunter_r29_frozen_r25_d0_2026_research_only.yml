name: Stock-Hunter R29 Frozen R25 D0 Classifier on R28 2026 (RESEARCH ONLY)

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r29_frozen_r25_d0_2026_research_only.yml'
      - 'research_projects/trendline_true55_r29_frozen_d0_20261124/**'
  workflow_dispatch:
    inputs:
      confirm_trainonly_score_transfer_readonly:
        description: 'R25 training84 exact frozen score/cutoff => R28 2026 36 events only, no live trading'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

jobs:
  r29-offline-research-tests:
    name: R25 train-only scoring, source SHA, D0-only, fixed R28 exits
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies (no network price sources)
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Test strict R25 model transfer and no 2026 re-training
        run: python -m unittest discover -s research_projects/trendline_true55_r29_frozen_d0_20261124 -p 'test_r29*.py' -v

  r29-frozen-artifact-replay:
    name: Verify 3 locked original artifacts and score 36 R28 2026 events
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_trainonly_score_transfer_readonly == true
    needs: r29-offline-research-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded existing source parsers and R25 classifier dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Download original frozen R25 149 trained source and 59 review score archive
        uses: actions/download-artifact@v4
        with:
          repository: ehdud6728-bit/Stock-Hunter
          run-id: 45160999953
          name: STOCKHUNTER_R25_BIG30_RECALL_ACTUAL_EXIT_CAPTURE_RESEARCH_ONLY
          github-token: ${{ github.token }}
          path: reports/r29_r25_frozen
      - name: Download original R28 2026 36 signal decisions and paired exits
        uses: actions/download-artifact@v4
        with:
          repository: ehdud6728-bit/Stock-Hunter
          run-id: 45229111748
          name: STOCKHUNTER_R28_NEW_TICKER_2026_R25_VS_R27_D3_RESEARCH_ONLY
          github-token: ${{ github.token }}
          path: reports/r29_r28_original
      - name: Download original BLUE immutable 29-new-ticker KIS daily historical artifact
        uses: actions/download-artifact@v4
        with:
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 45221059025
          name: BLUE_STOCKHUNTER_R28_UNSEEN2026_45221059025
          github-token: ${{ github.token }}
          path: reports/r29_blue_kis_frozen
      - name: Audit original JSON SHA and R25 59-scores replay, then transfer frozen model to 2026
        run: |
          python research_projects/trendline_true55_r29_frozen_d0_20261124/r29_frozen_d0.py \
            --blue-source reports/r29_blue_kis_frozen \
            --r25-original reports/r29_r25_frozen \
            --r28-original reports/r29_r28_original \
            --out reports/r29_frozen_transfer
      - name: Upload derived score and paired R25/R27 outcomes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R29_FROZEN_R25_D0_2026_PAIRED_RESEARCH_ONLY
          path: |
            reports/r29_frozen_transfer/R29_FROZEN_D0_TRANSFER_SUMMARY.json
            reports/r29_frozen_transfer/R29_2026_D0_SCORES_AND_PAIRED_EXITS.json
          if-no-files-found: warn
          retention-days: 30
