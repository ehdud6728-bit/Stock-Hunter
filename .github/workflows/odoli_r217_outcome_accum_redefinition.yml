name: ODOLI R2.17 Outcome Accumulation Redefinition

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download frozen R2.16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r216
          gh run download "36360402372" \
            -n "odoli-r216-two-year-validation-36360402372" \
            -D source_r216

      - name: Fetch 2024-2026 PIT marcap
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'data/marcap-2024.parquet' \
            'data/marcap-2025.parquet' \
            'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run R2.17
        run: |
          python -u odoli_r217_outcome_accum_redefinition.py \
            --r216-root source_r216 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_r217

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r217/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_tuning"] is False
          assert m["new_gate_created"] is False
          assert m["cohort_n"]==100
          assert m["accumulation_candle_and_sequence_separated"] is True
          print(m)
          PY

      - run: cat reports/odoli_r217/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r217-outcome-accum-redefinition-${{ github.run_id }}
          path: reports/odoli_r217/**
          retention-days: 30
