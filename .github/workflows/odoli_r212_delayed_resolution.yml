name: ODOLI R2.12 Delayed Resolution

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download frozen R2.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r211
          gh run download "36249556767" \
            -n "odoli-r211-accumulation-anatomy-36249556767" \
            -D source_r211

      - name: Fetch 2026 PIT marcap
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run delayed-resolution anatomy
        run: |
          python -u odoli_r212_delayed_resolution.py \
            --r211-root source_r211 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_r212_delayed_resolution

      - name: Validate research-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r212_delayed_resolution/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["new_gate_created"] is False
          assert m["same_sample_tuning"] is False
          assert m["original_d5_failure_n"]==9
          print(m)
          PY

      - run: cat reports/odoli_r212_delayed_resolution/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r212-delayed-resolution-${{ github.run_id }}
          path: reports/odoli_r212_delayed_resolution/**
          retention-days: 30
