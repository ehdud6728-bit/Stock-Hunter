name: Stock-Hunter R21 Phased Exit and Early Pullback Research Only

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r21_true55_phase_exit_research_only.yml'
      - 'research_projects/trendline_true55_r21_phase_exit_20261123/**'
  workflow_dispatch:
    inputs:
      confirm_research_only_replay:
        description: 'Replay only pinned KIS 44988188271 and frozen true55 R19 149; no LIVE/SEARCH/WATCH changes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  r21-offline-tests:
    name: R21 causal, closed-bar, next-open and anti-hindsight tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Run offline timing and causal tests
        run: python -m unittest discover -s research_projects/trendline_true55_r21_phase_exit_20261123 -p 'test_r21*.py' -v

  r21-manual-frozen-replay:
    name: Frozen KIS 30 -> R16/R17 -> R19 149 -> R20 -> R21
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_research_only_replay == true
    needs: r21-offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Fetch pinned BLUE KIS source artifact; never ask for new secrets
        uses: actions/download-artifact@v4
        with:
          name: BLUE_STOCKHUNTER_R16_KIS_30_44988188271
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 44988188271
          github-token: ${{ github.token }}
          path: reports/r21_source
      - name: Verify source and rebuild R16 R17
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r17_failure_exit.py \
            --repo . --artifact reports/r21_source \
            --r16-out reports/r21_r16 --out reports/r21_r17 --phase all
      - name: Rebuild same 149 R19 true55 events
        run: |
          python research_projects/trendline_true55_r19_20261122/r19_true55_transfer.py \
            --repo . --r16-out reports/r21_r16 \
            --r17-out reports/r21_r17 --out reports/r21_r19
      - name: Rebuild and audit frozen MA5 baseline R20
        run: |
          python research_projects/trendline_true55_r20_ma_exit_20261123/r20_ma_exit.py \
            --r16-out reports/r21_r16 --r19-out reports/r21_r19 \
            --out reports/r21_r20_ma
      - name: Run R21 causal phased exit / 5-day diagnostic audit
        run: |
          python research_projects/trendline_true55_r21_phase_exit_20261123/r21_phase_exit.py \
            --r16-out reports/r21_r16 --r19-out reports/r21_r19 \
            --r20-ma-out reports/r21_r20_ma --out reports/r21_phase
      - name: Upload derived summaries and paired events ONLY; no raw OHLCV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R21_PHASE_EXIT_RESEARCH_ONLY
          path: |
            reports/r21_r16/R16_SOURCE_MANIFEST.json
            reports/r21_r19/R19_TRUE55_TRANSFER_SUMMARY.json
            reports/r21_r20_ma/R20_MA_EXIT_SUMMARY.json
            reports/r21_phase/R21_PHASE_EXIT_SUMMARY.json
            reports/r21_phase/R21_PHASE_PAIRED_EVENTS.json
          if-no-files-found: warn
          retention-days: 30
