name: Stock-Hunter R18 KIS Big-Loss Warning Research Only

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r18_kis_tail_risk_research_only.yml'
      - 'research_projects/trendline_kis_failure_r17_20261122/**'
  workflow_dispatch:
    inputs:
      confirm_research_only_kis_replay:
        description: 'Read only fixed BLUE R16 KIS artifact 44988188271, re-run R16/R17/R18 (no orders)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  r18-offline-preflight:
    name: R17/R18 no-future-peek and training-only threshold tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research-only dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Frozen signal as-of tests and temporal tail warning tests
        run: python -m unittest discover -s research_projects/trendline_kis_failure_r17_20261122 -p 'test_r*.py' -v

  r18-manual-frozen-kis-replay:
    name: Consume fixed KIS artifact, R16 replay, R17 exits, R18 tail warning
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_research_only_kis_replay == true
    needs: r18-offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research-only dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Download exact BLUE KIS 30-code capture; do not request or expose KIS secrets
        uses: actions/download-artifact@v4
        with:
          name: BLUE_STOCKHUNTER_R16_KIS_30_44988188271
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 44988188271
          github-token: ${{ github.token }}
          path: reports/r18_source_from_blue
      - name: Reject unpinned or incomplete provider source; replay unmodified R16/R14/R15
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r17_failure_exit.py \
            --repo . \
            --artifact reports/r18_source_from_blue \
            --r16-out reports/r18_r16 \
            --out reports/r18_r17 \
            --phase all
      - name: Score large-loss tail in chronological plus unseen-code folds
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r18_big_loss_warning.py \
            --r16-out reports/r18_r16 \
            --r17-out reports/r18_r17 \
            --out reports/r18_tail
      - name: Upload only research summaries and diagnostic scores, not raw KIS price history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R18_TAIL_RISK_RESEARCH_ONLY
          path: |
            reports/r18_r16/R16_SOURCE_MANIFEST.json
            reports/r18_r16/R16_HOLDOUT_SUMMARY.json
            reports/r18_r17/R17_SUMMARY.json
            reports/r18_tail/R18_SUMMARY.json
            reports/r18_tail/R18_UNSEEN_TICKER_TEMPORAL_SCORES.json
          if-no-files-found: warn
          retention-days: 30
