name: Closing Bet R1.23 Success Failure x Shakeout-like x Overhead Proxy (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closing-bet-r123-success-failure-readonly
  cancel-in-progress: false

jobs:
  audit:
    name: R123 fixed 60d EOD proxy x D20 stop/recovery forensic audit (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: '1'
      R122_RUN: '38893723498'
      R122_ARTIFACT: 'closebet-r122-candle-support-actions-38893723498'
      R171_RUN: '38664095610'
    steps:
      - name: Checkout research source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fixed analytical libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6' 'pandas==2.2.3'
      - name: Preflight 17 fixed tests and import sanity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r118_partial_market_wave_geometry.py closebet_research/r123_success_failure_microstructure_forensics.py tests/test_r123_success_failure_microstructure_forensics.py
          python -m unittest discover -s tests -p 'test_r123*.py' -v
          python -m closebet_research.r123_success_failure_microstructure_forensics --help >/dev/null
          echo R123_PREFLIGHT_17_TESTS_PASS
      - name: Fetch pinned R122 result and verify all its member hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/r122 evidence/history_archives
          gh run download "$R122_RUN" --repo "$GITHUB_REPOSITORY" --name "$R122_ARTIFACT" --dir evidence/r122
          python - <<'PY'
          from closebet_research.r123_success_failure_microstructure_forensics import load_r122
          a,b,m=load_r122('evidence/r122')
          assert len(a)==4567 and len(b)==3077
          print('R123_SOURCE_R122_MANIFEST_AND_ALL_SHA_PIN_PASS')
          PY
      - name: Fetch four unchanged original KRX history shards
        shell: bash
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            mkdir -p "evidence/raw$i"
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" --name "r171-history-$i" --dir "evidence/raw$i"
            test "$(find "evidence/raw$i" -maxdepth 1 -name '*.csv.gz' | wc -l)" -ge 450
            test "$(find "evidence/raw$i" -maxdepth 1 -name 'krx_history_manifest_*.json' | wc -l)" -eq 1
          done
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(4):
              src=Path('evidence/raw'+str(i));files=sorted(p for p in src.iterdir() if p.is_file())
              assert len(files)>450
              with ZipFile('evidence/history_archives/immutable_'+str(i)+'.zip','w',compression=ZIP_STORED) as z:
                  for p in files:z.write(p,p.name)
          print('R123_FOUR_UNMODIFIED_ORIGINAL_SHARDS_REPACKAGED')
          PY
      - name: Verify 1907 KRX compressed source hashes and compute path outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r123_success_failure_microstructure_forensics \
            --r122-root evidence/r122 --history-dir evidence/history_archives --output-dir reports/r123
      - name: Fail closed on evidence, source scope and outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('reports/r123');m=json.loads((p/'r123_integrity_manifest.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS_SOURCE_LIMITED_D20_PATH_FORENSIC_DIAGNOSTIC_ONLY'
          assert m['source_eligible_events']==3077 and m['krx_day_sha_verified']==1907
          assert m['r122_source_run']==38893723498
          assert not m['trade_authority'] and not m['live_changed'] and not m['shadow_changed'] and not m['autoexit_changed']
          assert not m['full_market_PIT_available'] and m['future_outcomes_not_used_for_D0_features']
          for fn,digest in m['sha256'].items():
              assert hashlib.sha256((p/fn).read_bytes()).hexdigest()==digest,('R123_OUTPUT_SHA_BAD',fn)
          print('R123_RESEARCH_SOURCE_SHA_OUTPUT_SHA_SCOPE_PASS; NO_LIVE_AUTHORITY')
          PY
      - name: Upload descriptive forensic evidence only
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r123-success-failure-path-forensics-${{ github.run_id }}
          path: reports/r123/**
          if-no-files-found: error
          retention-days: 30
