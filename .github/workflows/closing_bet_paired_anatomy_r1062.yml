name: Closing Bet Paired Anatomy OOS R1.0.6.2

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "35295676895"
        type: string
      r102_run_id:
        required: true
        default: "35308434562"
        type: string
      r105_run_id:
        required: true
        default: "35319857025"
        type: string
      discovery_end:
        required: true
        default: "2026-08-18"
        type: string
      oos_start:
        required: true
        default: "2026-08-19"
        type: string
      oos_end:
        required: true
        default: "2026-09-18"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
      R102_HISTORY_WORKERS: "6"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pykrx finance-datareader

      - name: Download research inputs
        run: |
          mkdir -p source_artifacts r105_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
          gh run download "${{ inputs.r105_run_id }}" -D r105_artifacts

      - name: Restore R1.0.2 causal OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/closebet_structure_env_oos_r102
          key: closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-${{ inputs.r102_run_id }}
          restore-keys: |
            closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-

      - name: Rebuild causal OHLCV only if cache absent
        run: |
          set -euo pipefail
          if [ ! -s .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv ]; then
            python -u closing_bet_structure_env_oos_r102_causal_history.py \
              --source-root source_artifacts \
              --discovery-end "${{ inputs.discovery_end }}" \
              --oos-start "${{ inputs.oos_start }}" \
              --oos-end "${{ inputs.oos_end }}"
          else
            echo "R102 causal OHLCV cache restored"
          fi

      - name: Run Winner Stop-First Paired Anatomy R1.0.6.2
        run: |
          python -u closing_bet_paired_anatomy_r106.py \
            --r105-root r105_artifacts \
            --history-cache .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv \
            --output-dir reports/closebet_paired_anatomy_r106 \
            --discovery-end "${{ inputs.discovery_end }}" \
            --oos-start "${{ inputs.oos_start }}" \
            --oos-end "${{ inputs.oos_end }}"

      - name: Validate R1.0.6.2 invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_paired_anatomy_r106/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert m['pair_distance_scales_frozen_from_discovery_without_outcome_optimization']
          assert m['oos_start']=='2026-08-19' and m['oos_end']=='2026-09-18'
          assert int(m['pair_rows'])>0
          assert int(m['trajectory_rows'])>0
          assert m['ma_long_history_fix'] is True
          assert int(m['checkpoint_rows'])>0
          print('R1061_PAIRED_ANATOMY PASS',m['oos_rows'],m['pair_rows'],m['trajectory_rows'],m['checkpoint_rows'])
          PY

      - name: Upload R1.0.6.2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-paired-anatomy-r106-${{ github.run_id }}
          path: reports/closebet_paired_anatomy_r106/**
          if-no-files-found: warn
          retention-days: 30
