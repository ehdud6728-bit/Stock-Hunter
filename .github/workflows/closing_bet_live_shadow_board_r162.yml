name: Closing Bet v49.76 Live Shadow Board R1.6.2

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: v49.76 source run for rendering test
        required: true
        default: "35295676895"
      r14_run_id:
        description: Frozen C/B1/B2/I Response Map run
        required: true
        default: "35445479856"
      r16_a_run_id:
        description: Frozen A Pattern Response Map R1.6 run
        required: true
        default: "35469509910"
      top_n:
        description: Preserve source order and display first N
        required: true
        default: "10"
      send_telegram:
        description: Manual observer Telegram test
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      CLOSING_BET_TOKEN: ${{ secrets.CLOSING_BET_TOKEN }}
      CLOSING_BET_CHAT_ID: ${{ secrets.CLOSING_BET_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Download source and frozen references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_run source_r14 source_r16_a
          gh run download "${{ inputs.source_run_id }}" -D source_run
          gh run download "${{ inputs.r14_run_id }}" -D source_r14
          gh run download "${{ inputs.r16_a_run_id }}" -D source_r16_a

      - name: Build R1.6.2 Live Shadow Board
        shell: bash
        run: |
          set -euo pipefail
          SEND=""
          if [ "${{ inputs.send_telegram }}" = "true" ]; then
            SEND="--send-telegram"
          fi
          python -u closing_bet_live_shadow_board_r162.py             --source-root source_run             --r14-root source_r14             --r16-a-root source_r16_a             --output-dir reports/live_shadow_board_r162             --top-n "${{ inputs.top_n }}"             --source-run-id "${{ inputs.source_run_id }}"             --r14-run-id "${{ inputs.r14_run_id }}"             --r16-a-run-id "${{ inputs.r16_a_run_id }}"             $SEND

      - name: Validate R1.6.2 observer invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/live_shadow_board_r162/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only']
          assert m['a_pattern_response_map_integrated']
          assert m['a_reference_only_from_r16']
          assert m['ambiguous_pending_excluded_from_route_proximity']
          assert m['excluded_route_proximity_families']==['AMBIGUOUS_OR_PENDING']
          assert m['historical_path_counts_still_include_ambiguous_pending']
          assert m['display_only_change']
          assert not m['candidate_membership_changed']
          assert not m['candidate_order_changed']
          assert not m['score_rank_changed']
          assert not m['candidate_filter_created']
          assert not m['production_logic_changed']
          assert not m['aggregate_route_score_created']
          assert not m['aggregate_route_classification_created']
          assert not m['atr_used_in_response_map']
          assert not m['same_sample_tuning']
          assert not m['new_threshold_optimization']
          print('LIVE_SHADOW_R162 PASS',m['rows'],m['source'])
          PY

      - name: Ensure ambiguous route is not used in proximity text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          txt=Path('reports/live_shadow_board_r162/shadow_board.txt').read_text(encoding='utf-8')
          for line in txt.splitlines():
              if line.startswith('FEATURE ROUTE PROXIMITY |'):
                  assert 'Ambiguous/Pending' not in line, line
          assert 'Ambiguous/Pending' in txt
          print('AMBIGUOUS_PROXIMITY_GUARD PASS')
          PY

      - name: Upload R1.6.2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r162-${{ github.run_id }}
          path: reports/live_shadow_board_r162/**
          if-no-files-found: warn
          retention-days: 30
