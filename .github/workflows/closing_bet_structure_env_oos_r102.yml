name: Closing Bet Structure + Environment OOS R1.0.2

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "v49.76 BACKTEST source run"
        required: true
        default: "35295676895"
        type: string
      discovery_end:
        required: true
        default: "2026-08-18"
        type: string
      oos_start:
        required: true
        default: "2026-08-19"
        type: string
      oos_end:
        required: true
        default: "2026-09-18"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
      R102_HISTORY_WORKERS: "6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pykrx finance-datareader

      - name: Download v49.76 source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
          find source_artifacts -type f \( \
            -name 'v49_76_selected_enriched_outcomes.csv' -o \
            -name 'v49_76_global_canonical.csv' \
          \) -print

      - name: Restore R1.0.2 causal OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/closebet_structure_env_oos_r102
          key: closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-${{ github.run_id }}
          restore-keys: |
            closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-

      - name: Run R1.0.2 causal-history OOS research
        shell: bash
        run: |
          set -euo pipefail
          python -u closing_bet_structure_env_oos_r102_causal_history.py \
            --source-root source_artifacts \
            --discovery-end "${{ inputs.discovery_end }}" \
            --oos-start "${{ inputs.oos_start }}" \
            --oos-end "${{ inputs.oos_end }}"

      - name: Validate research-only invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_structure_env_oos_r1/meta.json',encoding='utf-8'))
          h=json.load(open('.cache/closebet_structure_env_oos_r102/history_rebuild_meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed'] and not m['score_rank_changed'] and not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert m['discovery_end']=='2026-08-18' and m['oos_start']=='2026-08-19' and m['oos_end']=='2026-09-18'
          assert int(m.get('oos_rows',0))>0,m
          assert float(h.get('coverage_pct',0))>=85,h
          print('R102_CAUSAL_HISTORY_OOS PASS',m['discovery_rows'],m['oos_rows'],m['structure_pass_rows'],'history_coverage',h['coverage_pct'])
          PY

      - name: Save R1.0.2 causal OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/closebet_structure_env_oos_r102
          key: closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-${{ github.run_id }}

      - name: Upload R1.0.2 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-structure-env-oos-r102-${{ github.run_id }}
          path: |
            reports/closebet_structure_env_oos_r1/**
            .cache/closebet_structure_env_oos_r102/history_rebuild_meta.json
            .cache/closebet_structure_env_oos_r102/history_rebuild_audit.csv
          if-no-files-found: warn
          retention-days: 30
