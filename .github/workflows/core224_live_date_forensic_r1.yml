name: CORE224 LIVE Date Forensic R1 (Research Only)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target completed KRX trading date (YYYY-MM-DD). Required, explicit.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate target and read-only source analysis
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'Invalid target format'; exit 2; }
          python - <<'PY'
          import os,datetime
          target=datetime.date.fromisoformat(os.environ['TARGET_DATE'])
          if target>datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date():
              raise SystemExit('FUTURE_TARGET_BLOCKED')
          PY
          python -u core224_live_date_preflight_r1.py --target "$TARGET_DATE"
      - name: Upload diagnostic evidence (never signal or orders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core224-live-date-forensic-r1-${{ github.run_id }}
          path: reports/core224_date_forensic_r1/
          if-no-files-found: warn
          retention-days: 30
