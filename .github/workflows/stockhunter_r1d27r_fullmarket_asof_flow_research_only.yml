name: StockHunter R1-D27R Full-Market Flow-Blind As-Of Pilot [RESEARCH ONLY]
on:
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: 'Previous completed checkpoint run ID, 0 for first run'
        default: '0'
        required: true
        type: string
      chain_depth:
        description: 'Autochain depth, first run 0'
        default: '0'
        required: true
        type: string
      auto_continue:
        description: 'Automatically dispatch next checkpoint after artifact upload'
        default: true
        required: true
        type: boolean
permissions:
  contents: read
  actions: write
concurrency:
  group: stockhunter-r1d27r-flowblind-pilot-300
  cancel-in-progress: false
jobs:
  collect_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and immutable freeze preflight
        run: |
          python -m pip install --disable-pip-version-check pandas numpy pykrx
          python -m research_formulas.stockhunter_r1d27r_flow_collect --help
          python - <<'PY'
          from research_formulas.stockhunter_r1d27r_flow_collect import load
          f,days,s=load('.', 'PILOT_300')
          assert len(f)==300 and len(days)==1907
          print('PILOT_FROZEN',len(f),'SHA',s)
          PY
      - name: Fail closed on absent KRX data credentials
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          python - <<'PY'
          import os,sys
          if not os.getenv('KRX_ID','').strip() or not os.getenv('KRX_PW','').strip():
              print('::error::KRX credentials absent: require KRX_DATA_ID/KRX_DATA_PW or KRX_ID/KRX_PW');sys.exit(2)
          print('KRX credentials are present (redacted)')
          PY
      - name: Restore prior sealed checkpoint
        if: ${{ inputs.seed_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-R1D27R-PILOT-300-${{ inputs.seed_run_id }}
          run-id: ${{ inputs.seed_run_id }}
          github-token: ${{ github.token }}
          path: r1d27r_seed
      - name: Fetch only missing/pending flow rows in one small batch
        id: collect
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f r1d27r_seed/R1D27R_FLOW_MANIFEST.json ]; then
              python -m research_formulas.stockhunter_r1d27r_flow_collect --cohort PILOT_300 --out r1d27r_checkpoint --seed-root r1d27r_seed --batch 20
          else
              python -m research_formulas.stockhunter_r1d27r_flow_collect --cohort PILOT_300 --out r1d27r_checkpoint --batch 20
          fi
      - name: Analyze only after complete pilot source attempts and adequate quality coverage
        if: ${{ success() }}
        run: |
          python - <<'PYANALYZE'
          import json,subprocess,sys
          m=json.load(open('r1d27r_checkpoint/R1D27R_FLOW_MANIFEST.json'))
          if m['n_unattempted'] or m['n_pending']:
              print('FLOW_REPLAY_DEFERRED_CHECKPOINT_INCOMPLETE');sys.exit(0)
          if m['n_complete'] < 240:
              print('::error::FLOW_REPLAY_QUALITY_GATE: fewer than 240/300 events complete')
              sys.exit(2)
          subprocess.run([sys.executable,'-m','research_formulas.stockhunter_r1d27r_flow_replay','--root','.','--checkpoint','r1d27r_checkpoint','--out','r1d27r_checkpoint/analysis'],check=True)
          PYANALYZE
      - name: Publish sealed source checkpoint even after provider abort
        if: ${{ always() && hashFiles('r1d27r_checkpoint/R1D27R_FLOW_MANIFEST.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-R1D27R-PILOT-300-${{ github.run_id }}
          path: r1d27r_checkpoint/
          retention-days: 90
          if-no-files-found: error
      - name: Source status and bounded auto-continuation
        if: ${{ success() && inputs.auto_continue }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          DEPTH: ${{ inputs.chain_depth }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          m=json.load(open('r1d27r_checkpoint/R1D27R_FLOW_MANIFEST.json'))
          print('SOURCE_PROGRESS',m['n_complete'],'/',m['events_frozen'],'pending',m['n_pending'],'quarantined',m['n_quarantined'])
          if m['provider_aborted']:
              raise SystemExit('PROVIDER_ABORTED_REQUIRES_MANUAL_DIAGNOSIS')
          if m['n_unattempted']==0 and m['n_pending']==0:
              print('SOURCE_ATTEMPTS_COMPLETE_QUARANTINES_REMAIN_MISSING');raise SystemExit(0)
          depth=int(os.getenv('DEPTH','0'));assert 0<=depth<20,'AUTOCHAIN_LIMIT_MANUAL_REVIEW'
          assert m['batch_attempted']>0 and m['cohort']=='PILOT_300' and m['research_only'] is True
          u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/stockhunter_r1d27r_fullmarket_asof_flow_research_only.yml/dispatches"
          data=json.dumps({'ref':os.environ['REF'],'inputs':{'seed_run_id':os.environ['RUN_ID'],'chain_depth':str(depth+1),'auto_continue':'true'}}).encode()
          req=urllib.request.Request(u,data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=40) as resp:assert resp.status==204
          print('NEXT_RESEARCH_ONLY_FLOW_COLLECTION_DISPATCHED')
          PY
