name: Closing Bet Expectation Capture Audit R1.0.12

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "35295676895"
        type: string
      r105_run_id:
        required: true
        default: "35319857025"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download inputs
        run: |
          mkdir -p source_artifacts r105_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
          gh run download "${{ inputs.r105_run_id }}" -D r105_artifacts

      - name: Run Expectation Capture Audit R1.0.12
        run: |
          python -u closing_bet_expectation_capture_audit_r112.py \
            --source-root source_artifacts \
            --r105-root r105_artifacts \
            --output-dir reports/closebet_expectation_capture_audit_r112

      - name: Validate invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_expectation_capture_audit_r112/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert m['sector_market_metadata_excluded']
          assert not m['retroactive_news_backfill_used']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['candidate_filter_created']
          assert not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert int(m['source_columns'])>0
          print('R112_EXPECTATION_CAPTURE_AUDIT PASS',
                m['source_columns'],
                m['candidate_catalyst_field_count'],
                m['captured_expectation_rows'])
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-expectation-capture-r112-${{ github.run_id }}
          path: reports/closebet_expectation_capture_audit_r112/**
          if-no-files-found: warn
          retention-days: 30
