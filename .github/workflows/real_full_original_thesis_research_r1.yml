name: REAL_FULL Original Thesis Research R1

on:
  workflow_dispatch:
    inputs:
      source_artifact_dir:
        description: "Path containing REAL_FULL validation-backtest reports/cache after restoration or download"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-thesis-research-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Self-test frozen research engine
        run: python real_full_original_thesis_research_r1.py --self-test

      - name: Locate source data
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_artifact_dir || '' }}"
          if [ -n "$SRC" ]; then
            EVENT="$SRC/reports/real_full_validation_backtest/analysis/pattern_backtest_event_ledger.csv"
            CACHE="$SRC/reports/.cache/v20_price_history"
          else
            EVENT="reports/real_full_validation_backtest/analysis/pattern_backtest_event_ledger.csv"
            CACHE="reports/.cache/v20_price_history"
          fi
          echo "EVENT_LEDGER=$EVENT" >> "$GITHUB_ENV"
          echo "PRICE_CACHE=$CACHE" >> "$GITHUB_ENV"
          test -f "$EVENT" || { echo "SOURCE_EVENT_LEDGER_MISSING: $EVENT"; exit 21; }
          test -d "$CACHE" || { echo "SOURCE_PRICE_CACHE_MISSING: $CACHE"; exit 22; }

      - name: Run frozen discovery + September holdout research
        run: |
          python -u real_full_original_thesis_research_r1.py \
            --event-ledger "$EVENT_LEDGER" \
            --price-cache-dir "$PRICE_CACHE" \
            --output-dir reports/real_full_original_thesis_r1

      - name: Validate research-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('reports/real_full_original_thesis_r1/real_full_original_thesis_meta.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] is True
          assert m['production_eligible'] is False
          assert m['selection_logic_changed'] is False
          assert m['score_rank_changed'] is False
          assert m['order_logic_changed'] is False
          assert m['new_gate_added'] is False
          assert m['same_sample_retuning'] is False
          assert m['lookahead_predictor_allowed'] is False
          assert m['discovery_end']=='2026-08-28'
          assert m['holdout_start']=='2026-09-01'
          assert m['horizons_trading_days']==[1,3,5,10,15,20]
          print('ORIGINAL_THESIS_R1_INVARIANTS PASS',m['design_hash'])
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-original-thesis-r1-${{ github.run_id }}
          path: reports/real_full_original_thesis_r1/**
          if-no-files-found: warn
          retention-days: 30
