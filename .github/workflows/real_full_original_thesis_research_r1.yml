name: REAL_FULL Original Thesis Research R1

on:
  workflow_dispatch:
    inputs:
      source_validation_run_id:
        description: "Optional REAL_FULL_VALIDATION_BACKTEST run id; blank = auto-find latest artifact containing pattern_backtest_event_ledger.csv"
        required: false
        default: ""
        type: string
      source_artifact_dir:
        description: "Optional pre-restored source directory (advanced/manual override)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-thesis-research-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader

      - name: Self-test frozen research engine
        run: python real_full_original_thesis_research_r1.py --self-test

      - name: Resolve REAL_FULL validation source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_VALIDATION_RUN_ID: ${{ inputs.source_validation_run_id || '' }}
          SOURCE_ARTIFACT_DIR: ${{ inputs.source_artifact_dir || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_validation
          if [ -n "${SOURCE_ARTIFACT_DIR}" ]; then
            echo "SOURCE_ROOT=${SOURCE_ARTIFACT_DIR}" >> "$GITHUB_ENV"
            echo "SOURCE_MODE=MANUAL_DIRECTORY" >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY'
          import io, json, os, pathlib, zipfile, requests
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ.get('GITHUB_TOKEN','')
          wanted=os.environ.get('SOURCE_VALIDATION_RUN_ID','').strip()
          h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          if token: h['Authorization']='Bearer '+token
          base=f'https://api.github.com/repos/{repo}'
          def get(url):
              r=requests.get(url,headers=h,timeout=60,allow_redirects=True); r.raise_for_status(); return r
          run_ids=[]
          if wanted:
              run_ids=[int(wanted)]
          else:
              # Search successful run_scanner runs newest-first. We validate by artifact CONTENT,
              # not by display title, so manual/backtest naming differences cannot fool the resolver.
              for page in range(1,11):
                  js=get(f'{base}/actions/runs?status=success&per_page=100&page={page}').json()
                  for x in js.get('workflow_runs',[]):
                      if str(x.get('path',''))=='.github/workflows/run_scanner.yml':
                          run_ids.append(int(x['id']))
                  if len(run_ids)>=80: break
          errors=[]
          out=pathlib.Path('source_validation')
          for rid in run_ids:
              try:
                  arts=get(f'{base}/actions/runs/{rid}/artifacts?per_page=100').json().get('artifacts',[])
                  for a in arts:
                      if a.get('expired'): continue
                      aid=int(a['id'])
                      raw=get(f'{base}/actions/artifacts/{aid}/zip').content
                      with zipfile.ZipFile(io.BytesIO(raw)) as z:
                          names=z.namelist()
                          led=[n for n in names if n.endswith('reports/real_full_validation_backtest/analysis/pattern_backtest_event_ledger.csv') or n.endswith('real_full_validation_backtest/analysis/pattern_backtest_event_ledger.csv')]
                          if not led: continue
                          # Extract whole artifact; reports are small enough and supporting context is useful.
                          z.extractall(out)
                          meta={'source_run_id':rid,'source_artifact_id':aid,'source_artifact_name':a.get('name'),'event_member':led[0]}
                          (out/'source_resolution.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
                          print('REAL_FULL_VALIDATION_SOURCE_RESOLVED',meta)
                          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
                              f.write(f'SOURCE_ROOT={out.as_posix()}\nSOURCE_MODE=GITHUB_ARTIFACT\nSOURCE_RUN_ID={rid}\nSOURCE_ARTIFACT_ID={aid}\n')
                          raise SystemExit(0)
              except SystemExit: raise
              except Exception as e:
                  errors.append(f'{rid}:{type(e).__name__}:{e}')
          raise SystemExit('NO_REAL_FULL_VALIDATION_ARTIFACT_FOUND | '+ ' | '.join(errors[-10:]))
          PY

      - name: Locate event ledger and prepare price cache
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${SOURCE_ROOT:-source_validation}"
          EVENT="$(find "$ROOT" -type f -path '*/real_full_validation_backtest/analysis/pattern_backtest_event_ledger.csv' | head -n 1 || true)"
          test -n "$EVENT" && test -f "$EVENT" || { echo "SOURCE_EVENT_LEDGER_MISSING under $ROOT"; exit 21; }
          CACHE="$(find "$ROOT" -type d -path '*/.cache/v20_price_history' | head -n 1 || true)"
          if [ -z "$CACHE" ]; then
            CACHE="reports/.cache/real_full_original_thesis_r1/price_history"
            mkdir -p "$CACHE"
            echo "PRICE_CACHE_NOT_IN_ARTIFACT -> historical FDR refetch will be used research-only"
          fi
          echo "EVENT_LEDGER=$EVENT" >> "$GITHUB_ENV"
          echo "PRICE_CACHE=$CACHE" >> "$GITHUB_ENV"
          echo "EVENT_LEDGER=$EVENT"
          echo "PRICE_CACHE=$CACHE"

      - name: Run frozen discovery + September holdout research
        run: |
          python -u real_full_original_thesis_research_r1.py \
            --event-ledger "$EVENT_LEDGER" \
            --price-cache-dir "$PRICE_CACHE" \
            --allow-price-refetch \
            --output-dir reports/real_full_original_thesis_r1

      - name: Validate research-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('reports/real_full_original_thesis_r1/real_full_original_thesis_meta.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] is True
          assert m['production_eligible'] is False
          assert m['selection_logic_changed'] is False
          assert m['score_rank_changed'] is False
          assert m['order_logic_changed'] is False
          assert m['new_gate_added'] is False
          assert m['same_sample_retuning'] is False
          assert m['lookahead_predictor_allowed'] is False
          assert m['historical_price_refetch_scope']=='RESEARCH_RECONSTRUCTION_ONLY_NOT_PRODUCTION'
          assert m['discovery_end']=='2026-08-28'
          assert m['holdout_start']=='2026-09-01'
          assert m['horizons_trading_days']==[1,3,5,10,15,20]
          print('ORIGINAL_THESIS_R1_INVARIANTS PASS',m['design_hash'])
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-original-thesis-r1-${{ github.run_id }}
          path: |
            reports/real_full_original_thesis_r1/**
            source_validation/source_resolution.json
          if-no-files-found: warn
          retention-days: 30
