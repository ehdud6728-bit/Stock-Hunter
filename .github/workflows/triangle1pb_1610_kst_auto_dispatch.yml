name: TRIANGLE1PB 16:10 KST Auto Dispatch

on:
  schedule:
    # Korea Standard Time (UTC+9): weekdays 16:10 KST = 07:10 UTC
    - cron: '10 07 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: triangle1pb-1610-kst-dispatch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch-triangle1pb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_WORKFLOW: run_scanner.yml
      TARGET_REF: main

    steps:
      - name: KST schedule timing audit
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import os

          kst = timezone(timedelta(hours=9))
          now_utc = datetime.now(timezone.utc)
          now_kst = now_utc.astimezone(kst)
          expected_kst = now_kst.replace(hour=16, minute=10, second=0, microsecond=0)
          drift_min = (now_kst - expected_kst).total_seconds() / 60.0
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          schedule_expr = os.environ.get("GITHUB_EVENT_PATH", "")

          print(f"EVENT_NAME={event_name}")
          print(f"NOW_UTC={now_utc.isoformat()}")
          print(f"NOW_KST={now_kst.isoformat()}")
          print(f"EXPECTED_KST={expected_kst.isoformat()}")
          print(f"DRIFT_MIN={drift_min:.2f}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## TRIANGLE1PB 16:10 KST timing audit\n")
                  f.write(f"- event: `{event_name}`\n")
                  f.write(f"- NOW_UTC: `{now_utc.isoformat()}`\n")
                  f.write(f"- NOW_KST: `{now_kst.isoformat()}`\n")
                  f.write(f"- EXPECTED_KST: `{expected_kst.isoformat()}`\n")
                  f.write(f"- DRIFT_MIN: `{drift_min:.2f}`\n")
                  if event_name == "schedule" and drift_min > 15:
                      f.write("- warning: GitHub scheduled-run delay exceeded 15 minutes.\n")
          PY

      - name: Dispatch existing TRIANGLE1PB research profile
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatch target: ${GITHUB_REPOSITORY}/${TARGET_WORKFLOW}@${TARGET_REF}"
          echo "Profile: TRIANGLE1PB_RESEARCH"
          gh api             --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches"             -f ref="${TARGET_REF}"             -f 'inputs[run_profile]=TRIANGLE1PB_RESEARCH'
          echo "TRIANGLE1PB_DISPATCH_ACCEPTED=1"
          echo "research_only=1"
          echo "production_search_score_rank_order_changed=0"
