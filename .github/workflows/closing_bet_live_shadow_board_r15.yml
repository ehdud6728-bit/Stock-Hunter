name: Closing Bet v49.76 Live Shadow Board R1.5

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: v49.76 source run. Blank = latest successful production run
        required: false
        default: ""
      r14_run_id:
        description: Frozen R1.4 Response Map reference run
        required: true
        default: "35445479856"
      top_n:
        description: Preserve source order and display first N only
        required: true
        default: "10"
      send_telegram:
        description: Send observer board to closing-bet Telegram route
        required: true
        type: boolean
        default: false

  workflow_run:
    workflows:
      - "closing-bet-v49.76.6.7.3.2.5.1.2.1-final-universe-source-recovery"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      CLOSING_BET_TOKEN: ${{ secrets.CLOSING_BET_TOKEN }}
      CLOSING_BET_CHAT_ID: ${{ secrets.CLOSING_BET_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Resolve source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.source_run_id }}" ]; then
            RID="${{ inputs.source_run_id }}"
          else
            RID="$(gh run list --workflow v49.76.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$RID"

      - name: Download v49.76 source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_run
          gh run download "${{ steps.source.outputs.run_id }}" -D source_run
          echo "=== candidate sidecars ==="
          find source_run -type f \( -name 'live_shadow_*' -o -name 'schedule_slot_authority_*.json' \) -print | sort || true

      - name: Download frozen R1.4 response map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_r14
          R14="${{ inputs.r14_run_id }}"
          if [ -z "$R14" ]; then R14="35445479856"; fi
          gh run download "$R14" -D source_r14
          find source_r14 -type f \( -name 'response_map_evidence.csv' -o -name 'pattern_response_map.csv' -o -name 'meta.json' \) -print | sort

      - name: Build R1.5 Live Shadow Board
        shell: bash
        run: |
          set -euo pipefail
          TOPN="${{ inputs.top_n }}"
          if [ -z "$TOPN" ]; then TOPN="10"; fi

          SEND=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SEND=""
          elif [ "${{ inputs.send_telegram }}" = "true" ]; then
            SEND="--send-telegram"
          fi

          R14="${{ inputs.r14_run_id }}"
          if [ -z "$R14" ]; then R14="35445479856"; fi

          python -u closing_bet_live_shadow_board_r15.py \
            --source-root source_run \
            --r14-root source_r14 \
            --output-dir reports/live_shadow_board_r15 \
            --top-n "$TOPN" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --r14-run-id "$R14" \
            $SEND

      - name: Validate R1.5 observer invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/live_shadow_board_r15/meta.json',encoding='utf-8'))
          assert m['research_only']
          assert not m.get('production_changed',False)
          assert not m.get('production_logic_changed',False)
          assert not m.get('score_rank_changed',False)
          assert not m.get('candidate_filter_created',False)
          if m['status']=='PASS':
              assert not m['candidate_membership_changed']
              assert not m['candidate_order_changed']
              assert not m['order_logic_changed']
              assert not m['aggregate_route_score_created']
              assert not m['aggregate_route_classification_created']
              assert m['feature_level_route_proximity_only']
              assert not m['atr_used_in_response_map']
              assert not m['same_sample_tuning']
              assert not m['new_threshold_optimization']
              print('LIVE_SHADOW_R15 PASS',m['rows'],m['source'])
          else:
              print('LIVE_SHADOW_R15 NON-CANDIDATE',m['status'],m.get('source_lane',''))
          PY

      - name: Upload R1.5 observer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r15-${{ github.run_id }}
          path: reports/live_shadow_board_r15/**
          if-no-files-found: warn
          retention-days: 30
