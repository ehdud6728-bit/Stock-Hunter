name: ODOLI R2.11 Accumulation Candle Anatomy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download frozen R2.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r210
          gh run download "36247681600" \
            -n "odoli-r210-characteristic-anatomy-36247681600" \
            -D source_r210

      - name: Fetch 2026 PIT marcap
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Validate frozen accumulation helper exists
        run: |
          test -f scanner/accumulation_wave_complete.py
          grep -q "def calc_accum_candle_score" scanner/accumulation_wave_complete.py

      - name: Run accumulation anatomy
        run: |
          python -u odoli_r211_accumulation_anatomy.py \
            --r210-root source_r210 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_r211_accumulation_anatomy

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r211_accumulation_anatomy/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["new_gate_created"] is False
          assert m["same_sample_tuning"] is False
          assert m["signal_day_or_earlier_only"] is True
          assert m["post_signal_data_used"] is False
          assert m["events"]==19 and m["success_n"]==10 and m["failure_n"]==9
          print(m)
          PY

      - run: cat reports/odoli_r211_accumulation_anatomy/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r211-accumulation-anatomy-${{ github.run_id }}
          path: reports/odoli_r211_accumulation_anatomy/**
          retention-days: 30
