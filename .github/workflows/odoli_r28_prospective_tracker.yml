name: ODOLI R2.8 Prospective Tracker

on:
  workflow_dispatch:
    inputs:
      signals_csv:
        description: "Prospective frozen-signal CSV path"
        required: false
        default: "research/odoli_prospective_signals.csv"
      state_csv:
        description: "Optional prior tracker state CSV path"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Validate prospective input file
        run: |
          test -f "${{ github.event.inputs.signals_csv }}" || {
            echo "::error::Missing prospective signals CSV: ${{ github.event.inputs.signals_csv }}"
            echo "Expected committed file with columns: signal_date,code,name,is_A,is_CORE,is_ODOLI"
            exit 1
          }
          echo "Using signals CSV: ${{ github.event.inputs.signals_csv }}"
          head -5 "${{ github.event.inputs.signals_csv }}" || true

      - name: Fetch current 2026 marcap PIT parquet
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run prospective tracker
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.state_csv }}" ]; then
            ARGS="--state ${{ github.event.inputs.state_csv }}"
          fi
          python -u odoli_r28_prospective_tracker.py \
            --signals "${{ github.event.inputs.signals_csv }}" \
            --marcap-root vendor/marcap \
            $ARGS \
            --output-dir reports/odoli_r28_prospective

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r28_prospective/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["signal_and_core_definitions_frozen"] is True
          assert m["prospective_observation_only"] is True
          print(m)
          PY

      - run: cat reports/odoli_r28_prospective/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r28-prospective-${{ github.run_id }}
          path: reports/odoli_r28_prospective/**
          retention-days: 30
