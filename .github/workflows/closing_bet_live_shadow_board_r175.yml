name: Closing Bet v49.76 Live Shadow Board R1.7.7 Compact + Manual Test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "35295676895"
      top_n:
        required: true
        default: "10"
      send_telegram:
        required: true
        type: boolean
        default: false
      allow_historical_test_send:
        required: true
        type: boolean
        default: false

  workflow_run:
    workflows:
      - "closing-bet-v49.76.6.7.3.2.5.1.2.1-final-universe-source-recovery"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  shadow_telegram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      CLOSING_BET_TOKEN: ${{ secrets.TELEGRAM_CLOSEBET_TOKEN || secrets.TELEGRAM_CLOSE_BET_TOKEN || secrets.CLOSING_BET_TOKEN || secrets.CLOSE_BET_TOKEN || secrets.CLOSING_BET_TELEGRAM_TOKEN || secrets.CLOSE_BET_TELEGRAM_TOKEN || vars.TELEGRAM_CLOSEBET_TOKEN || vars.TELEGRAM_CLOSE_BET_TOKEN }}
      CLOSING_BET_CHAT_ID: ${{ secrets.TELEGRAM_CLOSEBET_CHAT_ID || secrets.TELEGRAM_CLOSE_BET_CHAT_ID || secrets.CLOSING_BET_CHAT_ID || secrets.CLOSE_BET_CHAT_ID || secrets.CLOSING_BET_TELEGRAM_CHAT_ID || secrets.CLOSE_BET_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CLOSEBET_ROOM_ID || secrets.TELEGRAM_CLOSE_BET_ROOM_ID || secrets.CLOSING_BET_ROOM_ID || secrets.CLOSE_BET_ROOM_ID || vars.TELEGRAM_CLOSEBET_CHAT_ID || vars.TELEGRAM_CLOSE_BET_CHAT_ID || vars.CLOSING_BET_CHAT_ID || vars.CLOSE_BET_CHAT_ID || vars.CLOSING_BET_TELEGRAM_CHAT_ID || vars.CLOSE_BET_TELEGRAM_CHAT_ID || vars.TELEGRAM_CLOSEBET_ROOM_ID || vars.TELEGRAM_CLOSE_BET_ROOM_ID || vars.CLOSING_BET_ROOM_ID || vars.CLOSE_BET_ROOM_ID }}
      TELEGRAM_DYUL_CHAT_ID: ${{ secrets.TELEGRAM_DYUL_CHAT_ID || vars.TELEGRAM_DYUL_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Resolve source run
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then RID="${{ github.event.workflow_run.id }}"; else RID="${{ inputs.source_run_id }}"; fi
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
      - name: Download source and frozen references
        run: |
          mkdir -p source_run source_r14 source_r16_a
          gh run download "${{ steps.source.outputs.run_id }}" -D source_run
          gh run download "35445479856" -D source_r14
          gh run download "35469509910" -D source_r16_a
      - name: Build and optionally send R1.7.7 SHADOW
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXTRA="--automatic"
          else
            if [ "${{ inputs.send_telegram }}" = "true" ]; then EXTRA="$EXTRA --send-telegram"; fi
            if [ "${{ inputs.allow_historical_test_send }}" = "true" ]; then EXTRA="$EXTRA --allow-historical-test-send"; fi
          fi
          python -u closing_bet_live_shadow_board_r177.py \
            --source-root source_run \
            --r14-root source_r14 \
            --r16-a-root source_r16_a \
            --output-dir reports/live_shadow_board_r17 \
            --top-n "${{ inputs.top_n || '10' }}" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --r14-run-id "35445479856" \
            --r16-a-run-id "35469509910" \
            $EXTRA || true
      - name: Validate isolation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/live_shadow_board_r17/meta.json")
          if not p.exists(): raise SystemExit(0)
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["research_only"]
          assert not m.get("candidate_membership_changed",False)
          assert not m.get("candidate_order_changed",False)
          assert not m.get("score_rank_changed",False)
          assert not m.get("production_logic_changed",False)
          assert m["production_final_message_modified"] is False
          assert m["shadow_message_separate_from_production_final"] is True
          print("R177 PASS")
          PY
      - name: Upload R1.7.7 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r177-${{ github.run_id }}
          path: reports/live_shadow_board_r17/**
          if-no-files-found: warn
          retention-days: 30
