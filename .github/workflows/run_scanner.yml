            CORE224_LIVE)
              core224_live_only=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            HAM_1503_RESEARCH)
              ham1503=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            V73_DISCOVERY)
              v73_discovery=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            V73_CASE_AUDIT)
              v73_case_audit=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            TEST_FAST|*)
              profile="TEST_FAST"; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
          esac

          # 09:30 독립 레이더는 AI/차트/구글 없이 네이버 장중 배치시세(주) + pykrx(보조)로 빠르게 종료합니다.
          if [ "$open0930" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi
          if [ "$ham1503" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi
          if [ "$v73_discovery" = "1" ] || [ "$v73_case_audit" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi
          if [ "$core224_live_only" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
            catalyst_capture=0
          fi

          catalyst_mode="$(echo "${catalyst_mode:-AUTO}" | tr '[:lower:]' '[:upper:]')"
          if [ "$event" = "workflow_dispatch" ]; then
            case "$catalyst_mode" in
              ON) catalyst_capture=1 ;;
              OFF) catalyst_capture=0 ;;
              AUTO|*)
                if [ "$profile" = "REAL_FULL" ] || [ "$profile" = "V73_DISCOVERY" ]; then catalyst_capture=1; else catalyst_capture=0; fi ;;
            esac
          fi
          # Backtests and historical research never issue current web searches.
          if [ "$weekly" = "1" ] || [ "$ham1503" = "1" ] || [ "$v73_case_audit" = "1" ] || [ "$core224_live_only" = "1" ]; then catalyst_capture=0; fi
          # WEEKLY_BACKTEST may persist only already-computed diagnostic CSVs to Google Sheets.
          # This is storage I/O, not current-news capture, and does not enter the backtest inputs.
          if [ "$weekly" = "1" ]; then diagnostic_sheet_sync=1; fi

          save_file=1
