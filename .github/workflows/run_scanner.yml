          grep -Fq "V73.3.6.6.25.3.1 DATA AUTHORITY + ALL COHORT LIFECYCLE" main7_bugfix_2.py || { echo "❌ V25.3.1 data/lifecycle marker missing"; exit 208; }
          set +e
          python -u main7_bugfix_2.py 2>&1 | tee "reports/v73_v23_shard_D_${{ matrix.shard }}_stdout.log"
          worker_rc=${PIPESTATUS[0]}
          if [ "$worker_rc" -eq 192 ] && grep -Fq "NO_DIRECT_UNIVERSE" "reports/v73_v23_shard_D_${{ matrix.shard }}_stdout.log"; then
            echo "♻️ V25 shard transient universe outage detected → one bounded retry after 20s"
            sleep 20
            python -u main7_bugfix_2.py 2>&1 | tee "reports/v73_v23_shard_D_${{ matrix.shard }}_stdout_retry.log"
            worker_rc=${PIPESTATUS[0]}
          fi
          exit "$worker_rc"

      - name: Save V73 shard listing seed
        if: ${{ always() && hashFiles('reports/v73_listing_cache.csv') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            reports/v73_listing_cache.csv
            reports/v73_filter_rejection_ledger.csv
            reports/v73_discovery_stage_ledger.csv
          key: stockhunter-v73-state-${{ github.ref_name }}-${{ github.run_id }}-shard-${{ matrix.shard }}

      - name: Save V23 shard cache explicitly
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v20_replay_checkpoint
            reports/v23_materialized
          key: ${{ steps.v23-shard-key.outputs.key }}

      - name: Package V23 same-run materialized handoff
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/.cache/v20_replay_checkpoint reports/v23_materialized
          if [ ! -f reports/v73_v23_shard_manifest.json ]; then
            echo '{"version":"V73.3.6.6.23","status":"PARTIAL","errors":["SHARD_MANIFEST_MISSING_AFTER_WORKER"]}' > reports/v73_v23_shard_manifest.json
          fi
          python -u direct_replay_materialized_v23.py --package-handoff "v23_shard_D_${{ matrix.shard }}_handoff.tar.gz" --output-dir reports
          rc=$?
          echo "V23_PACKAGE rc=$rc"
          ls -lh "v23_shard_D_${{ matrix.shard }}_handoff.tar.gz" 2>/dev/null || true
          exit 0

      - name: Upload V23 shard handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-v23-shard-D-${{ matrix.shard }}-${{ github.run_id }}
          path: v23_shard_D_${{ matrix.shard }}_handoff.tar.gz
          if-no-files-found: warn
          retention-days: 2

  triangle1pb-research:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_profile == 'TRIANGLE1PB_RESEARCH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      TRIANGLE1PB_RESEARCH_ONLY: "1"
      TRIANGLE1PB_STRATEGY_ID: "TRIANGLE1PB_R1_CHRONOLOGY_FIRST"
      TRIANGLE1PB_LIVE_ENABLE: "0"
      TRIANGLE1PB_SCORE_RANK_ENABLE: "0"
      TRIANGLE1PB_ORDER_ENABLE: "0"
      TRIANGLE1PB_TUNING_ALLOWED: "0"
      V20_PRICE_CACHE_DIR: reports/.cache/v20_price_history
      V20_ASOF_CACHE_DIR: reports/.cache/v20_asof_snapshots
      V25_ACTUAL_AMOUNT_CACHE_DIR: reports/.cache/v25_actual_amount_history
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install TRIANGLE1PB research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Compile and synthetic chronology preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f triangle1pb_research.py || { echo "TRIANGLE1PB source missing"; exit 231; }
          python -m py_compile triangle1pb_research.py
          python triangle1pb_research.py --self-test
          grep -Fq 'RESEARCH_AUTHORITY = "RESEARCH_ONLY_NO_LIVE_NO_POLICY_NO_ORDERS"' triangle1pb_research.py
          grep -Fq 'STRATEGY_ID = "TRIANGLE1PB_R1_CHRONOLOGY_FIRST"' triangle1pb_research.py
          grep -Fq 'synthetic_close_x_volume_fallback_rows' triangle1pb_research.py
          echo "TRIANGLE1PB_PREFLIGHT PASS independent=1 live=0 score_rank=0 order=0 tuning=0"

      - name: Restore latest V21 research cache read-only
        id: tri-v21-restore
        uses: actions/cache/restore@v4
        with:
          # This path-set intentionally matches the canonical V21 save path-set byte-for-byte
          # so actions/cache version matching can restore the existing research cache.
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
            reports/.cache/v20_replay_checkpoint
          key: triangle1pb-readonly-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-v21-replay-${{ github.ref_name }}-

      - name: Prove TRIANGLE1PB research data authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/triangle1pb
          price_files=$(find reports/.cache/v20_price_history -type f 2>/dev/null | wc -l | tr -d ' ')
          asof_files=$(find reports/.cache/v20_asof_snapshots -type f 2>/dev/null | wc -l | tr -d ' ')
          amount_files=$(find reports/.cache/v25_actual_amount_history -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "TRIANGLE1PB_CACHE_RESTORE matched=${{ steps.tri-v21-restore.outputs.cache-matched-key }} price_files=${price_files} asof_files=${asof_files} amount_files=${amount_files} cache_write=0"
          test "$price_files" -gt 0 || { echo "TRIANGLE1PB_FAIL_CLOSED price cache empty"; exit 232; }
          test "$asof_files" -gt 0 || { echo "TRIANGLE1PB_FAIL_CLOSED historical as-of universe cache empty"; exit 233; }

      - name: Run TRIANGLE1PB chronology-first two-year research
        shell: bash
        env:
          TRI_START_DATE: ${{ inputs.tri_start_date }}
          TRI_END_DATE: ${{ inputs.tri_end_date }}
          TRI_MAX_CODES: ${{ inputs.tri_max_codes }}
          TRI_MANUAL_SAMPLE_LIMIT: ${{ inputs.tri_manual_sample_limit }}
        run: |
          set -euo pipefail
          args=(
            --price-cache-dir reports/.cache/v20_price_history
            --asof-cache-dir reports/.cache/v20_asof_snapshots
            --amount-cache-dir reports/.cache/v25_actual_amount_history
            --output-dir reports/triangle1pb
            --max-codes "${TRI_MAX_CODES:-0}"
            --manual-sample-limit "${TRI_MANUAL_SAMPLE_LIMIT:-40}"
          )
          if [ -n "${TRI_START_DATE:-}" ]; then args+=(--start-date "$TRI_START_DATE"); fi
          if [ -n "${TRI_END_DATE:-}" ]; then args+=(--end-date "$TRI_END_DATE"); fi
          python -u triangle1pb_research.py "${args[@]}" | tee reports/triangle1pb/tri_runtime.log

      - name: TRIANGLE1PB fail-closed research postflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTRIGUARD'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('reports/triangle1pb')
          required=[
              'tri_state_spec.csv','tri_stage_ledger.csv','tri_signal_ledger.csv','tri_forward_outcomes.csv',
              'tri_stage_counts.csv','tri_rejection_ledger.csv','tri_rejection_counts.csv',
              'tri_chronology_audit.csv','tri_lookahead_audit.csv','tri_invariant_audit.csv',
              'tri_amount_authority_audit.csv','tri_asof_universe_audit.csv','tri_manual_chart_review_sample.csv',
              'tri_event_study_summary.csv','tri_manifest.json','tri_report.txt','tri_runtime.log',
          ]
          missing=[x for x in required if not (root/x).exists()]
          assert not missing, ('TRIANGLE1PB_OUTPUT_MISSING',missing)
          m=json.loads((root/'tri_manifest.json').read_text(encoding='utf-8'))
          assert m.get('schema')=='TRIANGLE1PB_RESEARCH_SCHEMA_V1'
          assert m.get('strategy_id')=='TRIANGLE1PB_R1_CHRONOLOGY_FIRST'
          assert m.get('research_authority')=='RESEARCH_ONLY_NO_LIVE_NO_POLICY_NO_ORDERS'
          assert m.get('core224_dependency')=='NONE'
          assert m.get('core224_logic_changed') is False
          assert m.get('live_logic_changed') is False
          assert m.get('score_rank_changed') is False
          assert m.get('order_logic_changed') is False
          assert m.get('primary_policy')=='NONE_EVENT_STUDY_ONLY'
          assert m.get('tuning_allowed') is False
          assert int(m.get('actual_amount_synthetic_fallback_rows',-1))==0
          assert int(m.get('lookahead_fail',-1))==0
          assert int(m.get('invariant_fail',-1))==0
          assert m.get('status')=='PASS'
          inv=pd.read_csv(root/'tri_invariant_audit.csv')
          la=pd.read_csv(root/'tri_lookahead_audit.csv')
          amt=pd.read_csv(root/'tri_amount_authority_audit.csv')
          uni=pd.read_csv(root/'tri_asof_universe_audit.csv')
          assert len(inv)==1 and str(inv.iloc[-1].get('status'))=='PASS'
          assert len(la)==1 and str(la.iloc[-1].get('status'))=='PASS'
          assert int(float(amt.iloc[-1].get('synthetic_close_x_volume_fallback_rows',-1)))==0
          assert int(float(uni.iloc[-1].get('future_snapshot_fallback_allowed',1)))==0
          print('TRIANGLE1PB_POSTFLIGHT PASS', 'signals',m.get('restart_signals'), 'digest',m.get('research_authority_digest'), 'core224_changed',m.get('core224_logic_changed'), 'live_changed',m.get('live_logic_changed'))
          PYTRIGUARD

      - name: Show TRIANGLE1PB research board
        if: always()
        shell: bash
        run: |
          echo "===== TRIANGLE1PB RESEARCH BOARD ====="
          cat reports/triangle1pb/tri_report.txt 2>/dev/null || true
          echo "===== STAGE COUNTS ====="
          cat reports/triangle1pb/tri_stage_counts.csv 2>/dev/null || true
          echo "===== INVARIANT ====="
          cat reports/triangle1pb/tri_invariant_audit.csv 2>/dev/null || true

      - name: Send TRIANGLE1PB research board to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BACKTEST_TOKEN: ${{ secrets.TELEGRAM_BACKTEST_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STOCKHUNTER_CHAT_ID: ${{ secrets.STOCKHUNTER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTRITELEGRAM'
          import csv
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("reports/triangle1pb")
          manifest_path = root / "tri_manifest.json"
          report_path = root / "tri_report.txt"
          signal_path = root / "tri_signal_ledger.csv"

          token = (os.environ.get("TELEGRAM_BACKTEST_TOKEN") or os.environ.get("TELEGRAM_TOKEN") or "").strip()
          chat_id = (os.environ.get("STOCKHUNTER_CHAT_ID") or os.environ.get("TELEGRAM_CHAT_ID") or "").strip()

          token_route = "TELEGRAM_BACKTEST_TOKEN" if os.environ.get("TELEGRAM_BACKTEST_TOKEN", "").strip() else (
              "TELEGRAM_TOKEN" if os.environ.get("TELEGRAM_TOKEN", "").strip() else "MISSING"
          )
          chat_route = "STOCKHUNTER_CHAT_ID" if os.environ.get("STOCKHUNTER_CHAT_ID", "").strip() else (
              "TELEGRAM_CHAT_ID" if os.environ.get("TELEGRAM_CHAT_ID", "").strip() else "MISSING"
          )

          if not token or not chat_id:
              print(
                  "TRIANGLE1PB_TELEGRAM_SKIP",
                  "reason=ROUTE_MISSING",
                  f"token_route={token_route}",
                  f"chat_route={chat_route}",
              )
              raise SystemExit(0)

          lines = [
              "🔬 [TRIANGLE1PB RESEARCH BOARD]",
              "RESEARCH ONLY · 주문 0 · LIVE/점수/랭킹 0 · CORE224 무관",
          ]

          if not manifest_path.exists():
              lines += [
                  "⚠️ 연구 manifest가 생성되지 않았습니다.",
                  "Actions artifact/log를 확인하세요.",
              ]
          else:
              m = json.loads(manifest_path.read_text(encoding="utf-8"))
              stage = m.get("stage_counts") or {}
              gate = m.get("gate_diagnostics") or {}

              lines += [
                  f"📌 strategy={m.get('strategy_id','-')}",
                  f"📅 period={m.get('research_start') or m.get('start_date','-')} ~ {m.get('research_end') or m.get('end_date','-')} · codes={m.get('codes_scanned','-')}",
                  "",
                  "🧭 [Chronology]",
                  (
                      f"SQUEEZE {stage.get('TRI_SQUEEZE',0)}"
                      f" → BREAKOUT {stage.get('TRI_BREAKOUT_WAVE1',0)}"
                      f" → FIRST_PB {stage.get('TRI_FIRST_PULLBACK',0)}"
                      f" → HEALTHY_PB {stage.get('TRI_HEALTHY_PULLBACK',0)}"
                      f" → RESTART {stage.get('TRI_RESTART',0)}"
                  ),
              ]

              if gate:
                  lines += [
                      "",
                      "🔎 [Gate Funnel]",
                      f"windows {int(gate.get('windows_tested',0)):,}",
                      (
                          f"full-squeeze {int(gate.get('squeeze_qualifying_windows',0)):,}"
                          f" · codes {int(gate.get('codes_with_qualifying_squeeze_window',0)):,}"
                      ),
                      (
                          f"min-streak reach {int(gate.get('squeeze_streak_reached',0)):,}"
                          f" · max streak {int(gate.get('max_squeeze_streak_global',0))}"
                      ),
                      (
                          f"universe PASS {int(gate.get('squeeze_universe_pass',0)):,}"
                          f" / FAIL {int(gate.get('squeeze_universe_fail',0)):,}"
                      ),
                      f"breakout price-cross {int(gate.get('breakout_price_cross',0)):,}",
                      f"Amount-ready {int(gate.get('breakout_amount_ready',0)):,}",
                      f"breakout accepted {int(gate.get('breakout_accepted',0)):,}",
                      f"restart accepted {int(gate.get('restart_accepted',0)):,}",
                  ]

              struct = m.get("structure_fidelity_audit") or {}
              if struct:
                  lines += [
                      "",
                      "🧬 [Structure Fidelity Audit]",
                      f"raw squeeze audit {int(struct.get('rows',0)):,}/{int(struct.get('expected_full_squeeze_rows',0)):,} · errors {int(struct.get('audit_errors',0)):,}",
                      f"research {int(struct.get('research_period_rows',0)):,} / warm-up {int(struct.get('warmup_rows',0)):,} · research codes {int(struct.get('research_period_codes',0)):,}",
                      f"manual sample {int(struct.get('manual_review_rows',0)):,}",
                      f"post15 wave1 {int(struct.get('wave1_found_rows',0)):,}",
                      f"first pullback {int(struct.get('first_pullback_found_rows',0)):,}",
                      f"restart-after-PB {int(struct.get('restart_after_pullback_rows',0)):,}",
                      "※ post-event 수치는 검증용 미래정보이며 검색 gate에는 미사용",
                  ]

              cf = m.get("counterfactual_streak_audit") or {}
              cf_rows = cf.get("summary") or []
              if cf_rows:
                  lines += ["", "🧪 [Streak Counterfactual · 연구기간만]"]
                  for r in cf_rows:
                      lines.append(
                          (
                              f"streak≥{int(r.get('streak_threshold',0))}: "
                              f"runs {int(r.get('research_candidate_runs',0))} · "
                              f"strict {int(r.get('first_cross_exact_with_universe',0))}"
                              f"→H{int(r.get('healthy_pullback_existing',0))}"
                              f"→R{int(r.get('restart_existing',0))} · "
                              f"qualified {int(r.get('any_exact_breakout_with_universe',0))}"
                              f"→H{int(r.get('qualified_healthy_pullback_existing',0))}"
                              f"→R{int(r.get('qualified_restart_existing',0))} · "
                              f"probe→qualified {int(r.get('probe_then_qualified_breakout',0))}"
                          )
                      )
                  lines.append("※ strict=첫 가격돌파 즉시판정 · qualified=동일 기존조건을 처음 모두 만족한 본돌파")
                  lines.append("※ 가상비교 전용 · 실제 chronology/streak/전략조건 변경 없음")

              qev = m.get("qualified_event_fidelity_audit") or {}
              qev_rows = qev.get("summary") or []
              if qev_rows:
                  q = qev_rows[0]
                  lines += [
                      "",
                      "🧫 [Qualified Unique Event Audit · streak1]",
                      (
                          f"unique {int(q.get('qualified_unique_events',0))}"
                          f" · duplicate source-runs {int(q.get('duplicate_source_runs',0))}"
                          f" · direct {int(q.get('direct_canonical_events',0))}"
                          f" · probe→qualified {int(q.get('probe_to_qualified_canonical_events',0))}"
                      ),
                      (
                          f"healthy {int(q.get('healthy_events',0))}"
                          f" · restart {int(q.get('restart_events',0))}"
                          f" · +5% {int(q.get('impulse_5pct_events',0))}"
                          f" · +10% {int(q.get('impulse_10pct_events',0))}"
                      ),
                      (
                          f"lower-structure intact {int(q.get('wait_structure_intact_lower_events',0))}"
                          f" · lower-break {int(q.get('wait_lower_break_events',0))}"
                          f" · discontinuity≥35% {int(q.get('suspicious_price_discontinuity_events',0))}"
                      ),
                      (
                          f"clean+intact {int(q.get('clean_intact_events',0))}"
                          f" → H{int(q.get('clean_intact_healthy_events',0))}"
                          f" → R{int(q.get('clean_intact_restart_events',0))}"
                      ),
                      "※ event audit 전용 · 실제 전략 gate 미변경",
                  ]

              ps = m.get("phase_sequence_audit") or {}
              ps_rows = ps.get("summary") or []
              if ps_rows:
                  p = ps_rows[0]
                  lines += [
                      "",
                      "🧩 [Phase Sequence Audit · unique qualified events]",
                      (
                          f"pre60 spike: Vol2x {int(p.get('pre60_volume_spike_2x_present',0))}"
                          f" · Amount2x {int(p.get('pre60_amount_spike_2x_present',0))}"
                          f" · accum-proxy {int(p.get('legacy_accumulation_proxy_present',0))}"
                      ),
                      (
                          f"squeeze cooling: Amount {int(p.get('squeeze_amount_cooling_events',0))}"
                          f" · Vol {int(p.get('squeeze_volume_cooling_events',0))}"
                          f" · range {int(p.get('squeeze_range_compression_events',0))}"
                          f" · all3 {int(p.get('three_phase_compression_events',0))}"
                      ),
                      (
                          f"breakout Amount20 mean median {float(p.get('median_breakout_amount20_mean_ratio',0) or 0):.2f}x"
                          f" · +5% {int(p.get('impulse_5pct_events',0))}"
                          f" · +10% {int(p.get('impulse_10pct_events',0))}"
                      ),
                      (
                          f"healthy {int(p.get('healthy_events',0))}"
                          f" · PB Amount/BO median {float(p.get('median_healthy_pullback_amount_vs_breakout',0) or 0):.2f}x"
                          f" · restart {int(p.get('restart_events',0))}"
                      ),
                      (
                          f"all3→+5%→healthy {int(p.get('sequence_compression_plus_5pct_plus_healthy',0))}"
                          f" · 그중 restart {int(p.get('sequence_compression_plus_5pct_plus_healthy_restart',0))}"
                      ),
                      (
                          f"extreme-context≥29% {int(p.get('extreme_context_29pct_events',0))}"
                          f" · lower-line intact tag {int(p.get('lower_structure_intact_tag_events',0))}"
                      ),
                      "※ phase audit 전용 · 어떤 태그도 실제 strategy gate에 미사용",
                  ]

              te = m.get("terminal_energy_profile_audit") or {}
              te_rows = te.get("summary") or []
              if te_rows:
                  t = te_rows[0]
                  total = int(t.get("qualified_unique_events",0))
                  ta = int(t.get("terminal_all3_dry_events",0))
                  nt = max(0, total - ta)
                  lines += [
                      "",
                      "⚡ [Terminal Energy Profile · unique qualified events]",
                      (
                          f"early-flow {int(t.get('early_flow_present_events',0))}/{total}"
                          f" · terminal dry: Amount {int(t.get('terminal_amount_dry_events',0))}"
                          f" / Vol {int(t.get('terminal_volume_dry_events',0))}"
                          f" / range {int(t.get('terminal_range_dry_events',0))}"
                          f" / all3 {ta}"
                      ),
                      (
                          f"median late/early: Amount {float(t.get('median_terminal_amount_ratio',0) or 0):.2f}x"
                          f" · Vol {float(t.get('median_terminal_volume_ratio',0) or 0):.2f}x"
                          f" · range {float(t.get('median_terminal_range_ratio',0) or 0):.2f}x"
                      ),
                      (
                          f"breakout/terminal median: Amount {float(t.get('median_breakout_vs_terminal_amount_ratio',0) or 0):.2f}x"
                          f" · Vol {float(t.get('median_breakout_vs_terminal_volume_ratio',0) or 0):.2f}x"
                      ),
                      (
                          f"terminal-all3 {ta}: +5% {int(t.get('terminal_all3_impulse_5pct',0))}"
                          f" · +10% {int(t.get('terminal_all3_impulse_10pct',0))}"
                          f" · H{int(t.get('terminal_all3_healthy',0))}"
                          f" · R{int(t.get('terminal_all3_restart',0))}"
                      ),
                      (
                          f"nonterminal {nt}: +5% {int(t.get('nonterminal_impulse_5pct',0))}"
                          f" · +10% {int(t.get('nonterminal_impulse_10pct',0))}"
                          f" · H{int(t.get('nonterminal_healthy',0))}"
                          f" · R{int(t.get('nonterminal_restart',0))}"
                      ),
                      "※ terminal profile도 관찰용 · 실제 strategy gate 미사용",
                  ]

              cc = m.get("causal_precursor_case_control_audit") or {}
              cc_rows = cc.get("summary") or []
              if cc_rows:
                  c = cc_rows[0]
                  def pct(v):
                      try:
                          return f"{float(v)*100.0:.1f}%"
                      except Exception:
                          return "-"
                  lines += [
                      "",
                      "🧪 [Causal Precursor Case-Control · streak1 전체]",
                      (
                          f"runs {int(c.get('streak1_candidate_runs',0))}"
                          f" → qualified {int(c.get('qualified_breakouts',0))}"
                          f" · strict {int(c.get('strict_first_cross_exact',0))}"
                      ),
                      (
                          f"terminal-all3 {int(c.get('terminal_all3_runs',0))}"
                          f" → Q{int(c.get('terminal_all3_qualified',0))}"
                          f" ({pct(c.get('terminal_all3_qualified_rate'))})"
                          f" | nonterminal {int(c.get('nonterminal_runs',0))}"
                          f" → Q{int(c.get('nonterminal_qualified',0))}"
                          f" ({pct(c.get('nonterminal_qualified_rate'))})"
                      ),
                      (
                          f"early-flow Q-rate {pct(c.get('early_flow_qualified_rate'))}"
                          f" vs no-flow {pct(c.get('no_early_flow_qualified_rate'))}"
                      ),
                      (
                          f"OBV+ Q-rate {pct(c.get('obv_positive_qualified_rate'))}"
                          f" vs non+ {pct(c.get('obv_nonpositive_qualified_rate'))}"
                          f" · BB40↓ {pct(c.get('bb40_contracting_qualified_rate'))}"
                          f" vs no↓ {pct(c.get('bb40_noncontracting_qualified_rate'))}"
                      ),
                      (
                          f"terminal Amount median Q/nonQ "
                          f"{float(c.get('qualified_median_terminal_amount_ratio',0) or 0):.2f}x/"
                          f"{float(c.get('nonqualified_median_terminal_amount_ratio',0) or 0):.2f}x"
                          f" · Vol "
                          f"{float(c.get('qualified_median_terminal_volume_ratio',0) or 0):.2f}x/"
                          f"{float(c.get('nonqualified_median_terminal_volume_ratio',0) or 0):.2f}x"
                      ),
                      "※ feature는 squeeze일까지 causal · qualified/H/R은 비교용 미래 label",
                      "※ 어떤 precursor도 실제 strategy gate에 미사용",
                  ]

              jp = m.get("joint_precursor_stability_audit") or {}
              jp_rows = jp.get("summary") or []
              if jp_rows:
                  def _find(split, group):
                      for rr in jp_rows:
                          if rr.get("split") == split and rr.get("group") == group:
                              return rr
                      return {}
                  fullj = _find("FULL","OBV+_AND_BB40DOWN")
                  fullr = _find("FULL","REST")
                  h1j = _find("H1_EARLY","OBV+_AND_BB40DOWN")
                  h1r = _find("H1_EARLY","REST")
                  h2j = _find("H2_LATE","OBV+_AND_BB40DOWN")
                  h2r = _find("H2_LATE","REST")
                  def _pctrow(r):
                      try:
                          return f"{float(r.get('qualified_rate'))*100.0:.1f}%"
                      except Exception:
                          return "-"
                  lines += [
                      "",
                      "🧬 [Joint Precursor Stability · 탐색가설]",
                      (
                          f"OBV+ & BB40↓ FULL: {int(fullj.get('qualified_breakout',0))}/"
                          f"{int(fullj.get('runs',0))} = {_pctrow(fullj)}"
                          f" | rest {int(fullr.get('qualified_breakout',0))}/"
                          f"{int(fullr.get('runs',0))} = {_pctrow(fullr)}"
                      ),
                      (
                          f"H1: {_pctrow(h1j)} vs {_pctrow(h1r)}"
                          f" · H2: {_pctrow(h2j)} vs {_pctrow(h2r)}"
                      ),
                      (
                          f"FULL H {int(fullj.get('healthy',0))}/{int(fullj.get('runs',0))}"
                          f" · R {int(fullj.get('restart',0))}/{int(fullj.get('runs',0))}"
                      ),
                      "※ 같은 2년 데이터에서 발견한 post-hoc 조합 · 아직 전략 filter 아님",
                      "※ 192개 전체 review bars 저장 · qualified/실패 모두 육안 비교 가능",
                  ]

              patha = m.get("qualified_d1_d15_path_audit") or {}
              path_rows = patha.get("summary") or []
              if path_rows:
                  def _pgroup(name):
                      for rr in path_rows:
                          if rr.get("group") == name:
                              return rr
                      return {}
                  pa = _pgroup("ALL")
                  pr = _pgroup("RESTART")
                  lines += [
                      "",
                      "📈 [Qualified D+1~D+15 Path · breakout close 기준]",
                      f"events {int(pa.get('events',0))} · D15 complete {int(pa.get('d15_complete_events',0))} · peak-day median D+{float(pa.get('median_peak_day_within_15',0) or 0):.1f}",
                      f"D+5 Close {float(pa.get('d5_close_ret_median_pct',0) or 0):+.2f}% / MFE {float(pa.get('d5_mfe_median_pct',0) or 0):+.2f}% / MAE {float(pa.get('d5_mae_median_pct',0) or 0):+.2f}%",
                      f"D+10 Close {float(pa.get('d10_close_ret_median_pct',0) or 0):+.2f}% / MFE {float(pa.get('d10_mfe_median_pct',0) or 0):+.2f}% / MAE {float(pa.get('d10_mae_median_pct',0) or 0):+.2f}%",
                      f"D+15 Close {float(pa.get('d15_close_ret_median_pct',0) or 0):+.2f}% / MFE {float(pa.get('d15_mfe_median_pct',0) or 0):+.2f}% / MAE {float(pa.get('d15_mae_median_pct',0) or 0):+.2f}%",
                      f"within15 +5% {int(pa.get('plus5_reached_within_15',0))} · +10% {int(pa.get('plus10_reached_within_15',0))} · restart-group D15 Close {float(pr.get('d15_close_ret_median_pct',0) or 0):+.2f}%",
                      "※ D+1~15는 미래 outcome 연구 · 검색 gate 미사용",
                  ]

              maa = m.get("long_ma_context_audit") or {}
              ma_rows = maa.get("summary") or []
              if ma_rows:
                  def _marow(stype, group):
                      for rr in ma_rows:
                          if rr.get("summary_type") == stype and rr.get("group") == group:
                              return rr
                      return {}
                  mb = _marow("SQUEEZE_CAUSAL_QUALIFIED_RATE","SQUEEZE_BELOW_MA224")
                  ma = _marow("SQUEEZE_CAUSAL_QUALIFIED_RATE","SQUEEZE_AT_OR_ABOVE_MA224")
                  ebb = _marow("QUALIFIED_PATH_BY_BREAKOUT_MA224","BREAKOUT_BELOW_MA224")
                  eba = _marow("QUALIFIED_PATH_BY_BREAKOUT_MA224","BREAKOUT_AT_OR_ABOVE_MA224")
                  cov = _marow("MA_COVERAGE","ALL")
                  def _rate(rr):
                      try: return f"{float(rr.get('qualified_rate'))*100.0:.1f}%"
                      except Exception: return "-"
                  lines += [
                      "",
                      "📏 [Long MA Context · MA120/200/224]",
                      f"squeeze MA224 ready {int(cov.get('ma224_ready',0))}/{int(cov.get('runs',0))} · below: Q {int(mb.get('qualified',0))}/{int(mb.get('runs',0))} ({_rate(mb)}) · at/above: Q {int(ma.get('qualified',0))}/{int(ma.get('runs',0))} ({_rate(ma)})",
                      f"qualified breakout below224 {int(ebb.get('runs',0))}: D10 MFE {float(ebb.get('d10_mfe_median_pct',0) or 0):+.2f}% / D15 MFE {float(ebb.get('d15_mfe_median_pct',0) or 0):+.2f}%",
                      f"qualified breakout at/above224 {int(eba.get('runs',0))}: D10 MFE {float(eba.get('d10_mfe_median_pct',0) or 0):+.2f}% / D15 MFE {float(eba.get('d15_mfe_median_pct',0) or 0):+.2f}%",
                      "※ squeeze MA 위치는 causal context · MA 조건도 아직 전략 filter 아님",
                  ]

              amount_cov = m.get("actual_amount_coverage_pct")
              asof_dates = m.get("asof_snapshot_dates")
              lookahead = m.get("lookahead_fail", 0)
              invariant = m.get("invariant_fail", 0)
              rerun = m.get("deterministic_rerun_fail", 0)
              if amount_cov is not None or asof_dates is not None:
                  amount_txt = "-" if amount_cov is None else f"{float(amount_cov):.2f}%"
                  lines += [
                      "",
                      "🛡️ [Authority/Audit]",
                      f"actual Amount coverage {amount_txt} · Close×Volume fallback 0",
                      f"as-of snapshots {asof_dates if asof_dates is not None else '-'} · future fallback 0",
                      f"lookahead {lookahead} · invariant {invariant} · deterministic {rerun}",
                  ]

              # If future research produces accepted restart signals, include a small
              # research-only preview without converting them into orders/recommendations.
              signal_rows = []
              if signal_path.exists() and signal_path.stat().st_size > 0:
                  try:
                      with signal_path.open(encoding="utf-8-sig", newline="") as f:
                          signal_rows = list(csv.DictReader(f))
                  except Exception:
                      signal_rows = []
              if signal_rows:
                  lines += ["", "🧪 [RESTART 연구표본 · 매수추천 아님]"]
                  for r in signal_rows[:5]:
                      code = r.get("code") or r.get("ticker") or "-"
                      date = r.get("event_date") or r.get("signal_date") or "-"
                      lines.append(f"• {code} · {date}")
                  if len(signal_rows) > 5:
                      lines.append(f"외 {len(signal_rows)-5}건")

          if report_path.exists():
              try:
                  report = report_path.read_text(encoding="utf-8", errors="replace")
                  next_gate = next(
                      (x.split("=",1)[1].strip() for x in report.splitlines() if x.startswith("NEXT_GATE=")),
                      "",
                  )
                  if next_gate:
                      lines += ["", f"➡️ NEXT: {next_gate}"]
              except Exception:
                  pass

          message = "\n".join(lines).strip()
          if len(message) > 3900:
              message = message[:3860] + "\n…(Telegram 길이 제한으로 생략)"

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true",
          }).encode("utf-8")

          req = urllib.request.Request(url, data=payload, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  status = int(getattr(resp, "status", 200))
          except Exception as exc:
              print(
                  "TRIANGLE1PB_TELEGRAM_SEND_FAIL",
                  f"token_route={token_route}",
                  f"chat_route={chat_route}",
                  f"error={type(exc).__name__}:{str(exc)[:500]}",
              )
              raise

          data = json.loads(raw)
          assert status == 200 and bool(data.get("ok")), ("TELEGRAM_API_NOT_OK", status, raw[:1000])
          msg_id = ((data.get("result") or {}).get("message_id"))
          print(
              "TRIANGLE1PB_TELEGRAM_SEND",
              "status=PASS",
              f"token_route={token_route}",
              f"chat_route={chat_route}",
              f"message_id={msg_id}",
              f"chars={len(message)}",
              "closebet_route_used=0",
          )
          PYTRITELEGRAM

      - name: Upload TRIANGLE1PB research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triangle1pb-r1-chronology-research-${{ github.run_number }}
          path: reports/triangle1pb/**
          if-no-files-found: warn
          retention-days: 30

