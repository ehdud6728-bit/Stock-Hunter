    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schedule proof / trigger diagnostics
        if: always()
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧭 [V1107.4.5.26 SCHEDULE PROOF]"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_EVENT_SCHEDULE=${{ github.event.schedule }}"
          echo "GITHUB_EVENT_SCHEDULE=${{ github.event.schedule }}" >> $GITHUB_ENV
          echo "NOW_UTC=$(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "SCHEDULE_EXPECTED_KST=08:37 / 09:30 / 14:37 / HAM 15:03 / 15:07 / V73 15:35 / CORE224 EOD 15:45 weekdays"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Resolve run profile
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_PROFILE: ${{ inputs.run_profile }}
          INPUT_TEST_CHAT_ID_OVERRIDE: ${{ inputs.test_chat_id_override }}
          INPUT_BACKTEST_SOURCE: ${{ inputs.backtest_source }}
          INPUT_DIRECT_TOP_N: ${{ inputs.direct_top_n }}
          INPUT_DIRECT_LIMIT_PER_DATE: ${{ inputs.direct_limit_per_date }}
          INPUT_BACKTEST_WEEKS: ${{ inputs.backtest_weeks }}
          INPUT_BACKTEST_HOLD_DAYS: ${{ inputs.backtest_hold_days }}
          INPUT_BACKTEST_STOP_PCT: ${{ inputs.backtest_stop_pct }}
          INPUT_BACKTEST_STOP_MODE: ${{ inputs.backtest_stop_mode }}
          INPUT_V25_COHORT_MODE: ${{ inputs.v25_cohort_mode }}
          INPUT_V25_TWO_YEAR_END_DATE: ${{ inputs.v25_two_year_end_date }}
          INPUT_V25_COHORT_START_DATE: ${{ inputs.v25_cohort_start_date }}
          INPUT_V25_COHORT_END_DATE: ${{ inputs.v25_cohort_end_date }}
          INPUT_V73_UNIVERSE_LIMIT: ${{ inputs.v73_universe_limit }}
          INPUT_V73_CASE_CODES: ${{ inputs.v73_case_codes }}
          INPUT_V73_CASE_DATES: ${{ inputs.v73_case_dates }}
          INPUT_CATALYST_FORWARD_CAPTURE: ${{ inputs.catalyst_forward_capture }}
        run: |
          set -euo pipefail
          event="${GH_EVENT_NAME:-}"
          schedule_expr="${GITHUB_EVENT_SCHEDULE:-}"
          legacy_chat="${V1107_4_5_47_BACKTEST_TARGET_CHAT_ID:-8325973023}"
          open0930=0
          ham1503=0
          v73_discovery=0
          v73_case_audit=0
          core224_live_only=0
          catalyst_capture=0
          catalyst_mode="AUTO"
          diagnostic_sheet_sync=0
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "30 00 * * 1-5" ]; then
            open0930=1
          fi
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "03 06 * * 1-5" ]; then
            ham1503=1
          fi
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "35 06 * * 1-5" ]; then
            v73_discovery=1
          fi
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "45 06 * * 1-5" ]; then
            core224_live_only=1
          fi
          # Forward-causal source capture runs twice daily: pre-market and after the 15:07 close scan.
          if [ "$event" = "schedule" ] && { [ "$schedule_expr" = "37 23 * * 0-4" ] || [ "$schedule_expr" = "07 06 * * 1-5" ]; }; then
            catalyst_capture=1
          fi

          if [ "$event" = "workflow_dispatch" ]; then
            profile="${INPUT_RUN_PROFILE:-TEST_FAST}"
            test_chat="${INPUT_TEST_CHAT_ID_OVERRIDE:-$legacy_chat}"
            bt_source="${INPUT_BACKTEST_SOURCE:-DIRECT_REPLAY}"
            direct_top_n="${INPUT_DIRECT_TOP_N:-500}"
            direct_limit="${INPUT_DIRECT_LIMIT_PER_DATE:-15}"
            bt_weeks="${INPUT_BACKTEST_WEEKS:-24}"
            bt_hold_days="${INPUT_BACKTEST_HOLD_DAYS:-10}"
            bt_stop_pct="${INPUT_BACKTEST_STOP_PCT:--5}"
            bt_stop_mode="${INPUT_BACKTEST_STOP_MODE:-SIGNAL_STOP_WITH_FALLBACK}"
            v25_cohort_mode="${INPUT_V25_COHORT_MODE:-ROLLING}"
            v25_two_year_end_date="${INPUT_V25_TWO_YEAR_END_DATE:-}"
            v25_cohort_start_date="${INPUT_V25_COHORT_START_DATE:-}"
            v25_cohort_end_date="${INPUT_V25_COHORT_END_DATE:-}"
            v73_universe_limit="${INPUT_V73_UNIVERSE_LIMIT:-900}"
            v73_case_codes="${INPUT_V73_CASE_CODES:-119850}"
            v73_case_dates="${INPUT_V73_CASE_DATES:-2026-06-29,2026-07-08}"
            catalyst_mode="${INPUT_CATALYST_FORWARD_CAPTURE:-AUTO}"
          else
            profile="REAL_FULL"
            test_chat="$legacy_chat"
            bt_source="DIRECT_REPLAY"
            direct_top_n="500"
            direct_limit="15"
            bt_weeks="8"
            bt_hold_days="10"
            bt_stop_pct="-5"
            bt_stop_mode="SIGNAL_STOP_WITH_FALLBACK"
            v25_cohort_mode="ROLLING"
            v25_two_year_end_date=""
            v25_cohort_start_date=""
