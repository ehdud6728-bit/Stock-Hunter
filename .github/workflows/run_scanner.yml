          echo "token_set=$([ -n "${TOKEN}" ] && echo YES || echo NO)"
          echo "chat_set=$([ -n "${CHAT_ID}" ] && echo YES || echo NO)"
          if [ -z "${TOKEN}" ]; then
            echo "❌ TELEGRAM_BACKTEST_TOKEN is empty. GitHub Secret부터 확인해야 합니다."
            exit 1
          fi
          if [ -z "${CHAT_ID}" ]; then
            echo "❌ target chat_id is empty. TEST_CHAT_ID_OVERRIDE/TELEGRAM_CHAT_ID_EFFECTIVE를 확인해야 합니다."
            exit 1
          fi
          echo "✅ V56 preflight OK — 수동/스케줄 모두 백테스트 텔레그램 경로로 강제합니다."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

