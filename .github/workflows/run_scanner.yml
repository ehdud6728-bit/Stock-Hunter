name: Run Main Scanner V1107.4.5.73.3.6.6.25.4.12-HF12 + TRIANGLE1PB R1 Independent Research

on:
  schedule:
    # 한국시간 평일 오전 8:37 = UTC 전날 23:37, 일~목
    - cron: '37 23 * * 0-4'
    # 한국시간 평일 오전 9:30 = UTC 00:30, 월~금 — 강섹터·대장주 독립 레이더
    - cron: '30 00 * * 1-5'
    # 한국시간 평일 오후 2:37 = UTC 05:37, 월~금
    - cron: '37 05 * * 1-5'
    # 한국시간 평일 오후 3:03 = UTC 06:03, 월~금 — HAM 연구 전용 + 패턴교차 경로감사(실제 종가후보 SHADOW는 15:07)
    - cron: '03 06 * * 1-5'
    # 한국시간 평일 오후 3:07 = UTC 06:07, 월~금
    - cron: '07 06 * * 1-5'
    # 한국시간 평일 오후 3:35 = UTC 06:35, 월~금 — V73 발견→추적 독립 실행
    - cron: '35 06 * * 1-5'
    # 한국시간 평일 오후 3:45 = UTC 06:45, 월~금 — CORE224 종가확정 전용 PAPER/LIVE BOARD
    - cron: '45 06 * * 1-5'
  workflow_dispatch:
    inputs:
      run_profile:
        description: "실행 프로필 선택"
        required: true
        default: TEST_FAST
        type: choice
        options:
          - REAL_FULL
          - OPEN_0930
          - TEST_FULL
          - TEST_FAST
          - WEEKLY_BACKTEST
          - CORE224_LIVE
          - TRIANGLE1PB_RESEARCH
          - HAM_1503_RESEARCH
          - V73_DISCOVERY
          - V73_CASE_AUDIT
      backtest_source:
        description: "성과검증 방식 선택"
        required: false
        default: DIRECT_REPLAY
        type: choice
        options:
          - DIRECT_REPLAY
          - CSV_CACHE
      direct_top_n:
        description: "직접 재현검증 universe 크기"
        required: false
        default: "500"
        type: string
      direct_limit_per_date:
        description: "직접 재현검증 기준일별 TOP 후보 수"
        required: false
        default: "15"
        type: string
      test_chat_id_override:
        description: "테스트 채널 ID 직접 입력 (선택)"
        required: false
        default: "8325973023"
        type: string
      backtest_weeks:
        description: "V1080 성과검증 주차 수"
        required: false
        default: "24"
        type: string
      backtest_hold_days:
        description: "성과검증 보유 평가일(추천 10: 1/3/5/10일 분석)"
        required: false
        default: "10"
        type: string
      backtest_stop_pct:
        description: "고정 손절 기준(%), fallback 또는 비교용"
        required: false
        default: "-5"
        type: string
      backtest_stop_mode:
        description: "V1082 성과검증 손절 기준 선택"
        required: false
        default: SIGNAL_STOP_WITH_FALLBACK
        type: choice
        options:
          - FIXED_PCT
          - SIGNAL_STOP
          - SIGNAL_STOP_WITH_FALLBACK
          - BOTH_COMPARE
      v25_cohort_mode:
        description: "CORE224 신호 코호트: ALL=2년 A→B→C→D 자동 순차실행·통합, 경계 강제청산 없음"
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - A
          - B
          - C
          - D
          - ROLLING
          - CUSTOM
      v25_two_year_end_date:
        description: "A~D 분할의 2년 종료 기준일(YYYY-MM-DD, 비우면 실행일)"
        required: false
        default: ""
        type: string
      v25_cohort_start_date:
        description: "CUSTOM 신호 코호트 시작일(YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      v25_cohort_end_date:
        description: "CUSTOM 신호 코호트 종료일(YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      tri_start_date:
        description: "TRIANGLE1PB 연구 시작일(YYYY-MM-DD, 비우면 cache 최신일 기준 2년)"
        required: false
        default: ""
        type: string
      tri_end_date:
        description: "TRIANGLE1PB 연구 종료일(YYYY-MM-DD, 비우면 price cache 최신일)"
        required: false
        default: ""
        type: string
      tri_max_codes:
        description: "TRIANGLE1PB 연구 종목 제한(0=복원된 cache 전체, 진단 시 소수 지정 가능)"
        required: false
        default: "0"
        type: string
      tri_manual_sample_limit:
        description: "TRIANGLE1PB 수동 차트검증 표본 수"
        required: false
        default: "40"
        type: string
      v73_universe_limit:
        description: "V73 동적 발견 유니버스 최대 종목 수"
        required: false
        default: "900"
        type: string
      v73_case_codes:
        description: "V73 사례감사 종목코드(쉼표 구분)"
        required: false
        default: "119850"
        type: string
      v73_case_dates:
        description: "V73 사례감사 기준일(쉼표 구분)"
        required: false
        default: "2026-06-29,2026-07-08"
        type: string
      catalyst_forward_capture:
        description: "재료·뉴스·AI·시장/섹터 전진수집"
        required: false
        default: AUTO
        type: choice
        options:
          - AUTO
          - ON
          - OFF

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stockhunter-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.run_profile || github.event_name }}
  cancel-in-progress: false

jobs:
  v23-backtest-shard:
    name: V24 TOP500 materialized+formula-shadow shard ${{ matrix.shard }} of 6
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_profile == 'WEEKLY_BACKTEST' && (inputs.backtest_source == 'DIRECT_REPLAY' || inputs.backtest_source == '') && inputs.v25_cohort_mode != 'ALL' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scanner
      STOCKHUNTER_WEEKLY_BACKTEST_ONLY: "1"
      STOCKHUNTER_HAM_1503_ONLY: "0"
      V1081_BACKTEST_SOURCE: DIRECT_REPLAY
      V1081_DIRECT_DATE_MODE: WEEK_LAST
      V1081_DIRECT_TOP_N: ${{ inputs.direct_top_n || '500' }}
      V1081_DIRECT_LIMIT_PER_DATE: ${{ inputs.direct_limit_per_date || '15' }}
      V1080_BACKTEST_WEEKS: ${{ inputs.backtest_weeks || '24' }}
      V1080_BACKTEST_HOLD_DAYS: ${{ inputs.backtest_hold_days || '10' }}
      V1080_BACKTEST_STOP_PCT: ${{ inputs.backtest_stop_pct || '-5' }}
      V1082_BACKTEST_STOP_MODE: ${{ inputs.backtest_stop_mode || 'SIGNAL_STOP_WITH_FALLBACK' }}
      V1080_BACKTEST_OUTPUT_DIR: reports
      V1081_UNIVERSE_MODE: HISTORICAL_ASOF_TOP500_EVENT_EXPANSION
      V1081_ASOF_LIQUIDITY_DAYS: "20"
      V1081_ASOF_MIN_PRICE: "3000"
      V1081_ASOF_MIN_MARCAP: "30000000000"
      V1081_EVENT_EXPANSION_MAX: "100"
      V1081_EVENT_AMOUNT_RATIO: "3.0"
      V1081_EVENT_VOLUME_RATIO: "3.0"
      V1081_EVENT_PREV_RET_PCT: "5.0"
      V1081_EVENT_MIN_AMOUNT: "10000000000"
      V20_REPLAY_ACCEL_ENABLE: "1"
      V20_PRICE_PREFETCH_ENABLE: "1"
      V20_PRICE_PREFETCH_WORKERS: "6"
      V20_PRICE_DISK_CACHE_ENABLE: "1"
      V20_REPLAY_RESUME_ENABLE: "1"
      V20_PROGRESS_EVERY: "50"
      V20_PRICE_CACHE_DIR: reports/.cache/v20_price_history
      V20_ASOF_CACHE_DIR: reports/.cache/v20_asof_snapshots
      V20_REPLAY_CHECKPOINT_DIR: reports/.cache/v20_replay_checkpoint
      V22_SHARD_WORKER_ONLY: "0"
      V22_NEWEST_FIRST_CACHE_PRIME: "1"
      V22_FAST_GATE_MODE: AUDIT_ONLY
      V23_SHARD_WORKER_ONLY: "1"
      V23_SHARD_INDEX: ${{ matrix.shard }}
      V23_SHARD_COUNT: "6"
      V23_HANDOFF_COHORT_ID: ${{ inputs.v25_cohort_mode || 'ROLLING' }}
      V23_MERGE_ONLY_PARENT: "0"
      V23_ZERO_RECOMPUTE: "1"
      V23_MATERIALIZED_DIR: reports/v23_materialized
      V24_FORMULA_SHADOW_ENABLE: "1"
      V24_SHADOW_BYPASS_PRECOMBO: "0"
      V25_ORIGINAL_THESIS_ENABLE: "1"
      V25_ORIGINAL_THESIS_REV: "25_3_1"
      V25_MANUAL_SAMPLE_PER_BUCKET: "15"
      V25_COHORT_MODE: ${{ inputs.v25_cohort_mode || 'ROLLING' }}
      V25_TWO_YEAR_END_DATE: ${{ inputs.v25_two_year_end_date || '' }}
      V25_COHORT_START_DATE: ${{ inputs.v25_cohort_start_date || '' }}
      V25_COHORT_END_DATE: ${{ inputs.v25_cohort_end_date || '' }}
      V25_COHORT_DATE_MODE: WEEK_LAST
      V25_LIFECYCLE_ENABLE: "1"
      V25_LIFECYCLE_MAX_DAYS: "60"
      HAM_RESEARCH_ONLY: "1"
      FAMILIAR_RESEARCH_ENABLE: "1"
      FAMILIAR_RESEARCH_ONLY: "1"
      PATTERN_AI_CROSS_RESEARCH_ENABLE: "1"
      MARKET_EXCESS_RESEARCH_ENABLE: "1"
      KOSCOM_API_KEY: ${{ secrets.KOSCOM_API_KEY }}
      KOSCOM_APIGW_URL: https://oap.k-mydata.org
      # V25.3.1: pykrx authority retained; cohort/lifecycle remains RESEARCH_ONLY. These secrets already existed in the parent job;
      # shard workers also need them because Historical-AsOf/CORE224 Amount authority is built inside shards.
      KRX_ID: ${{ secrets.KRX_DATA_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install shard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 pytz scipy ta finance-datareader pykrx mplfinance
          pip install openai google-generativeai gspread gspread-formatting gspread-dataframe google-auth oauth2client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "requirements.txt not found, skip"; fi

      - name: V25 KRX authority credential preflight
        if: env.V25_ORIGINAL_THESIS_ENABLE == '1'
        shell: bash
        run: |
          python - <<'PY'
          import os
          ok=bool(os.getenv('KRX_ID','').strip()) and bool(os.getenv('KRX_PW','').strip())
          print('V25_KRX_AUTH_ENV', 'READY' if ok else 'MISSING', '| secret_values_not_printed=1')
          if not ok:
              print('::warning::V25 actual Amount/Historical-AsOf authority will remain fail-closed because KRX_DATA_ID/KRX_DATA_PW are not configured.')
          PY

      - name: Build V23 shard cache identity
        id: v23-shard-key
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(sha256sum main7_bugfix_2.py direct_replay_performance_v20.py historical_asof_universe.py direct_replay_sharding_v22.py direct_replay_materialized_v23.py pattern_catalyst_context_pipeline.py bear_winner_stability_diagnostic.py research_readiness_v24.py original_thesis_reconstruction.py | sha256sum | cut -c1-20)"
          CFG="$(printf '%s' '${{ inputs.direct_top_n || '500' }}|${{ inputs.backtest_weeks || '24' }}|${{ inputs.backtest_hold_days || '10' }}|${{ inputs.backtest_stop_pct || '-5' }}|${{ inputs.backtest_stop_mode || 'SIGNAL_STOP_WITH_FALLBACK' }}|${{ inputs.v25_cohort_mode || 'ROLLING' }}|${{ inputs.v25_two_year_end_date || '' }}|${{ inputs.v25_cohort_start_date || '' }}|${{ inputs.v25_cohort_end_date || '' }}|6|V24_SHADOW_1|V25_ORIGINAL_THESIS_25_3_1|COHORT_BOUNDARY_NOT_EXIT|STRUCTURAL_SCALEIN_60D|DATA_AUTHORITY_25_2_2_KRX_AUTH|ALNUM_TICKER_IDENTITY' | sha256sum | cut -c1-16)"
          PREFIX="stockhunter-v23-shard-${GITHUB_REF_NAME}-${{ matrix.shard }}-${SRC}-${CFG}"
          KEY="${PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "V23_SHARD_CACHE identity shard=${{ matrix.shard }} prefix=$PREFIX key=$KEY"

      - name: Restore V23 shard cache
        id: v23-shard-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v20_replay_checkpoint
            reports/v23_materialized
          key: ${{ steps.v23-shard-key.outputs.key }}
          restore-keys: |
            ${{ steps.v23-shard-key.outputs.prefix }}-
            stockhunter-v23-shard-${{ github.ref_name }}-${{ matrix.shard }}-

      - name: Restore V73 listing seed for shard universe
        id: v25-shard-listing-seed
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/v73_listing_cache.csv
            reports/v73_filter_rejection_ledger.csv
            reports/v73_discovery_stage_ledger.csv
          key: stockhunter-v73-state-${{ github.ref_name }}-${{ github.run_id }}-shard-${{ matrix.shard }}
          restore-keys: |
            stockhunter-v73-state-${{ github.ref_name }}-
            stockhunter-v73-state-

      - name: Inspect V25 shard universe seed
        shell: bash
        run: |
          set +e
          echo "V25_SHARD_SEED cache-hit=${{ steps.v25-shard-listing-seed.outputs.cache-hit }} matched=${{ steps.v25-shard-listing-seed.outputs.cache-matched-key }}"
          python - <<'PYSEED'
          from pathlib import Path
          import pandas as pd
          p=Path('reports/v73_listing_cache.csv')
          if p.exists():
              try:
                  d=pd.read_csv(p,dtype={'Code':str},low_memory=False)
                  print('V25_SHARD_SEED listing_rows',len(d),'codes',d.get('Code',pd.Series(dtype=str)).astype(str).nunique())
              except Exception as e:
                  print('V25_SHARD_SEED listing_read_error',type(e).__name__,e)
          else:
              print('V25_SHARD_SEED listing_rows 0 (cache file missing; provider fallback remains enabled)')
          PYSEED

      - name: Run V23 materialized shard worker
        id: v23-shard-worker
        timeout-minutes: 155
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/.cache/v20_replay_checkpoint reports/v23_materialized
          echo "🚄 V23 shard worker ${{ matrix.shard }}/5 | topN=${V1081_DIRECT_TOP_N} weeks=${V1080_BACKTEST_WEEKS} materialized=1"
          python -B - <<'PYV25'
          import original_thesis_reconstruction as m
          assert m.VERSION == "V73.3.6.6.25.3.1", m.VERSION
          assert m.RESEARCH_ONLY and not m.LIVE_LOGIC_CHANGED and not m.REAL_ORDER_CHANGED
          print("✅ V25.3.1 shard activation + cohort lifecycle source contract PASS", m.VERSION)
          PYV25
          grep -Fq "V73.3.6.6.25.3.1 ORIGINAL THESIS RECONSTRUCTION + CORE224 SHADOW + ALL COHORT AUTO CHAIN" main7_bugfix_2.py || { echo "❌ V25.3.1 main activation marker missing"; exit 206; }
          grep -Fq "V73.3.6.6.25.1.1 SHARD UNIVERSE OUTAGE RECOVERY" main7_bugfix_2.py || { echo "❌ V25.1.1 shard universe guard marker missing"; exit 207; }
          grep -Fq "V73.3.6.6.25.3.1 DATA AUTHORITY + ALL COHORT LIFECYCLE" main7_bugfix_2.py || { echo "❌ V25.3.1 data/lifecycle marker missing"; exit 208; }
          set +e
          python -u main7_bugfix_2.py 2>&1 | tee "reports/v73_v23_shard_${{ matrix.shard }}_stdout.log"
          worker_rc=${PIPESTATUS[0]}
          if [ "$worker_rc" -eq 192 ] && grep -Fq "NO_DIRECT_UNIVERSE" "reports/v73_v23_shard_${{ matrix.shard }}_stdout.log"; then
            echo "♻️ V25 shard transient universe outage detected → one bounded retry after 20s"
            sleep 20
            python -u main7_bugfix_2.py 2>&1 | tee "reports/v73_v23_shard_${{ matrix.shard }}_stdout_retry.log"
            worker_rc=${PIPESTATUS[0]}
          fi
          exit "$worker_rc"

      - name: Save V73 shard listing seed
        if: ${{ always() && hashFiles('reports/v73_listing_cache.csv') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            reports/v73_listing_cache.csv
            reports/v73_filter_rejection_ledger.csv
            reports/v73_discovery_stage_ledger.csv
          key: stockhunter-v73-state-${{ github.ref_name }}-${{ github.run_id }}-shard-${{ matrix.shard }}

      - name: Save V23 shard cache explicitly
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v20_replay_checkpoint
            reports/v23_materialized
          key: ${{ steps.v23-shard-key.outputs.key }}

      - name: Package V23 same-run materialized handoff
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/.cache/v20_replay_checkpoint reports/v23_materialized
          if [ ! -f reports/v73_v23_shard_manifest.json ]; then
            echo '{"version":"V73.3.6.6.23","status":"PARTIAL","errors":["SHARD_MANIFEST_MISSING_AFTER_WORKER"]}' > reports/v73_v23_shard_manifest.json
          fi
          python -u direct_replay_materialized_v23.py --package-handoff "v23_shard_${{ matrix.shard }}_handoff.tar.gz" --output-dir reports
          rc=$?
          echo "V23_PACKAGE rc=$rc"
          ls -lh "v23_shard_${{ matrix.shard }}_handoff.tar.gz" 2>/dev/null || true
          exit 0

      - name: Upload V23 shard handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-v23-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: v23_shard_${{ matrix.shard }}_handoff.tar.gz
          if-no-files-found: warn
          retention-days: 2


# ✅ V25.3.1 HF3: shard universe transient-outage retry + same-run listing-seed persistence + cohort-chain continuation
  v23-backtest-shard-a:
    name: V25 ALL A · TOP500 shard ${{ matrix.shard }} of 6
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_profile == 'WEEKLY_BACKTEST' && (inputs.backtest_source == 'DIRECT_REPLAY' || inputs.backtest_source == '') && inputs.v25_cohort_mode == 'ALL' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scanner
      STOCKHUNTER_WEEKLY_BACKTEST_ONLY: "1"
      STOCKHUNTER_HAM_1503_ONLY: "0"
      V1081_BACKTEST_SOURCE: DIRECT_REPLAY
      V1081_DIRECT_DATE_MODE: WEEK_LAST
      V1081_DIRECT_TOP_N: ${{ inputs.direct_top_n || '500' }}
      V1081_DIRECT_LIMIT_PER_DATE: ${{ inputs.direct_limit_per_date || '15' }}
      V1080_BACKTEST_WEEKS: ${{ inputs.backtest_weeks || '24' }}
      V1080_BACKTEST_HOLD_DAYS: ${{ inputs.backtest_hold_days || '10' }}
      V1080_BACKTEST_STOP_PCT: ${{ inputs.backtest_stop_pct || '-5' }}
      V1082_BACKTEST_STOP_MODE: ${{ inputs.backtest_stop_mode || 'SIGNAL_STOP_WITH_FALLBACK' }}
      V1080_BACKTEST_OUTPUT_DIR: reports
      V1081_UNIVERSE_MODE: HISTORICAL_ASOF_TOP500_EVENT_EXPANSION
      V1081_ASOF_LIQUIDITY_DAYS: "20"
      V1081_ASOF_MIN_PRICE: "3000"
      V1081_ASOF_MIN_MARCAP: "30000000000"
      V1081_EVENT_EXPANSION_MAX: "100"
      V1081_EVENT_AMOUNT_RATIO: "3.0"
      V1081_EVENT_VOLUME_RATIO: "3.0"
      V1081_EVENT_PREV_RET_PCT: "5.0"
      V1081_EVENT_MIN_AMOUNT: "10000000000"
      V20_REPLAY_ACCEL_ENABLE: "1"
      V20_PRICE_PREFETCH_ENABLE: "1"
      V20_PRICE_PREFETCH_WORKERS: "6"
      V20_PRICE_DISK_CACHE_ENABLE: "1"
      V20_REPLAY_RESUME_ENABLE: "1"
      V20_PROGRESS_EVERY: "50"
      V20_PRICE_CACHE_DIR: reports/.cache/v20_price_history
      V20_ASOF_CACHE_DIR: reports/.cache/v20_asof_snapshots
      V20_REPLAY_CHECKPOINT_DIR: reports/.cache/v20_replay_checkpoint
      V22_SHARD_WORKER_ONLY: "0"
      V22_NEWEST_FIRST_CACHE_PRIME: "1"
      V22_FAST_GATE_MODE: AUDIT_ONLY
      V23_SHARD_WORKER_ONLY: "1"
      V23_SHARD_INDEX: ${{ matrix.shard }}
      V23_SHARD_COUNT: "6"
      V23_HANDOFF_COHORT_ID: "A"
      V23_MERGE_ONLY_PARENT: "0"
      V23_ZERO_RECOMPUTE: "1"
      V23_MATERIALIZED_DIR: reports/v23_materialized
      V24_FORMULA_SHADOW_ENABLE: "1"
      V24_SHADOW_BYPASS_PRECOMBO: "0"
      V25_ORIGINAL_THESIS_ENABLE: "1"
