    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schedule proof / trigger diagnostics
        if: always()
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧭 [V1107.4.5.26 SCHEDULE PROOF]"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_EVENT_SCHEDULE=${{ github.event.schedule }}"
          echo "GITHUB_EVENT_SCHEDULE=${{ github.event.schedule }}" >> $GITHUB_ENV
          echo "NOW_UTC=$(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "SCHEDULE_EXPECTED_KST=08:37 / 09:30 / 14:37 / HAM 15:03 / 15:07 / V73 15:35 weekdays"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Resolve run profile
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_PROFILE: ${{ inputs.run_profile }}
          INPUT_TEST_CHAT_ID_OVERRIDE: ${{ inputs.test_chat_id_override }}
          INPUT_BACKTEST_SOURCE: ${{ inputs.backtest_source }}
          INPUT_DIRECT_TOP_N: ${{ inputs.direct_top_n }}
          INPUT_DIRECT_LIMIT_PER_DATE: ${{ inputs.direct_limit_per_date }}
          INPUT_BACKTEST_WEEKS: ${{ inputs.backtest_weeks }}
          INPUT_BACKTEST_HOLD_DAYS: ${{ inputs.backtest_hold_days }}
          INPUT_BACKTEST_STOP_PCT: ${{ inputs.backtest_stop_pct }}
          INPUT_BACKTEST_STOP_MODE: ${{ inputs.backtest_stop_mode }}
          INPUT_V73_UNIVERSE_LIMIT: ${{ inputs.v73_universe_limit }}
          INPUT_V73_CASE_CODES: ${{ inputs.v73_case_codes }}
          INPUT_V73_CASE_DATES: ${{ inputs.v73_case_dates }}
          INPUT_CATALYST_FORWARD_CAPTURE: ${{ inputs.catalyst_forward_capture }}
        run: |
          set -euo pipefail
          event="${GH_EVENT_NAME:-}"
          schedule_expr="${GITHUB_EVENT_SCHEDULE:-}"
          legacy_chat="${V1107_4_5_47_BACKTEST_TARGET_CHAT_ID:-8325973023}"
          open0930=0
          ham1503=0
          v73_discovery=0
          v73_case_audit=0
          catalyst_capture=0
          catalyst_mode="AUTO"
          diagnostic_sheet_sync=0
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "30 00 * * 1-5" ]; then
            open0930=1
          fi
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "03 06 * * 1-5" ]; then
            ham1503=1
          fi
          if [ "$event" = "schedule" ] && [ "$schedule_expr" = "35 06 * * 1-5" ]; then
            v73_discovery=1
          fi
          # Forward-causal source capture runs twice daily: pre-market and after the 15:07 close scan.
          if [ "$event" = "schedule" ] && { [ "$schedule_expr" = "37 23 * * 0-4" ] || [ "$schedule_expr" = "07 06 * * 1-5" ]; }; then
            catalyst_capture=1
          fi

          if [ "$event" = "workflow_dispatch" ]; then
            profile="${INPUT_RUN_PROFILE:-TEST_FAST}"
            test_chat="${INPUT_TEST_CHAT_ID_OVERRIDE:-$legacy_chat}"
            bt_source="${INPUT_BACKTEST_SOURCE:-DIRECT_REPLAY}"
            direct_top_n="${INPUT_DIRECT_TOP_N:-150}"
            direct_limit="${INPUT_DIRECT_LIMIT_PER_DATE:-15}"
            bt_weeks="${INPUT_BACKTEST_WEEKS:-24}"
            bt_hold_days="${INPUT_BACKTEST_HOLD_DAYS:-10}"
            bt_stop_pct="${INPUT_BACKTEST_STOP_PCT:--5}"
            bt_stop_mode="${INPUT_BACKTEST_STOP_MODE:-SIGNAL_STOP_WITH_FALLBACK}"
            v73_universe_limit="${INPUT_V73_UNIVERSE_LIMIT:-900}"
            v73_case_codes="${INPUT_V73_CASE_CODES:-119850}"
            v73_case_dates="${INPUT_V73_CASE_DATES:-2026-06-29,2026-07-08}"
            catalyst_mode="${INPUT_CATALYST_FORWARD_CAPTURE:-AUTO}"
          else
            profile="REAL_FULL"
            test_chat="$legacy_chat"
            bt_source="DIRECT_REPLAY"
            direct_top_n="150"
            direct_limit="15"
            bt_weeks="8"
            bt_hold_days="10"
            bt_stop_pct="-5"
            bt_stop_mode="SIGNAL_STOP_WITH_FALLBACK"
            v73_universe_limit="900"
            v73_case_codes="119850"
            v73_case_dates="2026-06-29,2026-07-08"
            catalyst_mode="AUTO"
            if [ "$ham1503" = "1" ]; then profile="HAM_1503_RESEARCH"; fi
            if [ "$v73_discovery" = "1" ]; then profile="V73_DISCOVERY"; fi
          fi

          bt_source="$(echo "$bt_source" | tr '[:lower:]' '[:upper:]')"
          case "$bt_source" in DIRECT_REPLAY|CSV_CACHE) ;; *) bt_source="DIRECT_REPLAY" ;; esac
          bt_stop_mode="$(echo "$bt_stop_mode" | tr '[:lower:]' '[:upper:]')"
          case "$bt_stop_mode" in FIXED_PCT|SIGNAL_STOP|SIGNAL_STOP_WITH_FALLBACK|BOTH_COMPARE) ;; *) bt_stop_mode="SIGNAL_STOP_WITH_FALLBACK" ;; esac

          case "$profile" in
            REAL_FULL)
              test_mode=0; skip_ai=0; skip_chart=0; skip_google=0; weekly=0; use_bt_token=0 ;;
            OPEN_0930)
              open0930=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            TEST_FULL)
              test_mode=1; skip_ai=1; skip_chart=0; skip_google=0; weekly=0; use_bt_token=1 ;;
            WEEKLY_BACKTEST)
              test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=1; use_bt_token=1 ;;
            HAM_1503_RESEARCH)
              ham1503=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            V73_DISCOVERY)
              v73_discovery=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            V73_CASE_AUDIT)
              v73_case_audit=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
            TEST_FAST|*)
              profile="TEST_FAST"; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
          esac

          # 09:30 독립 레이더는 AI/차트/구글 없이 네이버 장중 배치시세(주) + pykrx(보조)로 빠르게 종료합니다.
          if [ "$open0930" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi
          if [ "$ham1503" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi
          if [ "$v73_discovery" = "1" ] || [ "$v73_case_audit" = "1" ]; then
            skip_ai=1
            skip_chart=1
            skip_google=1
            weekly=0
          fi

          catalyst_mode="$(echo "${catalyst_mode:-AUTO}" | tr '[:lower:]' '[:upper:]')"
          if [ "$event" = "workflow_dispatch" ]; then
            case "$catalyst_mode" in
              ON) catalyst_capture=1 ;;
              OFF) catalyst_capture=0 ;;
              AUTO|*)
                if [ "$profile" = "REAL_FULL" ] || [ "$profile" = "V73_DISCOVERY" ]; then catalyst_capture=1; else catalyst_capture=0; fi ;;
            esac
          fi
          # Backtests and historical research never issue current web searches.
          if [ "$weekly" = "1" ] || [ "$ham1503" = "1" ] || [ "$v73_case_audit" = "1" ]; then catalyst_capture=0; fi
          # WEEKLY_BACKTEST may persist only already-computed diagnostic CSVs to Google Sheets.
          # This is storage I/O, not current-news capture, and does not enter the backtest inputs.
          if [ "$weekly" = "1" ]; then diagnostic_sheet_sync=1; fi

          save_file=1
          send_bt=1
          if [ "$profile" != "WEEKLY_BACKTEST" ]; then send_bt=0; fi
          if [ "$event" = "workflow_dispatch" ] || [ "$event" = "schedule" ]; then
            force_bt=1
            use_bt_token=1
            if [ "$event" = "workflow_dispatch" ]; then manual=1; else manual=0; fi
          else
            force_bt="${STOCKHUNTER_FORCE_BACKTEST_TELEGRAM:-0}"
            manual=0
          fi

          effective_chat="${test_chat:-}"
          if [ -z "$effective_chat" ]; then
            if [ "$profile" = "REAL_FULL" ]; then
              effective_chat="${STOCK_SEARCH_CHAT_ID:-${STOCKHUNTER_CHAT_ID:-${TELEGRAM_DYUL_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}}}"
            else
              effective_chat="${TELEGRAM_TEST_CHAT_ID:-${STOCK_SEARCH_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}}"
            fi
          fi

          {
            echo "TEST_PROFILE=$profile"
            echo "TEST_MODE=$test_mode"
            echo "SKIP_AI_IN_TEST=$skip_ai"
            echo "SKIP_CHART_IN_TEST=$skip_chart"
            echo "SKIP_GOOGLE_IN_TEST=$skip_google"
            echo "STOCKHUNTER_WEEKLY_BACKTEST_ONLY=$weekly"
            echo "STOCKHUNTER_HAM_1503_ONLY=$ham1503"
            echo "HAM_RESEARCH_ONLY=1"
            echo "HAM_EXPECT_GUARD_VERSION=V73.3.6.5.3"
            echo "HAM_ALLOW_YAHOO_MINUTE_PROXY=1"
            echo "HAM_ALLOW_PROXY_VALUE_POLICY_LOCK=0"
            echo "HAM_BASELINE_N_DAYS=20"
            echo "HAM_BASELINE_A_MIN_DAYS=20"
            echo "HAM_TRAIN_DAYS=20"
            echo "HAM_CAPTURE_MAX_CODES=60"
            echo "HAM_CAPTURE_TOP_AMOUNT_N=35"
            echo "HAM_LISTING_MIN_ROWS=100"
            echo "HAM_LISTING_DIRECT_LIMIT=3000"
            echo "HAM_MINUTE_WORKERS=6"
            echo "STOCKHUNTER_OPEN_0930_ONLY=$open0930"
            echo "STOCKHUNTER_V73_DISCOVERY_ONLY=$v73_discovery"
            echo "STOCKHUNTER_V73_CASE_AUDIT_ONLY=$v73_case_audit"
            echo "V73_DISCOVERY_UNIVERSE_LIMIT=$v73_universe_limit"
            echo "V73_CASE_CODES=$v73_case_codes"
            echo "V73_CASE_DATES=$v73_case_dates"
            echo "V73_TOP_AMOUNT_POOL=750"
            echo "V73_DISCOVERY_WORKERS=10"
            echo "V73_HISTORY_COUNT=330"
            echo "V73_TELEGRAM_TOP_N=10"
            echo "V73_MIN_PRICE=3000"
            echo "V73_MIN_MARCAP_EOK=300"
            echo "V73_OUTPUT_DIR=reports"
            echo "CATALYST_FORWARD_CAPTURE_ENABLE=$catalyst_capture"
            echo "CATALYST_GOOGLE_SHEET_SYNC_ENABLE=$catalyst_capture"
            echo "CONTEXT_DIAGNOSTIC_SHEET_SYNC_ENABLE=$diagnostic_sheet_sync"
            echo "CATALYST_NETWORK_ENABLE=$catalyst_capture"
            echo "CATALYST_CAPTURE_MAX_CODES=30"
            echo "CATALYST_CAPTURE_MAX_GLOBAL_QUERIES=8"
            echo "CATALYST_DART_MAX_CODES=30"
            echo "CATALYST_GOOGLE_MAX_QUERIES=10"
            echo "CATALYST_KAKAO_MAX_QUERIES=30"
            echo "V7224_TOP_SECTORS=2"
            echo "V7225_SECOND_MAX_SCORE_GAP=6.0"
