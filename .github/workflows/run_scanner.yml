            if [ "$core224_live_only" = "1" ]; then profile="CORE224_LIVE"; fi
          fi

          bt_source="$(echo "$bt_source" | tr '[:lower:]' '[:upper:]')"
          case "$bt_source" in DIRECT_REPLAY|CSV_CACHE) ;; *) bt_source="DIRECT_REPLAY" ;; esac
          bt_stop_mode="$(echo "$bt_stop_mode" | tr '[:lower:]' '[:upper:]')"
