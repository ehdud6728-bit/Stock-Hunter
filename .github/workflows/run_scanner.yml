      - name: Persist weekly context diagnostics to Google Sheet
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CONTEXT_DIAGNOSTIC_SHEET_SYNC_ENABLE:-0}" != "1" ]; then
            echo "CONTEXT_DIAGNOSTIC Google Sheet sync skipped"
            exit 0
          fi
          echo "🧭 CONTEXT_DIAGNOSTIC Google Sheet sync start"
          python google_sheet_forward_ledger.py --bootstrap --sync --strict --output-dir reports
          python - <<'PY'
          import pandas as pd, sys
          p='reports/v73_google_sheet_storage_audit.csv'
          q=pd.read_csv(p, dtype=str).fillna('')
          r=q.iloc[-1].to_dict() if len(q) else {}
          st=str(r.get('status','MISSING'))
          print('CONTEXT_DIAGNOSTIC_SHEET_SYNC_STATUS', st, 'rows', r.get('rows_appended',''), 'error', r.get('error_type',''), r.get('error_message',''))
          sys.exit(0 if st == 'SHEET_PRIMARY_OK' else 155)
          PY

      - name: Forward-causal catalyst and market-sector capture + Google Sheet persistence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CATALYST_FORWARD_CAPTURE_ENABLE:-0}" != "1" ]; then
            echo "CATALYST_FORWARD_CAPTURE skipped profile=${TEST_PROFILE:-UNKNOWN}"
            exit 0
          fi
          echo "📰 FORWARD_CAUSAL capture start profile=${TEST_PROFILE:-UNKNOWN} run_id=${GITHUB_RUN_ID:-LOCAL}"
          python catalyst_source_adapters.py --capture --output-dir reports
          python - <<'PY'
          import pandas as pd, sys
          from pathlib import Path
          p='reports/v73_catalyst_source_capture_audit.csv'
          q=pd.read_csv(p, dtype=str).fillna('') if Path(p).exists() else pd.DataFrame()
          o=q[q.get('source_name','').eq('OVERALL')].tail(1) if not q.empty and 'source_name' in q else pd.DataFrame()
          r=o.iloc[0].to_dict() if len(o) else {}
          st=str(r.get('status','MISSING'))
          print('CATALYST_FORWARD_CAPTURE_AUDIT', st, 'rows', r.get('rows'), 'new', r.get('new_unique_rows'), 'first_seen_regressions', r.get('first_seen_regressions'))
          sys.exit(0 if st in ('CAPTURED','LEDGER_READY','TEMPLATE_READY','PARTIAL') and str(r.get('first_seen_regressions','0')) in ('0','0.0','') else 146)
          PY
          if [ "${CATALYST_GOOGLE_SHEET_SYNC_ENABLE:-0}" = "1" ]; then
            echo "🗄️ GOOGLE_SHEET_FORWARD_LEDGER sync start"
            python google_sheet_forward_ledger.py --sync --strict --output-dir reports
            test -f reports/v73_google_sheet_storage_audit.csv || { echo "❌ Google Sheet storage audit missing"; exit 147; }
            test -f reports/v73_google_sheet_sync_audit.csv || { echo "❌ Google Sheet sync detail audit missing"; exit 148; }
            cat reports/v73_google_sheet_storage_report.txt || true
            python - <<'PY'
          import pandas as pd, sys
          p='reports/v73_google_sheet_storage_audit.csv'
          q=pd.read_csv(p, dtype=str).fillna('')
          r=q.iloc[-1].to_dict() if len(q) else {}
          st=str(r.get('status','MISSING'))
          print('GOOGLE_SHEET_SYNC_STATUS', st, 'rows', r.get('rows_appended',''), 'error', r.get('error_type',''), r.get('error_message',''))
          sys.exit(0 if st == 'SHEET_PRIMARY_OK' else 150)
          PY
          else
            echo "GOOGLE_SHEET_FORWARD_LEDGER sync skipped"
          fi

