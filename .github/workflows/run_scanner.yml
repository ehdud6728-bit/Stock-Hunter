            echo "V7226_MIN_NAVER_ROWS=500"
            echo "V7226_MIN_NAVER_COVERAGE=0.55"
            echo "STOCKHUNTER_TEST_USE_BACKTEST_TOKEN=$use_bt_token"
            echo "STOCKHUNTER_MANUAL_RUN=$manual"
            echo "STOCKHUNTER_FORCE_BACKTEST_TELEGRAM=$force_bt"
            echo "TELEGRAM_CHAT_ID_EFFECTIVE=$effective_chat"
            echo "TEST_CHAT_ID_OVERRIDE=$effective_chat"
            echo "V1080_SIGNAL_CSV=reports/v1080_stockhunter_signals.csv"
            echo "V1081_BACKTEST_SOURCE=$bt_source"
            echo "V1081_DIRECT_TOP_N=$direct_top_n"
            echo "V1081_DIRECT_LIMIT_PER_DATE=$direct_limit"
            echo "V1080_BACKTEST_WEEKS=$bt_weeks"
            echo "V1080_BACKTEST_HOLD_DAYS=$bt_hold_days"
            echo "V1080_BACKTEST_STOP_PCT=$bt_stop_pct"
            echo "V1082_BACKTEST_STOP_MODE=$bt_stop_mode"
            echo "V1080_BACKTEST_OUTPUT_MODE=BOTH"
            echo "V1080_BACKTEST_SAVE_FILE=$save_file"
            echo "V1080_BACKTEST_SEND_TELEGRAM=$send_bt"
            echo "V1107_4_5_56_FORCE_EVENTS=workflow_dispatch,schedule"
            echo "V1107_4_5_56_FINAL_FRAME_FALLBACK=1"
            echo "V1107_4_5_56_SUPPRESS_LEGACY_NO_SEND_DIAG=1"
            echo "V1107_4_5_26_SHUTDOWN_NO_SEND_DIAG=0"
            echo "V1107_4_5_31_INLINE_EMPTY_PAYLOAD_TRACE=0"
            echo "V1107_4_5_53_PYTHON_STARTUP_PING=0"
            echo "V1107_4_5_53_FINAL_FALLBACK_PING=0"
            echo "V1107_4_5_68_PRICE_SCALE_WATCH=0"
            echo "V1107_4_5_70_TRUE_TOP_QUALITY_GUARD=1"
            echo "V1107_4_5_70_DISABLE_PRICE_SCALE_WATCH=1"
          } >> "$GITHUB_ENV"

          echo "✅ profile resolved: profile=$profile open0930=$open0930 ham1503=$ham1503 v73_discovery=$v73_discovery v73_case=$v73_case_audit catalyst_capture=$catalyst_capture source=$bt_source weeks=$bt_weeks hold=$bt_hold_days stop=$bt_stop_pct mode=$bt_stop_mode"
      - name: Prepare report directories
        run: |
          mkdir -p reports docs

