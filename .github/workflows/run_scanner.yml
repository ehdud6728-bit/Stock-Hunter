      - name: Refresh current CORE224 LIVE seed (lightweight no-hold, one date)
        if: env.STOCKHUNTER_CORE224_LIVE_ONLY == '1'
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/scanner:${PYTHONPATH:-}"
          SCRIPT="main7_bugfix_2.py"
          test -f "$SCRIPT" || { echo "❌ CORE224 seed refresh root script missing"; exit 221; }
          test -f v25_core224_live_seed_builder.py || { echo "❌ CORE224 seed builder missing"; exit 222; }

          price_before=$(find reports/.cache/v20_price_history -type f 2>/dev/null | wc -l | tr -d ' ')
          asof_before=$(find reports/.cache/v20_asof_snapshots -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "V25_CURRENT_LIVE_SEED_PREFLIGHT price_files=${price_before} asof_files=${asof_before} base_matched=${{ steps.v25-core224-base-restore.outputs.cache-matched-key }} overlay_matched=${{ steps.v25-core224-live-restore.outputs.cache-matched-key }}"
          # The already-computed V21 research cache is the raw-data/cache authority here.
          # No 2-year parent recomputation is permitted in CORE224_LIVE.
          test "$price_before" -gt 0 || { echo "❌ V25_CURRENT_LIVE_SEED_NO_PRICE_BASE_CACHE"; exit 223; }

          current_live_end=$(python -c "from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; now=datetime.now(ZoneInfo('Asia/Seoul')); d=now.date()-(timedelta(days=1) if (now.hour,now.minute)<(15,40) else timedelta(0)); exec('while d.weekday() >= 5: d -= timedelta(days=1)'); print(d.isoformat())")
          test -n "$current_live_end"
          echo "V25_CURRENT_LIVE_END_DATE=$current_live_end" >> "$GITHUB_ENV"

          # If the exact latest-completed no-hold seed is already persisted, reuse it.
          # This is infrastructure-only and avoids repeating the ~9 minute one-date worker.
          if python - "$current_live_end" <<'PYFAST'
          import json, os, sys
          expected=sys.argv[1]
          base='reports/.cache/v25_core224_live'
          required=[f'{base}/seed_meta.json',f'{base}/weekly_seed_snapshot.csv',f'{base}/seed_universe.csv']
          if not all(os.path.isfile(p) and os.path.getsize(p)>0 for p in required):
              raise SystemExit(1)
          try:
              d=json.load(open(required[0],encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          ok=(
              str(d.get('weekly_snapshot_date',''))==expected and
              str(d.get('source',''))=='CURRENT_NO_HOLD_TOP500_MATERIALIZED_V23' and
              int(d.get('snapshot_calendar_complete',0) or 0)==1 and
              int(d.get('seed_count',0) or 0)>0 and
              str(d.get('policy_lock_status','')) in {'LOCKED','PENDING_POLICY_LOCK_PREREQUISITES'} and
              str(d.get('primary_policy_id',''))=='PRIMARY_FIB618_PLUS5_D1' and
              str(d.get('policy_lock_schema',''))=='V25.4.10_POLICY_LOCK_3'
          )
          if not ok:
              raise SystemExit(1)
          print('V25_CURRENT_LIVE_SEED_ALREADY_CURRENT','snapshot',d.get('weekly_snapshot_date'),'seed_count',d.get('seed_count'),'source',d.get('source'))
          PYFAST
          then
            policy_manifest=$(test -s reports/.cache/v25_core224_live/policy_lock_manifest.csv && echo READY || echo MISSING)
            echo "V25_CURRENT_LIVE_SEED_REFRESH SKIP_ALREADY_CURRENT current_end=${current_live_end} policy_manifest=${policy_manifest} historical_parent_recompute=0"
            exit 0
          fi

          echo "V25_CURRENT_LIVE_SEED_REFRESH start current_end=${current_live_end} mode=ONE_DATE_NO_HOLD historical_parent_recompute=0"

          backup_dir="$(mktemp -d)"
          restore_seed_backup() {
            rm -f reports/.cache/v25_core224_live/seed_meta.json reports/.cache/v25_core224_live/weekly_seed_snapshot.csv reports/.cache/v25_core224_live/seed_universe.csv
            for f in seed_meta.json weekly_seed_snapshot.csv seed_universe.csv; do
              if [ -f "$backup_dir/$f" ]; then cp -f "$backup_dir/$f" "reports/.cache/v25_core224_live/$f"; fi
            done
          }
          for f in seed_meta.json weekly_seed_snapshot.csv seed_universe.csv; do
            if [ -f "reports/.cache/v25_core224_live/$f" ]; then cp -f "reports/.cache/v25_core224_live/$f" "$backup_dir/$f"; fi
          done
          trap 'rc=$?; echo "❌ V25_CURRENT_LIVE_SEED_REFRESH failed rc=$rc; restoring previous seed"; restore_seed_backup; rm -rf "$backup_dir"; exit $rc' ERR

          rm -rf reports/v25_live_seed_build
          mkdir -p reports/v25_live_seed_build reports/.cache/v25_core224_live
          rm -f reports/.cache/v25_core224_live/seed_meta.json reports/.cache/v25_core224_live/weekly_seed_snapshot.csv reports/.cache/v25_core224_live/seed_universe.csv

          env \
            TEST_PROFILE=WEEKLY_BACKTEST \
            STOCKHUNTER_WEEKLY_BACKTEST_ONLY=1 \
            STOCKHUNTER_CORE224_LIVE_ONLY=0 \
            V25_CORE224_LIVE_ENABLE=0 \
            V1081_BACKTEST_SOURCE=DIRECT_REPLAY \
            V1081_DIRECT_DATE_MODE=WEEK_LAST \
            V25_CURRENT_LIVE_END_DATE="$current_live_end" \
            V25_TWO_YEAR_END_DATE="$current_live_end" \
            V1080_BACKTEST_OUTPUT_DIR=reports/v25_live_seed_build \
            V1080_BACKTEST_HOLD_DAYS=0 \
