          echo "V73 matched-cache-key=$MATCHED"
          ACTIVE_PRESENT=0
          LIFE_PRESENT=0
          [ -f reports/v73_active_cycle_state.csv ] && ACTIVE_PRESENT=1
          [ -f reports/v73_signal_lifecycle_ledger.csv ] && LIFE_PRESENT=1
          for f in reports/v73_active_cycle_state.csv reports/v73_signal_lifecycle_ledger.csv reports/v73_daily_sector_regime.csv reports/v73_state_persistence_manifest.json; do
            if [ -f "$f" ]; then
              echo "✅ restored $f bytes=$(wc -c < "$f") lines=$(wc -l < "$f")"
            else
              echo "ℹ️ not restored $f"
            fi
          done
          {
            echo "V73_STATE_RESTORE_GUARD=1"
            if [ -n "$MATCHED" ]; then echo "V73_CACHE_RESTORE_MATCHED=1"; else echo "V73_CACHE_RESTORE_MATCHED=0"; fi
