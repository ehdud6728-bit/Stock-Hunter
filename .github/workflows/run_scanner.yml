          case "$v25_cohort_mode" in ALL|ROLLING|A|B|C|D|CUSTOM) ;; *) v25_cohort_mode="ROLLING" ;; esac

          case "$profile" in
            REAL_FULL)
              test_mode=0; skip_ai=0; skip_chart=0; skip_google=0; weekly=0; use_bt_token=0 ;;
            OPEN_0930)
              open0930=1; test_mode=1; skip_ai=1; skip_chart=1; skip_google=1; weekly=0; use_bt_token=1 ;;
