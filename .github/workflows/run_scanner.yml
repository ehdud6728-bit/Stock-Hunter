name: Run Main Scanner V1107.4.5.73.3.6.6.17 Bear-Winner Stability Geo-Causal Complete

on:
  schedule:
    # 한국시간 평일 오전 8:37 = UTC 전날 23:37, 일~목
    - cron: '37 23 * * 0-4'
    # 한국시간 평일 오전 9:30 = UTC 00:30, 월~금 — 강섹터·대장주 독립 레이더
    - cron: '30 00 * * 1-5'
    # 한국시간 평일 오후 2:37 = UTC 05:37, 월~금
    - cron: '37 05 * * 1-5'
    # 한국시간 평일 오후 3:03 = UTC 06:03, 월~금 — HAM 연구 전용 + 패턴교차 경로감사(실제 종가후보 SHADOW는 15:07)
    - cron: '03 06 * * 1-5'
    # 한국시간 평일 오후 3:07 = UTC 06:07, 월~금
    - cron: '07 06 * * 1-5'
    # 한국시간 평일 오후 3:35 = UTC 06:35, 월~금 — V73 발견→추적 독립 실행
    - cron: '35 06 * * 1-5'
  workflow_dispatch:
    inputs:
      run_profile:
        description: "실행 프로필 선택"
        required: true
        default: TEST_FAST
        type: choice
        options:
          - REAL_FULL
          - OPEN_0930
          - TEST_FULL
          - TEST_FAST
          - WEEKLY_BACKTEST
          - HAM_1503_RESEARCH
          - V73_DISCOVERY
          - V73_CASE_AUDIT
      backtest_source:
        description: "성과검증 방식 선택"
        required: false
        default: DIRECT_REPLAY
        type: choice
        options:
          - DIRECT_REPLAY
          - CSV_CACHE
      direct_top_n:
        description: "직접 재현검증 universe 크기"
        required: false
        default: "150"
        type: string
      direct_limit_per_date:
        description: "직접 재현검증 기준일별 TOP 후보 수"
        required: false
        default: "15"
        type: string
      test_chat_id_override:
        description: "테스트 채널 ID 직접 입력 (선택)"
        required: false
        default: "8325973023"
        type: string
      backtest_weeks:
        description: "V1080 성과검증 주차 수"
        required: false
        default: "24"
        type: string
      backtest_hold_days:
        description: "성과검증 보유 평가일(추천 10: 1/3/5/10일 분석)"
        required: false
        default: "10"
        type: string
      backtest_stop_pct:
        description: "고정 손절 기준(%), fallback 또는 비교용"
        required: false
        default: "-5"
        type: string
      backtest_stop_mode:
        description: "V1082 성과검증 손절 기준 선택"
        required: false
        default: SIGNAL_STOP_WITH_FALLBACK
        type: choice
        options:
          - FIXED_PCT
          - SIGNAL_STOP
          - SIGNAL_STOP_WITH_FALLBACK
          - BOTH_COMPARE
      v73_universe_limit:
        description: "V73 동적 발견 유니버스 최대 종목 수"
        required: false
        default: "900"
        type: string
      v73_case_codes:
        description: "V73 사례감사 종목코드(쉼표 구분)"
        required: false
        default: "119850"
        type: string
      v73_case_dates:
        description: "V73 사례감사 기준일(쉼표 구분)"
        required: false
        default: "2026-06-29,2026-07-08"
        type: string
      catalyst_forward_capture:
        description: "재료·뉴스·AI·시장/섹터 전진수집"
        required: false
        default: AUTO
        type: choice
        options:
          - AUTO
          - ON
          - OFF

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stockhunter-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.run_profile || github.event_name }}
  cancel-in-progress: false

