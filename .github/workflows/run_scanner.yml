            echo "V1107_4_5_70_DISABLE_PRICE_SCALE_WATCH=1"
          } >> "$GITHUB_ENV"

          echo "✅ profile resolved: profile=$profile open0930=$open0930 core224_live=$core224_live_only ham1503=$ham1503 v73_discovery=$v73_discovery v73_case=$v73_case_audit catalyst_capture=$catalyst_capture source=$bt_source weeks=$bt_weeks hold=$bt_hold_days stop=$bt_stop_pct mode=$bt_stop_mode cohort=$v25_cohort_mode cohort_start=$v25_cohort_start_date cohort_end=$v25_cohort_end_date anchor=$v25_two_year_end_date"
      - name: Prepare report directories
        run: |
          mkdir -p reports docs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pandas
          pip install requests beautifulsoup4 pytz scipy ta
          pip install finance-datareader pykrx mplfinance
          pip install openai google-generativeai
          pip install "gspread>=6.0,<7" gspread-formatting gspread-dataframe google-auth oauth2client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "requirements.txt not found, skip"; fi

      - name: V23.1 parent dependency preflight
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY == '1' && env.V1081_BACKTEST_SOURCE == 'DIRECT_REPLAY'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import pandas as pd
          print('V23_1_PARENT_DEPENDENCY_PREFLIGHT', 'PASS', 'python', sys.version.split()[0], 'pandas', pd.__version__)
          PY

      - name: Build V21 replay resume cache identity
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY == '1' && env.V1081_BACKTEST_SOURCE == 'DIRECT_REPLAY'
        id: v21-replay-key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          files = [
              'main7_bugfix_2.py',
              'historical_asof_universe.py',
              'direct_replay_performance_v20.py',
              'search_formula_universe_audit.py',
              'resume_cache_manifest_v21.py',
              'direct_replay_sharding_v22.py',
              'direct_replay_materialized_v23.py',
              'pattern_catalyst_context_pipeline.py',
              'bear_winner_stability_diagnostic.py',
              'research_readiness_v24.py',
              'original_thesis_reconstruction.py',
              'v25_core224_daily_episode_replay.py',
              'v25_core224_live_runtime.py',
          ]
          h = hashlib.sha256()
          for name in files:
              p = Path(name)
              h.update(name.encode()); h.update(b'\\0')
              h.update(p.read_bytes() if p.exists() else b'MISSING')
              h.update(b'\\0')
          source_hash = h.hexdigest()[:20]
          cfg_keys = [
              'TEST_PROFILE','V1081_BACKTEST_SOURCE','V1081_DIRECT_TOP_N','V1081_DIRECT_LIMIT_PER_DATE',
              'V1080_BACKTEST_WEEKS','V1080_BACKTEST_HOLD_DAYS','V1080_BACKTEST_STOP_PCT',
              'V1082_BACKTEST_STOP_MODE','V1081_UNIVERSE_MODE','V1081_ASOF_LIQUIDITY_DAYS',
              'V1081_ASOF_MIN_PRICE','V1081_ASOF_MIN_MARCAP','V1081_EVENT_EXPANSION_MAX',
              'V1081_EVENT_AMOUNT_RATIO','V1081_EVENT_VOLUME_RATIO','V1081_EVENT_PREV_RET_PCT',
              'V1081_EVENT_MIN_AMOUNT','V24_FORMULA_SHADOW_ENABLE','V25_ORIGINAL_THESIS_ENABLE','V25_ORIGINAL_THESIS_REV',
              'V25_COHORT_MODE','V25_TWO_YEAR_END_DATE','V25_COHORT_START_DATE','V25_COHORT_END_DATE','V25_COHORT_DATE_MODE','V25_LIFECYCLE_MAX_DAYS'
          ]
          cfg = {k: os.getenv(k,'') for k in cfg_keys}
          config_hash = hashlib.sha256(json.dumps(cfg,sort_keys=True,separators=(',',':')).encode()).hexdigest()[:16]
          branch = re.sub(r'[^A-Za-z0-9_.-]+','-',os.getenv('GITHUB_REF_NAME','main')).strip('-') or 'main'
          prefix = f"stockhunter-v21-replay-{branch}-{source_hash}-{config_hash}"
          run_id = os.getenv('GITHUB_RUN_ID','local')
          attempt = os.getenv('GITHUB_RUN_ATTEMPT','1')
          key = f"{prefix}-{run_id}-{attempt}"
          print('V21_CACHE_IDENTITY', 'source',source_hash,'config',config_hash,'prefix',prefix,'key',key)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              print(f"source_hash={source_hash}", file=fh)
              print(f"config_hash={config_hash}", file=fh)
              print(f"prefix={prefix}", file=fh)
              print(f"key={key}", file=fh)
          PY

      - name: Restore V21 replay partial cache
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY == '1' && env.V1081_BACKTEST_SOURCE == 'DIRECT_REPLAY'
        id: v21-replay-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
            reports/.cache/v20_replay_checkpoint
          key: ${{ steps.v21-replay-key.outputs.key }}
          restore-keys: |
            ${{ steps.v21-replay-key.outputs.prefix }}-

      - name: Inspect V21 replay cache restore
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY == '1' && env.V1081_BACKTEST_SOURCE == 'DIRECT_REPLAY'
        shell: bash
        run: |
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_core224_live reports/.cache/v20_replay_checkpoint
          echo "V21_RESTORE cache-hit=${{ steps.v21-replay-restore.outputs.cache-hit }} matched=${{ steps.v21-replay-restore.outputs.cache-matched-key }}"
          echo "V21_RESTORE price_files=$(find reports/.cache/v20_price_history -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "V21_RESTORE asof_files=$(find reports/.cache/v20_asof_snapshots -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "V21_RESTORE checkpoint_files=$(find reports/.cache/v20_replay_checkpoint -type f 2>/dev/null | wc -l | tr -d ' ')"

      - name: Restore CORE224 live base from latest V21 research cache
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY != '1'
        id: v25-core224-base-restore
        uses: actions/cache/restore@v4
        with:
          # Keep this path set byte-for-byte aligned with the V21 replay save path set.
          # actions/cache versions include the cached path set; omitting replay_checkpoint made
          # the existing V21 research cache invisible to CORE224_LIVE despite a matching prefix.
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
            reports/.cache/v20_replay_checkpoint
          key: stockhunter-v25-core224-base-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-v21-replay-${{ github.ref_name }}-

      - name: Restore latest CORE224 live state overlay
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY != '1'
        id: v25-core224-live-restore
        uses: actions/cache/restore@v4
        with:
          # HF3 persists the incremental current-data cache together with the seed so the next
          # CORE224_LIVE run does not fall back to an old V21 price snapshot.
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
          key: stockhunter-v25-core224-live-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-v25-core224-live-${{ github.ref_name }}-

      - name: Inspect CORE224 live cache restore
        if: env.STOCKHUNTER_WEEKLY_BACKTEST_ONLY != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/.cache/v25_core224_live reports/.cache/v20_replay_checkpoint
          echo "V25_LIVE_BASE_RESTORE matched=${{ steps.v25-core224-base-restore.outputs.cache-matched-key }}"
          echo "V25_LIVE_OVERLAY_RESTORE matched=${{ steps.v25-core224-live-restore.outputs.cache-matched-key }}"
          seed_meta=$(test -f reports/.cache/v25_core224_live/seed_meta.json && echo READY || echo MISSING)
          policy_manifest=$(test -f reports/.cache/v25_core224_live/policy_lock_manifest.csv && echo READY || echo MISSING)
          price_files=$(find reports/.cache/v20_price_history -type f 2>/dev/null | wc -l | tr -d ' ')
          asof_files=$(find reports/.cache/v20_asof_snapshots -type f 2>/dev/null | wc -l | tr -d ' ')
          amount_files=$(find reports/.cache/v25_actual_amount_history -type f 2>/dev/null | wc -l | tr -d ' ')
          eod_rows=$(python -c "import os,pandas as pd; p='reports/.cache/v25_core224_live/live_eod_snapshot_ledger.csv'; print(len(pd.read_csv(p)) if os.path.exists(p) else 0)")
          if [ "$policy_manifest" = "READY" ]; then
            cp -f reports/.cache/v25_core224_live/policy_lock_manifest.csv reports/v73_v25_core224_policy_lock_manifest.csv
          fi
          echo "V25_LIVE_RESTORE seed_meta=${seed_meta} policy_manifest=${policy_manifest} price_files=${price_files} asof_files=${asof_files} amount_files=${amount_files} eod_rows=${eod_rows}"

      - name: Bootstrap CORE224 Policy Lock manifest from validated historical artifact
        if: env.STOCKHUNTER_CORE224_LIVE_ONLY == '1'
        env:
          V25_POLICY_BOOTSTRAP_ARTIFACT_ID: '9640787237'
          V25_POLICY_BOOTSTRAP_RUN_ID: '33039169885'
          V25_POLICY_BOOTSTRAP_ARTIFACT_NAME: stockhunter-v1107-4-5-73-3-6-6-24-causal-universe-full-denom-pattern-oos-exit-reports-1256
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/.cache/v25_core224_live
          cache_manifest="reports/.cache/v25_core224_live/policy_lock_manifest.csv"
          root_manifest="reports/v73_v25_core224_policy_lock_manifest.csv"

          if [ -s "$cache_manifest" ]; then
            cp -f "$cache_manifest" "$root_manifest"
            echo "V25_POLICY_MANIFEST_BOOTSTRAP source=LIVE_CACHE status=READY"
            python - <<'PYCHECK'
          import csv, hashlib
          p='reports/v73_v25_core224_policy_lock_manifest.csv'
          rows=list(csv.DictReader(open(p,encoding='utf-8-sig',newline='')))
          assert rows, 'V25_POLICY_MANIFEST_CACHE_EMPTY'
          print('V25_POLICY_MANIFEST_READY','rows',len(rows),'sha256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          print('V25_POLICY_MANIFEST_COLUMNS',','.join(rows[-1].keys()))
          PYCHECK
            exit 0
          fi

          echo "V25_POLICY_MANIFEST_BOOTSTRAP source=HISTORICAL_ARTIFACT artifact_id=${V25_POLICY_BOOTSTRAP_ARTIFACT_ID} run_id=${V25_POLICY_BOOTSTRAP_RUN_ID}"
          meta="/tmp/v25_policy_artifact_meta.json"
          zipf="/tmp/v25_policy_artifact.zip"
          rm -f "$meta" "$zipf"

          curl --fail --silent --show-error -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V25_POLICY_BOOTSTRAP_ARTIFACT_ID}" \
            -o "$meta"

          python - <<'PYMETA'
          import json, os
          m=json.load(open('/tmp/v25_policy_artifact_meta.json',encoding='utf-8'))
          expected_id=int(os.environ['V25_POLICY_BOOTSTRAP_ARTIFACT_ID'])
          expected_run=int(os.environ['V25_POLICY_BOOTSTRAP_RUN_ID'])
          expected_name=os.environ['V25_POLICY_BOOTSTRAP_ARTIFACT_NAME']
          assert int(m.get('id') or 0)==expected_id, ('V25_POLICY_ARTIFACT_ID_MISMATCH',m.get('id'))
          assert str(m.get('name') or '')==expected_name, ('V25_POLICY_ARTIFACT_NAME_MISMATCH',m.get('name'))
          assert not bool(m.get('expired')), 'V25_POLICY_ARTIFACT_EXPIRED'
          wr=m.get('workflow_run') or {}
          assert int(wr.get('id') or 0)==expected_run, ('V25_POLICY_ARTIFACT_RUN_MISMATCH',wr.get('id'))
          print('V25_POLICY_ARTIFACT_METADATA','id',m.get('id'),'run',wr.get('id'),'name',m.get('name'),'size',m.get('size_in_bytes'),'expired',m.get('expired'))
          PYMETA

          curl --fail --silent --show-error -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V25_POLICY_BOOTSTRAP_ARTIFACT_ID}/zip" \
            -o "$zipf"

          python - <<'PYEXTRACT'
          import csv, hashlib, zipfile
          from pathlib import Path
          zipf=Path('/tmp/v25_policy_artifact.zip')
          root=Path('reports/v73_v25_core224_policy_lock_manifest.csv')
          cache=Path('reports/.cache/v25_core224_live/policy_lock_manifest.csv')
          target='reports/v73_v25_core224_policy_lock_manifest.csv'
          with zipfile.ZipFile(zipf) as z:
              names=z.namelist()
              matches=[n for n in names if n.replace('\\','/').endswith(target)]
              if not matches:
                  matches=[n for n in names if n.replace('\\','/').endswith('v73_v25_core224_policy_lock_manifest.csv')]
              assert len(matches)==1, ('V25_POLICY_MANIFEST_ARTIFACT_MATCH_COUNT',len(matches),matches[:10])
              raw=z.read(matches[0])
          root.parent.mkdir(parents=True,exist_ok=True)
          cache.parent.mkdir(parents=True,exist_ok=True)
          root.write_bytes(raw)
          cache.write_bytes(raw)
          rows=list(csv.DictReader(raw.decode('utf-8-sig').splitlines()))
          assert rows, 'V25_POLICY_MANIFEST_ARTIFACT_EMPTY'
          flat='|'.join(str(v) for v in rows[-1].values())
          assert 'PENDING_POLICY_LOCK_PREREQUISITES' in flat or 'LOCKED' in flat, 'V25_POLICY_MANIFEST_STATE_UNRECOGNIZED'
          digest=hashlib.sha256(raw).hexdigest()
          print('V25_POLICY_MANIFEST_BOOTSTRAP_READY','rows',len(rows),'sha256',digest,'artifact_member',matches[0])
          print('V25_POLICY_MANIFEST_COLUMNS',','.join(rows[-1].keys()))
          for k,v in rows[-1].items():
              lk=k.lower()
              if any(tok in lk for tok in ('policy','training','primary','digest','cutoff','migration','status')):
                  print('V25_POLICY_MANIFEST_FIELD',k,str(v)[:240])
          PYEXTRACT

          cmp -s "$root_manifest" "$cache_manifest"
          echo "V25_POLICY_MANIFEST_BOOTSTRAP status=READY byte_identical=1"

      - name: Synchronize CORE224 seed Policy Lock metadata from canonical manifest
        if: env.STOCKHUNTER_CORE224_LIVE_ONLY == '1'
        run: |
          set -euo pipefail
          python - <<'PYSYNCPOLICY'
          import csv, json, os, tempfile
          from pathlib import Path

          manifest = Path('reports/v73_v25_core224_policy_lock_manifest.csv')
          seed_meta = Path('reports/.cache/v25_core224_live/seed_meta.json')

          if not seed_meta.exists():
              print('V25_SEED_POLICY_META_SYNC status=SEED_META_MISSING action=DEFER_TO_REFRESH')
              raise SystemExit(0)

          if not manifest.exists() or manifest.stat().st_size <= 0:
              print('V25_SEED_POLICY_META_SYNC status=MANIFEST_MISSING fail_closed=1')
              raise SystemExit(0)

          rows = list(csv.DictReader(manifest.open(encoding='utf-8-sig', newline='')))
          assert rows, 'V25_POLICY_MANIFEST_EMPTY'
          r = rows[-1]

          status = str(r.get('policy_lock_status', r.get('status', '')) or '')
          primary = str(r.get('primary_policy_id', 'PRIMARY_FIB618_PLUS5_D1') or 'PRIMARY_FIB618_PLUS5_D1')
          cutoff = str(r.get('training_cutoff_date', r.get('cutoff_date', '')) or '')
          schema = str(r.get('policy_lock_schema', r.get('schema', '')) or '')

          # Keep the exact same contract used by v25_core224_live_seed_builder._policy_lock().
          assert status in {'LOCKED', 'PENDING_POLICY_LOCK_PREREQUISITES'}, ('V25_POLICY_STATUS_INVALID', status)
          assert primary == 'PRIMARY_FIB618_PLUS5_D1', ('V25_PRIMARY_POLICY_MISMATCH', primary)
          assert schema == 'V25.4.10_POLICY_LOCK_3', ('V25_POLICY_SCHEMA_MISMATCH', schema)

          meta = json.loads(seed_meta.read_text(encoding='utf-8'))
          assert isinstance(meta, dict), 'V25_SEED_META_NOT_DICT'
          assert str(meta.get('source', '')) == 'CURRENT_NO_HOLD_TOP500_MATERIALIZED_V23', ('V25_SEED_SOURCE_INVALID', meta.get('source'))
          assert int(meta.get('snapshot_calendar_complete', 0) or 0) == 1, 'V25_SEED_CALENDAR_NOT_COMPLETE'
          assert int(meta.get('seed_count', 0) or 0) > 0, 'V25_SEED_COUNT_INVALID'

          before = {
              'policy_lock_status': str(meta.get('policy_lock_status', '') or ''),
              'primary_policy_id': str(meta.get('primary_policy_id', '') or ''),
              'training_cutoff_date': str(meta.get('training_cutoff_date', '') or ''),
              'policy_lock_schema': str(meta.get('policy_lock_schema', '') or ''),
          }

          # These are exactly the four fields written by the canonical LIVE seed builder.
          meta['policy_lock_status'] = status
          meta['primary_policy_id'] = primary
          meta['training_cutoff_date'] = cutoff
          meta['policy_lock_schema'] = schema

          seed_meta.parent.mkdir(parents=True, exist_ok=True)
          fd, tmp = tempfile.mkstemp(prefix=seed_meta.name + '.', suffix='.tmp', dir=str(seed_meta.parent))
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as f:
                  json.dump(meta, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write('\n')
                  f.flush()
                  os.fsync(f.fileno())
              os.replace(tmp, seed_meta)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)

          reread = json.loads(seed_meta.read_text(encoding='utf-8'))
          assert reread.get('policy_lock_status') == status
          assert reread.get('primary_policy_id') == primary
          assert reread.get('training_cutoff_date') == cutoff
          assert reread.get('policy_lock_schema') == schema

          print(
              'V25_SEED_POLICY_META_SYNC',
              'status=READY',
              'snapshot', reread.get('weekly_snapshot_date', '-'),
              'source', reread.get('source', '-'),
              'before_status', before['policy_lock_status'] or '-',
              'after_status', status,
              'primary', primary,
              'cutoff', cutoff,
              'schema', schema,
              'execution_authority=UNCHANGED_FAIL_CLOSED',
          )
          PYSYNCPOLICY

