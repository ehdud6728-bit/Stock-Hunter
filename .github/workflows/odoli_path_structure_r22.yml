name: ODOLI Path Structure R2.2 Whole-Market

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Download frozen ODOLI PIT R1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_odoli
          gh run download "36129293163" \
            -n "odoli-retrospective-all-market-r1-36129293163" \
            -D source_odoli

      - name: Download frozen R2.1 report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r21
          gh run download "36140416395" \
            -n "odoli-a-path-r21-36140416395" \
            -D source_r21

      - name: Fetch marcap 2023-2026 parquet
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'data/marcap-2023.parquet' \
            'data/marcap-2024.parquet' \
            'data/marcap-2025.parquet' \
            'data/marcap-2026.parquet' \
            > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          ls -lh data/
          cd ../..

      - name: Compute whole-market path descriptors
        run: |
          python -u odoli_path_structure_r22.py \
            --odoli-root source_odoli \
            --r21-root source_r21 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_path_structure_r22

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_path_structure_r22/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_threshold_tuning"] is False
          assert m["odoli_n"]==65054
          assert m["path_descriptor_complete_n"]>60000
          assert m["true_oos_validation"] is False
          print(m)
          PY

      - run: cat reports/odoli_path_structure_r22/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-path-structure-r22-${{ github.run_id }}
          path: reports/odoli_path_structure_r22/**
          retention-days: 30
