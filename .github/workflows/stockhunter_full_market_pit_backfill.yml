name: StockHunter Whole-Market KRX PIT Price Backfill (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockhunter-krx-whole-market-price-backfill-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  offline-contract-tests:
    name: Offline Source Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -m unittest discover -s tests -p 'test_full_market_pit.py' -v
      - name: Confirm full-market reference and KRX login secrets before 8 shards
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        shell: bash
        run: |
          set -euo pipefail
          ref='research_pit/historical_market_counts_20190102_20261012.csv'
          if [ ! -s "$ref" ]; then
            echo '::error::Missing research_pit/historical_market_counts_20190102_20261012.csv. Upload the reference CSV retaining its folder.'
            exit 31
          fi
          refsha="$(sha256sum "$ref" | cut -d' ' -f1)"
          expected='e733c3bd67a4cf06e93954888ef1ea539ec2e04d193f9d8a2406ef55fc248af1'
          if [ "$refsha" != "$expected" ]; then
            echo '::error::Historical full-market reference checksum mismatch: do not continue.'
            exit 32
          fi
          python - <<'PYREF'
          import csv
          path = 'research_pit/historical_market_counts_20190102_20261012.csv'
          with open(path, encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 1907, f'expected 1907 trading dates, found {len(rows)}'
          assert rows[0]['date'] == '2019-01-02'
          assert rows[-1]['date'] == '2026-10-12'
          print('H7_REFERENCE_1907_DATES_SHA_PASS')
          PYREF
          if [ -z "${KRX_ID:-}" ] || [ -z "${KRX_PW:-}" ]; then
            echo '::error::KRX_ID and/or KRX_PW not found as GitHub Actions repository secrets. No credentials are printed.'
            exit 33
          fi
          echo 'KRX_REQUIRED_SECRETS_PRESENT (values hidden); ready for actual market API check'

  # One real old+recent KRX check before starting eight expensive history shards.
  live-provider-canary:
    name: KRX live full-market identity and anchor canary (2019 + 2026)
    needs: offline-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pykrx
      - name: Verify actual date-specific KRX identity count and gzip roundtrip
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research_pit python - <<'PYKRX'
          from pykrx import stock
          from krx_full_market_pit import read_reference, normalize_day, encode_day, validate_stored_day
          ref = read_reference('research_pit/historical_market_counts_20190102_20261012.csv')
          for day in ('2019-01-02', '2026-10-12'):
              raw = stock.get_market_ohlcv_by_ticker(day.replace('-', ''), market='ALL', alternative=False)
              frame, flags = normalize_day(raw, day)
              if len(frame) != ref[day]:
                  raise RuntimeError('KRX_LIVE_CANARY_ROW_COUNT_MISMATCH:' + day
                                     + ':got=' + str(len(frame)) + ':expected=' + str(ref[day]))
              validate_stored_day(encode_day(frame), day, ref[day])
              letters = int(frame['code'].str.contains('[A-Z]',regex=True).sum())
              print('KRX_LIVE_CANARY_PASS',day,'rows=',len(frame),
                    'alphanumeric_tickers=',letters,'nontradeable=',flags['zero_or_nontradeable_proxy_rows'],flush=True)
          PYKRX

  fetch-full-market:
    name: Fetch full KRX session ${{ matrix.shard }}/8
    needs: live-provider-canary
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install price-provider dependencies
        run: pip install pandas numpy pykrx
      - name: Fetch historical full-market KRX, no ticker allowlist
        run: |
          python -u research_pit/krx_full_market_pit.py \
            --mode fetch \
            --reference research_pit/historical_market_counts_20190102_20261012.csv \
            --start 2019-01-02 --end 2026-10-12 \
            --root pitdata --shard ${{ matrix.shard }} --shards 8 \
            --retries 3 --pause 1
      - name: Upload shard (including incomplete evidence if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-allkrx-price-shard-${{ matrix.shard }}
          path: pitdata/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  verify-unfiltered-price-data:
    name: Fail-closed multi-shard full-market audit
    needs: fetch-full-market
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          path: pitdata/
          merge-multiple: true
      - name: Audit all 1907 days, all KRX rows, SHA and index-series identities
        run: |
          python -u research_pit/krx_full_market_pit.py \
            --mode verify \
            --reference research_pit/historical_market_counts_20190102_20261012.csv \
            --root pitdata \
            --report full_market_price_collection_audit.json
      - name: Publish collection audit (NOT PIT strategy-ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-full-market-collection-audit
          path: full_market_price_collection_audit.json
          if-no-files-found: warn
          retention-days: 30
