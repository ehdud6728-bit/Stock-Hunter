name: Closing Bet Exit Window OOS R1.0.8

on:
  workflow_dispatch:
    inputs:
      r107_run_id:
        required: true
        default: "35342001308"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download R1.0.7 artifact
        run: |
          mkdir -p r107_artifacts
          gh run download "${{ inputs.r107_run_id }}" -D r107_artifacts

      - name: Run Exit Window OOS R1.0.8
        run: |
          python -u closing_bet_exit_window_oos_r108.py \
            --r107-root r107_artifacts \
            --output-dir reports/closebet_exit_window_oos_r108

      - name: Validate R1.0.8 invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_exit_window_oos_r108/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert m['same_cohort_exit_comparison']
          assert not m['uses_hindsight_optimized_exit']
          assert int(m['d20_mature_rows'])>0
          print('R108_EXIT_WINDOW PASS',m['event_rows'],m['d20_mature_rows'])
          PY

      - name: Upload R1.0.8 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-exit-window-r108-${{ github.run_id }}
          path: reports/closebet_exit_window_oos_r108/**
          if-no-files-found: warn
          retention-days: 30
