name: Closing Bet R1.22 Candle x Volume x MA x Previous-Support Action (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closebet-r122-candle-support-research-only
  cancel-in-progress: false

jobs:
  research:
    name: R122 D0 causal candle support x 4 entries x 3 stops (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      R120_RUN: '38871858855'
      R120_NAME: 'closebet-r120-entry-scale-stop-38871858855'
      R171_RUN: '38664095610'
    steps:
      - name: Checkout research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fixed analysis requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6' 'pandas==2.2.3'
      - name: Preflight syntax tests and research-only policy contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r118_partial_market_wave_geometry.py closebet_research/r122_candle_support_action_research.py tests/test_r122_candle_support_action_research.py
          python -m unittest discover -s tests -p 'test_r122_candle_support_action_research.py' -v
          python -m closebet_research.r122_candle_support_action_research --help >/dev/null
          echo R122_PREFLIGHT_TESTS_PASS
      - name: Fetch immutable R120 research and R171 original KRX daily snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/r120 evidence/history_archives
          gh run download "$R120_RUN" --repo "$GITHUB_REPOSITORY" --name "$R120_NAME" --dir evidence/r120
          test -s evidence/r120/r120_integrity_manifest.json
          python - <<'PY'
          from closebet_research.r122_candle_support_action_research import checked_source
          a,m=checked_source('evidence/r120')
          assert len(a)==4567
          print('R122_EXACT_R120_PINNED_SHA_VERIFIED')
          PY
          for i in 0 1 2 3; do
            mkdir -p "evidence/raw$i"
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" --name "r171-history-$i" --dir "evidence/raw$i"
            test "$(find "evidence/raw$i" -maxdepth 1 -name '*.csv.gz' | wc -l)" -ge 450
            test "$(find "evidence/raw$i" -maxdepth 1 -name 'krx_history_manifest_*.json' | wc -l)" -eq 1
          done
      - name: Repackage original gzip bytes without any market refetch or recomputation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(4):
              src=Path('evidence/raw'+str(i))
              members=sorted(p for p in src.iterdir() if p.is_file())
              assert len(members)>450
              with ZipFile('evidence/history_archives/immutable_'+str(i)+'.zip','w',compression=ZIP_STORED) as z:
                  for p in members:z.write(p,p.name)
          print('R122_FOUR_ORIGINAL_IMMUTABLE_ARCHIVES_READY')
          PY
      - name: Verify all 1907 KRX SHA and replay frozen structure hypotheses
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r122_candle_support_action_research \
            --r120-root evidence/r120 \
            --history-dir evidence/history_archives \
            --output-dir reports/r122
      - name: Strict source-scope and result SHA assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('reports/r122')
          m=json.loads((p/'r122_integrity_manifest.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS_SOURCE_LIMITED_ASOF_CANDLE_SUPPORT_DESCRIPTIVE_NOT_OOS_NOT_TRADE_APPROVED'
          assert m['krx_day_sha_verified']==1907 and m['r120_episodes']==4567
          assert m['feature_rows']==4567 and m['feature_valid_rows']==4453
          assert m['scenario_events']==3077 and m['scenario_rows']==36924
          # Cross-version identity: fixed D1 -5/+5 must reproduce R120 on
          # the exact 3077 asof-valid episodes (no strategy baseline drift).
          import pandas as pd
          old=pd.read_csv('evidence/r120/r120_entry_scale_stop_scenario_ledger.csv',dtype={'code':str},low_memory=False)
          new=pd.read_csv(p/'r122_entry_scale_structure_stop_ledger.csv',dtype={'code':str},low_memory=False)
          q=old[(old.entry_policy=='D1_FULL') & (old.stop_policy=='STOP5')][['scope','code','signal_date','profit_pct_budget_net05']]
          v=new[(new.entry=='E0_D1_FULL') & (new.stop=='S0_FIXED5')][['scope','code','signal_date','budget_net_pct']]
          paired=q.merge(v,on=['scope','code','signal_date'],validate='one_to_one')
          assert len(paired)==3077 and (paired.profit_pct_budget_net05-paired.budget_net_pct).abs().max()<1e-6, 'R120_BASELINE_REPLICATION_FAILED'
          assert not m['trade_authority'] and not m['live_changed'] and not m['shadow_changed'] and not m['auto_exit_changed']
          assert not m['full_market_PIT_recall_valid'] and m['research_only']
          for fn,expected in m['sha256'].items():
              assert hashlib.sha256((p/fn).read_bytes()).hexdigest()==expected,('OUTPUT_SHA_BAD',fn)
          print('R122_SOURCE_LIMITED_DESCRIPTIVE_SHA_PASS; NO_LIVE_AUTHORITY; NOT_OOS')
          PY
      - name: Upload audit evidence only
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r122-candle-support-actions-${{ github.run_id }}
          path: reports/r122/**
          if-no-files-found: error
          retention-days: 30
