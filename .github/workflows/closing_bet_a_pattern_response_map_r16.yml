name: Closing Bet A Pattern Response Map R1.6

on:
  workflow_dispatch:
    inputs:
      source_r13_run_id:
        description: Successful R1.3 Outcome Refinement run id
        required: true
        default: "35443265652"

permissions:
  contents: read
  actions: read

jobs:
  a_response_map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download R1.3 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_r13
          gh run download "${{ inputs.source_r13_run_id }}" -D source_r13
          find source_r13 -type f | sort

      - name: Build A Pattern Response Map R1.6
        shell: bash
        run: |
          set -euo pipefail
          python -u closing_bet_a_pattern_response_map_r16.py \
            --source-root source_r13 \
            --output-dir reports/a_pattern_response_map_r16 \
            --source-r13-run-id "${{ inputs.source_r13_run_id }}"

      - name: Validate R1.6 guardrails
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/a_pattern_response_map_r16/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only']
          assert m['pattern']=='A'
          assert not m['candidate_membership_changed']
          assert not m['candidate_order_changed']
          assert not m['score_rank_changed']
          assert not m['candidate_filter_created']
          assert not m['production_logic_changed']
          assert not m['aggregate_route_score_created']
          assert not m['aggregate_route_classification_created']
          assert not m['same_sample_tuning']
          assert not m['new_threshold_optimization']
          assert not m['atr_used']
          assert m['wick_display_label']=='UpperWick(body-relative)'
          assert not m['existing_pattern_maps_modified']
          print('A_PATTERN_RESPONSE_MAP_R16 PASS',m['events'],m['independent_signal_dates'])
          PY

      - name: Upload R1.6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-a-pattern-response-map-r16-${{ github.run_id }}
          path: reports/a_pattern_response_map_r16/**
          if-no-files-found: warn
          retention-days: 30
