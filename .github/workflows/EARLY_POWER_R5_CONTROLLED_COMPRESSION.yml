name: EARLY POWER R5 Controlled Compression Shape Map
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  TZ: Asia/Seoul
jobs:
  r5-controlled-compression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Download frozen R3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3
          python - <<'PY'
          import io,os,zipfile,requests
          repo=os.environ["GITHUB_REPOSITORY"]; rid=37132857142
          H={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          b=f"https://api.github.com/repos/{repo}"
          arts=requests.get(f"{b}/actions/runs/{rid}/artifacts?per_page=100",headers=H,timeout=60).json()["artifacts"]
          a=next(x for x in arts if x["name"]=="early-power-r3-s3-structure-anatomy")
          z=requests.get(f"{b}/actions/artifacts/{a['id']}/zip",headers=H,timeout=90,allow_redirects=True); z.raise_for_status()
          zipfile.ZipFile(io.BytesIO(z.content)).extractall("/tmp/r3")
          PY
      - name: Fetch marcap 2025-2026
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap; mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2025.parquet' 'data/marcap-2026.parquet' >/tmp/m.txt
          git sparse-checkout set --stdin </tmp/m.txt
          git checkout
          cd ../..
      - name: Run R5
        shell: bash
        run: |
          set -euo pipefail
          R3=$(find /tmp/r3 -name r3_s3_structure_ledger.csv | head -1)
          python early_power_r5_controlled_compression.py --r3-ledger "$R3" --marcap vendor/marcap/data/marcap-2025.parquet vendor/marcap/data/marcap-2026.parquet --out reports/early_power_r5
      - name: Validate invariants
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/early_power_r5/meta.json",encoding="utf-8"))
          assert m["research_only"] is True and m["production_changed"] is False and m["same_sample_retuning"] is False
          q=pd.read_csv("reports/early_power_r5/r5_s3_rebuilt_path_ledger.csv")
          assert len(q)>0 and q["stage"].eq("S3_CONVERGENCE").all()
          print("EARLY_POWER_R5_INVARIANTS_PASS")
          PY
      - name: Show report
        if: always()
        run: cat reports/early_power_r5/REPORT.txt || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-power-r5-controlled-compression-shape-map
          path: reports/early_power_r5/**
          if-no-files-found: error
          retention-days: 90
