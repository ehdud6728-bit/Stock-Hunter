name: Stock-Hunter R25 Big30 Opportunity Recall and Realized Exit Capture Research Only

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r25_big30_opportunity_capture_research_only.yml'
      - 'research_projects/trendline_true55_r25_big30_20261123/**'
  workflow_dispatch:
    inputs:
      confirm_fixed_kis_research_only:
        description: 'Only pinned BLUE KIS 44988188271 / R19 149; research only, no LIVE or orders'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  r25-unit-tests:
    name: Intraday big30 opportunity versus actual next-open fills and no-future tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Run R25 synthetic timing, capture, and train-only tests
        run: python -m unittest discover -s research_projects/trendline_true55_r25_big30_20261123 -p 'test_r25*.py' -v

  r25-frozen-manual-replay:
    name: Pinned KIS => R19 149 => R20/21/22/24 => R25 opportunity versus profit
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_fixed_kis_research_only == true
    needs: r25-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Download PINNED BLUE KIS source; no KIS tokens or refresh
        uses: actions/download-artifact@v4
        with:
          name: BLUE_STOCKHUNTER_R16_KIS_30_44988188271
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 44988188271
          github-token: ${{ github.token }}
          path: reports/r25_source
      - name: Hash-pin archive and rebuild R16/R17
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r17_failure_exit.py \
            --repo . --artifact reports/r25_source \
            --r16-out reports/r25_r16 --out reports/r25_r17 --phase all
      - name: Rebuild and audit R19 unchanged true55 149 entry events
        run: |
          python research_projects/trendline_true55_r19_20261122/r19_true55_transfer.py \
            --repo . --r16-out reports/r25_r16 \
            --r17-out reports/r25_r17 --out reports/r25_r19
      - name: Rebuild immutable R20 MA5/MA20 baseline
        run: |
          python research_projects/trendline_true55_r20_ma_exit_20261123/r20_ma_exit.py \
            --r16-out reports/r25_r16 --r19-out reports/r25_r19 \
            --out reports/r25_r20
      - name: Rebuild R21 causal phased exits
        run: |
          python research_projects/trendline_true55_r21_phase_exit_20261123/r21_phase_exit.py \
            --r16-out reports/r25_r16 --r19-out reports/r25_r19 \
            --r20-ma-out reports/r25_r20 --out reports/r25_r21
      - name: Rebuild R22 frozen 55-day level exits
        run: |
          python research_projects/trendline_true55_r22_level_reclaim_20261123/r22_level_reclaim.py \
            --r16-out reports/r25_r16 --r19-out reports/r25_r19 \
            --r20-ma-out reports/r25_r20 \
            --r21-out reports/r25_r21 --out reports/r25_r22
      - name: Rebuild R24 prior loss warning benchmark
        run: |
          python research_projects/trendline_true55_r24_entry_risk_20261123/r24_entry_risk.py \
            --r16-out reports/r25_r16 --r19-out reports/r25_r19 \
            --r20-ma-out reports/r25_r20 --out reports/r25_r24
      - name: Run R25 +30% recall and actual next-open exit capture with R24 contrast
        run: |
          python research_projects/trendline_true55_r25_big30_20261123/r25_big30.py \
            --r16-out reports/r25_r16 --r19-out reports/r25_r19 \
            --r20-out reports/r25_r20 --r22-out reports/r25_r22 \
            --r24-out reports/r25_r24 --out reports/r25_big30
      - name: Upload only derived reports, never raw KIS OHLCV or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R25_BIG30_RECALL_ACTUAL_EXIT_CAPTURE_RESEARCH_ONLY
          path: |
            reports/r25_r16/R16_SOURCE_MANIFEST.json
            reports/r25_r19/R19_TRUE55_TRANSFER_SUMMARY.json
            reports/r25_r20/R20_MA_EXIT_SUMMARY.json
            reports/r25_r22/R22_LEVEL_EXIT_SUMMARY.json
            reports/r25_r24/R24_D0_ENTRY_RISK_SUMMARY.json
            reports/r25_big30/R25_BIG30_RESEARCH_SUMMARY.json
            reports/r25_big30/R25_149_PAIRED_EXIT_AND_LANDMARK_EVENTS.json
            reports/r25_big30/R25_2024_2025_D0_REVIEW_SCORES.json
          if-no-files-found: warn
          retention-days: 30
