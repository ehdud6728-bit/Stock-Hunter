name: CORE224 LIVE Date Forensic R2 (Static Research Only)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Historical target date for comparison only (YYYY-MM-DD)'
        required: true
        default: '2026-10-12'
        type: string
permissions:
  contents: read
jobs:
  forensic:
    name: Read-only source date routing audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run offline source forensic (never import production or fetch market data)
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          python -u core224_live_date_forensic_r2.py --target "$TARGET_DATE"
          test -s reports/core224_live_date_forensic_r2/summary.json
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core224-live-date-forensic-r2-${{ github.run_id }}
          path: reports/core224_live_date_forensic_r2/
          retention-days: 30
          if-no-files-found: warn
