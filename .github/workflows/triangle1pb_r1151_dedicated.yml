name: TRIANGLE1PB R1.15.3 Dedicated Verify & Research

on:
  workflow_dispatch:
    inputs:
      tri_start_date:
        description: "발견표본 시작일 잠금값 (2024-08-27만 허용)"
        required: false
        default: "2024-08-27"
        type: string
      tri_end_date:
        description: "연구 종료일 (비우면 price cache 최신일)"
        required: false
        default: ""
        type: string
      tri_max_codes:
        description: "종목 제한 (0=전체)"
        required: false
        default: "0"
        type: string
      tri_manual_sample_limit:
        description: "수동 차트검증 표본 수"
        required: false
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: triangle1pb-r1151-dedicated-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  triangle1pb-r1151-dedicated:
    name: TRIANGLE1PB R1.15.3 Dedicated Research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      TRIANGLE1PB_RESEARCH_ONLY: "1"
      TRIANGLE1PB_STRATEGY_ID: "TRIANGLE1PB_R1_CHRONOLOGY_FIRST"
      TRIANGLE1PB_LIVE_ENABLE: "0"
      TRIANGLE1PB_SCORE_RANK_ENABLE: "0"
      TRIANGLE1PB_ORDER_ENABLE: "0"
      TRIANGLE1PB_TUNING_ALLOWED: "0"
      V20_PRICE_CACHE_DIR: reports/.cache/v20_price_history
      V20_ASOF_CACHE_DIR: reports/.cache/v20_asof_snapshots
      V25_ACTUAL_AMOUNT_CACHE_DIR: reports/.cache/v25_actual_amount_history
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: R1.12.1 dedicated workflow identity
        shell: bash
        run: |
          set -euo pipefail
          echo "TRIANGLE1PB_DEDICATED_WORKFLOW=R1_15"
          echo "TRIANGLE1PB_EVENT_REF=${GITHUB_REF}"
          echo "TRIANGLE1PB_EVENT_SHA=${GITHUB_SHA}"
          echo "TRIANGLE1PB_WORKSPACE=${GITHUB_WORKSPACE}"
          test -f triangle1pb_research.py || { echo "TRIANGLE1PB source missing"; exit 241; }
          grep -Fq 'LOADER_REVISION = "TRIANGLE1PB_R1_15_6_OOS_OBSERVATION_GAP_GUARD"' triangle1pb_research.py || {
            echo "TRIANGLE1PB_DEDICATED_STALE_SOURCE_FAIL";
            echo "Expected TRIANGLE1PB_R1_15_6_OOS_OBSERVATION_GAP_GUARD";
            grep -n '^LOADER_REVISION' triangle1pb_research.py || true;
            exit 242;
          }
          echo "TRIANGLE1PB_DEDICATED_SOURCE_SHA256=$(sha256sum triangle1pb_research.py | awk '{print $1}')"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install TRIANGLE1PB research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Compile and synthetic chronology preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f triangle1pb_research.py || { echo "TRIANGLE1PB source missing"; exit 231; }

          # R2C1 append-only OOS authority requires the immutable frozen baseline.
          test -f tri_r2_frozen_discovery_baseline.csv || {
            echo "❌ TRIANGLE_R2_FROZEN_BASELINE_MISSING tri_r2_frozen_discovery_baseline.csv"
            exit 253
          }
          actual_baseline_sha="$(sha256sum tri_r2_frozen_discovery_baseline.csv | awk '{print $1}')"
          expected_baseline_sha="65ac0f184045ae57a58e48f5b16042e79790398ffc22e5ef4686e89fed5068d5"
          if [ "$actual_baseline_sha" != "$expected_baseline_sha" ]; then
            echo "❌ TRIANGLE_R2_FROZEN_BASELINE_SHA_MISMATCH expected=$expected_baseline_sha actual=$actual_baseline_sha"
            exit 254
          fi
          baseline_rows="$(tail -n +2 tri_r2_frozen_discovery_baseline.csv | wc -l | tr -d ' ')"
          baseline_candidate="$(grep -c ',R2C1_RECLAIM_CANDIDATE$' tri_r2_frozen_discovery_baseline.csv || true)"
          baseline_control="$(grep -c ',NO_RECLAIM_CONTEMPORANEOUS_CONTROL$' tri_r2_frozen_discovery_baseline.csv || true)"
          if [ "$baseline_rows" != "16" ] || [ "$baseline_candidate" != "7" ] || [ "$baseline_control" != "9" ]; then
            echo "❌ TRIANGLE_R2_FROZEN_BASELINE_POPULATION_MISMATCH rows=$baseline_rows candidate=$baseline_candidate control=$baseline_control"
            exit 256
          fi
          echo "TRIANGLE_R2_FROZEN_BASELINE PASS rows=$baseline_rows candidate=$baseline_candidate control=$baseline_control sha=$actual_baseline_sha"

          python -m py_compile triangle1pb_research.py
          python triangle1pb_research.py --self-test
          grep -Fq 'RESEARCH_AUTHORITY = "RESEARCH_ONLY_NO_LIVE_NO_POLICY_NO_ORDERS"' triangle1pb_research.py
          grep -Fq 'STRATEGY_ID = "TRIANGLE1PB_R1_CHRONOLOGY_FIRST"' triangle1pb_research.py
          grep -Fq 'LOADER_REVISION = "TRIANGLE1PB_R1_15_6_OOS_OBSERVATION_GAP_GUARD"' triangle1pb_research.py || {
            echo "TRIANGLE1PB_STALE_SOURCE_FAIL expected=R1_15_5";
            grep -n '^LOADER_REVISION' triangle1pb_research.py || true;
            exit 236;
          }
          grep -Fq 'synthetic_close_x_volume_fallback_rows' triangle1pb_research.py
          echo "TRIANGLE1PB_SOURCE_REVISION=$(grep '^LOADER_REVISION' triangle1pb_research.py)"
          echo "TRIANGLE1PB_SOURCE_SHA256=$(sha256sum triangle1pb_research.py | awk '{print $1}')"
          echo "TRIANGLE1PB_GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          echo "TRIANGLE1PB_GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo UNKNOWN)"
          echo "TRIANGLE1PB_PREFLIGHT PASS revision=R1_15_5 independent=1 live=0 score_rank=0 order=0 tuning=0"

      - name: Restore latest CORE224 current-data overlay for TRIANGLE1PB
        id: tri-current-overlay-restore
        uses: actions/cache/restore@v4
        with:
          # Exact path-set used by "Save CORE224 live state overlay".
          # TRIANGLE1PB only reads price/as-of/actual-Amount from this cache.
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
          key: triangle1pb-current-overlay-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-v25-core224-live-${{ github.ref_name }}-

      - name: Restore V21 research cache only as fallback
        if: steps.tri-current-overlay-restore.outputs.cache-matched-key == ''
        id: tri-v21-restore
        uses: actions/cache/restore@v4
        with:
          # Exact canonical V21 replay path-set.
          path: |
            reports/.cache/v20_price_history
            reports/.cache/v20_asof_snapshots
            reports/.cache/v25_actual_amount_history
            reports/.cache/v25_core224_live
            reports/.cache/v20_replay_checkpoint
          key: triangle1pb-v21-fallback-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-v21-replay-${{ github.ref_name }}-

      - name: Prove TRIANGLE1PB research data authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/.cache/v20_price_history reports/.cache/v20_asof_snapshots reports/.cache/v25_actual_amount_history reports/triangle1pb
          price_files=$(find reports/.cache/v20_price_history -type f 2>/dev/null | wc -l | tr -d ' ')
          asof_files=$(find reports/.cache/v20_asof_snapshots -type f 2>/dev/null | wc -l | tr -d ' ')
          amount_files=$(find reports/.cache/v25_actual_amount_history -type f 2>/dev/null | wc -l | tr -d ' ')
          current_match="${{ steps.tri-current-overlay-restore.outputs.cache-matched-key }}"
          fallback_match="${{ steps.tri-v21-restore.outputs.cache-matched-key }}"
          if [ -n "$current_match" ]; then
            cache_source="CURRENT_V25_CORE224_LIVE_OVERLAY"
            matched="$current_match"
          elif [ -n "$fallback_match" ]; then
            cache_source="V21_REPLAY_FALLBACK"
            matched="$fallback_match"
          else
            cache_source="NONE"
            matched=""
          fi
          echo "TRIANGLE1PB_CACHE_AUTHORITY source=${cache_source} matched=${matched} price_files=${price_files} asof_files=${asof_files} amount_files=${amount_files} cache_write=0"
          test "$price_files" -gt 0 || { echo "TRIANGLE1PB_FAIL_CLOSED price cache empty"; exit 232; }
          test "$asof_files" -gt 0 || { echo "TRIANGLE1PB_FAIL_CLOSED historical as-of universe cache empty"; exit 233; }

      - name: Restore TRIANGLE1PB append-only OOS ledger
        id: tri-oos-ledger-restore
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/triangle1pb_r2_oos_ledger
          key: stockhunter-triangle1pb-r2-oos-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockhunter-triangle1pb-r2-oos-ledger-${{ github.ref_name }}-

      - name: Run TRIANGLE1PB chronology-first two-year research
        shell: bash
        env:
          TRI_START_DATE: ${{ inputs.tri_start_date }}
          TRI_END_DATE: ${{ inputs.tri_end_date }}
          TRI_MAX_CODES: ${{ inputs.tri_max_codes }}
          TRI_MANUAL_SAMPLE_LIMIT: ${{ inputs.tri_manual_sample_limit }}
        run: |
          set -euo pipefail
          args=(
            --price-cache-dir reports/.cache/v20_price_history
            --asof-cache-dir reports/.cache/v20_asof_snapshots
            --amount-cache-dir reports/.cache/v25_actual_amount_history
            --output-dir reports/triangle1pb
            --max-codes "${TRI_MAX_CODES:-0}"
            --manual-sample-limit "${TRI_MANUAL_SAMPLE_LIMIT:-40}"
            --oos-ledger-dir reports/.cache/triangle1pb_r2_oos_ledger
            --frozen-discovery-baseline tri_r2_frozen_discovery_baseline.csv
          )
          if [ -z "${TRI_END_DATE:-}" ]; then
            args+=(--require-current-overlay-authority)
            current_match="${{ steps.tri-current-overlay-restore.outputs.cache-matched-key }}"
            producer_end=""
            if [ -n "$current_match" ]; then
              producer_end=$(python - <<'PYPRODUCER'
          import json
          from pathlib import Path
          marker=Path("reports/.cache/v25_core224_live/current_overlay_handoff_authority.json")
          seed=Path("reports/.cache/v25_core224_live/seed_meta.json")
          m=json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else {}
          s=json.loads(seed.read_text(encoding="utf-8")) if seed.exists() else {}
          md=str(m.get("producer_snapshot_date","")).strip()
          sd=str(s.get("weekly_snapshot_date","")).strip()
          if md and sd and md != sd:
              raise SystemExit(f"CURRENT_OVERLAY_AUTHORITY_CONFLICT marker={md} seed={sd}")
          print(md or sd)
          PYPRODUCER
          )
            fi
            if [ -n "$producer_end" ]; then args+=(--expected-current-data-end "$producer_end"); fi
            echo "TRIANGLE1PB_CURRENT_OVERLAY_HANDOFF matched=${current_match:-NONE} producer_end=${producer_end:-MISSING} guard=REQUIRED"
          else
            echo "TRIANGLE1PB_CURRENT_OVERLAY_HANDOFF explicit_end=${TRI_END_DATE} guard=HISTORICAL_EXPLICIT_END"
          fi
          if [ -n "${TRI_START_DATE:-}" ]; then args+=(--start-date "$TRI_START_DATE"); fi
          if [ -n "${TRI_END_DATE:-}" ]; then args+=(--end-date "$TRI_END_DATE"); fi
          grep -Fq 'LOADER_REVISION = "TRIANGLE1PB_R1_15_6_OOS_OBSERVATION_GAP_GUARD"' triangle1pb_research.py || {
            echo "TRIANGLE1PB_STALE_SOURCE_FAIL immediately_before_run";
            grep -n '^LOADER_REVISION' triangle1pb_research.py || true;
            exit 237;
          }
          echo "TRIANGLE1PB_RUN_SOURCE_SHA256=$(sha256sum triangle1pb_research.py | awk '{print $1}')"
          python -u triangle1pb_research.py "${args[@]}" | tee reports/triangle1pb/tri_runtime.log

      - name: TRIANGLE1PB fail-closed research postflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTRIGUARD'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('reports/triangle1pb')
          required=[
              'tri_state_spec.csv','tri_stage_ledger.csv','tri_signal_ledger.csv','tri_forward_outcomes.csv',
              'tri_stage_counts.csv','tri_rejection_ledger.csv','tri_rejection_counts.csv',
              'tri_chronology_audit.csv','tri_lookahead_audit.csv','tri_invariant_audit.csv',
              'tri_amount_authority_audit.csv','tri_asof_universe_audit.csv','tri_manual_chart_review_sample.csv',
              'tri_event_study_summary.csv',
              'tri_stage_anchor_d1_d15_path_detail.csv',
              'tri_stage_anchor_d1_d15_event_summary.csv',
              'tri_stage_anchor_d1_d15_summary.csv',
              'tri_conversion_vs_quality_summary.csv',
              'tri_healthy_bottoming_anatomy.csv',
              'tri_restart_reacceleration_anatomy.csv',
              'tri_stage_quality_anatomy_summary.csv',
              'tri_restart_reclaim_robustness_summary.csv',
              'tri_r2_candidate_definition.csv',
              'tri_r2_candidate_shadow_detail.csv',
              'tri_r2_candidate_shadow_summary.csv',
              'tri_r2_prospective_control_detail.csv',
              'tri_r2_prospective_control_summary.csv',
              'tri_r2_oos_readiness.csv',
              'tri_r2_oos_append_only_ledger.csv','tri_r2_oos_append_only_summary.csv',
              'tri_r2_discovery_baseline_drift_summary.csv',
              'tri_manifest.json','tri_report.txt','tri_runtime.log',
          ]
          missing=[x for x in required if not (root/x).exists()]
          assert not missing, ('TRIANGLE1PB_OUTPUT_MISSING',missing)
          m=json.loads((root/'tri_manifest.json').read_text(encoding='utf-8'))
          assert m.get('schema')=='TRIANGLE1PB_RESEARCH_SCHEMA_V1'
          assert m.get('strategy_id')=='TRIANGLE1PB_R1_CHRONOLOGY_FIRST'
          assert m.get('loader_revision')=='TRIANGLE1PB_R1_15_6_OOS_OBSERVATION_GAP_GUARD', (
              'TRIANGLE1PB_STALE_MANIFEST_REVISION', m.get('loader_revision')
          )
          ready=pd.read_csv(root/'tri_r2_oos_readiness.csv')
          for col in (
              'expected_current_data_end','current_overlay_authority_required',
              'current_overlay_authority_present','current_overlay_handoff_fresh',
              'current_overlay_handoff_lag_days'
          ):
              assert col in ready.columns, ('R1_15_5_HANDOFF_GUARD_COLUMN_MISSING', col)
          for col in (
              'current_day_candidate_events','current_day_control_events',
              'oos_membership_authority','retroactive_recomputed_not_admitted',
              'membership_flip_against_frozen_ledger'
          ):
              assert col in ready.columns, ('R1_15_5_APPEND_ONLY_COLUMN_MISSING', col)
          ao=pd.read_csv(root/'tri_r2_oos_append_only_summary.csv')
          assert str(ao.iloc[0]['ledger_authority'])=='APPEND_ONLY_FIRST_OBSERVED_ON_EVENT_DATE'
          assert int(ao.iloc[0]['retroactive_rows_can_enter_ledger'])==0
          assert int(ao.iloc[0]['membership_rewrite_allowed'])==0
          assert 'stage_anchor_path_audit' in m, 'R1_12_STAGE_ANCHOR_MANIFEST_MISSING'
          assert 'conversion_vs_quality_audit' in m, 'R1_12_CONVERSION_QUALITY_MANIFEST_MISSING'
          assert 'stage_quality_anatomy_audit' in m, 'R1_15_STAGE_QUALITY_ANATOMY_MANIFEST_MISSING'
          assert 'restart_reclaim_robustness_audit' in m, 'R1_15_RECLAIM_ROBUSTNESS_MANIFEST_MISSING'
          assert 'r2_candidate_prospective_shadow' in m, 'R1_15_R2_SHADOW_MANIFEST_MISSING'
          assert 'r2_prospective_control_audit' in m, 'R1_15_1_CONTROL_MANIFEST_MISSING'
          assert m.get('research_authority')=='RESEARCH_ONLY_NO_LIVE_NO_POLICY_NO_ORDERS'
          assert m.get('core224_dependency')=='NONE'
          assert m.get('core224_logic_changed') is False
          assert m.get('live_logic_changed') is False
          assert m.get('score_rank_changed') is False
          assert m.get('order_logic_changed') is False
          assert m.get('primary_policy')=='NONE_EVENT_STUDY_ONLY'
          assert m.get('tuning_allowed') is False
          assert int(m.get('actual_amount_synthetic_fallback_rows',-1))==0
          assert int(m.get('lookahead_fail',-1))==0
          assert int(m.get('invariant_fail',-1))==0
          assert m.get('status')=='PASS'
          inv=pd.read_csv(root/'tri_invariant_audit.csv')
          la=pd.read_csv(root/'tri_lookahead_audit.csv')
          amt=pd.read_csv(root/'tri_amount_authority_audit.csv')
          uni=pd.read_csv(root/'tri_asof_universe_audit.csv')
          stage=pd.read_csv(root/'tri_stage_anchor_d1_d15_summary.csv')
          convq=pd.read_csv(root/'tri_conversion_vs_quality_summary.csv')
          assert not stage.empty, 'R1_12_STAGE_ANCHOR_SUMMARY_EMPTY'
          assert {'QUALIFIED','HEALTHY','RESTART'}.issubset(set(stage['anchor'].astype(str))), (
              'R1_12_STAGE_ANCHORS_MISSING', sorted(set(stage['anchor'].astype(str)))
          )
          assert not convq.empty, 'R1_12_CONVERSION_QUALITY_EMPTY'
          assert {'OBV+_AND_BB40DOWN','REST'}.issubset(set(convq['group'].astype(str))), (
              'R1_12_CONVERSION_GROUPS_MISSING', sorted(set(convq['group'].astype(str)))
          )
          assert len(inv)==1 and str(inv.iloc[-1].get('status'))=='PASS'
          assert len(la)==1 and str(la.iloc[-1].get('status'))=='PASS'
          assert int(float(amt.iloc[-1].get('synthetic_close_x_volume_fallback_rows',-1)))==0
          assert int(float(uni.iloc[-1].get('future_snapshot_fallback_allowed',1)))==0
          print('TRIANGLE1PB_POSTFLIGHT PASS', 'signals',m.get('restart_signals'), 'digest',m.get('research_authority_digest'), 'core224_changed',m.get('core224_logic_changed'), 'live_changed',m.get('live_logic_changed'))
          PYTRIGUARD

      - name: Show TRIANGLE1PB research board
        if: always()
        shell: bash
        run: |
          echo "===== TRIANGLE1PB RESEARCH BOARD ====="
          cat reports/triangle1pb/tri_report.txt 2>/dev/null || true
          echo "===== STAGE COUNTS ====="
          cat reports/triangle1pb/tri_stage_counts.csv 2>/dev/null || true
          echo "===== INVARIANT ====="
          cat reports/triangle1pb/tri_invariant_audit.csv 2>/dev/null || true

      - name: Send TRIANGLE1PB research board to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BACKTEST_TOKEN: ${{ secrets.TELEGRAM_BACKTEST_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STOCKHUNTER_CHAT_ID: ${{ secrets.STOCKHUNTER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTRITELEGRAM'
          import csv
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("reports/triangle1pb")
          manifest_path = root / "tri_manifest.json"
          report_path = root / "tri_report.txt"
          signal_path = root / "tri_signal_ledger.csv"

          token = (os.environ.get("TELEGRAM_BACKTEST_TOKEN") or os.environ.get("TELEGRAM_TOKEN") or "").strip()
          chat_id = (os.environ.get("STOCKHUNTER_CHAT_ID") or os.environ.get("TELEGRAM_CHAT_ID") or "").strip()

          token_route = "TELEGRAM_BACKTEST_TOKEN" if os.environ.get("TELEGRAM_BACKTEST_TOKEN", "").strip() else (
              "TELEGRAM_TOKEN" if os.environ.get("TELEGRAM_TOKEN", "").strip() else "MISSING"
          )
          chat_route = "STOCKHUNTER_CHAT_ID" if os.environ.get("STOCKHUNTER_CHAT_ID", "").strip() else (
              "TELEGRAM_CHAT_ID" if os.environ.get("TELEGRAM_CHAT_ID", "").strip() else "MISSING"
          )

          if not token or not chat_id:
              print(
                  "TRIANGLE1PB_TELEGRAM_SKIP",
                  "reason=ROUTE_MISSING",
                  f"token_route={token_route}",
                  f"chat_route={chat_route}",
              )
              raise SystemExit(0)

          lines = [
              "🔬 [TRIANGLE1PB RESEARCH BOARD]",
              "RESEARCH ONLY · 주문 0 · LIVE/점수/랭킹 0 · CORE224 무관",
          ]

          if not manifest_path.exists():
              lines += [
                  "⚠️ 연구 manifest가 생성되지 않았습니다.",
                  "Actions artifact/log를 확인하세요.",
              ]
          else:
              m = json.loads(manifest_path.read_text(encoding="utf-8"))
              stage = m.get("stage_counts") or {}
              gate = m.get("gate_diagnostics") or {}

              lines += [
                  f"📌 strategy={m.get('strategy_id','-')}",
                  f"📅 period={m.get('research_start') or m.get('start_date','-')} ~ {m.get('research_end') or m.get('end_date','-')} · codes={m.get('codes_scanned','-')}",
              ]
              ready_rows = ((m.get("r2_oos_readiness") or {}).get("summary") or [])
              if ready_rows:
                  rd = ready_rows[0]
                  lines += [
                      "",
                      "🛰️ [R2C1 OOS Readiness · 먼저 확인]",
                      (
                          f"data end {rd.get('research_data_end','-')} · prospective start "
                          f"{rd.get('prospective_start_date','-')}"
                      ),
                      (
                          f"producer end {rd.get('expected_current_data_end') or '-'}"
                          f" · handoff fresh {int(rd.get('current_overlay_handoff_fresh',0) or 0)}"
                          f" · lag {rd.get('current_overlay_handoff_lag_days','-')}d"
                      ),
                      (
                          f"as-of {rd.get('latest_asof_snapshot_le_data_end','-')}"
                          f" · age {rd.get('asof_age_to_data_end_calendar_days','-')}d"
                          f" / max {rd.get('asof_max_calendar_age_days','-')}d"
                      ),
                      (
                          f"today candidate {int(rd.get('current_day_candidate_events',0))}"
                          f" · control {int(rd.get('current_day_control_events',0))}"
                          f" | ledger total {int(rd.get('prospective_candidate_events',0))}/"
                          f"{int(rd.get('prospective_control_events',0))}"
                      ),
                      (
                          f"D15 mature {int(rd.get('candidate_d15_mature',0))}/"
                          f"{int(rd.get('control_d15_mature',0))}"
                          f" · retroactive excluded {int(rd.get('retroactive_recomputed_not_admitted',0))}"
                      ),
                      f"status={rd.get('oos_readiness_status','-')}",
                      (
                          "※ READY일 때만 candidate=0을 '신규 event 없음'으로 해석"
                          if rd.get("oos_readiness_status") != "READY_PROSPECTIVE_OOS"
                          else "※ OOS 데이터 준비 완료 · 신규 event만 검증"
                      ),
                  ]
