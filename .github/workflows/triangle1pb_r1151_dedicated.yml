                      "※ healthy lower-low는 미래 taxonomy · wave-high reclaim은 post-hoc 가설",
                      "※ 어떤 anatomy 태그도 실제 HEALTHY/RESTART gate에 미사용",
                  ]

              rra = m.get("restart_reclaim_robustness_audit") or {}
              rr_rows = rra.get("summary") or []
              if rr_rows:
                  def _rr(cat, grp):
                      for x in rr_rows:
                          if x.get("category") == cat and x.get("group") == grp:
                              return x
                      return {}
                  fr = _rr("RESTART_RECLAIM_TEMPORAL","FULL_RECLAIM")
                  fn = _rr("RESTART_RECLAIM_TEMPORAL","FULL_NO_RECLAIM")
                  h1r = _rr("RESTART_RECLAIM_TEMPORAL","H1_EARLY_RECLAIM")
                  h1n = _rr("RESTART_RECLAIM_TEMPORAL","H1_EARLY_NO_RECLAIM")
                  h2r = _rr("RESTART_RECLAIM_TEMPORAL","H2_LATE_RECLAIM")
                  h2n = _rr("RESTART_RECLAIM_TEMPORAL","H2_LATE_NO_RECLAIM")
                  lr = _rr("RESTART_RECLAIM_LOO","RECLAIM")
                  ln = _rr("RESTART_RECLAIM_LOO","NO_RECLAIM")
                  hd = _rr("HEALTHY_BOTTOMING_BY_BREAKOUT_TYPE","DIRECT")
                  hp = _rr("HEALTHY_BOTTOMING_BY_BREAKOUT_TYPE","PROBE_TO_QUALIFIED")
                  lines += [
                      "",
                      "🧪 [Restart Reclaim Robustness · post-hoc]",
                      (
                          f"FULL reclaim {int(fr.get('d15_positive',0))}/{int(fr.get('events',0))}"
                          f" D15 {float(fr.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                          f" vs no {int(fn.get('d15_positive',0))}/{int(fn.get('events',0))}"
                          f" {float(fn.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                      ),
                      (
                          f"H1 D15 {float(h1r.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                          f" vs {float(h1n.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                          f" · H2 {float(h2r.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                          f" vs {float(h2n.get('d15_close_ret_median_pct',0) or 0):+.2f}%"
                      ),
                      (
                          f"LOO median reclaim {float(lr.get('loo_d15_median_min_pct',0) or 0):+.2f}%"
                          f"~{float(lr.get('loo_d15_median_max_pct',0) or 0):+.2f}%"
                          f" · no {float(ln.get('loo_d15_median_min_pct',0) or 0):+.2f}%"
                          f"~{float(ln.get('loo_d15_median_max_pct',0) or 0):+.2f}%"
                      ),
                      (
                          f"HEALTHY lower-low≤5: direct {int(hd.get('lower_low_within5_events',0))}/"
                          f"{int(hd.get('events',0))}"
                          f" · probe {int(hp.get('lower_low_within5_events',0))}/"
                          f"{int(hp.get('events',0))}"
                      ),
                      "※ wave-high reclaim은 같은 표본에서 발견한 post-hoc 가설 · 아직 gate 아님",
                  ]

              r2s = m.get("r2_candidate_prospective_shadow") or {}
              r2rows = r2s.get("summary") or []
              if r2rows:
                  rr = r2rows[0]
                  lines += [
                      "",
                      "🔒 [R2C1 Prospective Shadow · definition frozen]",
                      f"candidate={r2s.get('candidate_id','-')}",
                      (
                          f"freeze {r2s.get('freeze_date','-')} · prospective start "
                          f"{r2s.get('prospective_start_date','-')}"
                      ),
                      (
                          f"discovery/pre-freeze {int(rr.get('discovery_candidate_events',0))} (검증 제외)"
                          f" · prospective {int(rr.get('prospective_candidate_events',0))}"
                      ),
                      (
                          f"mature D5 {int(rr.get('prospective_d5_mature',0))}"
                          f" · D10 {int(rr.get('prospective_d10_mature',0))}"
                          f" · D15 {int(rr.get('prospective_d15_mature',0))}"
                      ),
                      "※ rolling shadow 표시는 감사용 · 공식 OOS membership은 append-only ledger만 사용",
                      "※ candidate 정의 추가튜닝 금지 · 실제 strategy gate 미변경",
                  ]

              r2c = m.get("r2_prospective_control_audit") or {}
              r2c_rows = r2c.get("summary") or []
              if r2c_rows:
                  cr = r2c_rows[0]
                  lines += [
                      "",
                      "🆚 [R2C1 Prospective Control · same-period]",
                      (
                          f"candidate {int(cr.get('candidate_events',0))}"
                          f" · control {int(cr.get('control_events',0))}"
                      ),
                      (
                          f"D15 mature candidate {int(cr.get('candidate_d15_mature',0))}"
                          f" · control {int(cr.get('control_d15_mature',0))}"
                      ),
                      "※ candidate=reclaim restart · control=no-reclaim restart",
                      "※ 공식 candidate/control 비교는 append-only OOS ledger의 최초관측 event만 사용",
                  ]

              amount_cov = m.get("actual_amount_coverage_pct")
              asof_dates = m.get("asof_snapshot_dates")
              lookahead = m.get("lookahead_fail", 0)
              invariant = m.get("invariant_fail", 0)
              rerun = m.get("deterministic_rerun_fail", 0)
              if amount_cov is not None or asof_dates is not None:
                  amount_txt = "-" if amount_cov is None else f"{float(amount_cov):.2f}%"
                  lines += [
                      "",
                      "🛡️ [Authority/Audit]",
                      f"actual Amount coverage {amount_txt} · Close×Volume fallback 0",
                      f"as-of snapshots {asof_dates if asof_dates is not None else '-'} · future fallback 0",
                      f"lookahead {lookahead} · invariant {invariant} · deterministic {rerun}",
                  ]

              # If future research produces accepted restart signals, include a small
              # research-only preview without converting them into orders/recommendations.
              signal_rows = []
              if signal_path.exists() and signal_path.stat().st_size > 0:
                  try:
                      with signal_path.open(encoding="utf-8-sig", newline="") as f:
                          signal_rows = list(csv.DictReader(f))
                  except Exception:
                      signal_rows = []
              if signal_rows:
                  lines += ["", "🧪 [RESTART 연구표본 · 매수추천 아님]"]
                  for r in signal_rows[:5]:
                      code = r.get("code") or r.get("ticker") or "-"
                      date = r.get("event_date") or r.get("signal_date") or "-"
                      lines.append(f"• {code} · {date}")
                  if len(signal_rows) > 5:
                      lines.append(f"외 {len(signal_rows)-5}건")

          if report_path.exists():
              try:
                  report = report_path.read_text(encoding="utf-8", errors="replace")
                  next_gate = next(
                      (x.split("=",1)[1].strip() for x in report.splitlines() if x.startswith("NEXT_GATE=")),
                      "",
                  )
                  if next_gate:
                      lines += ["", f"➡️ NEXT: {next_gate}"]
              except Exception:
                  pass

          def _split_telegram_parts(src_lines, max_body_chars=3400):
              """Split on section boundaries and never silently truncate."""
              sections = []
              current = []
              for raw_line in src_lines:
                  line = str(raw_line)
                  if line == "":
                      if current:
                          sections.append(current)
                          current = []
                      continue
                  current.append(line)
              if current:
                  sections.append(current)

              normalized = []
              for sec in sections:
                  sec_text = "\n".join(sec)
                  if len(sec_text) <= max_body_chars:
                      normalized.append(sec)
                      continue

                  chunk = []
                  chunk_len = 0
                  for line in sec:
                      pieces = [line[i:i + max_body_chars] for i in range(0, len(line), max_body_chars)] or [""]
                      for piece in pieces:
                          add_len = len(piece) + (1 if chunk else 0)
                          if chunk and chunk_len + add_len > max_body_chars:
                              normalized.append(chunk)
                              chunk = []
                              chunk_len = 0
                          chunk.append(piece)
                          chunk_len += len(piece) + (1 if len(chunk) > 1 else 0)
                  if chunk:
                      normalized.append(chunk)

              parts = []
              current_sections = []
              current_len = 0
              for sec in normalized:
                  sec_text = "\n".join(sec)
                  add_len = len(sec_text) + (2 if current_sections else 0)
                  if current_sections and current_len + add_len > max_body_chars:
                      parts.append("\n\n".join(current_sections))
                      current_sections = []
                      current_len = 0
                  current_sections.append(sec_text)
                  current_len += len(sec_text) + (2 if len(current_sections) > 1 else 0)
              if current_sections:
                  parts.append("\n\n".join(current_sections))
              return [p for p in parts if p.strip()]


          parts = _split_telegram_parts(lines, max_body_chars=3400)
          assert parts, "TRIANGLE1PB_TELEGRAM_SPLIT_EMPTY"
          assert all(len(p) <= 3400 for p in parts), [
              ("PART_TOO_LONG", i + 1, len(p)) for i, p in enumerate(parts) if len(p) > 3400
          ]

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          sent_ids = []
          total_parts = len(parts)

          for part_idx, body in enumerate(parts, start=1):
              prefix = f"📨 [TRIANGLE1PB {part_idx}/{total_parts}]\n"
              message = prefix + body
              assert len(message) < 3900, ("TELEGRAM_PART_LIMIT_GUARD", part_idx, len(message))

              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(url, data=payload, method="POST")

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                      status = int(getattr(resp, "status", 200))
              except Exception as exc:
                  print(
                      "TRIANGLE1PB_TELEGRAM_SEND_FAIL",
                      f"part={part_idx}/{total_parts}",
                      f"sent_parts={len(sent_ids)}",
                      f"token_route={token_route}",
                      f"chat_route={chat_route}",
                      f"error={type(exc).__name__}:{str(exc)[:500]}",
                  )
                  raise

              data = json.loads(raw)
              assert status == 200 and bool(data.get("ok")), (
                  "TELEGRAM_API_NOT_OK", part_idx, total_parts, status, raw[:1000]
              )
              msg_id = ((data.get("result") or {}).get("message_id"))
              sent_ids.append(msg_id)
              print(
                  "TRIANGLE1PB_TELEGRAM_SEND",
                  "status=PASS",
                  f"part={part_idx}/{total_parts}",
                  f"token_route={token_route}",
                  f"chat_route={chat_route}",
                  f"message_id={msg_id}",
                  f"chars={len(message)}",
                  "truncated=0",
                  "closebet_route_used=0",
              )

          assert len(sent_ids) == total_parts, (
              "TRIANGLE1PB_TELEGRAM_MULTIPART_INCOMPLETE", len(sent_ids), total_parts
          )
          print(
              "TRIANGLE1PB_TELEGRAM_MULTIPART_COMPLETE",
              f"parts={total_parts}",
              f"message_ids={','.join(str(x) for x in sent_ids)}",
              "truncated=0",
          )
          PYTRITELEGRAM

      - name: Save TRIANGLE1PB append-only OOS ledger
        if: success() && hashFiles('reports/.cache/triangle1pb_r2_oos_ledger/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/.cache/triangle1pb_r2_oos_ledger
          key: stockhunter-triangle1pb-r2-oos-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload TRIANGLE1PB research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triangle1pb-r1-chronology-research-${{ github.run_number }}
          path: reports/triangle1pb/**
          if-no-files-found: warn
          retention-days: 30
