name: CORE224 R3 Env Scope Complete YAML Builder (NO PUSH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified replacement YAML (without modifying repo)
        shell: bash
        run: |
          set -euo pipefail
          test -f core224_live_date_selector_r3.py
          python -u core224_r3_env_scope_fix.py --src .github/workflows/run_scanner.yml --dst reports/core224_r3_fix/run_scanner.yml
          python - <<'PY'
          from pathlib import Path
          s=Path('reports/core224_r3_fix/run_scanner.yml').read_text()
          a=s.index('          echo "CORE224_R3_PATCH_MAIN_PREPARE')
          b=s.index('          echo "V25_CURRENT_LIVE_SEED_LOADER_PREFLIGHT_BEGIN"',a)
          fragment=s[a:b]
          assert fragment.index('python -u core224_live_date_selector_r3.py --patch-main "$SCRIPT"') < fragment.index('          env \\\n')
          assert fragment.index('V23_MATERIALIZED_DIR=reports/v25_live_seed_build/v23_materialized') < fragment.index('python -u "$SCRIPT"')
          print('CORE224_R3_ENV_SCOPE_VALIDATED: env belongs to main replay, not patcher')
          PY
      - name: Upload complete replacement YAML
        uses: actions/upload-artifact@v4
        with:
          name: CORE224_R3_ENV_SCOPE_FIXED_RUN_SCANNER
          path: reports/core224_r3_fix/run_scanner.yml
          if-no-files-found: error
          retention-days: 14
