name: Closing Bet Dynamic Exit OOS R1.0.9.1

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "35295676895"
        type: string
      r102_run_id:
        required: true
        default: "35308434562"
        type: string
      r1081_run_id:
        required: true
        default: "35344611619"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
      R102_HISTORY_WORKERS: "6"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pykrx finance-datareader

      - name: Download research inputs
        run: |
          mkdir -p source_artifacts r1081_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
          gh run download "${{ inputs.r1081_run_id }}" -D r1081_artifacts

      - name: Restore R1.0.2 causal OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/closebet_structure_env_oos_r102
          key: closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-${{ inputs.r102_run_id }}
          restore-keys: |
            closebet-oos-r102-history-${{ github.ref_name }}-${{ inputs.source_run_id }}-

      - name: Rebuild causal OHLCV only if cache absent
        run: |
          set -euo pipefail
          if [ ! -s .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv ]; then
            python -u closing_bet_structure_env_oos_r102_causal_history.py \
              --source-root source_artifacts \
              --discovery-end "2026-08-18" \
              --oos-start "2026-08-19" \
              --oos-end "2026-09-18"
          else
            echo "R102 causal OHLCV cache restored"
          fi

      - name: Run Dynamic Exit OOS R1.0.9.1
        run: |
          python -u closing_bet_dynamic_exit_oos_r109.py \
            --r1081-root r1081_artifacts \
            --history-cache .cache/closebet_structure_env_oos_r102/v49_76_research_raw_history.csv \
            --output-dir reports/closebet_dynamic_exit_oos_r109

      - name: Validate R1.0.9.1 invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_dynamic_exit_oos_r109/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert m['same_d20_mature_cohort']
          assert m['policy_thresholds_predeclared']
          assert not m['hindsight_best_policy_promotion']
          assert int(m['evaluated_events'])>0
          print('R1091_DYNAMIC_EXIT PASS',m['evaluated_events'],m['ledger_rows'])
          PY

      - name: Upload R1.0.9.1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-dynamic-exit-r109-${{ github.run_id }}
          path: reports/closebet_dynamic_exit_oos_r109/**
          if-no-files-found: warn
          retention-days: 30
