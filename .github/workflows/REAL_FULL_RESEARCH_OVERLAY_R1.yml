name: REAL_FULL Research Overlay R1
on:
  workflow_dispatch:
    inputs:
      real_full_run_id:
        description: "REAL_FULL production run ID to review"
        required: true
        type: string
      freeze_run_id:
        description: "Frozen Watermelon/Long-MA OOS registry run"
        required: true
        default: "35829764818"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pandas numpy requests finance-datareader
      - name: Resolve source + frozen registry
        env:
          GH_TOKEN: ${{ github.token }}
          REAL_FULL_RUN_ID: ${{ inputs.real_full_run_id }}
          FREEZE_RUN_ID: ${{ inputs.freeze_run_id }}
        run: |
          set -euo pipefail
          mkdir -p source_prod source_freeze
          python - <<'PY'
          import io,os,requests,zipfile,pathlib,json
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f'https://api.github.com/repos/{repo}'
          def artifacts(rid):
              return requests.get(f'{base}/actions/runs/{rid}/artifacts?per_page=100',headers=h,timeout=60).json().get('artifacts',[])
          def dl(a,dst):
              raw=requests.get(f"{base}/actions/artifacts/{a['id']}/zip",headers=h,timeout=60,allow_redirects=True);raw.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(raw.content)) as z:z.extractall(dst)
          # Production run: download artifacts until canonical source is found.
          found=None
          for a in artifacts(os.environ['REAL_FULL_RUN_ID']):
              if a.get('expired'):continue
              td=pathlib.Path('source_prod')/str(a['id']);td.mkdir(parents=True,exist_ok=True)
              try: dl(a,td)
              except Exception: continue
              hits=list(td.rglob('real_full_trust_source.csv'))
              if hits:
                  found=hits[0];break
          if not found: raise SystemExit('REAL_FULL_TRUST_SOURCE_NOT_FOUND_IN_RUN_ARTIFACTS')
          pathlib.Path('source_prod_path.txt').write_text(str(found),encoding='utf-8')
          # Frozen registry.
          fa=next((x for x in artifacts(os.environ['FREEZE_RUN_ID']) if not x.get('expired') and x['name'].startswith('real-full-watermelon-longma-oos-freeze-r1-')),None)
          if not fa:raise SystemExit('FREEZE_ARTIFACT_NOT_FOUND')
          dl(fa,'source_freeze')
          regs=list(pathlib.Path('source_freeze').rglob('FROZEN_watermelon_longma_signature_registry.csv'))
          if not regs:raise SystemExit('FROZEN_REGISTRY_NOT_FOUND')
          pathlib.Path('registry_path.txt').write_text(str(regs[0]),encoding='utf-8')
          PY
      - name: Build simple research overlay
        run: |
          python -m py_compile real_full_research_overlay_r1.py
          SOURCE="$(cat source_prod_path.txt)"
          REG="$(cat registry_path.txt)"
          python -u real_full_research_overlay_r1.py --source "$SOURCE" --registry "$REG"
      - name: Verify no production authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/real_full_research_overlay_r1/real_full_research_overlay_meta.json').read_text())
          assert d['research_only'] is True
          assert not d['production_search_changed']
          assert not d['production_score_changed']
          assert not d['production_rank_changed']
          assert not d['production_order_changed']
          assert not d['same_sample_retuning']
          print('REAL_FULL_RESEARCH_OVERLAY_R1_INVARIANTS PASS')
          PY
      - name: Show simple overlay
        run: cat reports/real_full_research_overlay_r1/real_full_research_overlay.txt
      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: real-full-research-overlay-r1-${{ github.run_id }}
          path: reports/real_full_research_overlay_r1/**
          retention-days: 30
