name: Closing Bet v49.76 Live Shadow Board R1.6.1

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: v49.76 source run for rendering test
        required: false
        default: "35295676895"
      r14_run_id:
        description: Frozen C/B1/B2/I Response Map run
        required: true
        default: "35445479856"
      r16_a_run_id:
        description: Frozen A Pattern Response Map R1.6 run
        required: true
        default: "35469509910"
      top_n:
        description: Preserve source order and display first N
        required: true
        default: "10"
      send_telegram:
        description: Manual observer Telegram test
        required: true
        type: boolean
        default: false

  workflow_run:
    workflows:
      - "closing-bet-v49.76.6.7.3.2.5.1.2.1-final-universe-source-recovery"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      CLOSING_BET_TOKEN: ${{ secrets.CLOSING_BET_TOKEN }}
      CLOSING_BET_CHAT_ID: ${{ secrets.CLOSING_BET_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Resolve source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.source_run_id }}" ]; then
            RID="${{ inputs.source_run_id }}"
          else
            RID="$(gh run list --workflow v49.76.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download source and references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_run source_r14 source_r16_a
          gh run download "${{ steps.source.outputs.run_id }}" -D source_run
          gh run download "${{ inputs.r14_run_id }}" -D source_r14
          gh run download "${{ inputs.r16_a_run_id }}" -D source_r16_a

      - name: Build R1.6.1 Live Shadow Board
        shell: bash
        run: |
          set -euo pipefail
          SEND=""
          if [ "${{ github.event_name }}" != "workflow_run" ] && [ "${{ inputs.send_telegram }}" = "true" ]; then
            SEND="--send-telegram"
          fi
          python -u closing_bet_live_shadow_board_r161.py \
            --source-root source_run \
            --r14-root source_r14 \
            --r16-a-root source_r16_a \
            --output-dir reports/live_shadow_board_r161 \
            --top-n "${{ inputs.top_n }}" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --r14-run-id "${{ inputs.r14_run_id }}" \
            --r16-a-run-id "${{ inputs.r16_a_run_id }}" \
            $SEND

      - name: Validate R1.6.1 observer invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/live_shadow_board_r161/meta.json',encoding='utf-8'))
          assert m['research_only']
          assert not m.get('production_changed',False)
          assert not m.get('production_logic_changed',False)
          assert not m.get('score_rank_changed',False)
          assert not m.get('candidate_filter_created',False)
          if m['status']=='PASS':
              assert m['a_pattern_response_map_integrated']
              assert m['a_reference_only_from_r16']
              assert not m['candidate_membership_changed']
              assert not m['candidate_order_changed']
              assert not m['order_logic_changed']
              assert not m['aggregate_route_score_created']
              assert not m['aggregate_route_classification_created']
              assert m['feature_level_route_proximity_only']
              assert m['route_proximity_min_n']==3
              assert m['route_proximity_low_confidence_below_n']==10
              assert m['small_sample_route_excluded_from_proximity']
              assert not m['atr_used_in_response_map']
              assert not m['same_sample_tuning']
              assert not m['new_threshold_optimization']
              print('LIVE_SHADOW_R161 PASS',m['rows'],m['source'])
          else:
              print('LIVE_SHADOW_R161 NON-CANDIDATE',m['status'],m.get('source_lane',''))
          PY

      - name: Upload R1.6.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r161-${{ github.run_id }}
          path: reports/live_shadow_board_r161/**
          if-no-files-found: warn
          retention-days: 30
