name: Stock-Hunter R26 Big30 Preservation and Left-Tail Loss Guards Research Only

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r26_tail_loss_guards_research_only.yml'
      - 'research_projects/trendline_true55_r26_tail_guard_20261123/**'
  workflow_dispatch:
    inputs:
      confirm_frozen_kis_research_only:
        description: 'Only fixed BLUE run 44988188271; R19 149, R25 40/20/17; no LIVE or orders'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  r26-offline-tests:
    name: R26 causal next-open tail-loss and first big30 timing synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Run no-lookahead, gap, and paired tail-loss tests
        run: python -m unittest discover -s research_projects/trendline_true55_r26_tail_guard_20261123 -p 'test_r26*.py' -v

  r26-manual-fixed-replay:
    name: Pinned KIS => R19 149 => R20/21/22/24/25 => R26 tail versus big30
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_frozen_kis_research_only == true
    needs: r26-offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Download pinned BLUE KIS only, never request KIS tokens
        uses: actions/download-artifact@v4
        with:
          name: BLUE_STOCKHUNTER_R16_KIS_30_44988188271
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 44988188271
          github-token: ${{ github.token }}
          path: reports/r26_source
      - name: Verify KIS raw source hash and reconstruct R16 R17
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r17_failure_exit.py \
            --repo . --artifact reports/r26_source \
            --r16-out reports/r26_r16 --out reports/r26_r17 --phase all
      - name: Rebuild unchanged R19 true55 149 original entries
        run: |
          python research_projects/trendline_true55_r19_20261122/r19_true55_transfer.py \
            --repo . --r16-out reports/r26_r16 \
            --r17-out reports/r26_r17 --out reports/r26_r19
      - name: Rebuild unchanged R20 MA5 and MA20 exits
        run: |
          python research_projects/trendline_true55_r20_ma_exit_20261123/r20_ma_exit.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --out reports/r26_r20
      - name: Rebuild unchanged R21 phased exits
        run: |
          python research_projects/trendline_true55_r21_phase_exit_20261123/r21_phase_exit.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --r20-ma-out reports/r26_r20 --out reports/r26_r21
      - name: Rebuild unchanged R22 frozen55 level exits
        run: |
          python research_projects/trendline_true55_r22_level_reclaim_20261123/r22_level_reclaim.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --r20-ma-out reports/r26_r20 \
            --r21-out reports/r26_r21 --out reports/r26_r22
      - name: Rebuild unchanged R24 train-only loss-warning benchmark
        run: |
          python research_projects/trendline_true55_r24_entry_risk_20261123/r24_entry_risk.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --r20-ma-out reports/r26_r20 --out reports/r26_r24
      - name: Rebuild unchanged R25 D0 big30 selection and causal exit baselines
        run: |
          python research_projects/trendline_true55_r25_big30_20261123/r25_big30.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --r20-out reports/r26_r20 --r22-out reports/r26_r22 \
            --r24-out reports/r26_r24 --out reports/r26_r25
      - name: Run R26 30pct-exit and predeclared tail guards event paired audit
        run: |
          python research_projects/trendline_true55_r26_tail_guard_20261123/r26_tail_guard.py \
            --r16-out reports/r26_r16 --r19-out reports/r26_r19 \
            --r25-out reports/r26_r25 --out reports/r26_guard
      - name: Upload derived reports only, no raw OHLCV or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R26_BIG30_PRESERVATION_TAIL_LOSS_GUARDS_RESEARCH_ONLY
          path: |
            reports/r26_r16/R16_SOURCE_MANIFEST.json
            reports/r26_r19/R19_TRUE55_TRANSFER_SUMMARY.json
            reports/r26_r25/R25_BIG30_RESEARCH_SUMMARY.json
            reports/r26_guard/R26_LEFT_TAIL_GUARD_SUMMARY.json
            reports/r26_guard/R26_FIXED149_PAIRED_GUARD_EVENTS.json
          if-no-files-found: warn
          retention-days: 30
