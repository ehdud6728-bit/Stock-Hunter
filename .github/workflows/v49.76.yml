    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pandas numpy requests finance-datareader beautifulsoup4 lxml pytz python-dateutil openpyxl gspread google-auth
          if [ -n "${PYKRX_VERSION:-}" ]; then
            echo "Installing pinned pykrx==${PYKRX_VERSION}"
            pip install "pykrx==${PYKRX_VERSION}"
          else
            echo "Installing latest pykrx"
            pip install pykrx
          fi
          python - <<'FDR_CHECK'
          import FinanceDataReader as fdr
          import gspread
          from google.oauth2.service_account import Credentials
          print("FinanceDataReader import OK")
          print("gspread/google-auth import OK")
          FDR_CHECK
          python - <<'PYKRX_CHECK'
          import os
          def state(name):
              v = str(os.environ.get(name, '') or '').strip()
              return 'SET' if v else 'EMPTY'
          print('KRX_ENV_ALIAS_STATE =', {
              'KRX_DATA_ID': state('KRX_DATA_ID'),
              'KRX_ID': state('KRX_ID'),
              'KRX_USER_ID': state('KRX_USER_ID'),
              'KRX_DATA_PW': state('KRX_DATA_PW'),
              'KRX_PW': state('KRX_PW'),
              'KRX_PASSWORD': state('KRX_PASSWORD'),
              'PYKRX_VERSION': os.environ.get('PYKRX_VERSION', '') or 'latest',
          })
          try:
              from pykrx import stock as pykrx_stock
              print('pykrx import OK')
          except BaseException as e:
              print(f'⚠️ pykrx import warning: {type(e).__name__}: {e}')
              print('Continue with scanner fallback / degraded data mode.')
          PYKRX_CHECK

      - name: Prepare KRX flow cache directory
        run: mkdir -p closing_bet_logs

      - name: Restore KRX flow cache only
        uses: actions/cache@v4
        with:
          path: closing_bet_logs/i_core_krx_flow_cache.csv
          key: krx-flow-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            krx-flow-cache-${{ github.ref_name }}-
            krx-flow-cache-


      - name: Restore v49.76 Universe snapshots and multi-context Lifecycle caches
        uses: actions/cache@v4
        with:
          path: |
            closing_bet_logs/v49_76_universe_snapshots
            closing_bet_logs/v49_76_lifecycle_cache
            closing_bet_logs/v49_76_strategy_eval_cache
            closing_bet_logs/v49_76_fast_final
          # Run-specific save key + stable restore prefix: each successful run carries forward all
          # snapshot/context subdirectories, while Python validates exact keys and SHA-256 values.
          key: v49-76-research-contexts-${{ runner.os }}-${{ github.ref_name }}-engine2-${{ github.run_id }}
          restore-keys: |
            v49-76-research-contexts-${{ runner.os }}-${{ github.ref_name }}-engine2-
            v49-76-research-contexts-${{ runner.os }}-${{ github.ref_name }}-

      - name: Verify Telegram route for Closing Bet (unified v49.76.6.7.3.2)
        run: |
          python v49_76_telegram_route.py --send "${{ inputs.send_telegram || 'true' }}" --json-output reports/v49_76_telegram_route_run.json

      - name: Show v4.4.9.53.8.49.76.6.7.3 files
        run: |
          echo "Python file check"
          ls -la Closing_bet_scanner_v2.py
          python -m py_compile Closing_bet_scanner_v2.py v49.76.2.py

      - name: Decide v4.4.9.53.8.49.76.6.7.3 run mode
        shell: bash
        run: |
          ACTION_RAW="${{ inputs.action_mode || '' }}"
          ACTION="${ACTION_RAW%%__*}"
          RUN_MODE="main"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "03 06 * * 1-5" ]; then
            RUN_MODE="pre_final"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "40 06 * * 1-5" ]; then
            RUN_MODE="after_final_fast"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "00 07 * * 1-5" ]; then
            RUN_MODE="after_final_full"
          fi

          if [ "$ACTION" = "pre_final" ]; then
            RUN_MODE="pre_final"
          fi
          if [ "$ACTION" = "after_final" ] || [ "$ACTION" = "final_kick" ]; then
            RUN_MODE="after_final"
          fi

          if [ "$RUN_MODE" = "after_final" ] || [ "$RUN_MODE" = "after_final_fast" ] || [ "$RUN_MODE" = "after_final_full" ]; then
            echo "CLOSING_BET_RUN_MODE=after_final" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FAST_ENABLE=1" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FULL_PARITY_AUDIT=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_FINAL_KICK_ONLY=1" >> "$GITHUB_ENV"
            echo "CLOSING_BET_MAX_FINAL_KICK_CARDS=2" >> "$GITHUB_ENV"
            echo "CLOSING_BET_WORKER_MODE=1" >> "$GITHUB_ENV"
            echo "CLOSING_BET_SHOW_RISK_DETAILS=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_SHOW_LEGACY_SECTIONS=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_SHOW_C_DIAG=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_SHOW_H_DIAG=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_TELEGRAM_MAX_LEN=3000" >> "$GITHUB_ENV"
            echo "CLOSING_BET_FINAL_KICK_COMPACT=1" >> "$GITHUB_ENV"
          elif [ "$RUN_MODE" = "pre_final" ]; then
            echo "CLOSING_BET_RUN_MODE=pre_final" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FAST_ENABLE=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FULL_PARITY_AUDIT=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_FINAL_KICK_ONLY=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_MAX_FINAL_KICK_CARDS=2" >> "$GITHUB_ENV"
            echo "CLOSING_BET_TELEGRAM_MAX_LEN=3000" >> "$GITHUB_ENV"
          else
            echo "CLOSING_BET_RUN_MODE=main" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FAST_ENABLE=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_V497667_FULL_PARITY_AUDIT=0" >> "$GITHUB_ENV"
            echo "CLOSING_BET_FINAL_KICK_ONLY=0" >> "$GITHUB_ENV"
          fi

          echo "RUN_MODE=$RUN_MODE"

      - name: Run v4.4.9.53.8.49.76.6.7.3.2 scanner/backtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p closing_bet_logs

          ACTION_RAW="${{ inputs.action_mode || '' }}"
          ACTION="${ACTION_RAW%%__*}"
          STRATEGY_RAW="${{ inputs.strategy_only || 'none__전체/일반실행' }}"
          STRATEGY="${STRATEGY_RAW%%__*}"

          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FLAGS="$FLAGS --force"
          else
            FLAGS="$FLAGS --force"
          fi

          STRAT_FLAGS=""
          case "$STRATEGY" in
            none) STRAT_FLAGS="" ;;
            i_core) STRAT_FLAGS="--backtest-i-core-only" ;;
            leader_gap) STRAT_FLAGS="--backtest-leader-gap-only" ;;
            h_watch) STRAT_FLAGS="--backtest-h-watch-only" ;;
            h) STRAT_FLAGS="--backtest-h-only" ;;
            g) STRAT_FLAGS="--backtest-g-only" ;;
            c_pullback) STRAT_FLAGS="--backtest-c-pullback-only" ;;
            c_strict) STRAT_FLAGS="--backtest-c-strict-only" ;;
            c_swing) STRAT_FLAGS="--backtest-c-swing-only" ;;
            c) STRAT_FLAGS="--backtest-c-only" ;;
            safe) STRAT_FLAGS="--backtest-safe-only" ;;
            neutral) STRAT_FLAGS="--backtest-neutral-only" ;;
            risk) STRAT_FLAGS="--backtest-risk-only" ;;
            core) STRAT_FLAGS="--backtest-core-only" ;;
            *) STRAT_FLAGS="" ;;
          esac

          # v49.76.6.7.3.2 queued 15:40/16:00 recovery classifier.
          # 0 = already DELIVERED -> no-op; 10 = frozen strategy exists -> gate-only retry; 20 = no valid frozen strategy -> FINAL authority build.
          SKIP_PRODUCTION=0
          GATE_ONLY_RECOVERY=0
          IS_RECOVERY_SCHEDULE=0
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "40 06 * * 1-5" ] || [ "${{ github.event.schedule }}" = "00 07 * * 1-5" ]; }; then
            IS_RECOVERY_SCHEDULE=1
          fi
          if [ "$IS_RECOVERY_SCHEDULE" = "1" ]; then
            if [ "${{ github.event.schedule }}" = "40 06 * * 1-5" ]; then
              FALLBACK_EPOCH="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 15:52:00" +%s)"
              NOW_EPOCH="$(date +%s)"
              if [ "$NOW_EPOCH" -lt "$FALLBACK_EPOCH" ]; then sleep $((FALLBACK_EPOCH-NOW_EPOCH)); fi
            fi
            echo "AFTER FINAL recovery precheck · $(TZ=Asia/Seoul date '+%F %T KST')"
            set +e
            python -c "import sys; import Closing_bet_scanner_v2 as m; day=m._now_kst().strftime('%Y-%m-%d'); row,state=m._v49765_load_evidence(day); ok,meta=m._v4976732_frozen_strategy_available(day); print(f'V4976732_RECOVERY_PRECHECK evidence={bool(row)} evidence_state={state} frozen_strategy={ok} meta={meta} day={day}'); sys.exit(0 if row is not None else (10 if ok else 20))"
            PRECHECK_RC=$?
            set -e
            if [ "$PRECHECK_RC" -eq 0 ]; then
              SKIP_PRODUCTION=1
              echo "Already DELIVERED/evidence locked · recovery no-op"
            elif [ "$PRECHECK_RC" -eq 10 ]; then
              GATE_ONLY_RECOVERY=1
              echo "Frozen FINAL strategy available · gate-only recovery selected"
            else
              echo "No valid frozen FINAL strategy · FAST-or-TRUE-FULL authority build selected"
            fi
          fi

          if [ "$GATE_ONLY_RECOVERY" = "1" ]; then
            python -c "import Closing_bet_scanner_v2 as m; day=m._now_kst().strftime('%Y-%m-%d'); print('GATE_ONLY_RESULT', m._v4976732_gate_only_recovery(day))"
          elif [ "$SKIP_PRODUCTION" = "1" ]; then
            echo "v49.76.6.7.3.2 recovery: production already delivered"
          elif [ "$ACTION" = "research_five_axis" ]; then
            # v6.6 immutable discovery rerun. User-supplied dates are intentionally ignored for this research authority.
            # The discovery sample is permanently frozen at 2025-02-17..2026-08-17.
            BT_FLAGS="--backtest-start 2025-02-17 --backtest-end 2026-08-17 --backtest-hold-days ${{ inputs.hold_days || '60' }} --backtest-min-eval-days ${{ inputs.backtest_min_eval_days || '3' }} --backtest-top-per-strategy 5 --backtest-all-candidates --backtest-debug --backtest-five-axis-only"
            if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then
              BT_FLAGS="$BT_FLAGS --send-backtest-summary"
            fi
            echo "RUN v49.76.6.7.3.2 FROZEN RESEARCH + PROSPECTIVE LOCK: python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS"
            python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS
          elif [ "$ACTION" = "research_prospective" ]; then
            # v49.76.6.7.3.2 forward-only lock. DART proxy is rejected and disabled for this daily prospective path.
            TODAY_KST="$(TZ=Asia/Seoul date +%F)"
            BT_FLAGS="--backtest-start 2025-02-17 --backtest-end $TODAY_KST --backtest-hold-days 60 --backtest-min-eval-days 0 --backtest-top-per-strategy 5 --backtest-all-candidates --backtest-debug --backtest-five-axis-only --prospective-lock-only"
            if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then BT_FLAGS="$BT_FLAGS --send-backtest-summary"; fi
            echo "RUN v49.76.6.7.3.2 PROSPECTIVE LOCK: python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS"
            CLOSING_BET_V497660_DART_ENABLE=0 python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS
          elif [ "$ACTION" = "backtest" ]; then
            BT_FLAGS="--backtest-hold-days ${{ inputs.hold_days || '60' }} --backtest-min-eval-days ${{ inputs.backtest_min_eval_days || '3' }} --backtest-top-per-strategy 5 $STRAT_FLAGS"
            if [ -n "${{ inputs.backtest_start || '' }}" ] || [ -n "${{ inputs.backtest_end || '' }}" ]; then
              [ -n "${{ inputs.backtest_start || '' }}" ] && BT_FLAGS="$BT_FLAGS --backtest-start ${{ inputs.backtest_start }}"
              [ -n "${{ inputs.backtest_end || '' }}" ] && BT_FLAGS="$BT_FLAGS --backtest-end ${{ inputs.backtest_end }}"
            else
              BT_FLAGS="$BT_FLAGS --backtest-months ${{ inputs.backtest_months || '18' }}"
            fi
            if [ "${{ inputs.all_candidates || 'true' }}" = "true" ]; then
              BT_FLAGS="$BT_FLAGS --backtest-all-candidates"
            fi
            if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then
              BT_FLAGS="$BT_FLAGS --send-backtest-summary"
            fi
            echo "RUN v4.4.9.53.8.49.76.6.7.3: python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS --compact-summary"
            python Closing_bet_scanner_v2.py $BT_FLAGS $FLAGS --compact-summary
          elif [ "$ACTION" = "eval" ]; then
            EXTRA="--eval-pending"
            if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then EXTRA="$EXTRA --send-summary"; fi
            python Closing_bet_scanner_v2.py $EXTRA $FLAGS --compact-summary
          elif [ "$ACTION" = "summary" ]; then
            EXTRA="--summary"
            if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then EXTRA="$EXTRA --send-summary"; fi
            python Closing_bet_scanner_v2.py $EXTRA $FLAGS --compact-summary
          elif [ "$ACTION" = "pre_final" ] || [ "$ACTION" = "after_final" ] || [ "$ACTION" = "final_kick" ]; then
            python Closing_bet_scanner_v2.py $FLAGS --compact-summary
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "03 06 * * 1-5" ]; then
            # v6.7.3.2: ONE Python process owns canonical cache -> PRE-FINAL -> frozen AFTER FINAL.
            CLOSING_BET_V497672_CONTINUOUS_PRIMARY=1 python Closing_bet_scanner_v2.py $FLAGS --compact-summary --continuous-after-final
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "40 06 * * 1-5" ]; then
            # Serialized recovery. FAST is attempted first; missing/invalid PRE-FINAL cache automatically falls through to TRUE FULL FINAL rebuild.
            CLOSING_BET_V497667_FAST_ENABLE=1 CLOSING_BET_V497667_FULL_PARITY_AUDIT=0 CLOSING_BET_V4976732_FULL_REBUILD_ENABLE=1 python Closing_bet_scanner_v2.py $FLAGS --compact-summary
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "40 05 * * 1-5" ]; then
            # 14:40 observation cannot drift into or compete with the 15:03 authority lane.
            DEADLINE_EPOCH="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 15:02:30" +%s)"
            NOW_EPOCH="$(date +%s)"
            if [ "$NOW_EPOCH" -ge "$DEADLINE_EPOCH" ]; then
              echo "14:40 observation skipped: 15:02:30 authority boundary already passed"
            else
              LEFT=$((DEADLINE_EPOCH-NOW_EPOCH))
              set +e
              timeout --signal=TERM "${LEFT}s" python Closing_bet_scanner_v2.py $FLAGS --compact-summary
              RC=$?
              set -e
              if [ "$RC" -eq 124 ] || [ "$RC" -eq 143 ]; then
                echo "::warning::14:40 observation stopped at 15:02:30 boundary; 15:03 authority lane protected"
              elif [ "$RC" -ne 0 ]; then
                exit "$RC"
              fi
            fi
          else
            python Closing_bet_scanner_v2.py $FLAGS --compact-summary
          fi

          # 15:40 primary + 16:00 recovery: production run above remains authoritative; prospective capture is research-only.
          # Both attempts use the same prospective_id/session_id, so the second run is idempotent and appends nothing when the first succeeded.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "40 06 * * 1-5" ] || [ "${{ github.event.schedule }}" = "00 07 * * 1-5" ]; }; then
            TODAY_KST="$(TZ=Asia/Seoul date +%F)"
            echo "CHECK v49.76.6.7.3.2 prospective production-validity gate · $TODAY_KST"
            set +e
            python -c "import sys; import Closing_bet_scanner_v2 as m; ok,meta=m._v497673_prospective_session_validity('$TODAY_KST'); print('PROSPECTIVE_VALIDITY',ok,meta); sys.exit(0 if ok else 3)"
            PVALID=$?
            set -e
            if [ "$PVALID" -eq 0 ]; then
              echo "RUN v49.76.6.7.3.2 AUTOMATIC PROSPECTIVE LOCK · production-valid session"
              CLOSING_BET_V497660_DART_ENABLE=0 python Closing_bet_scanner_v2.py --backtest-start 2025-02-17 --backtest-end "$TODAY_KST" --backtest-hold-days 60 --backtest-min-eval-days 0 --backtest-top-per-strategy 5 --backtest-all-candidates --backtest-debug --backtest-five-axis-only --prospective-lock-only --force || echo "::warning::v49.76.6.7.3.2 prospective capture failed; production authority unaffected"
            else
              echo "::warning::v49.76.6.7.3.2 prospective session skipped: production AFTER FINAL authority invalid/incomplete"
            fi
          fi

      - name: Upload v49.76.6.7.3.2 complete research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v49.76.6.7.3.2-research-reports-${{ github.run_number }}
          path: |
            reports/
            closing_bet_logs/five_axis/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6

  prepare_backtest:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.action_mode, 'backtest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
