      - name: Verify Telegram route for Closing Bet merge (unified v49.76.6.7.3.2)
        run: |
          python v49_76_telegram_route.py --send "${{ inputs.send_telegram || 'true' }}" --json-output reports/v49_76_telegram_route_merge.json
      - name: Merge global population and build final performance report
        shell: bash
        run: |
          set -euo pipefail
          SEND=""
          if [ "${{ inputs.send_telegram || 'true' }}" = "true" ]; then SEND="--send-telegram"; fi
          BASELINE=""
          BASELINE_SNAPSHOT=""
          LEGACY_V4974_SNAPSHOT=""
          if [ -s .v49_76_input_baseline/v49_76_input_authority_manifest.json ]; then
            BASELINE="--baseline-input-authority .v49_76_input_baseline/v49_76_input_authority_manifest.json"
          fi
          if [ -s .v49_76_input_baseline/v49_76_prepared_authority_snapshot.csv ]; then
            BASELINE_SNAPSHOT="--baseline-prepared-snapshot .v49_76_input_baseline/v49_76_prepared_authority_snapshot.csv"
          fi
          if [ -s .v49_74_input_baseline/v49_74_prepared_authority_snapshot.csv ]; then
            LEGACY_V4974_SNAPSHOT="--legacy-v4974-prepared-snapshot .v49_74_input_baseline/v49_74_prepared_authority_snapshot.csv"
          fi
          python v49_76_merge.py --input-root v49_76_downloads --prepare-dir v49_76_prepare_output --output-dir reports --pit-cache-dir .v49_76_pit_marcap_cache --top-per-strategy 5 --shard-count 8 $SEND $BASELINE $BASELINE_SNAPSHOT $LEGACY_V4974_SNAPSHOT
      - name: Stage baseline-eligible v49.76 input authority for future same-period reruns
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          p=Path('reports/v49_76_input_authority_manifest.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              if bool(d.get('baseline_eligible', False)):
                  q=Path('.v49_76_input_baseline'); q.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,q/p.name)
                  snap=Path('reports/v49_76_prepared_authority_snapshot.csv')
                  snapj=Path('reports/v49_76_prepared_authority_snapshot.json')
                  if not snap.exists() or not snapj.exists():
                      raise SystemExit('MARCAP prepared snapshot missing; baseline not staged')
                  shutil.copy2(snap,q/snap.name); shutil.copy2(snapj,q/snapj.name)
                  print('INPUT+MARCAP AUTHORITY BASELINE STAGED',d.get('reproducibility_status'),d.get('data_completeness_status'))
              else:
                  print('INPUT AUTHORITY NOT BASELINE-ELIGIBLE',d.get('status'),d.get('data_completeness_status'))
          PY
      - name: Save v49.76 input authority baseline
        if: ${{ always() && hashFiles('.v49_76_input_baseline/v49_76_input_authority_manifest.json') != '' }}
