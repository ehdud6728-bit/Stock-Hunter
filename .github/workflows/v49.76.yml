      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests finance-datareader beautifulsoup4 lxml pytz python-dateutil openpyxl gspread google-auth pyyaml
          if [ -n "${PYKRX_VERSION:-}" ]; then pip install "pykrx==${PYKRX_VERSION}"; else pip install pykrx; fi
      - uses: actions/download-artifact@v4
        with:
          name: v49-76-prepare
          path: v49_76_prepare_output
      - name: Restore shard resume cache (input-authority scoped)
        uses: actions/cache@v4
        with:
          path: closing_bet_logs/v49_76_strategy_eval_cache
          # Cache reuse is allowed only when the immutable prepare document and requested period inputs match.
          # This prevents a prior run's evaluator cache from silently changing the raw/funnel population.
          key: v49-76-strategy-shard-${{ matrix.shard }}-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('v49_76_prepare_output/v49_76_preflight.json') }}-${{ inputs.backtest_start || 'AUTO' }}-${{ inputs.backtest_end || 'AUTO' }}-${{ inputs.backtest_months || '18' }}-${{ github.run_id }}
          restore-keys: |
            v49-76-strategy-shard-${{ matrix.shard }}-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('v49_76_prepare_output/v49_76_preflight.json') }}-${{ inputs.backtest_start || 'AUTO' }}-${{ inputs.backtest_end || 'AUTO' }}-${{ inputs.backtest_months || '18' }}-
      - name: Run performance-only shard
        shell: bash
        run: |
          set -euo pipefail
          BT_FLAGS="--backtest-hold-days ${{ inputs.hold_days || '60' }} --backtest-min-eval-days ${{ inputs.backtest_min_eval_days || '1' }} --backtest-top-per-strategy 5 --backtest-all-candidates --force"
          if [ -n "${{ inputs.backtest_start || '' }}" ] || [ -n "${{ inputs.backtest_end || '' }}" ]; then
            [ -n "${{ inputs.backtest_start || '' }}" ] && BT_FLAGS="$BT_FLAGS --backtest-start ${{ inputs.backtest_start }}"
            [ -n "${{ inputs.backtest_end || '' }}" ] && BT_FLAGS="$BT_FLAGS --backtest-end ${{ inputs.backtest_end }}"
          else
            BT_FLAGS="$BT_FLAGS --backtest-months ${{ inputs.backtest_months || '18' }}"
          fi
          echo "RUN SHARD ${{ matrix.shard }}/8: $BT_FLAGS"
          python Closing_bet_scanner_v2.py $BT_FLAGS
      - name: Verify shard hard-exit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          shard = int('${{ matrix.shard }}')
          root = Path('v49_76_shard_output')
          raw = root / f'shard_{shard:02d}_raw.csv'
          manifest = root / f'shard_{shard:02d}_manifest.json'
          complete = root / f'shard_{shard:02d}_complete.json'
          funnel = root / f'shard_{shard:02d}_strategy_funnel.csv'
          zero = root / f'shard_{shard:02d}_zero_mode_audit.csv'
          exceptions = root / f'shard_{shard:02d}_predicate_exceptions.csv'
          opportunity = root / f'shard_{shard:02d}_opportunity_census.csv'
          history = root / f'shard_{shard:02d}_history_authority.csv'
          for path in (raw, manifest, complete, funnel, zero, exceptions, opportunity, history):
              if not path.exists() or path.stat().st_size <= 0:
                  raise SystemExit(f'missing shard output: {path}')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          c = json.loads(complete.read_text(encoding='utf-8'))
          assert m['shard_index'] == shard
          assert m['shard_count'] == 8
          assert m['engine_status'] == 'VALID'
          assert m['control_flow'] == 'V49_75_SHARD_EXPORT_RETURN_MAIN_EXIT'
          assert m['research_lane'] == 'SKIPPED'
          assert m['telegram'] == 'SKIPPED'
          assert m['post_export_network'] == 'FORBIDDEN'
          assert c['status'] == 'SHARD_ONLY_COMPLETE'
          assert c['shard_index'] == shard
          assert hashlib.sha256(raw.read_bytes()).hexdigest() == m['raw_sha256'] == c['raw_sha256']
          assert hashlib.sha256(opportunity.read_bytes()).hexdigest() == m['opportunity_sha256'] == c['opportunity_sha256']
          assert hashlib.sha256(history.read_bytes()).hexdigest() == m['history_file_sha256'] == c['history_file_sha256']
          assert int(m.get('history_codes',0)) == int(m.get('shard_count_codes',0))
          assert str(m.get('history_global_sha256','')) == str(c.get('history_global_sha256',''))
          assert int(m.get('opportunity_rows', -1)) >= 0
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == c['manifest_sha256']
          d = m['diagnostics']
          assert hashlib.sha256(funnel.read_bytes()).hexdigest() == d['funnel_sha256']
          assert hashlib.sha256(zero.read_bytes()).hexdigest() == d['zero_audit_sha256']
          assert hashlib.sha256(exceptions.read_bytes()).hexdigest() == d['exceptions_sha256']
          print(f'v49.76 HARD EXIT VERIFIED shard={shard} raw_rows={m["raw_rows"]} history_codes={m.get("history_codes",0)} history_fp={str(m.get("history_global_sha256",""))[:12]} false_negative={d["false_negative_hits"]} exceptions={d.get("predicate_exception_rows", 0)}')
          PY
      - name: Upload shard raw signals
        uses: actions/upload-artifact@v4
        with:
          name: v49-76-shard-${{ matrix.shard }}
          path: v49_76_shard_output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

