          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests finance-datareader beautifulsoup4 lxml pytz python-dateutil openpyxl gspread google-auth pyyaml pykrx
      - uses: actions/download-artifact@v4
        with:
          name: v49-76-prepare
          path: v49_76_prepare_output
      - uses: actions/download-artifact@v4
        with:
          pattern: v49-76-shard-*
          path: v49_76_downloads
          merge-multiple: true
      - name: Resolve v49.76 input-authority baseline key
        id: input_authority_key
        shell: bash
        run: |
          END_DATE="${{ inputs.backtest_end || '' }}"
          if [ -z "$END_DATE" ]; then END_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          START_TOKEN="${{ inputs.backtest_start || '' }}"
          if [ -z "$START_TOKEN" ]; then START_TOKEN="AUTO-M${{ inputs.backtest_months || '18' }}"; fi
          PERIOD_KEY="${START_TOKEN}_${END_DATE}"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "period_key=$PERIOD_KEY" >> "$GITHUB_OUTPUT"
      - name: Restore prior same-period v49.76 input authority
        id: input_authority_restore
        uses: actions/cache/restore@v4
        with:
          path: .v49_76_input_baseline
          key: v49-76-input-authority-${{ runner.os }}-${{ github.ref_name }}-${{ steps.input_authority_key.outputs.period_key }}-${{ github.run_id }}
          restore-keys: |
            v49-76-input-authority-${{ runner.os }}-${{ github.ref_name }}-${{ steps.input_authority_key.outputs.period_key }}-
      - name: Restore legacy same-period v49.74 MARCAP snapshot for cross-version forensic
        id: legacy_v4974_restore
        uses: actions/cache/restore@v4
        with:
          path: .v49_74_input_baseline
          key: v49-74-input-authority-${{ runner.os }}-${{ github.ref_name }}-${{ steps.input_authority_key.outputs.period_key }}-${{ github.run_id }}
