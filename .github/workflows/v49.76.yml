      CLOSING_BET_V4950_FAIL_LOCK_ENABLE: '0'
      CLOSING_BET_V4950_RUNNER_ENABLE: '0'
      CLOSING_BET_V4951_FAIL_WALK_ENABLE: '0'
      CLOSING_BET_V4951_RUNNER_POLICY_ENABLE: '0'
      CLOSING_BET_V4953_RUNNER_WALK_ENABLE: '0'
      CLOSING_BET_V4958_LIFECYCLE_CACHE_ENABLE: '0'
      CLOSING_BET_V4959_I_FLOW_MODE: CACHE_ONLY_PROXY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
