name: Closing Bet v49.76 R1.16 Legacy Minute Evidence x Wave Signal Join (RESEARCH ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r116_research_only:
    name: Immutable legacy HAM 7-day minute evidence x R114 signals (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      R114_RUN: "38831145566"
      R114_ARTIFACT: "closebet-r114-wave-descriptive-blindcharts-38831145566"
      LEGACY_RUN: "38736163160"
      LEGACY_ARTIFACT: "stockhunter-v1107-4-5-73-3-6-6-24-causal-universe-full-denom-pattern-oos-exit-reports-1653"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Strict Python and provenance regression checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r116_legacy_minute_evidence.py tests/test_r116_legacy_minute_evidence.py
          python -m unittest discover -s tests -p 'test_r116_legacy_minute_evidence.py' -v
          python -m closebet_research.r116_legacy_minute_evidence --help >/dev/null
          echo R116_PY310_PREFLIGHT_PASS
      - name: Fetch immutable GitHub-saved minute files and R1.14 metrics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/r114 evidence/ham
          gh run download "$R114_RUN" --repo "$GITHUB_REPOSITORY" --name "$R114_ARTIFACT" --dir evidence/r114
          gh run download "$LEGACY_RUN" --repo "$GITHUB_REPOSITORY" --name "$LEGACY_ARTIFACT" --dir evidence/ham
          test -s evidence/r114/r114_1059_exante_descriptive_metrics.csv
          test -s evidence/r114/r114_integrity_manifest.json
          test "$(find evidence/ham/reports/ham_minute_history -type f -name '*.csv.gz' | wc -l)" -eq 7
      - name: Verify SHA256 source; audit minute coverage; join R1.14 1059 signals
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r116_legacy_minute_evidence \
            --minute-dir evidence/ham/reports/ham_minute_history \
            --r114-dir evidence/r114 \
            --out reports/r116
      - name: Fail-closed summary and file hash contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('reports/r116');m=json.loads((d/'r116_integrity_manifest.json').read_text())
          assert m['status']=='PASS_DATA_DISCOVERED_BUT_NOT_TRADE_ELIGIBLE'
          assert m['trade_authority'] is False
          assert (m['cached_minute_files'],m['minute_rows'],m['code_day_pairs'])==(7,3610,10)
          assert (m['matched_r114_signals'],m['matched_quarantined'])==(3,2)
          assert m['actual_traded_value_bars']==m['verified_1530_auction_events']==0
          for fn,expected in m['output_sha256'].items():
              assert hashlib.sha256((d/fn).read_bytes()).hexdigest()==expected,fn
          print('R116_FINAL_RESEARCH_ONLY_PASS; NOT_TRADE_ELIGIBLE; LIVE_AUTHORITY=NONE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: closebet-r116-legacy-minute-evidence-${{ github.run_id }}
          path: reports/r116/
          if-no-files-found: error
          retention-days: 30
