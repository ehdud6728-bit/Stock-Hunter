name: Closing Bet v49.76 R1.15 Historical Minute Feasibility + Closing Volume Integrity (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      minute_source_run_id:
        description: Optional GitHub run ID containing a STRICT intraday interval CSV artifact; blank is a readiness audit only
        type: string
        required: false
        default: ''
      minute_source_artifact_name:
        description: Exact artifact name within that run; must be supplied together with run ID
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: closing-bet-research-current-r115-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r115_readonly:
    name: R1.14 SHA-pin + intraday provenance feasibility (NO LIVE, NO ORDERS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      R114_RUN: '38831145566'
      R114_ARTIFACT: closebet-r114-wave-descriptive-blindcharts-38831145566
      OPTIONAL_MINUTE_RUN: ${{ inputs.minute_source_run_id }}
      OPTIONAL_MINUTE_ARTIFACT: ${{ inputs.minute_source_artifact_name }}
    steps:
      - name: Checkout repository research sources only
        uses: actions/checkout@v4

      - name: Configure Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Preflight imports, syntax and Python-3.10 unit tests
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r115_intraday_data_readiness_audit.py tests/test_r115_intraday_data_readiness_audit.py
          python -m closebet_research.r115_intraday_data_readiness_audit --help >/dev/null
          python -m unittest discover -s tests -p test_r115_intraday_data_readiness_audit.py -v
          echo 'R115_PY310_UNIT_TEST_PASS'

      - name: Fetch immutable R1.14 GitHub evidence without any market refetch
        run: |
          set -euo pipefail
          mkdir -p evidence/r114 evidence/minute
          gh run download "$R114_RUN" --repo "$GITHUB_REPOSITORY" --name "$R114_ARTIFACT" --dir evidence/r114
          python - <<'PY'
          from pathlib import Path
          from closebet_research.r115_intraday_data_readiness_audit import verify_r114
          m,cs,signals=verify_r114(Path('evidence/r114'))
          assert len(cs)==40 and len(signals)==1059
          print('R115_R114_SHA_PIN_PASS')
          PY

      - name: Optional externally supplied intraday evidence - never silently substitute daily OHLCV
        run: |
          set -euo pipefail
          if [[ -z "$OPTIONAL_MINUTE_RUN" && -z "$OPTIONAL_MINUTE_ARTIFACT" ]]; then
            echo 'R115_NO_HISTORICAL_MINUTE_SOURCE_PROVIDED / readiness-only'
          elif [[ "$OPTIONAL_MINUTE_RUN" =~ ^[0-9]{8,15}$ && "$OPTIONAL_MINUTE_ARTIFACT" =~ ^[a-zA-Z0-9._-]{1,120}$ ]]; then
            gh run download "$OPTIONAL_MINUTE_RUN" --repo "$GITHUB_REPOSITORY" --name "$OPTIONAL_MINUTE_ARTIFACT" --dir evidence/minute
            test "$(find evidence/minute -type f -name '*.csv' | wc -l)" -ge 1
            echo 'R115_OPTIONAL_MINUTE_ARTIFACT_PRESENT / row-level provenance validation next'
          else
            echo 'R115_INVALID_OPTIONAL_MINUTE_SOURCE_ARGS' >&2; exit 68
          fi

      - name: Verify source semantics, pinned R1.14, honest minute coverage and blank 40-case labels
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$OPTIONAL_MINUTE_RUN" ]]; then ARGS+=(--minute-source evidence/minute); fi
          python -m closebet_research.r115_intraday_data_readiness_audit \
            --r114-dir evidence/r114 --repo-root . --out reports/r115 "${ARGS[@]}"

      - name: Final strict results contract (NOT a successful minute backtest)
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('reports/r115'); m=json.loads((d/'r115_integrity_manifest.json').read_text())
          assert m['status']=='PASS_READINESS_ONLY_NOT_A_MINUTE_BACKTEST',m
          assert m['signals']==1059 and m['algorithm_no_wave']==659 and m['blind_charts_pre_D0']==40,m
          assert m['independently_labeled_blind_charts']==0,m
          assert m['limits']['trade_approval'] is False and m['limits']['no_synthetic_minutes'] is True
          for fn,dig in m['output_sha256'].items():
              assert hashlib.sha256((d/fn).read_bytes()).hexdigest()==dig,fn
          print('R115_READINESS_ONLY_CONTRACT_PASS; NO_LIVE_AUTHORITY')
          PY

      - name: Publish only verified source/coverage audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r115-minute-readiness-${{ github.run_id }}
          path: reports/r115/
          retention-days: 30
          if-no-files-found: error
