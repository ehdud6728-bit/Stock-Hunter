name: Closing Bet v49.76 R1.11 First Signal x Wave Episode x Early Strength (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closebet-current-research-r111-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r111_episodes:
    name: Pinned KRX 1059-bar replay x signal episodes (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      R171_RUN: '38664095610'
      R110_RUN: '38745541969'
    steps:
      - name: Checkout RESEARCH ONLY source
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (matching tested research runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python syntax checks before touching inputs
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r111_episode_first_strength_audit.py tests/test_r111_episode_first_strength_audit.py
          echo 'R111_PY310_COMPILE_PASS'

      - name: Install pinned offline analysis libraries
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6' 'pandas==2.3.3'

      - name: Package import and CLI entrypoint preflight
        run: |
          set -euo pipefail
          python -c 'from closebet_research import r111_episode_first_strength_audit; print("R111_IMPORT_PASS")'
          python -m closebet_research.r111_episode_first_strength_audit --help > /dev/null
          echo 'R111_CLI_PASS'

      - name: Episode causality and corruption tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_r111_episode_first_strength_audit.py' -v

      - name: Fetch exact immutable R1.7.1 selected signals and R1.10 features
        run: |
          set -euo pipefail
          mkdir -p evidence/r171 evidence/r110 evidence/history
          gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "closebet-r17-krx-only-replay-${R171_RUN}" --dir evidence/r171
          gh run download "$R110_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "closebet-r110-wave-pullback-entry-${R110_RUN}" --dir evidence/r110
          test -s evidence/r171/r17_krx/native/v49_76_global_selected_top5.csv
          test -s evidence/r110/r110_signal_flags_and_outcomes.csv
          python - <<'PY'
          from closebet_research.r111_episode_first_strength_audit import src_verify
          a,b,_=src_verify('evidence/r171','evidence/r110')
          print('R111_PINNED_SOURCE_SHA_PASS',len(a),len(b))
          PY

      - name: Fetch exact 4 independent KRX daily history shards (NO refetch/recompute)
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            mkdir -p "evidence/shard-${i}"
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "r171-history-${i}" --dir "evidence/shard-${i}"
          done
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(4):
              root=Path(f'evidence/shard-{i}')
              manifests=list(root.rglob('krx_history_manifest_*.json'))
              assert len(manifests)==1, (i,manifests)
              files=sorted(p for p in root.rglob('*') if p.is_file())
              assert len(files)>=400,(i,len(files))
              dest=Path(f'evidence/history/history_{i}.zip')
              with ZipFile(dest,'w',compression=ZIP_STORED) as z:
                  for f in files:z.write(f,arcname=f.relative_to(root).as_posix())
          print('R111_FOUR_HISTORY_ARTIFACTS_REPACKAGED_UNCHANGED')
          PY

      - name: Audit all selected bars and analyze episodes and real subsequent KRX prices
        run: |
          set -euo pipefail
          python -m closebet_research.r111_episode_first_strength_audit \
            --r171-dir evidence/r171 --r110-dir evidence/r110 \
            --history-artifacts evidence/history --out reports/r111

      - name: Strict research output contract before upload
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('reports/r111')
          m=json.loads((root/'r111_integrity_manifest.json').read_text(encoding='utf-8'))
          assert m['status']=='PASS_DESCRIPTIVE_ONLY_NOT_TRADE_APPROVED'
          assert m['all_selected_unique_signals']==1059 and m['krx_selected_price_bars_exact_verified']==1059
          assert m['r110_reused_unique_signals']==754 and m['mature_D20']==570 and m['recent_D5_only']==184
          assert m['within_episode_first_repeat_pair_count'] >= 1
          for f,h in m['output_sha256'].items():
              assert hashlib.sha256((root/f).read_bytes()).hexdigest()==h,f
          print('R111_FINAL_RESEARCH_ONLY_EVIDENCE_PASS / NO LIVE AUTHORITY')
          PY

      - name: Upload RESEARCH results only if all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r111-episode-strength-${{ github.run_id }}
          path: reports/r111/
          retention-days: 30
          if-no-files-found: error
