name: StockHunter PIT Stage7-J Partial Recovery (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      audit_phase:
        description: 'Research-only: SHA-reuse 7 prior bodies; resolve ONLY 2 selected 15-version KIND bodies; leave one company text unverified'
        required: true
        type: choice
        default: stage7j_recovery
        options:
          - stage7j_recovery

permissions:
  contents: read
  actions: read

concurrency:
  group: stockhunter-pit-stage7j-partial-recovery
  cancel-in-progress: false

jobs:
  stage7j-recovery-offline:
    if: ${{ github.event.inputs.audit_phase == 'stage7j_recovery' }}
    name: Stage7-J recover prior-failure 27 raw SHA, old 172, prior 74, 30 strict contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STAGE7J_EVIDENCE_ROOT: stage7j-source
      STAGE7J_SOURCE_ROOT: stage7j-source
      STAGE7J_OLD_BODY_DIR: stage7j-source/old7j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install previously reviewed source parsing and test dependencies only
        run: pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3' 'PyYAML>=6,<7'
      - name: Verify immutable five successful sources and exact failed Stage7-J partial artifact
        shell: bash
        run: |
          set -euo pipefail
          for pin in \
            39523929718:c8e07a889fc9e0e2497682d2f02a77ec5c505983:success \
            39541621602:cfd4a7d2fa71377273137c2b5d2ba9b104a39bc3:success \
            39570031470:4e221be6dfd02518e8fa3725994836fe029c7704:success \
            39578003404:0fb4392da16320c11671f9fd64f5582a28579d00:success \
            39708812035:a3cd338b1306030039f117fa8392a9c9be359db7:success \
            39716439150:5ed7756851bdc5968f67f8fa25dfcac4318c3ccb:failure
          do
            rid="${pin%%:*}"
            rem="${pin#*:}"
            sha="${rem%%:*}"
            conclusion="${rem##*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .head_sha)" = "$sha"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .conclusion)" = "$conclusion"
          done
          for pin in \
            12311588532:sha256:9134bf69da37dca28aa935647fc3f4c35a93d8c2b22f66874a234f191d24b10b \
            12320020824:sha256:d25a2b2a9d90478b5699899d9774b57ba268c15d5212efaf320acd14c76c2b08 \
            12331038075:sha256:78c0ffb56422235b6f492e5b5af5fc6a9c7f1dd523d8c5dbab06dc8afe7be06c \
            12335870064:sha256:18bee4ef59c5ce7d9cc50483973b469dca2aabeee8c53b9bc9ba320e20bbed04 \
            12396655109:sha256:275cdfc71fe2be4280bd21ecc400449f78246a0a88fd99fbeffafa553b9e3a48 \
            12399431069:sha256:dd08df6a038317b26ee0d7ecb0722ee423fc20c37740db89b5923a976a688591
          do
            aid="${pin%%:*}"
            expected="${pin#*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" --jq .digest)" = "$expected"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" --jq .expired)" = false
          done
          echo STAGE7J_RECOVERY_ALL_6_RUN_IDENTITIES_AND_ARTIFACT_DIGEST_PINS_PASS
      - name: Reuse 7-H 57 original notice summary, no original KIND request
        uses: actions/download-artifact@v4
        with:
          run-id: 39578003404
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7h-correction-candidates-sha-pinned-research-only
          path: stage7j-source/7h
      - name: Reuse 7-I eight real KIND list HTML, no new category search
        uses: actions/download-artifact@v4
        with:
          run-id: 39708812035
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7i-bounded-outside57-category-gap-canary
          path: stage7j-source/7i
      - name: Restore older original D ten bodies (unchanged)
        uses: actions/download-artifact@v4
        with:
          run-id: 39523929718
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7d-kind-full-document-source-evidence
          path: stage7j-source/7d
      - name: Restore older original F eleven bodies (unchanged)
        uses: actions/download-artifact@v4
        with:
          run-id: 39541621602
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7f-kind-direct-halt-source-coverage
          path: stage7j-source/7f
      - name: Restore older original G thirty-six bodies (unchanged)
        uses: actions/download-artifact@v4
        with:
          run-id: 39570031470
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7g-kind-other-market-context-full-bodies
          path: stage7j-source/7g
      - name: Restore EXACT failed 7-J partial artifact with 7 good bodies and 3 partial sources
        uses: actions/download-artifact@v4
        with:
          run-id: 39716439150
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7j-ten-official-bodies-context-sha-research-only
          path: stage7j-source/old7j
      - name: Run 30 recovery contracts, including REAL SHA, 15-option parsing, 2-only mock and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -s tests/test_pit_stage7j_three_residual_recovery.py
          python - <<'PYTEST'
          import unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_pit_stage7j_three_residual_recovery.py')
          n=suite.countTestCases()
          print('STAGE7J_RECOVERY_TESTS_DISCOVERED',n,flush=True)
          if n<30:raise SystemExit('RECOVERY_TEST_DISCOVERY_MISSING:'+str(n))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or len(result.skipped):
              raise SystemExit('STAGE7J_RECOVERY_TESTS_FAIL_OR_SKIPPED')
          PYTEST
      - name: Run prior unchanged Stage7-J 50 regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_pit_stage7j_selected_notice_fullbody.py' -v
      - name: Reconfirm the 172 original raw SHA plus exact failed 27 raw SHA without network
        shell: bash
        run: |
          set -euo pipefail
          python -u research_pit/pit_stage7j_three_residual_recovery.py \
            --stage7h-dir stage7j-source/7h \
            --stage7i-dir stage7j-source/7i \
            --stage7d-dir stage7j-source/7d \
            --stage7f-dir stage7j-source/7f \
            --stage7g-dir stage7j-source/7g \
            --old7j-dir stage7j-source/old7j \
            --mode offline --out reports/pit-stage7j-recovery-offline
      - name: Preserve SHA audit no matter how previous test finishes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage7j-recovery-offline-sha-verified
          path: reports/pit-stage7j-recovery-offline/**
          if-no-files-found: warn
          retention-days: 90

  stage7j-recovery-two-resolvers:
    if: ${{ github.event.inputs.audit_phase == 'stage7j_recovery' }}
    needs: stage7j-recovery-offline
    name: Stage7-J recover 2 selected 15-version official bodies ONLY; reuse the other 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
      - name: Re-pin failing run's exact source identity before ONLY two resolver calls
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39716439150" --jq .head_sha)" = 5ed7756851bdc5968f67f8fa25dfcac4318c3ccb
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12399431069" --jq .digest)" = sha256:dd08df6a038317b26ee0d7ecb0722ee423fc20c37740db89b5923a976a688591
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12399431069" --jq .expired)" = false
      - uses: actions/download-artifact@v4
        with:
          run-id: 39578003404
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7h-correction-candidates-sha-pinned-research-only
          path: stage7j-source/7h
      - uses: actions/download-artifact@v4
        with:
          run-id: 39708812035
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7i-bounded-outside57-category-gap-canary
          path: stage7j-source/7i
      - uses: actions/download-artifact@v4
        with:
          run-id: 39523929718
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7d-kind-full-document-source-evidence
          path: stage7j-source/7d
      - uses: actions/download-artifact@v4
        with:
          run-id: 39541621602
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7f-kind-direct-halt-source-coverage
          path: stage7j-source/7f
      - uses: actions/download-artifact@v4
        with:
          run-id: 39570031470
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7g-kind-other-market-context-full-bodies
          path: stage7j-source/7g
      - uses: actions/download-artifact@v4
        with:
          run-id: 39716439150
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage7j-ten-official-bodies-context-sha-research-only
          path: stage7j-source/old7j
      - name: Reuse original 7 captured docs and 1 still identity-unverified body; retrieve ONLY 2
        shell: bash
        run: |
          set -euo pipefail
          python -u research_pit/pit_stage7j_three_residual_recovery.py \
            --stage7h-dir stage7j-source/7h \
            --stage7i-dir stage7j-source/7i \
            --stage7d-dir stage7j-source/7d \
            --stage7f-dir stage7j-source/7f \
            --stage7g-dir stage7j-source/7g \
            --old7j-dir stage7j-source/old7j \
            --mode recover --pause 1.2 \
            --out reports/pit-stage7j-recovery-bodies
      - name: Publish SHA raw evidence even on failure; no LIVE, no trading approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage7j-recovery-two-residual-bodies-research-only
          path: reports/pit-stage7j-recovery-bodies/**
          if-no-files-found: warn
          retention-days: 90
