name: Closing Bet v49.76 R1.9.2 Paired Charts + Price Integrity (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closing-bet-r192-chart-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r19_audit:
    name: Pinned KRX evidence + 36 paired descriptive cases (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      R171_RUN: '38664095610'
      R18_RUN: '38693918216'
    steps:
      - name: Checkout research files only
        uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python 3.10 syntax preflight BEFORE dependencies and evidence downloads
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r19_paired_chart_audit.py tests/test_r19_chart_pair_audit.py
          python -m py_compile closebet_research/r18_wave_entry_forensic.py tests/test_r18_wave_entry_forensic.py
          echo 'R192_PY310_SYNTAX_PASS'
      - name: Install OFFLINE scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'matplotlib>=3.8,<4'
      - name: R1.9.2 Python module invocation preflight BEFORE evidence downloads
        run: |
          set -euo pipefail
          python -c 'from closebet_research import r19_paired_chart_audit, r18_wave_entry_forensic; print("R192_PACKAGE_IMPORT_PASS")'
          python -m closebet_research.r19_paired_chart_audit --help > /dev/null
          echo 'R192_MODULE_CLI_PASS'
      - name: Download EXACT completed KRX R1.7.1 and R1.8 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/history evidence/r171 evidence/r18
          for i in 0 1 2 3; do
            gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "r171-history-${i}" --dir evidence/history
          done
          gh run download "$R171_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "closebet-r17-krx-only-replay-${R171_RUN}" --dir evidence/r171
          gh run download "$R18_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "closebet-r18-wave-entry-forensics-${R18_RUN}" --dir evidence/r18
          test -s evidence/r171/r17_krx/native/v49_76_global_selected_top5.csv
          test -s evidence/r18/r18_research_manifest.json
          test -s evidence/r18/r18_all_unique_signal_features.csv
          test "$(find evidence/history -name 'krx_history_manifest_*.json' | wc -l)" -eq 4
          echo 'R19 PINNED_ARTIFACTS_PRESENT · content SHA + calendar snapshot hash will be validated next'
      - name: Run corruption / causality tests (FAIL CLOSED)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_r19_chart_pair_audit.py' -v
          python -m unittest discover -s tests -p 'test_r18_wave_entry_forensic.py' -v
      - name: Audit ALL selected KRX signal bars and R18 pre-signal features, then prepare paired charts
        run: |
          set -euo pipefail
          python -m closebet_research.r19_paired_chart_audit \
            --r171-zip evidence/r171 \
            --r18-zip evidence/r18 \
            --history-artifacts evidence/history \
            --out reports/r19 \
            --max-chart-pairs 6
      - name: Assert final integrity contract before upload
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('reports/r19')
          m=json.loads((d/'r19_integrity_manifest.json').read_text())
          assert m['status']=='PASS_WITH_KNOWN_LIMITATIONS'
          assert m['r19_status']=='DESCRIPTIVE_RESEARCH_NOT_OOS'
          assert m['all_native_unique_signal_price_bars_verified']==1059
          assert m['R18_feature_rows_recalculated']==754
          assert m['D20_outcomes_independently_recalculated']==570
          assert m['charted_cases']==12
          assert m['r19_paired_cases']>=18
          assert len(m['output_sha256'])>=18
          for name,sha in m['output_sha256'].items():
              p=d/name
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==sha, name
          assert 'regular_session_15_30_only' in m['NOT_PROVEN']
          print('R19_INTEGRITY_CONTRACT_PASS / not live or prospectively validated')
          PY
      - name: Upload complete research result ONLY after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r191-paired-chart-integrity-${{ github.run_id }}
          path: reports/r19/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
