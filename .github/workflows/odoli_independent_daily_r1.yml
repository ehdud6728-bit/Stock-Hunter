name: ODOLI Independent Daily R1

on:
  workflow_dispatch:
  schedule:
    # Weekdays 16:50 KST = 07:50 UTC
    - cron: '50 07 * * 1-5'

permissions:
  contents: read

concurrency:
  group: odoli-independent-daily-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  odoli-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_DATA_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODOLI dependencies
        run: pip install pandas numpy pyarrow exchange-calendars pykrx

      - name: Restore independent ODOLI state
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/odoli_independent_r1
          key: odoli-independent-r1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            odoli-independent-r1-${{ github.ref_name }}-

      - name: Fetch PIT marcap base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'data/marcap-2025.parquet' \
            'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: KRX credential preflight
        shell: bash
        run: |
          python - <<'PY'
          import os
          ok=bool(os.getenv("KRX_ID","").strip()) and bool(os.getenv("KRX_PW","").strip())
          print("ODOLI_KRX_AUTH", "READY" if ok else "MISSING")
          if not ok:
              print("::warning::KRX_DATA_ID/KRX_DATA_PW are missing; pykrx augmentation may fail closed to STALE_SOURCE.")
          PY

      - name: Run independent all-market ODOLI with pykrx augmentation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile odoli_independent_daily_r1.py
          python -u odoli_independent_daily_r1.py \
            --marcap-root vendor/marcap \
            --state-dir reports/.cache/odoli_independent_r1 \
            --output-dir reports/odoli_independent_r1

      - name: Validate isolation freshness and augmentation authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open("reports/odoli_independent_r1/meta.json",encoding="utf-8"))
          assert m["definition"]=="STRICT_ODOLI_R1"
          assert m["independent_all_market_lane"] is True
          assert m["real_full_source_required"] is False
          assert m["a_required"] is False
          assert m["core_required"] is False
          assert m["production_search_changed"] is False
          assert m["production_score_changed"] is False
          assert m["production_rank_changed"] is False
          assert m["production_order_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["telegram_route"]=="TELEGRAM_DYUL_CHAT_ID"
          if m["fresh_source"]:
              assert m["asof_date"]==m["expected_krx_session"]
              assert m["all_missing_sessions_fetched"] is True
          else:
              assert m["new_frozen_events"]==0
              assert m["source_status"]=="STALE_SOURCE"
          print("ODOLI_INDEPENDENT_R1_3_GUARDS PASS",m)
          PY

      - name: Show source augmentation diagnostics
        if: always()
        run: cat reports/odoli_independent_r1/source_augmentation_diagnostics.json || true

      - name: Show message
        run: cat reports/odoli_independent_r1/telegram_message.txt

      - name: Send Telegram to DYUL chat
        env:
          TELEGRAM_BACKTEST_TOKEN: ${{ secrets.TELEGRAM_BACKTEST_TOKEN }}
          TELEGRAM_DYUL_CHAT_ID: ${{ secrets.TELEGRAM_DYUL_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SHOULD="$(python - <<'PY'
          import json
          print("1" if json.load(open("reports/odoli_independent_r1/meta.json",encoding="utf-8"))["telegram_should_send"] else "0")
          PY
          )"
          if [ "$SHOULD" != "1" ]; then
            echo "ODOLI_INDEPENDENT_TELEGRAM_SKIP duplicate"
            exit 0
          fi

          TOKEN="${TELEGRAM_BACKTEST_TOKEN:-}"
          CHAT="${TELEGRAM_DYUL_CHAT_ID:-}"
          FILE="reports/odoli_independent_r1/telegram_message.txt"

          echo "ODOLI_TELEGRAM_ROUTE=TELEGRAM_DYUL_CHAT_ID"

          if [ -z "$TOKEN" ] || [ -z "$CHAT" ] || [ ! -s "$FILE" ]; then
            echo "ODOLI_INDEPENDENT_TELEGRAM_SKIP DYUL route unavailable"
            exit 0
          fi

          python - <<'PY'
          import os,urllib.parse,urllib.request
          from pathlib import Path

          text=Path("reports/odoli_independent_r1/telegram_message.txt").read_text(encoding="utf-8")
          chunks=[]
          while text:
              if len(text)<=3500:
                  chunks.append(text)
                  break
              cut=text.rfind("\n",0,3500)
              if cut<1000:
                  cut=3500
              chunks.append(text[:cut])
              text=text[cut:].lstrip("\n")

          token=os.environ["TELEGRAM_BACKTEST_TOKEN"]
          chat=os.environ["TELEGRAM_DYUL_CHAT_ID"]

          for i,msg in enumerate(chunks,1):
              data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode()
              req=urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode("utf-8","replace")
                  if r.status!=200:
                      raise RuntimeError(f"telegram http={r.status} body={body[:200]}")
              print("ODOLI_INDEPENDENT_TELEGRAM_SENT_DYUL",i,len(msg))
          PY

      - name: Save independent ODOLI state
        if: always() && hashFiles('reports/.cache/odoli_independent_r1/r11_freshness_migrated.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/.cache/odoli_independent_r1
          key: odoli-independent-r1-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload ODOLI independent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoli-independent-r1-${{ github.run_id }}
          path: |
            reports/odoli_independent_r1/**
            reports/.cache/odoli_independent_r1/bootstrap_pre_freshness_*.csv
          if-no-files-found: warn
          retention-days: 90
