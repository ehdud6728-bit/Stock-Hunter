name: ODOLI Exit R2.7 Target Touch

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download frozen R2.6 cohort/outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r26
          gh run download "36189917763"             -n "odoli-a-context-r26-36189917763"             -D source_r26

      - name: Fetch current 2026 marcap PIT parquet
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout             https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run exit target-touch sidecar
        run: |
          python -u odoli_exit_r27.py             --r26-root source_r26             --marcap-root vendor/marcap             --output-dir reports/odoli_exit_r27

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_exit_r27/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["signal_definition_frozen"] is True
          assert m["core_definition_frozen"] is True
          assert m["core_n"]==21
          assert m["core_odoli_n"]==4
          assert m["core_without_odoli_n"]==17
          assert m["intraday_sequence_resolved"] is False
          print(m)
          PY

      - run: cat reports/odoli_exit_r27/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-exit-r27-${{ github.run_id }}
          path: reports/odoli_exit_r27/**
          retention-days: 30
