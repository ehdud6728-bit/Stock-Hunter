name: EARLY POWER R3 S3 Structure Anatomy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Seoul

jobs:
  r3-structure-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Download frozen R2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2
          gh run download 37129336493 -n early-power-r2-s2-s3-anatomy -D /tmp/r2
          find /tmp/r2 -maxdepth 2 -type f -print
      - name: Run R3 structure anatomy
        shell: bash
        run: |
          set -euo pipefail
          python early_power_r3_structure_anatomy.py \
            --r2-ledger /tmp/r2/r2_s2_s3_event_ledger.csv \
            --out reports/early_power_r3
      - name: Validate RESEARCH_ONLY invariants
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open('reports/early_power_r3/meta.json',encoding='utf-8'))
          assert m['revision']=='EARLY_POWER_R3_S3_STRUCTURE_ANATOMY_20261003'
          assert m['research_only'] is True
          assert m['production_changed'] is False
          assert m['production_search_changed'] is False
          assert m['production_score_changed'] is False
          assert m['production_rank_changed'] is False
          assert m['production_order_changed'] is False
          assert m['same_sample_retuning'] is False
          q=pd.read_csv('reports/early_power_r3/r3_s3_structure_ledger.csv')
          assert len(q)>0 and q['stage'].eq('S3_CONVERGENCE').all()
          print('EARLY_POWER_R3_INVARIANTS_PASS')
          PY
      - name: Show report
        if: always()
        run: cat reports/early_power_r3/REPORT.txt || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-power-r3-s3-structure-anatomy
          path: reports/early_power_r3/**
          if-no-files-found: error
          retention-days: 90
