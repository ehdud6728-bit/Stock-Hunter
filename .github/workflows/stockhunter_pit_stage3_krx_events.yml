name: StockHunter PIT Stage3 Official KRX Listing Delisting Event Audit (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      audit_phase:
        description: 'PIT research phase (Stage7 bounded official halt API probe; earlier stages unchanged)'
        required: true
        type: choice
        default: stage7
        options:
          - stage7
          - stage6
          - stage5
          - stage4
          - stage3

permissions:
  contents: read
  actions: read

concurrency:
  group: stockhunter-pit-stage3-official-events
  cancel-in-progress: false

jobs:
  offline-test:
    if: ${{ github.event.inputs.audit_phase == 'stage3' }}
    name: Stage3 official-event contracts (offline, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pit_official_events_audit.py' -v

  official-event-audit:
    name: Crosscheck pinned 3341 codes & 472 terminal candidates against KRX event registries
    needs: offline-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install known KRX client (do not install an unreviewed credential-bearing fork)
        run: pip install 'pykrx==1.2.9' 'requests>=2.31,<3'
      - name: Pin BOTH source identities and require KRX secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197" --jq .head_sha)" = 08e328c101f0774a2236c0a44cc1fdbbaa59e96e
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39343301692" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39343301692" --jq .head_sha)" = afeee6010254d37ae4729812c13f4bdf0d97e91e
          test -n "${KRX_ID:-}" && test -n "${KRX_PW:-}"
          echo 'PINNED_STAGE1_STAGE2_AND_SECRET_BINDING_PASS'
      - name: Download source-locked Stage2 evidence ONLY (no repeated 5M-row download)
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Inspect pinned 3341 identity rows and 472 terminal observations, fetch OFFICIAL KRX 20037/20001 yearly events
        shell: bash
        run: |
          python -u research_pit/pit_official_events_audit.py \
            --stage2-dir stage2-source \
            --out reports/pit-stage3 \
            --pause 1.5
      - name: Publish audit, source SHA evidence, and failures (NEVER auto-approve PIT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage3-krx-official-event-evidence
          path: reports/pit-stage3/**
          if-no-files-found: warn
          retention-days: 90

  stage4-retrospective-type-evidence:
    if: ${{ github.event.inputs.audit_phase == 'stage4' }}
    name: Stage4 retrospective type evidence - pinned artifacts (NOT PIT approved)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage4 offline contracts (stdlib only)
        run: python -m unittest discover -s tests -p 'test_pit_stage4_security_type_evidence.py' -v
      - name: Pin previous 1/2/3 successes by commit identity
        shell: bash
        run: |
          set -euo pipefail
          for item in '39295295197:08e328c101f0774a2236c0a44cc1fdbbaa59e96e' '39343301692:afeee6010254d37ae4729812c13f4bdf0d97e91e' '39364301572:d45fcee5529c339fbbaf721425d249dfa3e2ef39'; do
            run_id="${item%%:*}"
            sha="${item#*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$sha"
          done
          echo 'STAGE4_THREE_SOURCE_RUN_PINS_PASS'
      - name: Download pinned Stage2 small identity evidence (no 5M-row price data)
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Download pinned Stage3 official event evidence (16 raw windows + SHA)
        uses: actions/download-artifact@v4
        with:
          run-id: 39364301572
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage3-krx-official-event-evidence
          path: stage3-source
      - name: Compare all 3341 code types without authorizing backtest or live
        shell: bash
        run: |
          python -u research_pit/pit_stage4_security_type_evidence.py \
            --stage2-dir stage2-source \
            --stage3-dir stage3-source \
            --out reports/pit-stage4
      - name: Publish Stage4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage4-retrospective-type-evidence
          path: reports/pit-stage4/**
          if-no-files-found: warn
          retention-days: 90

  stage5-offline-contracts:
    if: ${{ github.event.inputs.audit_phase == 'stage5' }}
    name: Stage5 code/date roster offline invariants (no KRX network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Stage5 synthetic merge / source tamper / identity tests
        run: python -m unittest discover -s tests -p 'test_pit_stage5_daily_roster.py' -v

  stage5-dated-source-canary:
    if: ${{ github.event.inputs.audit_phase == 'stage5' }}
    needs: stage5-offline-contracts
    name: Stage5 KRX live canary - 4 pinned historical market-date identities
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pykrx==1.2.9'
      - name: Verify immutable price/Stage2/Stage4 historical reference identities
        shell: bash
        run: |
          set -euo pipefail
          for item in '39295295197:08e328c101f0774a2236c0a44cc1fdbbaa59e96e' '39343301692:afeee6010254d37ae4729812c13f4bdf0d97e91e' '39364301572:d45fcee5529c339fbbaf721425d249dfa3e2ef39' '39373355974:e2c07532ca507c98d53f061ab987b715cbdfdd50'; do
            rid="${item%%:*}"
            sha="${item#*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .head_sha)" = "$sha"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .conclusion)" = success
          done
          test -n "${KRX_ID:-}" && test -n "${KRX_PW:-}"
          echo STAGE5_FOUR_SOURCE_PINS_PASS
      - name: Download Stage2 historical reference roster (small evidence)
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Actual KRX date-qualified market lists equal the prior four anchor date identities
        run: |
          python -u research_pit/pit_stage5_daily_roster.py \
            --mode canary --stage2-dir stage2-source \
            --out reports/pit-stage5-canary --pause 1.3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage5-4day-canary-evidence
          path: reports/pit-stage5-canary/
          if-no-files-found: warn
          retention-days: 90

  stage5-date-roster-eight-shards:
    if: ${{ github.event.inputs.audit_phase == 'stage5' }}
    needs: stage5-dated-source-canary
    name: Stage5 collect historical KRX 3-market dated rosters (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pykrx==1.2.9'
      - name: Download pinned Stage2 observed sessions only (no price re-fetch)
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Collect assigned dated KOSPI/KOSDAQ/KONEX code rosters without type assumptions
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          shard_dir=$(printf 'stage5-rosters/shard_%02d' "$SHARD")
          python -u research_pit/pit_stage5_daily_roster.py \
            --mode scan --stage2-dir stage2-source \
            --out "$shard_dir" --shard-index "$SHARD" --shards 8 --pause 1.2
      - name: Preserve evidence for completed and incomplete shards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage5-shard-${{ matrix.shard }}
          path: stage5-rosters/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  stage5-verified-dated-market-merge:
    if: ${{ github.event.inputs.audit_phase == 'stage5' }}
    needs: stage5-date-roster-eight-shards
    name: Stage5 verify exact 1907-day KRX market membership vs SHA-pinned 5,090,428 price codes
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download historical dated KRX roster for all 8 shards
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-pit-stage5-shard-*
          path: stage5-rosters
          merge-multiple: true
      - name: Download original pinned source price rows, no KRX refetch
        uses: actions/download-artifact@v4
        with:
          run-id: 39295295197
          github-token: ${{ github.token }}
          pattern: stockhunter-allkrx-price-shard-*
          path: pitdata
          merge-multiple: true
      - name: Download original source Stage2 observations
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Download original Stage4 type-evidence classifications
        uses: actions/download-artifact@v4
        with:
          run-id: 39373355974
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage4-retrospective-type-evidence
          path: stage4-source
      - name: Fail closed on any missing date, duplicate, SHA, or identity mismatch
        run: |
          python -u research_pit/pit_stage5_daily_roster.py \
            --mode verify --roster-dir stage5-rosters --root pitdata \
            --stage2-dir stage2-source --stage4-dir stage4-source \
            --out reports/pit-stage5 --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage5-date-scoped-market-membership-audit
          path: reports/pit-stage5/
          if-no-files-found: warn
          retention-days: 90

  stage6-offline-contracts:
    if: ${{ github.event.inputs.audit_phase == 'stage6' }}
    name: Stage6 offline cap/roster provenance and fail-closed contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pit_stage6_market_cap.py' -v

  stage6-marketcap-canary:
    if: ${{ github.event.inputs.audit_phase == 'stage6' }}
    needs: stage6-offline-contracts
    name: Stage6 historical KRX market-cap actual four-date canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pykrx==1.2.9'
      - name: Pin original price, Stage2, Stage4, and Stage5 completed identities
        shell: bash
        run: |
          set -euo pipefail
          for item in '39295295197:08e328c101f0774a2236c0a44cc1fdbbaa59e96e' '39343301692:afeee6010254d37ae4729812c13f4bdf0d97e91e' '39373355974:e2c07532ca507c98d53f061ab987b715cbdfdd50' '39383970402:6d643b3aade052ebf7e330c5bc005cff36847cf2'; do
            rid="${item%%:*}"
            sha="${item#*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .head_sha)" = "$sha"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .conclusion)" = success
          done
          test -n "${KRX_ID:-}" && test -n "${KRX_PW:-}"
          echo STAGE6_FOUR_SOURCE_IDENTITY_PINS_PASS
      - name: Download Stage2 fixed historical four-date canonical code sets
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Probe actual 2019/2022/2024/2026 market-cap source and exact dated membership
        shell: bash
        run: |
          python -u research_pit/pit_stage6_market_cap.py \
            --mode canary --stage2-dir stage2-source \
            --out reports/pit-stage6-canary --pause 1.4
      - name: Save canary evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage6-marketcap-canary
          path: reports/pit-stage6-canary/
          if-no-files-found: warn
          retention-days: 90

  stage6-marketcap-eight-shards:
    if: ${{ github.event.inputs.audit_phase == 'stage6' }}
    needs: stage6-marketcap-canary
    name: Stage6 KRX historical dated cap + shares snapshots (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pykrx==1.2.9'
      - name: Download only the corresponding immutable Stage5 dated-market roster shard
        uses: actions/download-artifact@v4
        with:
          run-id: 39383970402
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage5-shard-${{ matrix.shard }}
          path: stage5-rosters
      - name: Fetch dated KRX cap snapshots without filtering, score/rank, or trading
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          shard_dir=$(printf 'stage6-cap/shard_%02d' "$SHARD")
          python -u research_pit/pit_stage6_market_cap.py \
            --mode scan --stage5-dir stage5-rosters \
            --shard "$SHARD" --out "$shard_dir" --pause 1.4
      - name: Preserve partial or complete SHA-pinned raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage6-cap-shard-${{ matrix.shard }}
          path: stage6-cap/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  stage6-verified-marketcap-merge:
    if: ${{ github.event.inputs.audit_phase == 'stage6' }}
    needs: stage6-marketcap-eight-shards
    name: Stage6 verify 1907 daily cap snapshots versus immutable 5,090,428 source rows
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore completed Stage6 date-and-cap evidence
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-pit-stage6-cap-shard-*
          path: stage6-cap
          merge-multiple: true
      - name: Restore original immutable Stage5 market memberships
        uses: actions/download-artifact@v4
        with:
          run-id: 39383970402
          github-token: ${{ github.token }}
          pattern: stockhunter-pit-stage5-shard-*
          path: stage5-rosters
          merge-multiple: true
      - name: Restore original immutable Stage1 SHA-validated price rows (no KRX refetch)
        uses: actions/download-artifact@v4
        with:
          run-id: 39295295197
          github-token: ${{ github.token }}
          pattern: stockhunter-allkrx-price-shard-*
          path: pitdata
          merge-multiple: true
      - name: Restore Stage2 source calendar and observed ticker evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 39343301692
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage2-crossendpoint-evidence
          path: stage2-source
      - name: Restore Stage4 evidence (NEVER treat retrospective type as confirmed)
        uses: actions/download-artifact@v4
        with:
          run-id: 39373355974
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage4-retrospective-type-evidence
          path: stage4-source
      - name: Compare every date/code, cap/price volume, amount, and retained type uncertainty
        shell: bash
        run: |
          python -u research_pit/pit_stage6_market_cap.py \
            --mode verify --stage6-dir stage6-cap --stage5-dir stage5-rosters \
            --price-dir pitdata --stage2-dir stage2-source \
            --stage4-dir stage4-source --out reports/pit-stage6
      - name: Publish summary and conflicts even if identity or SHA audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-pit-stage6-dated-cap-source-audit
          path: reports/pit-stage6/
          if-no-files-found: warn
          retention-days: 90

  stage7-offline-contracts:
    if: ${{ github.event.inputs.audit_phase == 'stage7' }}
    name: Stage7 official halt source contracts (offline / RESEARCH_ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test halt API identity, empty response behavior, source hashes and no backtest promotion
        run: python -m unittest discover -s tests -p 'test_pit_stage7_official_halts.py' -v

  stage7-official-halt-canary:
    if: ${{ github.event.inputs.audit_phase == 'stage7' }}
    needs: stage7-offline-contracts
    name: Stage7 KRX 20011 bounded historical halt-register canary (12 targeted codes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      STOCKHUNTER_RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pykrx==1.2.9' 'requests>=2.31,<3'
      - name: Pin prior Stage3 and Stage6 immutable sources by run and commit identities
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            '39364301572:d45fcee5529c339fbbaf721425d249dfa3e2ef39' \
            '39408210227:ccdeaf82e46164e78f3891742db1c58a75c6bde7'; do
            rid="${item%%:*}"
            sha="${item#*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .head_sha)" = "$sha"
          done
          test -n "${KRX_ID:-}" && test -n "${KRX_PW:-}"
          echo 'STAGE7_SOURCES_AND_KRX_SECRETS_PINNED'
      - name: Restore Stage3 original event responses and ISINs (small; SHA audited)
        uses: actions/download-artifact@v4
        with:
          run-id: 39364301572
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage3-krx-official-event-evidence
          path: stage3-source
      - name: Restore Stage6 code-wise zero-volume proxy only (NO 5M-row fetch)
        uses: actions/download-artifact@v4
        with:
          run-id: 39408210227
          github-token: ${{ github.token }}
          name: stockhunter-pit-stage6-dated-cap-source-audit
          path: stage6-source
