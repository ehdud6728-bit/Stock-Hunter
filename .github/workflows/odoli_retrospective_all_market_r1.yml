name: ODOLI Retrospective All-Market R1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - { id: "2024H1", start: "2024-01-01", end: "2024-06-30" }
          - { id: "2024H2", start: "2024-07-01", end: "2024-12-31" }
          - { id: "2025H1", start: "2025-01-01", end: "2025-06-30" }
          - { id: "2025H2", start: "2025-07-01", end: "2025-12-31" }
          - { id: "2026H1", start: "2026-01-01", end: "2026-06-30" }
          - { id: "2026H2", start: "2026-07-01", end: "2026-09-24" }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Fetch FinanceData marcap point-in-time dataset
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          git ls-tree -r --name-only HEAD | \
            grep -E '^(__init__\.py|marcap_utils\.py|data/.*(2023|2024|2025|2026).*\.csv\.gz)$' \
            > /tmp/marcap_paths.txt
          cat /tmp/marcap_paths.txt
          test -s /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..
          test -f vendor/marcap/__init__.py
      - name: Scan marcap PIT ODOLI events
        run: |
          python -u odoli_retrospective_all_market_r1.py \
            --start "${{ matrix.shard.start }}" \
            --end "${{ matrix.shard.end }}" \
            --output-dir "reports/odoli_r1/${{ matrix.shard.id }}" \
            --marcap-root vendor
      - name: Validate PIT authority
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r1/${{ matrix.shard.id }}/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_threshold_tuning"] is False
          assert m["definition"]=="STRICT_ODOLI_R1"
          assert m["status"]=="PASS"
          assert m["historical_membership_authority"]=="FINANCEDATA_MARCAP_DAILY_PIT_ROWS"
          assert m["point_in_time_universe"] is True
          assert m["current_only_universe_used"] is False
          assert m["source_valid_rows"]>0
          assert m["market_days"]>0
          assert m["amount_nonnull_pct"]>95.0
          print("ODOLI R1 FIX6 PIT PASS",m)
          PY
      - name: Upload shard result or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoli-r1-shard-${{ matrix.shard.id }}-${{ github.run_id }}
          path: reports/odoli_r1/${{ matrix.shard.id }}/**
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: scan
    if: ${{ always() && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: odoli-r1-shard-*
          path: shard_artifacts
          merge-multiple: false
      - name: Download frozen R1.3 reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r13
          gh run download "35443265652" -D source_r13
      - name: Merge and compare
        run: |
          python -u odoli_retrospective_all_market_r1_merge.py \
            --shards-root shard_artifacts \
            --r13-root source_r13 \
            --output-dir reports/odoli_retrospective_all_market_r1
      - name: Show report
        run: cat reports/odoli_retrospective_all_market_r1/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: odoli-retrospective-all-market-r1-${{ github.run_id }}
          path: reports/odoli_retrospective_all_market_r1/**
          retention-days: 30
