name: ODOLI Retrospective All-Market R1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: "2024H1", start: "2024-01-01", end: "2024-06-30" }
          - { id: "2024H2", start: "2024-07-01", end: "2024-12-31" }
          - { id: "2025H1", start: "2025-01-01", end: "2025-06-30" }
          - { id: "2025H2", start: "2025-07-01", end: "2025-12-31" }
          - { id: "2026H1", start: "2026-01-01", end: "2026-06-30" }
          - { id: "2026H2", start: "2026-07-01", end: "2026-09-24" }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy pykrx requests
      - name: Restore ODOLI daily market cache
        uses: actions/cache@v4
        with:
          path: reports/.cache/odoli_all_market_r1
          key: odoli-all-market-r1-${{ matrix.shard.id }}-${{ github.run_id }}
          restore-keys: |
            odoli-all-market-r1-${{ matrix.shard.id }}-
      - name: Scan all-market ODOLI events
        run: |
          python -u odoli_retrospective_all_market_r1.py \
            --start "${{ matrix.shard.start }}" \
            --end "${{ matrix.shard.end }}" \
            --output-dir "reports/odoli_r1/${{ matrix.shard.id }}"
      - name: Validate research isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/odoli_r1/${{ matrix.shard.id }}/meta.json")
          m=json.loads(p.read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_threshold_tuning"] is False
          assert m["definition"]=="STRICT_ODOLI_R1"
          print("ODOLI R1 SHARD PASS",m["events"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r1-shard-${{ matrix.shard.id }}-${{ github.run_id }}
          path: reports/odoli_r1/${{ matrix.shard.id }}/**
          retention-days: 30

  merge:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Download all scan shards
        uses: actions/download-artifact@v4
        with:
          pattern: odoli-r1-shard-*
          path: shard_artifacts
          merge-multiple: false
      - name: Download frozen R1.3 reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r13
          gh run download "35443265652" -D source_r13
      - name: Merge and compare with R1.3 overlap
        run: |
          python -u odoli_retrospective_all_market_r1_merge.py \
            --shards-root shard_artifacts \
            --r13-root source_r13 \
            --output-dir reports/odoli_retrospective_all_market_r1
      - name: Validate population authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/odoli_retrospective_all_market_r1/meta.json")
          m=json.loads(p.read_text())
          assert m["research_only"] is True
          assert m["population_authority"]=="ALL_MARKET_ODOLI_EVENTS_NOT_R13_523"
          assert m["feature_quintiles_descriptive_only"] is True
          assert m["production_logic_changed"] is False
          print("ODOLI ALL-MARKET R1 MERGE PASS",m)
          PY
      - name: Show report
        run: cat reports/odoli_retrospective_all_market_r1/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: odoli-retrospective-all-market-r1-${{ github.run_id }}
          path: reports/odoli_retrospective_all_market_r1/**
          retention-days: 30
