name: EARLY POWER R6.2 Prospective OOS Shadow

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional exact run_scanner run ID; blank = newest successful run that contains real_full_trust_source.csv"
        required: false
        default: ""
  schedule:
    - cron: "20 7 * * 1-5"

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Seoul

jobs:
  r6-prospective-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests

      - name: Resolve newest REAL_FULL trust-source run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          python - <<'PY'
          import io,os,pathlib,shutil,zipfile,requests
          repo=os.environ["GITHUB_REPOSITORY"]
          H={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          base=f"https://api.github.com/repos/{repo}"
          explicit=os.environ.get("INPUT_SOURCE_RUN_ID","").strip()
          def probe(run_id):
              ar=requests.get(f"{base}/actions/runs/{run_id}/artifacts?per_page=100",headers=H,timeout=60); ar.raise_for_status()
              arts=[a for a in ar.json().get("artifacts",[]) if not a.get("expired")]
              arts=sorted(arts,key=lambda a:(0 if "report" in a.get("name","").lower() else 1,0 if "real" in a.get("name","").lower() else 1,a.get("name","")))
              for a in arts:
                  z=requests.get(f"{base}/actions/artifacts/{a['id']}/zip",headers=H,timeout=90,allow_redirects=True)
                  if not z.ok: continue
                  td=pathlib.Path("/tmp/source")/f"run_{run_id}_artifact_{a['id']}"
                  shutil.rmtree(td,ignore_errors=True); td.mkdir(parents=True,exist_ok=True)
                  try: zipfile.ZipFile(io.BytesIO(z.content)).extractall(td)
                  except Exception: continue
                  hits=list(td.rglob("real_full_trust_source.csv"))
                  if hits:return hits[0],a
              return None,None
          if explicit:
              found,art=probe(explicit)
              if found is None: raise SystemExit(f"R6_EXPLICIT_RUN_HAS_NO_TRUST_SOURCE:{explicit}")
              chosen=explicit
          else:
              chosen=found=art=None
              for page in range(1,6):
                  rr=requests.get(f"{base}/actions/workflows/run_scanner.yml/runs?status=success&per_page=50&page={page}",headers=H,timeout=60)
                  rr.raise_for_status(); runs=rr.json().get("workflow_runs",[])
                  if not runs: break
                  for run in runs:
                      rid=str(run["id"]); f,a=probe(rid)
                      print("R6_SOURCE_PROBE",rid,"FOUND" if f else "NO_TRUST_SOURCE")
                      if f: chosen,found,art=rid,f,a; break
                  if found: break
              if found is None: raise SystemExit("R6_NO_SUCCESSFUL_RUN_SCANNER_WITH_TRUST_SOURCE")
          pathlib.Path("/tmp/original_source_path.txt").write_text(str(found),encoding="utf-8")
          pathlib.Path("/tmp/source_run_id.txt").write_text(str(chosen),encoding="utf-8")
          pathlib.Path("/tmp/source_artifact_id.txt").write_text(str(art["id"]),encoding="utf-8")
          pathlib.Path("/tmp/source_artifact_name.txt").write_text(str(art["name"]),encoding="utf-8")
          print("R6_ORIGINAL_SOURCE_SELECTED",chosen,art["id"],art["name"],found)
          PY

      - name: Download previous R6.2 ledger if present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous
          python - <<'PY'
          import io,os,pathlib,zipfile,requests
          repo=os.environ["GITHUB_REPOSITORY"]
          H={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          base=f"https://api.github.com/repos/{repo}"
          names=["early-power-r6-2-oos-ledger","early-power-r6-1-oos-ledger","early-power-r6-oos-ledger"]
          arts=[]
          for name in names:
              r=requests.get(f"{base}/actions/artifacts?per_page=100&name={name}",headers=H,timeout=60)
              if r.ok: arts.extend([a for a in r.json().get("artifacts",[]) if not a.get("expired")])
          if not arts:
              print("R6_PREVIOUS_LEDGER NONE"); raise SystemExit(0)
          a=sorted(arts,key=lambda x:x["created_at"],reverse=True)[0]
          z=requests.get(f"{base}/actions/artifacts/{a['id']}/zip",headers=H,timeout=90,allow_redirects=True); z.raise_for_status()
          zipfile.ZipFile(io.BytesIO(z.content)).extractall("/tmp/previous")
          cand=list(pathlib.Path("/tmp/previous").rglob("r6_oos_candidate_ledger.csv"))
          coh=list(pathlib.Path("/tmp/previous").rglob("r6_oos_cohort_ledger.csv"))
          if cand:pathlib.Path("/tmp/previous_ledger_path.txt").write_text(str(cand[0]),encoding="utf-8")
          if coh:pathlib.Path("/tmp/previous_cohorts_path.txt").write_text(str(coh[0]),encoding="utf-8")
          print("R6_PREVIOUS_LEDGER",a["id"],cand[:1],coh[:1])
          PY

      - name: Fetch marcap 2025-2026
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap; mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2025.parquet' 'data/marcap-2026.parquet' >/tmp/m.txt
          git sparse-checkout set --stdin </tmp/m.txt
          git checkout
          cd ../..

      - name: Run frozen R6.2 OOS shadow
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat /tmp/original_source_path.txt)
          PREV=""; COH=""
          if [ -f /tmp/previous_ledger_path.txt ]; then PREV=$(cat /tmp/previous_ledger_path.txt); fi
          if [ -f /tmp/previous_cohorts_path.txt ]; then COH=$(cat /tmp/previous_cohorts_path.txt); fi
          ARGS=(--marcap vendor/marcap/data/marcap-2025.parquet vendor/marcap/data/marcap-2026.parquet --original-source "$SRC" --out reports/early_power_r6)
          if [ -n "$PREV" ]; then ARGS+=(--previous-ledger "$PREV"); fi
          if [ -n "$COH" ]; then ARGS+=(--previous-cohorts "$COH"); fi
          python early_power_r6_2_oos.py "${ARGS[@]}"

      - name: Attach source provenance
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("reports/early_power_r6/meta.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          m["resolved_source_run_id"]=pathlib.Path("/tmp/source_run_id.txt").read_text().strip()
          m["resolved_source_artifact_id"]=pathlib.Path("/tmp/source_artifact_id.txt").read_text().strip()
          m["resolved_source_artifact_name"]=pathlib.Path("/tmp/source_artifact_name.txt").read_text().strip()
          m["source_resolver_revision"]="R6_1_PROBE_UNTIL_TRUST_SOURCE"
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Validate frozen authority
        shell: bash
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/early_power_r6/meta.json",encoding="utf-8"))
          assert m["revision"]=="EARLY_POWER_R6_2_PENDING_BACKFILL_20261005"
          assert m["frozen_rule_id"]=="R6_FROZEN_V1"
          assert m["research_only"] and m["prospective_only"]
          for k in ["production_changed","production_search_changed","production_score_changed",
                    "production_rank_changed","production_order_changed","automatic_orders","same_sample_retuning"]:
              assert m[k] is False
          q=pd.read_csv("reports/early_power_r6/r6_today_shadow_board.csv",dtype={"code":str})
          o=q[q.lane.eq("ORIGINAL_TOP3")]
          assert 1 <= len(o) <= 3
          e=q[q.lane.eq("EARLY_POWER")]
          assert len(e)<=3
          c=pd.read_csv("reports/early_power_r6/r6_today_cohort_status.csv")
          assert len(c)==1
          assert c.iloc[0]["early_power_status"] in ["DATA_PENDING","READY","BACKFILLED_READY"]
          print("EARLY_POWER_R6_2_FROZEN_AUTHORITY_PASS")
          PY

      - name: Show report
        if: always()
        run: cat reports/early_power_r6/REPORT.txt || true

      - name: Upload persistent R6.2 ledger
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: early-power-r6-2-oos-ledger
          path: reports/early_power_r6/**
          if-no-files-found: error
          retention-days: 90
