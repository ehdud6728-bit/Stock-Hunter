name: ODOLI Entry-Anchored Risk Reward Validation R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoli-entry-anchored-rr-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run entry anchored risk reward validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/odoli_entry_rr_r1

          cat > /tmp/odoli_entry_rr_r1.py <<'PY'
          from pathlib import Path
          import json
          import re
          import numpy as np
          import pandas as pd

          REV="ODOLI_ENTRY_ANCHORED_RR_R1_20261001"
          DEFINITION="STRICT_ODOLI_R1"
          RULESET="FAST_D2_AND_SLOW_C4_FROZEN"
          OUT=Path("reports/odoli_entry_rr_r1")
          OUT.mkdir(parents=True,exist_ok=True)

          STOP_MODES=[
              "SIGNAL_LOW",
              "PRE_CONFIRM_SWING_LOW",
              "CONFIRM_DAY_LOW",
          ]
          HORIZONS=[3,5,10]
          R_TARGETS=[1,2,3,5]

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def is_spac(name):
              s=str(name or "").upper()
              return ("스팩" in s) or ("SPAC" in s)

          def load_marcap():
              p=Path("vendor/marcap/data/marcap-2026.parquet")
              q=pd.read_parquet(p)
              if "Date" not in q.columns:
                  q=q.reset_index()
              q["Date"]=pd.to_datetime(q["Date"],errors="coerce").dt.normalize()
              q["Code"]=q["Code"].map(norm_code)
              if "Market" in q.columns:
                  q=q[q["Market"].astype(str).str.upper().isin(["KOSPI","KOSDAQ"])]
              for c in ["Open","High","Low","Close","Volume","Amount"]:
                  q[c]=pd.to_numeric(q[c],errors="coerce")
              q=q.dropna(subset=["Date","Code","Open","High","Low","Close"])
              q=q[q["Code"].ne("")]
              return q.sort_values(["Code","Date"]).drop_duplicates(["Code","Date"],keep="last")

          def add_features(g):
              g=g.sort_values("Date").reset_index(drop=True).copy()
              c=pd.to_numeric(g["Close"],errors="coerce")
              g["ma5"]=c.rolling(5,min_periods=5).mean()
              g["prev_close"]=c.shift(1)
              g["prev_ma5"]=g["ma5"].shift(1)
              g["prev2_close"]=c.shift(2)
              g["prev2_ma5"]=g["ma5"].shift(2)
              g["prev3_close"]=c.shift(3)
              g["prev3_ma5"]=g["ma5"].shift(3)
              g["pre3_below_ma5_n"]=(
                  (g["prev_close"]<g["prev_ma5"]).astype(float)
                  +(g["prev2_close"]<g["prev2_ma5"]).astype(float)
                  +(g["prev3_close"]<g["prev3_ma5"]).astype(float)
              )
              g["ma5_slope_1d_pct"]=(g["ma5"]/g["prev_ma5"]-1)*100
              g["strict_odoli_r1"]=(
                  (g["Close"]>g["Open"])
                  & (g["prev_close"]<g["prev_ma5"])
                  & (g["Close"]>g["ma5"])
                  & (g["ma5_slope_1d_pct"]>0)
                  & (g["pre3_below_ma5_n"]>=2)
              )
              return g

          mar=load_marcap()
          sessions=sorted(pd.Timestamp(x).normalize() for x in mar["Date"].dropna().unique())
          if len(sessions)<60:
              raise SystemExit("INSUFFICIENT_SESSIONS")

          latest=sessions[-1]
          # Signal must have enough room for C4 confirmation up to D10 plus another D10 forward path.
          # Use 20 trading sessions of maturity to avoid future leakage/truncation.
          mature_signal_end=sessions[-21]
          signal_dates=[d for d in sessions if d<=mature_signal_end][-30:]
          signal_set=set(signal_dates)

          rows=[]
          for code,g0 in mar.groupby("Code",sort=False):
              g=add_features(g0)
              amount=pd.to_numeric(g["Amount"],errors="coerce")
              ma5=pd.to_numeric(g["ma5"],errors="coerce")

              hits=g.index[g["Date"].isin(signal_set) & g["strict_odoli_r1"].fillna(False)]
              for i0 in hits:
                  i=int(i0)
                  if i+20>=len(g):
                      continue

                  sig_close=float(g.iloc[i]["Close"])
                  sig_low=float(g.iloc[i]["Low"])
                  name=str(g.iloc[i].get("Name","") or "")
                  spac=is_spac(name)

                  # FAST is known only at D2 close.
                  d1_low=float(g.iloc[i+1]["Low"])
                  d2_low=float(g.iloc[i+2]["Low"])
                  d2_close=float(g.iloc[i+2]["Close"])
                  fast=bool(d2_low>d1_low and pd.notna(ma5.iloc[i+2]) and d2_close>float(ma5.iloc[i+2]))

                  confirm_idx=None
                  path_class=None

                  if fast:
                      confirm_idx=i+2
                      path_class="FAST_D2"
                  else:
                      # SLOW_C4 is known only on the first actual C4 confirmation day.
                      for j in range(i+4,i+11):
                          close=float(g.iloc[j]["Close"])
                          low=float(g.iloc[j]["Low"])
                          prev_low=float(g.iloc[j-1]["Low"])
                          above=bool(pd.notna(ma5.iloc[j]) and close>float(ma5.iloc[j]))
                          higher_low=bool(low>prev_low)

                          pre20=amount.iloc[max(0,j-20):j]
                          ama=float(pre20.mean()) if len(pre20) else np.nan
                          ar=float(amount.iloc[j]/ama) if pd.notna(ama) and ama>0 else np.nan

                          survive=bool(
                              pd.to_numeric(g.iloc[i+1:j+1]["Low"],errors="coerce").min()>=sig_low
                          )
                          c4=bool(above and higher_low and pd.notna(ar) and ar>=1.0 and survive)
                          if c4:
                              confirm_idx=j
                              path_class="SLOW_C4"
                              break

                  if confirm_idx is None:
                      continue
                  if confirm_idx+10>=len(g):
                      continue

                  entry=float(g.iloc[confirm_idx]["Close"])
                  confirm_low=float(g.iloc[confirm_idx]["Low"])
                  confirm_day=confirm_idx-i

                  # Only information observable at entry is used.
                  # Pre-confirm swing low = minimum Low of previous 2 completed sessions,
                  # excluding confirmation day's own low.
                  pre_start=max(i+1,confirm_idx-2)
                  pre_slice=g.iloc[pre_start:confirm_idx]
                  pre_swing_low=float(pd.to_numeric(pre_slice["Low"],errors="coerce").min()) if len(pre_slice) else np.nan

                  stop_map={
                      "SIGNAL_LOW":sig_low,
                      "PRE_CONFIRM_SWING_LOW":pre_swing_low,
                      "CONFIRM_DAY_LOW":confirm_low,
                  }

                  base={
                      "signal_date":pd.Timestamp(g.iloc[i]["Date"]).date().isoformat(),
                      "confirm_date":pd.Timestamp(g.iloc[confirm_idx]["Date"]).date().isoformat(),
                      "code":code,
                      "name":name,
                      "market":str(g.iloc[i].get("Market","") or ""),
                      "is_spac":spac,
                      "path_class":path_class,
                      "confirm_day":confirm_day,
                      "signal_close":sig_close,
                      "signal_low":sig_low,
                      "entry_close":entry,
                      "entry_vs_signal_pct":(entry/sig_close-1)*100,
                      "confirm_day_low":confirm_low,
                      "pre_confirm_swing_low":pre_swing_low,
                      "entry_above_ma5_pct":((entry/float(ma5.iloc[confirm_idx])-1)*100) if pd.notna(ma5.iloc[confirm_idx]) and ma5.iloc[confirm_idx]>0 else np.nan,
                  }

                  for stop_mode,stop in stop_map.items():
                      if pd.isna(stop) or stop<=0 or stop>=entry:
                          continue

                      risk_pct=(entry/stop-1)*100
                      risk_abs=entry-stop

                      r=dict(base)
                      r["stop_mode"]=stop_mode
                      r["stop_price"]=stop
                      r["risk_pct"]=risk_pct

                      for h in HORIZONS:
                          q=g.iloc[confirm_idx+1:confirm_idx+h+1]
                          high=pd.to_numeric(q["High"],errors="coerce")
                          low=pd.to_numeric(q["Low"],errors="coerce")
                          close_h=float(g.iloc[confirm_idx+h]["Close"])

                          mfe_pct=float(((high/entry-1)*100).max())
                          mae_pct=float(((low/entry-1)*100).min())
                          r[f"post_d{h}_mfe_pct"]=mfe_pct
                          r[f"post_d{h}_mae_pct"]=mae_pct
                          r[f"post_d{h}_close_ret_pct"]=(close_h/entry-1)*100

                          # Conservative daily-bar ordering:
                          # if stop and target could both occur in same daily bar, treat stop as first.
                          stop_hit=False
                          hit_day=np.nan
                          max_r=0.0
                          for k in range(1,h+1):
                              bar=g.iloc[confirm_idx+k]
                              bar_low=float(bar["Low"])
                              bar_high=float(bar["High"])

                              if bar_low<=stop:
                                  stop_hit=True
                                  hit_day=k
                                  break

                              bar_r=(bar_high-entry)/risk_abs
                              if bar_r>max_r:
                                  max_r=bar_r

                          r[f"post_d{h}_stop_hit"]=stop_hit
                          r[f"post_d{h}_stop_day"]=hit_day
                          r[f"post_d{h}_max_r_before_stop"]=max_r
                          for target in R_TARGETS:
                              r[f"post_d{h}_touch_{target}R_before_stop"]=bool(max_r>=target)

                      rows.append(r)

          ev=pd.DataFrame(rows)
          if ev.empty:
              raise SystemExit("NO_ENTRY_ANCHORED_EVENTS")

          ev["signal_date"]=pd.to_datetime(ev["signal_date"]).dt.normalize()
          ev["confirm_date"]=pd.to_datetime(ev["confirm_date"]).dt.normalize()
          ev.to_csv(OUT/"entry_anchored_events.csv",index=False,encoding="utf-8-sig")

          non=ev[~ev["is_spac"]].copy()

          summary=[]
          for (path,stop_mode),g in non.groupby(["path_class","stop_mode"],sort=False):
              row={
                  "path_class":path,
                  "stop_mode":stop_mode,
                  "n":len(g),
                  "risk_pct_median":float(g["risk_pct"].median()),
                  "risk_pct_p25":float(g["risk_pct"].quantile(.25)),
                  "risk_pct_p75":float(g["risk_pct"].quantile(.75)),
                  "entry_vs_signal_pct_median":float(g["entry_vs_signal_pct"].median()),
              }
              for h in HORIZONS:
                  row[f"d{h}_stop_rate_pct"]=float(g[f"post_d{h}_stop_hit"].mean()*100)
                  row[f"d{h}_1R_rate_pct"]=float(g[f"post_d{h}_touch_1R_before_stop"].mean()*100)
                  row[f"d{h}_2R_rate_pct"]=float(g[f"post_d{h}_touch_2R_before_stop"].mean()*100)
                  row[f"d{h}_3R_rate_pct"]=float(g[f"post_d{h}_touch_3R_before_stop"].mean()*100)
                  row[f"d{h}_5R_rate_pct"]=float(g[f"post_d{h}_touch_5R_before_stop"].mean()*100)
                  row[f"d{h}_max_r_median"]=float(g[f"post_d{h}_max_r_before_stop"].median())
                  row[f"d{h}_close_ret_median_pct"]=float(g[f"post_d{h}_close_ret_pct"].median())
              summary.append(row)

          sm=pd.DataFrame(summary)
          sm.to_csv(OUT/"summary_by_entry_and_stop.csv",index=False,encoding="utf-8-sig")

          # Pre-entry feature table for the next holdout study.
          # No model / threshold is selected here.
          feature_cols=[
              "signal_date","confirm_date","code","name","path_class","confirm_day",
              "entry_close","entry_vs_signal_pct","entry_above_ma5_pct",
              "signal_low","pre_confirm_swing_low","confirm_day_low",
              "stop_mode","risk_pct",
              "post_d10_stop_hit","post_d10_max_r_before_stop",
              "post_d10_touch_1R_before_stop","post_d10_touch_2R_before_stop",
              "post_d10_touch_3R_before_stop","post_d10_touch_5R_before_stop",
          ]
          non[[c for c in feature_cols if c in non.columns]].to_csv(
              OUT/"pre_entry_features_with_outcomes_for_future_holdout.csv",
              index=False,encoding="utf-8-sig"
          )

          meta={
              "revision":REV,
              "definition":DEFINITION,
              "ruleset":RULESET,
              "research_only":True,
              "production_search_changed":False,
              "production_score_changed":False,
              "production_rank_changed":False,
              "production_order_changed":False,
              "automatic_ordering":False,
              "same_sample_tuning":False,
              "stop_rule_promoted":False,
              "entry_rule_promoted":False,
              "interpretation_scope":"ENTRY_ANCHORED_HISTORICAL_ROBUSTNESS_NOT_TRUE_OOS",
              "latest_data_date":latest.date().isoformat(),
              "signal_window_start":signal_dates[0].date().isoformat(),
              "signal_window_end":signal_dates[-1].date().isoformat(),
              "signal_sessions":len(signal_dates),
              "rows_all_stop_variants":len(ev),
              "rows_non_spac_stop_variants":len(non),
              "unique_confirmed_events_non_spac":int(non[["signal_date","code","path_class"]].drop_duplicates().shape[0]),
              "stop_modes":STOP_MODES,
              "horizons":HORIZONS,
              "r_targets":R_TARGETS,
              "same_bar_policy":"STOP_FIRST_CONSERVATIVE",
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")

          report=[
              "# ODOLI Entry-Anchored Risk/Reward Validation R1",
              "",
              "- FAST entry = D2 close, only after FAST is observable.",
              "- SLOW_C4 entry = first C4 confirmation-day close, only after C4 is observable.",
              "- Stop candidates are compared, not promoted.",
              "- Same-bar stop/target ambiguity is treated conservatively as STOP FIRST.",
              "- SPAC rows excluded from primary summary.",
              "- Historical robustness only; not true untouched OOS.",
              "- No production/search/score/rank/order changes.",
              "",
              "## Meta",
              "```",
              json.dumps(meta,ensure_ascii=False,indent=2),
              "```",
              "",
              "## Summary",
              "```",
              sm.to_string(index=False),
              "```",
          ]
          (OUT/"REPORT.md").write_text("\n".join(report),encoding="utf-8")

          print("ODOLI_ENTRY_ANCHORED_RR_PASS")
          print(json.dumps(meta,ensure_ascii=False))
          print(sm.to_string(index=False))
          PY

          python /tmp/odoli_entry_rr_r1.py

      - name: Validate anti leakage and research isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pandas as pd

          m=json.load(open("reports/odoli_entry_rr_r1/meta.json",encoding="utf-8"))
          assert m["definition"]=="STRICT_ODOLI_R1"
          assert m["ruleset"]=="FAST_D2_AND_SLOW_C4_FROZEN"
          assert m["research_only"] is True
          assert m["production_search_changed"] is False
          assert m["production_score_changed"] is False
          assert m["production_rank_changed"] is False
          assert m["production_order_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["same_sample_tuning"] is False
          assert m["stop_rule_promoted"] is False
          assert m["entry_rule_promoted"] is False
          assert m["same_bar_policy"]=="STOP_FIRST_CONSERVATIVE"

          q=pd.read_csv("reports/odoli_entry_rr_r1/entry_anchored_events.csv",low_memory=False)
          assert len(q)>0
          assert (pd.to_numeric(q["risk_pct"],errors="coerce")>0).all()

          # FAST must be entered exactly on D2; SLOW only on D4~D10 confirmation.
          f=q[q["path_class"].eq("FAST_D2")]
          s=q[q["path_class"].eq("SLOW_C4")]
          assert (pd.to_numeric(f["confirm_day"],errors="coerce")==2).all()
          assert pd.to_numeric(s["confirm_day"],errors="coerce").between(4,10).all()

          print("ODOLI_ENTRY_ANCHORED_ANTI_LEAKAGE_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/odoli_entry_rr_r1/meta.json || true
          echo
          cat reports/odoli_entry_rr_r1/REPORT.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoli-entry-anchored-risk-reward-r1
          path: reports/odoli_entry_rr_r1/**
          if-no-files-found: error
          retention-days: 90
