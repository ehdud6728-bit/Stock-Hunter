name: CORE224 R3 Build Complete run_scanner YAML (NO PUSH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-complete-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build finished run_scanner.yml from CURRENT checked-out repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas
          python core224_live_date_selector_r3.py --self-test
          mkdir -p ready_upload
          cp .github/workflows/run_scanner.yml ready_upload/run_scanner.yml
          python core224_live_date_selector_r3.py --patch-workflow ready_upload/run_scanner.yml
          test -s ready_upload/run_scanner.yml
          grep -F 'python -u core224_live_date_selector_r3.py --patch-main "$SCRIPT"' ready_upload/run_scanner.yml
          echo 'CORE224_R3_COMPLETE_FILE_READY (NO PUSH, NO PRODUCTION EDIT)'
          sha256sum ready_upload/run_scanner.yml
      - name: Downloadable finished run_scanner.yml
        uses: actions/upload-artifact@v4
        with:
          name: CORE224_R3_READY_TO_UPLOAD_RUN_SCANNER
          path: ready_upload/run_scanner.yml
          if-no-files-found: error
          retention-days: 30
