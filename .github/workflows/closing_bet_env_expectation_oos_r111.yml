name: Closing Bet Market Env + Expectation OOS R1.0.11

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "35295676895"
        type: string
      r105_run_id:
        required: true
        default: "35319857025"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Download inputs
        run: |
          mkdir -p source_artifacts r105_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
          gh run download "${{ inputs.r105_run_id }}" -D r105_artifacts

      - name: Run R1.0.11
        run: |
          python -u closing_bet_env_expectation_oos_r111.py \
            --r105-root r105_artifacts \
            --source-root source_artifacts \
            --output-dir reports/closebet_env_expectation_oos_r111

      - name: Validate invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_env_expectation_oos_r111/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert m['external_context_shadow_only']
          assert m['expectation_context_shadow_only']
          assert not m['same_sample_retuning']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['candidate_filter_created']
          assert not m['order_logic_changed']
          assert m['independent_signal_date_count_reported']
          assert m['no_hindsight_news_backfill']
          assert int(m['pit_fail_rows'])==0
          assert int(m['oos_rows'])>0
          assert int(m['signal_dates'])>3
          print('R111_ENV_EXPECTATION PASS',m['oos_rows'],m['signal_dates'],m['expectation_text_rows'])
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-env-expectation-r111-${{ github.run_id }}
          path: reports/closebet_env_expectation_oos_r111/**
          if-no-files-found: warn
          retention-days: 30
