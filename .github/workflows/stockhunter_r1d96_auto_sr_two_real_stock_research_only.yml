name: StockHunter R1D96 Auto Upper-Lower Trendlines 2 Real Stocks (RESEARCH_ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check research inputs are committed
        run: |
          test -f research_projects/r1d96/SHA256_INPUTS.txt
          test -f research_projects/r1d96/data/053800_KRX.csv
          test -f research_projects/r1d96/data/220260_KRX.csv
      - name: Verify frozen original data hashes
        working-directory: research_projects/r1d96
        run: sha256sum --check SHA256_INPUTS.txt
      - name: Install research-only dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Auto upper/lower pivot and trendline validation
        working-directory: research_projects/r1d96
        run: python research_r1d96.py
      - name: Unit tests
        working-directory: research_projects/r1d96
        run: python -m unittest discover -s tests -v
      - name: Package independent research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R1D96_AUTO_UPPER_LOWER_RESEARCH_ONLY
          path: |
            research_projects/r1d96/results/
            research_projects/r1d96/CONSOLE_RUN.txt
            research_projects/r1d96/README_R1D96_KO.md
          retention-days: 30
