name: ODOLI R2.16 Two-Year Frozen Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download 2024-2025 v49.76 authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_v4976
          gh run download "36318449010" \
            -n "v49.76.6.7.3.2.5.1.2.1-global-performance-199" \
            -D source_v4976

      - name: Download frozen ODOLI R1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_odoli
          gh run download "36129293163" \
            -n "odoli-retrospective-all-market-r1-36129293163" \
            -D source_odoli

      - name: Download frozen R2.3 bins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r23
          gh run download "36143654300" \
            -n "odoli-a-context-r23-36143654300" \
            -D source_r23

      - name: Fetch 2024-2025 PIT marcap
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2024.parquet' 'data/marcap-2025.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run two-year frozen validation
        run: |
          python -u odoli_r216_two_year_validation.py \
            --v4976-root source_v4976 \
            --odoli-root source_odoli \
            --r23-root source_r23 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_r216_two_year_validation

      - name: Validate authority and isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r216_two_year_validation/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_tuning"] is False
          assert m["new_gate_created"] is False
          assert m["selected_a"]==2464
          assert m["technical_fn_a_audit"]==1
          assert m["technical_fn_repaired_into_selected_population"] is False
          assert m["odoli_definition"]=="STRICT_ODOLI_R1"
          print(m)
          PY

      - run: cat reports/odoli_r216_two_year_validation/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r216-two-year-validation-${{ github.run_id }}
          path: reports/odoli_r216_two_year_validation/**
          retention-days: 30
