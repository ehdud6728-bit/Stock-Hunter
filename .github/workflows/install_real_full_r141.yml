name: Install REAL_FULL R1C1 R1.4.1 Runtime Sidecar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-r141:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate patch files
        shell: bash
        run: |
          set -euo pipefail
          test -s real_full_r1c1_capture_wrapper.py
          test -s apply_real_full_r141_patch.py
          python -m py_compile real_full_r1c1_capture_wrapper.py apply_real_full_r141_patch.py

      - name: Apply R1.4.1 patch
        shell: bash
        run: |
          set -euo pipefail
          python apply_real_full_r141_patch.py
          git diff -- .github/workflows/run_scanner.yml .github/workflows/real_full_r1c1_oos_r14.yml

      - name: Commit patched workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/run_scanner.yml .github/workflows/real_full_r1c1_oos_r14.yml
          if git diff --cached --quiet; then
            echo "R141_INSTALL_NO_CHANGES"
            exit 0
          fi
          git commit -m "Add REAL_FULL R1C1 R1.4.1 runtime sidecar routing"
          git push
