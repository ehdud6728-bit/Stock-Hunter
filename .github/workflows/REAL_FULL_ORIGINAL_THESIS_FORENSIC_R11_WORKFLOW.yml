name: REAL_FULL Original Thesis Forensic R1.1

on:
  workflow_dispatch:
    inputs:
      source_r1_run_id:
        description: "Successful REAL_FULL Original Thesis Research R1 run id"
        required: true
        default: "35694917114"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: real-full-original-thesis-forensic-r11-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  forensic-r11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader

      - name: Self-test forensic engine
        run: |
          python -m py_compile real_full_original_thesis_forensic_r11.py
          python real_full_original_thesis_forensic_r11.py --self-test

      - name: Resolve frozen R1 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_R1_RUN_ID: ${{ inputs.source_r1_run_id }}
        run: |
          set -euo pipefail
          mkdir -p source_r1
          python - <<'PY'
          import io,json,os,pathlib,requests,zipfile
          repo=os.environ['GITHUB_REPOSITORY']; rid=int(os.environ['SOURCE_R1_RUN_ID']); token=os.environ['GH_TOKEN']
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f'https://api.github.com/repos/{repo}'
          arts=requests.get(f'{base}/actions/runs/{rid}/artifacts?per_page=100',headers=h,timeout=60).json().get('artifacts',[])
          selected=None
          for a in arts:
              if a.get('expired'): continue
              if str(a.get('name','')).startswith('real-full-original-thesis-r1-'):
                  selected=a; break
          if not selected: raise SystemExit(f'R1_SOURCE_ARTIFACT_NOT_FOUND run={rid}')
          raw=requests.get(f"{base}/actions/artifacts/{selected['id']}/zip",headers=h,timeout=60,allow_redirects=True); raw.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(raw.content)) as z:
              names=z.namelist()
              target=[n for n in names if n.endswith('real_full_original_thesis_r1/real_full_original_thesis_event_master.csv')]
              if not target: raise SystemExit('R1_EVENT_MASTER_NOT_IN_ARTIFACT')
              z.extractall('source_r1')
          meta={'source_r1_run_id':rid,'source_artifact_id':selected['id'],'source_artifact_name':selected['name'],'event_member':target[0]}
          pathlib.Path('source_r1/source_resolution.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('R1_SOURCE_RESOLVED',meta)
          PY

      - name: Run multi-structure success/failure forensic research
        run: |
          set -euo pipefail
          python -u real_full_original_thesis_forensic_r11.py \
            --event-master source_r1/reports/real_full_original_thesis_r1/real_full_original_thesis_event_master.csv \
            --price-cache-dir reports/.cache/real_full_original_thesis_forensic_r11/price_history \
            --allow-price-refetch \
            --output-dir reports/real_full_original_thesis_forensic_r11

      - name: Validate research-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/real_full_original_thesis_forensic_r11/forensic_meta.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='PASS',d
          assert d['research_only'] is True
          assert d['production_eligible'] is False
          assert d['selection_logic_changed'] is False
          assert d['score_rank_changed'] is False
          assert d['order_logic_changed'] is False
          assert d['same_sample_retuning'] is False
          assert d['discovery_end']=='2026-08-28'
          print('FORENSIC_R1_1_INVARIANTS PASS',d['design_hash'])
          PY

      - name: Upload forensic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-original-thesis-forensic-r11-${{ github.run_id }}
          path: |
            reports/real_full_original_thesis_forensic_r11/**
            source_r1/source_resolution.json
          if-no-files-found: warn
          retention-days: 30
