name: Closing Bet v49.76 Live Shadow Board R1.7.3 Single Route Legacy Last

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source v49.76 run
        required: true
        default: "35295676895"
      top_n:
        required: true
        default: "10"
      send_telegram:
        required: true
        type: boolean
        default: false
      allow_historical_test_send:
        required: true
        type: boolean
        default: false
      closing_bet_chat_id_manual:
        description: Optional dedicated close-bet primary chat ID override
        required: false
        default: ""

  workflow_run:
    workflows:
      - "closing-bet-v49.76.6.7.3.2.5.1.2.1-final-universe-source-recovery"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  shadow_telegram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}

      CLOSING_BET_TOKEN: ${{ secrets.TELEGRAM_CLOSEBET_TOKEN || secrets.TELEGRAM_CLOSE_BET_TOKEN || secrets.CLOSING_BET_TOKEN || secrets.CLOSE_BET_TOKEN || secrets.CLOSING_BET_TELEGRAM_TOKEN || secrets.CLOSE_BET_TELEGRAM_TOKEN || vars.TELEGRAM_CLOSEBET_TOKEN || vars.TELEGRAM_CLOSE_BET_TOKEN }}

      # Dedicated aliases first, exactly one effective SHADOW chat.
      CLOSING_BET_CHAT_ID: ${{ inputs.closing_bet_chat_id_manual || secrets.TELEGRAM_CLOSEBET_CHAT_ID || secrets.TELEGRAM_CLOSE_BET_CHAT_ID || secrets.CLOSING_BET_CHAT_ID || secrets.CLOSE_BET_CHAT_ID || secrets.CLOSING_BET_TELEGRAM_CHAT_ID || secrets.CLOSE_BET_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CLOSEBET_ROOM_ID || secrets.TELEGRAM_CLOSE_BET_ROOM_ID || secrets.CLOSING_BET_ROOM_ID || secrets.CLOSE_BET_ROOM_ID || vars.TELEGRAM_CLOSEBET_CHAT_ID || vars.TELEGRAM_CLOSE_BET_CHAT_ID || vars.CLOSING_BET_CHAT_ID || vars.CLOSE_BET_CHAT_ID || vars.CLOSING_BET_TELEGRAM_CHAT_ID || vars.CLOSE_BET_TELEGRAM_CHAT_ID || vars.TELEGRAM_CLOSEBET_ROOM_ID || vars.TELEGRAM_CLOSE_BET_ROOM_ID || vars.CLOSING_BET_ROOM_ID || vars.CLOSE_BET_ROOM_ID }}

      # Production's legacy last fallback only.
      TELEGRAM_DYUL_CHAT_ID: ${{ secrets.TELEGRAM_DYUL_CHAT_ID || vars.TELEGRAM_DYUL_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Resolve source run
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          else
            RID="${{ inputs.source_run_id }}"
          fi
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Verify Telegram route candidates
        shell: bash
        run: |
          python - <<'PY'
          import os
          d=(os.getenv("CLOSING_BET_CHAT_ID") or "").strip()
          l=(os.getenv("TELEGRAM_DYUL_CHAT_ID") or "").strip()
          print("TOKEN_PRESENT", bool((os.getenv("CLOSING_BET_TOKEN") or "").strip()))
          print("DEDICATED_CHAT_PRESENT", bool(d))
          print("LEGACY_LAST_PRESENT", bool(l))
          print("GENERIC_TELEGRAM_CHAT_DISABLED", True)
          PY

      - name: Download source and frozen references
        shell: bash
        run: |
          mkdir -p source_run source_r14 source_r16_a
          gh run download "${{ steps.source.outputs.run_id }}" -D source_run
          gh run download "35445479856" -D source_r14
          gh run download "35469509910" -D source_r16_a

      - name: Build and optionally send R1.7.3 SHADOW
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXTRA="--automatic"
          else
            if [ "${{ inputs.send_telegram }}" = "true" ]; then EXTRA="$EXTRA --send-telegram"; fi
            if [ "${{ inputs.allow_historical_test_send }}" = "true" ]; then EXTRA="$EXTRA --allow-historical-test-send"; fi
          fi

          python -u closing_bet_live_shadow_board_r173.py \
            --source-root source_run \
            --r14-root source_r14 \
            --r16-a-root source_r16_a \
            --output-dir reports/live_shadow_board_r17 \
            --top-n "${{ inputs.top_n || '10' }}" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --r14-run-id "35445479856" \
            --r16-a-run-id "35469509910" \
            $EXTRA || true

      - name: Validate R1.7.3 single-route legacy-last guard
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp=Path("reports/live_shadow_board_r17/meta.json")
          tp=Path("reports/live_shadow_board_r17/telegram_delivery.json")
          if not mp.exists():
              print("NO_META observer isolated")
              raise SystemExit(0)

          m=json.loads(mp.read_text(encoding="utf-8"))
          t=json.loads(tp.read_text(encoding="utf-8")) if tp.exists() else {}

          assert m["research_only"]
          assert not m.get("candidate_membership_changed",False)
          assert not m.get("candidate_order_changed",False)
          assert not m.get("score_rank_changed",False)
          assert not m.get("candidate_filter_created",False)
          assert not m.get("production_logic_changed",False)
          assert m["production_final_message_modified"] is False
          assert m["shadow_message_separate_from_production_final"] is True
          assert m["telegram_failure_affects_production"] is False

          if t.get("status") not in ("NOT_REQUESTED","SKIPPED_NO_ROUTE"):
              assert t.get("single_route_guard") is True
              assert t.get("legacy_last_fallback_allowed") is True
              assert t.get("generic_telegram_chat_disabled") is True
              assert t.get("route_chat_count")==1
              assert t.get("chat_count")==1

          print(
              "R173 PASS",
              "delivery=",t.get("status"),
              "chat_source=",t.get("route_chat_source"),
              "legacy_used=",t.get("legacy_last_fallback_used"),
              "attempts=",t.get("attempts"),
              "success=",t.get("success"),
          )
          PY

      - name: Upload R1.7.3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r173-${{ github.run_id }}
          path: reports/live_shadow_board_r17/**
          if-no-files-found: warn
          retention-days: 30
