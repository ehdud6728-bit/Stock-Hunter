  r1d26q_new_d125_ticker_disjoint_reclaim_flow_holdout:
    name: R1-D26Q NEW 125 disjoint D signals, frozen foreign break flow + reclaim turnover vs second stop [NOT PIT/OOS/LIVE]
    if: ${{ inputs.scope == 'r1d26q_new_d125_ticker_disjoint_reclaim_flow_holdout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    env:
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      R1D26Q_D25_ZIP: reports/r1d26q/input/r1d25.zip
    steps:
      - name: Checkout existing research, no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11 for sealed research
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated read-only KRX data clients
        run: |
          set -euo pipefail
          python -m pip install 'pandas>=2,<3' 'numpy>=1.26,<3' 'pykrx>=1.0.45,<2'
      - name: Verify fixed D25 GitHub source identity before any price collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY_VERIFY'
          import json,os,urllib.request
          p=json.load(open('R1D26Q_PREDECLARED_PROTOCOL.json'))
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
            u='https://api.github.com/repos/'+repo+path
            h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=45) as r:return json.load(r)
          run=get('/actions/runs/'+str(p['parent_d25_run_id']))
          art=get('/actions/artifacts/'+str(p['parent_d25_artifact_id']))
          assert run['conclusion']=='success' and run['head_sha']==p['parent_d25_head_sha'],'D25_RUN_DRIFT'
          assert not art['expired'] and art['digest']=='sha256:'+p['parent_d25_zip_sha256'],'D25_ZIP_IDENTITY_DRIFT'
          assert art['workflow_run']['id']==p['parent_d25_run_id'],'D25_ARTIFACT_PARENT_DRIFT'
          print('R1D26Q_D25_SOURCE_IDENTITY_PIN_PASS')
          PY_VERIFY
      - name: Download D25 source immutable byte-for-byte and verify 125 outcome-blind selections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/r1d26q/input
          python - <<'PY_DOWNLOAD'
          import json,subprocess,os,hashlib,pathlib
          p=json.load(open('R1D26Q_PREDECLARED_PROTOCOL.json'))
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{p['parent_d25_artifact_id']}/zip"
          dst=pathlib.Path('reports/r1d26q/input/r1d25.zip')
          subprocess.run(['curl','--fail','--silent','--show-error','--location','--retry','3','--max-time','160','--proto-redir','=https','--header','Authorization: Bearer '+os.environ['GH_TOKEN'],'--header','Accept: application/vnd.github+json','--output',str(dst),url],check=True)
          assert hashlib.sha256(dst.read_bytes()).hexdigest()==p['parent_d25_zip_sha256'],'D25_SOURCE_ARCHIVE_SHA_DRIFT'
          print('R1D26Q_EXACT_D25_SOURCE_ZIP_SHA_PASS')
          PY_DOWNLOAD
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode verify \
            --d25 reports/r1d26q/input/r1d25.zip \
            --selection data/R1D26Q_FROZEN_D125_ASOF_ONLY.csv
          python -m unittest discover -s tests -p 'test_stockhunter_r1d26q_holdout.py' -v
      - name: Read historical signal-to-date prices and seal D support BEFORE any post-price read
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          set -euo pipefail
          if [ -z "${KRX_ID:-}" ] || [ -z "${KRX_PW:-}" ]; then echo '::error::R1D26Q_KRX_AUTH_MISSING'; exit 2; fi
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode pre \
            --selection data/R1D26Q_FROZEN_D125_ASOF_ONLY.csv \
            --out reports/r1d26q/result/pre_source --sleep-seconds 1.0
          python - <<'PY_SEAL'
          import json,hashlib,pathlib
          p=pathlib.Path('reports/r1d26q/result/pre_source')
          m=json.loads((p/'R1D26Q_QA_MANIFEST.json').read_text())
          assert m['phase']=='pre' and m['attempted']==125 and m['support_sealed_before_future']
          for name,expected in m['file_sha256'].items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected
          print('R1D26Q_ASOF_SUPPORT_PRE_OUTCOME_SEALED',m['valid'],'/125')
          PY_SEAL
      - name: Fetch separate D30 chronological OHLC for the same 125 locked NEW tickers
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          set -euo pipefail
          if [ -z "${KRX_ID:-}" ] || [ -z "${KRX_PW:-}" ]; then echo '::error::R1D26Q_KRX_AUTH_MISSING'; exit 2; fi
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode post \
            --selection data/R1D26Q_FROZEN_D125_ASOF_ONLY.csv \
            --pre-dir reports/r1d26q/result/pre_source \
            --out reports/r1d26q/result/post_source --sleep-seconds 1.0
      - name: Calculate predeclared stop reclaim and second stop chronologically, D25 price parity audit
        run: |
          set -euo pipefail
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode price_evaluate \
            --selection data/R1D26Q_FROZEN_D125_ASOF_ONLY.csv \
            --d25 reports/r1d26q/input/r1d25.zip \
            --pre-dir reports/r1d26q/result/pre_source \
            --post-dir reports/r1d26q/result/post_source \
            --out reports/r1d26q/result/price_audit
      - name: Fetch foreign institutional signed net flows only for new observed reentries
        env:
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          set -euo pipefail
          if [ -z "${KRX_ID:-}" ] || [ -z "${KRX_PW:-}" ]; then echo '::error::R1D26Q_KRX_AUTH_MISSING'; exit 2; fi
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode flow \
            --price-dir reports/r1d26q/result/price_audit \
            --post-dir reports/r1d26q/result/post_source \
            --out reports/r1d26q/result/flow_source --sleep-seconds 1.2
      - name: Apply two frozen hypotheses and control small sample and missing source diagnostics
        run: |
          set -euo pipefail
          python -m research_formulas.stockhunter_r1d26q_independent_holdout --mode evaluate \
            --price-dir reports/r1d26q/result/price_audit \
            --flow-dir reports/r1d26q/result/flow_source \
            --out reports/r1d26q/result/holdout
          python - <<'PY_GATE'
          import json,hashlib,pathlib
          p=pathlib.Path('reports/r1d26q/result')
          for sub in ('pre_source','post_source','price_audit','flow_source','holdout'):
            d=p/sub;m=json.loads((d/'R1D26Q_QA_MANIFEST.json').read_text())
            assert not m['strategy_ready'] and not m['orders_placed'] and not m['prospective_OOS']
            for name,expected in m['file_sha256'].items(): assert hashlib.sha256((d/name).read_bytes()).hexdigest()==expected,'R1D26Q_RESULT_SHA_MISMATCH'
          a=json.loads((p/'price_audit'/'R1D26Q_QA_MANIFEST.json').read_text())
          b=json.loads((p/'holdout'/'R1D26Q_QA_MANIFEST.json').read_text())
          print('R1D26Q_D125_NEW_TICKERS_QA',a['signals_complete'],'price',a['reference_price_parity_pass'],'D25_price_matches',b['new_evaluable'],'evaluable_reentries')
          if a['signals_complete']<80 or a['reference_price_parity_pass']<70:
            raise ValueError('R1D26Q_PRICE_COVERAGE_OR_PARITY_INSUFFICIENT_FAIL_CLOSED')
          if b['new_evaluable']<10:raise ValueError('R1D26Q_TOO_FEW_NEW_REENTRIES_INCONCLUSIVE_FAIL_CLOSED')
          print('R1D26Q_HOLDOUT_QA_PASS_HISTORICAL_DISTINCT_TICKERS_NOT_PIT_NOT_PROSPECTIVE_OOS')
          PY_GATE
      - name: Always upload audits including censored cases even on failed source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d26q-NEW-D125-TICKER-DISJOINT-FOREIGN-RECLAIM-NOT-PIT-OOS
          retention-days: 90
          if-no-files-found: warn
          path: |
            reports/r1d26q/result/**
            R1D26Q_PREDECLARED_PROTOCOL.json
            data/R1D26Q_FROZEN_D125_ASOF_ONLY.csv
