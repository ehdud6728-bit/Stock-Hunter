name: Closing Bet Historical Shadow Replay R1.2

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Historical v49.76 source run containing enriched outcome artifacts
        required: true
        default: "35295676895"
      oos_start:
        description: Research replay OOS start (default matches prior R102+ research cohort)
        required: true
        default: "2026-08-19"
      oos_end:
        description: Optional replay end YYYY-MM-DD
        required: false
        default: ""
      max_events:
        description: 0 = all events, otherwise preserve source order and cap
        required: true
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Download historical v49.76 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_run
          gh run download "${{ inputs.source_run_id }}" -D source_run
          echo "=== likely replay sources ==="
          find source_run -type f \( \
            -name 'v49_76_selected_enriched_outcomes.csv' -o \
            -name 'v49_76_global_canonical.csv' -o \
            -name 'v49_76_pit_marcap_current_selected_enriched.csv' \
          \) -print | sort

      - name: Historical Shadow Replay R1.2
        shell: bash
        run: |
          set -euo pipefail
          END_ARG=""
          if [ -n "${{ inputs.oos_end }}" ]; then END_ARG="--oos-end ${{ inputs.oos_end }}"; fi
          python -u closing_bet_historical_shadow_replay_r12.py \
            --source-root source_run \
            --output-dir reports/historical_shadow_replay_r12 \
            --source-run-id "${{ inputs.source_run_id }}" \
            --oos-start "${{ inputs.oos_start }}" \
            --max-events "${{ inputs.max_events }}" \
            $END_ARG

      - name: Validate research-only invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/historical_shadow_replay_r12/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only']
          assert not m['same_sample_tuning']
          assert not m['new_threshold_optimization']
          assert not m['candidate_membership_changed']
          assert not m['candidate_order_changed']
          assert not m['score_rank_changed']
          assert not m['production_logic_changed']
          assert not m['snapshot_1503_reconstructed_from_final_bar']
          assert m['historical_macro_semantics']=='STRICT_PRIOR_CLOSE'
          print('HISTORICAL_SHADOW_REPLAY_R12 PASS',m['events'],m['independent_signal_dates'])
          PY

      - name: Upload Historical Shadow Replay R1.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-historical-shadow-replay-r12-${{ github.run_id }}
          path: reports/historical_shadow_replay_r12/**
          if-no-files-found: warn
          retention-days: 30
