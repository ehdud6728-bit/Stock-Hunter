name: Stock-Hunter R14 Price Structure Exit Research Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r14_structure_exits_research_only.yml'
      - 'research_projects/trendline_structure_exits_r14_20261121/**'

permissions:
  contents: read

jobs:
  r14-price-structure-exits:
    name: R14 broken line and confirmed low exits no OOS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Causal invariants and frozen ancestors
        run: python -m unittest discover -s research_projects/trendline_structure_exits_r14_20261121 -p 'test_r14_*.py' -v
      - name: Frozen five stock R116 structural replay
        run: python research_projects/trendline_structure_exits_r14_20261121/r14_structure_exits.py --repo . --out reports/trendline_r14
      - name: Upload full auditable research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCK_HUNTER_R14_STRUCTURE_EXITS_RESEARCH_ONLY
          path: reports/trendline_r14/
          if-no-files-found: warn
          retention-days: 30
