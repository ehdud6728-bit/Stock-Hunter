name: Stock-Hunter R12 Signal Entry Expectancy Research Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r12_signal_expectancy_research_only.yml'
      - 'research_projects/trendline_signal_expectancy_r12_20261121/**'

permissions:
  contents: read

jobs:
  r12-signal-entry-expectancy:
    name: R12 frozen R5 next-open signal profitability
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: R12 invariants
        run: python -m unittest discover -s research_projects/trendline_signal_expectancy_r12_20261121 -p 'test_*.py' -v
      - name: Re-run frozen signals and evaluate entry paths
        run: python research_projects/trendline_signal_expectancy_r12_20261121/r12_signal_expectancy.py --repo . --out reports/trendline_r12
      - name: Upload independent research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCK_HUNTER_R12_SIGNAL_ENTRY_EXPECTANCY_RESEARCH_ONLY
          path: reports/trendline_r12/
          if-no-files-found: warn
          retention-days: 30
