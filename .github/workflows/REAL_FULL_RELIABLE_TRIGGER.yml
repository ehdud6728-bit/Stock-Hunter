name: REAL_FULL Reliable Trigger

on:
  schedule:
    # KST 14:30 / 14:35 / 14:40 / 14:45 / 14:50 / 15:00 weekdays
    - cron: '30 05 * * 1-5'
    - cron: '35 05 * * 1-5'
    - cron: '40 05 * * 1-5'
    - cron: '45 05 * * 1-5'
    - cron: '50 05 * * 1-5'
    - cron: '00 06 * * 1-5'
  workflow_dispatch:
    inputs:
      install_patch:
        description: "One-time: patch run_scanner.yml and commit it"
        required: false
        default: false
        type: boolean
      force_dispatch:
        description: "Ignore guards and dispatch REAL_FULL now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: real-full-reliable-trigger-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_patch == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply run_scanner patch
        run: |
          set -euo pipefail
          python -m py_compile apply_real_full_reliable_overlay_patch.py real_full_research_overlay_r1.py
          python apply_real_full_reliable_overlay_patch.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("reference/FROZEN_watermelon_longma_signature_registry.csv")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="558ff5804134a57d35eb77736f6e064ff925588347919912c3e2b07cb26da51a"
          print("FROZEN_REGISTRY_HASH PASS")
          PY
      - name: Stage patched run_scanner artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patched_workflow
          cp .github/workflows/run_scanner.yml patched_workflow/run_scanner.yml
          echo "PATCHED_RUN_SCANNER_READY patched_workflow/run_scanner.yml"
          echo "GitHub App cannot push workflow files automatically; upload this artifact manually to .github/workflows/run_scanner.yml"

      - name: Upload patched run_scanner
        uses: actions/upload-artifact@v4
        with:
          name: REAL_FULL_PATCHED_RUN_SCANNER_${{ github.run_id }}
          path: patched_workflow/run_scanner.yml
          if-no-files-found: error
          retention-days: 7

  dispatch:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.install_patch == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve KST day and slot
        id: day
        shell: bash
        run: |
          echo "kst_date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          echo "kst_slot=$(TZ=Asia/Seoul date +%H%M)" >> "$GITHUB_OUTPUT"
          echo "now_kst=$(TZ=Asia/Seoul date '+%F %T %Z')"

      - name: Reject excessively delayed scheduled trigger
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "allowed=1" >> "$GITHUB_OUTPUT"
            echo "RELIABLE_TRIGGER_WINDOW manual_dispatch_allowed"
            exit 0
          fi
          hhmm="$(TZ=Asia/Seoul date +%H%M)"
          # The scheduled slots are 14:30~15:00. 15:20 watchdog owns missed-production recovery.
          if [ "$hhmm" -ge 1425 ] && [ "$hhmm" -le 1510 ]; then
            echo "allowed=1" >> "$GITHUB_OUTPUT"
            echo "RELIABLE_TRIGGER_WINDOW PASS hhmm=$hhmm"
          else
            echo "allowed=0" >> "$GITHUB_OUTPUT"
            echo "REAL_FULL_RELIABLE_TRIGGER_SKIP stale delayed cron hhmm=$hhmm allowed=1425..1510"
          fi

      - name: Prepare daily lock path
        run: mkdir -p .real_full_trigger_lock

      - name: Restore today's dispatch lock
        id: lock
        uses: actions/cache/restore@v4
        with:
          path: .real_full_trigger_lock
          key: stockhunter-real-full-reliable-trigger-${{ github.ref_name }}-${{ steps.day.outputs.kst_date }}

      - name: Restore latest REAL_FULL TRUST state
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/real_full_trust_r1
          key: stockhunter-real-full-trust-r1-${{ github.ref_name }}-reliable-${{ github.run_id }}
          restore-keys: |
            stockhunter-real-full-trust-r1-${{ github.ref_name }}-

      - name: Check same-day REAL_FULL production snapshot
        id: captured
        shell: bash
        run: |
          set -euo pipefail
          today="${{ steps.day.outputs.kst_date }}"
          state="reports/.cache/real_full_trust_r1/state.json"
          last_success=""
          if [ -f "$state" ]; then
            last_success="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/.cache/real_full_trust_r1/state.json")
          try:
              d=json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              d={}
          print(str(d.get("last_successful_snapshot_date") or ""))
          PY
          )"
          fi
          echo "RELIABLE_TRIGGER_CAPTURE_CHECK today=$today last_success=${last_success:-NONE}"
          if [ "$last_success" = "$today" ]; then
            echo "already_captured=1" >> "$GITHUB_OUTPUT"
            echo "REAL_FULL_RELIABLE_TRIGGER_SKIP same-day production snapshot already present"
          else
            echo "already_captured=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch REAL_FULL production
        if: ${{ inputs.force_dispatch == true || (steps.window.outputs.allowed == '1' && steps.lock.outputs.cache-hit != 'true' && steps.captured.outputs.already_captured != '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
          KST_SLOT: ${{ steps.day.outputs.kst_slot }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          slot=os.environ["KST_SLOT"]
          payload={
            "ref": os.environ.get("GITHUB_REF_NAME","main"),
            "inputs":{
              "run_profile":"REAL_FULL",
              "real_full_capture_slot":f"RELIABLE_TRIGGER_{slot}",
              "test_chat_id_override":"8325973023",
              "catalyst_forward_capture":"AUTO"
            }
          }
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/run_scanner.yml/dispatches",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                "Authorization":f"Bearer {token}",
                "Accept":"application/vnd.github+json",
                "X-GitHub-Api-Version":"2022-11-28",
                "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              assert r.status==204, r.status
          print("REAL_FULL_RELIABLE_DISPATCH_SENT", payload["inputs"]["real_full_capture_slot"])
          PY
          printf '%s\n' "${{ steps.day.outputs.kst_date }} ${{ steps.day.outputs.kst_slot }} dispatched" > .real_full_trigger_lock/dispatched.txt

      - name: Save today's dispatch lock
        if: ${{ inputs.force_dispatch != true && steps.window.outputs.allowed == '1' && steps.lock.outputs.cache-hit != 'true' && steps.captured.outputs.already_captured != '1' }}
        uses: actions/cache/save@v4
        with:
          path: .real_full_trigger_lock
          key: stockhunter-real-full-reliable-trigger-${{ github.ref_name }}-${{ steps.day.outputs.kst_date }}

      - name: Show duplicate suppression
        if: ${{ inputs.force_dispatch != true && (steps.lock.outputs.cache-hit == 'true' || steps.captured.outputs.already_captured == '1') }}
        shell: bash
        run: |
          if [ "${{ steps.captured.outputs.already_captured }}" = "1" ]; then
            echo "REAL_FULL_RELIABLE_TRIGGER_SKIP same-day production snapshot already present"
          else
            echo "REAL_FULL_RELIABLE_TRIGGER_SKIP already dispatched today"
          fi
