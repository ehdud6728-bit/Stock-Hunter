name: ODOLI R2.21 SLOW Confirmation Combos

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy

      - name: Download frozen R2.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r220
          gh run download "36378828712" \
            -n "odoli-r220-slow-entry-timing-36378828712" \
            -D source_r220

      - name: Run R2.21
        run: |
          python -u odoli_r221_slow_confirmation_combos.py \
            --r220-root source_r220 \
            --output-dir reports/odoli_r221

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r221/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_tuning"] is False
          assert m["new_gate_created"] is False
          assert m["slow_n"]==28
          assert m["no_n"]==40
          print(m)
          PY

      - run: cat reports/odoli_r221/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r221-slow-confirmation-combos-${{ github.run_id }}
          path: reports/odoli_r221/**
          retention-days: 30
