name: Stock-Hunter R24 True55 Train-Only Entry Risk Research Only

on:
  pull_request:
    paths:
      - '.github/workflows/stockhunter_r24_true55_entry_risk_research_only.yml'
      - 'research_projects/trendline_true55_r24_entry_risk_20261123/**'
  workflow_dispatch:
    inputs:
      confirm_fixed_source_research_only:
        description: 'Rebuild only pinned KIS run 44988188271, R19 149 and R20 exits, evaluate fixed R24 train/review'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  r24-offline-tests:
    name: R24 fixed D0 features and purged train-only evaluation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Run R24 deterministic anti-leakage tests
        run: python -m unittest discover -s research_projects/trendline_true55_r24_entry_risk_20261123 -p 'test_r24*.py' -v

  r24-manual-fixed-source-replay:
    name: Hash-locked KIS => R16/R17 => R19 149 => R20 exits => train-only warning review
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_fixed_source_research_only == true
    needs: r24-offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Download pre-existing frozen BLUE KIS archive only
        uses: actions/download-artifact@v4
        with:
          name: BLUE_STOCKHUNTER_R16_KIS_30_44988188271
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 44988188271
          github-token: ${{ github.token }}
          path: reports/r24_source
      - name: Verify KIS archive SHA and rebuild R16/R17
        run: |
          python research_projects/trendline_kis_failure_r17_20261122/r17_failure_exit.py \
            --repo . --artifact reports/r24_source \
            --r16-out reports/r24_r16 --out reports/r24_r17 --phase all
      - name: Rebuild unchanged R19 genuine55 149 events
        run: |
          python research_projects/trendline_true55_r19_20261122/r19_true55_transfer.py \
            --repo . --r16-out reports/r24_r16 \
            --r17-out reports/r24_r17 --out reports/r24_r19
      - name: Rebuild unchanged R20 MA5 and MA20 exits
        run: |
          python research_projects/trendline_true55_r20_ma_exit_20261123/r20_ma_exit.py \
            --r16-out reports/r24_r16 --r19-out reports/r24_r19 \
            --out reports/r24_r20_ma
      - name: Run R24 loss-warning train-only risk classification and review
        run: |
          python research_projects/trendline_true55_r24_entry_risk_20261123/r24_entry_risk.py \
            --r16-out reports/r24_r16 --r19-out reports/r24_r19 \
            --r20-ma-out reports/r24_r20_ma --out reports/r24_risk
      - name: Upload derived audit only, no raw OHLCV or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOCKHUNTER_R24_GENUINE55_TRAINONLY_ENTRY_RISK_RESEARCH_ONLY
          path: |
            reports/r24_r16/R16_SOURCE_MANIFEST.json
            reports/r24_r19/R19_TRUE55_TRANSFER_SUMMARY.json
            reports/r24_r20_ma/R20_MA_EXIT_SUMMARY.json
            reports/r24_risk/R24_D0_ENTRY_RISK_SUMMARY.json
            reports/r24_risk/R24_REVIEW_SCORES_RESEARCH_ONLY.json
          if-no-files-found: warn
          retention-days: 30
