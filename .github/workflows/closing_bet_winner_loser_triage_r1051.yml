name: Closing Bet Winner Loser Triage OOS R1.0.5.1

on:
  workflow_dispatch:
    inputs:
      r104_run_id:
        description: "Successful R1.0.4.1 run"
        required: true
        default: "35315426333"
        type: string
      discovery_end:
        required: true
        default: "2026-08-18"
        type: string
      oos_start:
        required: true
        default: "2026-08-19"
        type: string
      oos_end:
        required: true
        default: "2026-09-18"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download successful R1.0.4.1 artifact
        run: |
          mkdir -p r104_artifacts
          gh run download "${{ inputs.r104_run_id }}" -D r104_artifacts

      - name: Run Winner Loser Anatomy + Shadow Triage R1.0.5.1
        run: |
          python -u closing_bet_winner_loser_triage_r105.py \
            --r104-root r104_artifacts \
            --output-dir reports/closebet_winner_loser_triage_r105 \
            --discovery-end "${{ inputs.discovery_end }}" \
            --oos-start "${{ inputs.oos_start }}" \
            --oos-end "${{ inputs.oos_end }}"

      - name: Validate R1.0.5.1 research-only invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_winner_loser_triage_r105/meta.json',encoding='utf-8'))
          assert m['status']=='PASS',m
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed']
          assert not m['score_rank_changed']
          assert not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert not m['shadow_composite_score_created']
          assert not m['shadow_ranking_created']
          assert m['strict_vs_exploratory_context_separated']
          assert m['matched_contrast_enabled']
          assert m['discovery_end']=='2026-08-18'
          assert m['oos_start']=='2026-08-19'
          assert m['oos_end']=='2026-09-18'
          assert int(m['oos_rows'])>0
          print('R105_WINNER_LOSER_TRIAGE PASS',m['oos_rows'],m['winner_rows'],m['loser_rows'])
          PY

      - name: Upload R1.0.5.1 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-winner-loser-triage-r105-${{ github.run_id }}
          path: reports/closebet_winner_loser_triage_r105/**
          if-no-files-found: warn
          retention-days: 30
