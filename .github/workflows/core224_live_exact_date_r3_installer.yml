name: CORE224 LIVE Exact-Date R3 Installer (Research/Paper Only)
on:
  workflow_dispatch:
    inputs:
      install:
        description: 'Type INSTALL to make the minimal LIVE-only workflow edit'
        required: true
        type: string
        default: 'DRY_RUN'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate helper and simulate workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas
          python core224_live_date_selector_r3.py --self-test
          cp .github/workflows/run_scanner.yml /tmp/core224_r3_run_scanner_test.yml
          python core224_live_date_selector_r3.py --patch-workflow /tmp/core224_r3_run_scanner_test.yml
          diff -u .github/workflows/run_scanner.yml /tmp/core224_r3_run_scanner_test.yml || test "$?" -eq 1
          echo 'CORE224_R3_PREINSTALL_SMOKE_PASS'
      - name: Commit minimal infrastructure-only workflow change
        if: ${{ inputs.install == 'INSTALL' }}
        shell: bash
        run: |
          set -euo pipefail
          python core224_live_date_selector_r3.py --patch-workflow .github/workflows/run_scanner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/run_scanner.yml
          if git diff --cached --quiet; then
            echo 'CORE224_R3_ALREADY_INSTALLED'
          else
            git commit -m 'research(core224): scope exact-date selector to LIVE seed worker only'
            git push
          fi
