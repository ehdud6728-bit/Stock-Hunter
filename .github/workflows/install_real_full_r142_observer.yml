name: Install REAL_FULL R1C1 R1.4.2 Structure Observer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-r142-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy pandas pytest

      - name: Validate R1.4.2 package and frozen base
        shell: bash
        run: |
          set -euo pipefail
          test -s real_full_r1c1_structure_observer_r142.py
          test -s apply_real_full_r142_observer_patch.py
          test -s tests/test_r142_observer.py
          test -s real_full_r1c1_runtime_adapter.py
          test -s real_full_capture_runner.py
          grep -q 'R141_CAUSAL_RUNTIME_ADAPTER_HOOK' real_full_capture_runner.py
          grep -q 'R1_4_1_CAUSAL_RUNTIME_FDR_CACHE_220_REPLAY_20260916' real_full_r1c1_runtime_adapter.py
          python -m py_compile real_full_r1c1_structure_observer_r142.py apply_real_full_r142_observer_patch.py
          python real_full_r1c1_structure_observer_r142.py --self-test
          pytest -q tests/test_r142_observer.py

      - name: Apply additive R1.4.2 observer hook
        shell: bash
        run: |
          set -euo pipefail
          python apply_real_full_r142_observer_patch.py
          rm -f real_full_capture_runner.py.pre_r142_observer.bak

      - name: Guard patch scope and production invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).strip().splitlines()
          assert changed == ['real_full_capture_runner.py'], changed
          diff = subprocess.check_output(['git','diff','--','real_full_capture_runner.py'], text=True)
          removed = [ln for ln in diff.splitlines() if ln.startswith('-') and not ln.startswith('---')]
          assert not removed, 'R1.4.2 patch must be additive-only; removed lines=' + repr(removed[:10])
          required = [
              'R141_CAUSAL_RUNTIME_ADAPTER_HOOK',
              'R142_PROSPECTIVE_STRUCTURE_OBSERVER_HOOK',
              'real_full_r1c1_structure_observer_r142',
              'RUNTIME_PRIMARY_VARIABLE = "ai_candidates"',
              'RUNTIME_SECONDARY_VARIABLE = "all_hits_sorted"',
          ]
          text=open('real_full_capture_runner.py',encoding='utf-8').read()
          for x in required:
              assert x in text, x
          print('R142_SCOPE_GUARD_PASS')
          print('workflow files changed=0')
          print('REAL_FULL search/score/rank/order code changed=0')
          print('R1C1 threshold changed=0')
          print('MA224 gate added=0')
          PY

      - name: Commit root Python hook only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- real_full_capture_runner.py; then
            echo 'R1.4.2 observer hook already installed; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add real_full_capture_runner.py
          git commit -m 'Install REAL_FULL R1C1 R1.4.2 structure observer hook'
          git push origin HEAD:${GITHUB_REF_NAME}
