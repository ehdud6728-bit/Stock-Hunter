name: ODOLI R2.19 D0-D3 Early Classification Anatomy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow

      - name: Download frozen R2.18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r218
          gh run download "36374132446" \
            -n "odoli-r218-plus15-speed-path-36374132446" \
            -D source_r218

      - name: Fetch 2024-2026 PIT marcap
        run: |
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'data/marcap-2024.parquet' \
            'data/marcap-2025.parquet' \
            'data/marcap-2026.parquet' > /tmp/marcap_paths.txt
          git sparse-checkout set --stdin < /tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run R2.19
        run: |
          python -u odoli_r219_d0_d3_early_classification.py \
            --r218-root source_r218 \
            --marcap-root vendor/marcap \
            --output-dir reports/odoli_r219

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r219/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_tuning"] is False
          assert m["new_gate_created"] is False
          assert m["cohort_n"]==100
          assert m["feature_cutoff"]=="D3_ONLY"
          print(m)
          PY

      - run: cat reports/odoli_r219/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r219-d0-d3-anatomy-${{ github.run_id }}
          path: reports/odoli_r219/**
          retention-days: 30
