name: ODOLI R2.18 Plus15 Speed Path Anatomy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy

      - name: Download frozen R2.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_r217
          gh run download "36364735032" \
            -n "odoli-r217-outcome-accum-redefinition-36364735032" \
            -D source_r217

      - name: Run R2.18
        run: |
          python -u odoli_r218_plus15_speed_path_anatomy.py \
            --r217-root source_r217 \
            --output-dir reports/odoli_r218

      - name: Validate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/odoli_r218/meta.json").read_text())
          assert m["research_only"] is True
          assert m["production_logic_changed"] is False
          assert m["same_sample_tuning"] is False
          assert m["new_gate_created"] is False
          assert m["cohort_n"]==100
          assert m["target_pct"]==15
          print(m)
          PY

      - run: cat reports/odoli_r218/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: odoli-r218-plus15-speed-path-${{ github.run_id }}
          path: reports/odoli_r218/**
          retention-days: 30
