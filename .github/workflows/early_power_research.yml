name: EARLY POWER MA Transition Research

on:
  workflow_dispatch:
    inputs:
      start:
        description: Study start date
        required: false
        default: "2026-01-01"
      cooldown:
        description: Same-stage event cooldown sessions
        required: false
        default: "20"
      min_amount_b:
        description: 20d median 거래대금 floor (억원 아님, KRW billions)
        required: false
        default: "20"

permissions:
  contents: read

env:
  TZ: Asia/Seoul

jobs:
  early-power-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap 2025-2026
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2025.parquet' 'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run EARLY POWER state-transition research
        shell: bash
        run: |
          set -euo pipefail
          python early_power_transition_research.py \
            --marcap vendor/marcap/data/marcap-2025.parquet vendor/marcap/data/marcap-2026.parquet \
            --out reports/early_power_transition \
            --start "${{ inputs.start }}" \
            --cooldown "${{ inputs.cooldown }}" \
            --min-amount-b "${{ inputs.min_amount_b }}"

      - name: Validate RESEARCH_ONLY invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pandas as pd
          m=json.load(open('reports/early_power_transition/meta.json',encoding='utf-8'))
          assert m['revision']=='EARLY_POWER_MA_TRANSITION_R1_20261003'
          assert m['research_only'] is True
          for k in ['production_changed','production_search_changed','production_score_changed','production_rank_changed','production_order_changed','automatic_orders','same_sample_retuning']:
              assert m[k] is False, (k,m[k])
          q=pd.read_csv('reports/early_power_transition/early_power_event_ledger.csv')
          assert len(q)>0
          assert {'signal_date','code','stage','entry_close','context_hits_7','d3_close_ret_pct','mfe5_pct','mae5_pct'}.issubset(q.columns)
          print('EARLY_POWER_RESEARCH_INVARIANTS_PASS')
          PY

      - name: Show report
        if: always()
        run: cat reports/early_power_transition/REPORT.txt || true

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-power-ma-transition-r1
          path: reports/early_power_transition/**
          if-no-files-found: error
          retention-days: 90
