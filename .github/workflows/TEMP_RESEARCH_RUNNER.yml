name: TEMP REAL_FULL Overlay Outcome Ledger R1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-real-full-overlay-outcome-ledger-r1
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests

      - name: Fetch marcap 2026
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Build frozen overlay outcome ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_real_full_overlay_outcome

          cat >/tmp/outcome.py <<'PY'
          from pathlib import Path
          import io, os, json, zipfile, requests, re
          import numpy as np
          import pandas as pd

          OUT=Path("reports/temp_real_full_overlay_outcome")
          REV="REAL_FULL_OVERLAY_OUTCOME_LEDGER_R1_20261002"
          REPO=os.environ["GITHUB_REPOSITORY"]
          TOKEN=os.environ["GH_TOKEN"]
          H={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          BASE=f"https://api.github.com/repos/{REPO}"

          # Bootstrap pairs already verified in prior research:
          # 2026-09-21 source -> standalone Overlay run 35861723754
          # 2026-10-01 source -> integrated REAL_FULL run 36868727334
          BOOTSTRAP=[
              {"overlay_run_id":35861723754,"source_run_id":35573389577,"kind":"STANDALONE_VERIFIED"},
              {"overlay_run_id":36868727334,"source_run_id":36868727334,"kind":"INTEGRATED_VERIFIED"},
          ]

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def api(path):
              r=requests.get(BASE+path,headers=H,timeout=60)
              r.raise_for_status()
              return r.json()

          def artifacts(run_id):
              return api(f"/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts",[])

          def download_artifact(a):
              r=requests.get(f"{BASE}/actions/artifacts/{a['id']}/zip",headers=H,timeout=90,allow_redirects=True)
              r.raise_for_status()
              return zipfile.ZipFile(io.BytesIO(r.content))

          def extract_run(run_id, target):
              target=Path(target);target.mkdir(parents=True,exist_ok=True)
              got=0
              for a in artifacts(run_id):
                  if a.get("expired"): continue
                  try:
                      z=download_artifact(a)
                      td=target/str(a["id"]);td.mkdir(parents=True,exist_ok=True)
                      z.extractall(td);got+=1
                  except Exception as e:
                      print("ARTIFACT_SKIP",run_id,a.get("id"),type(e).__name__)
              return got

          def first(root,name):
              hits=list(Path(root).rglob(name))
              return hits[0] if hits else None

          # Discover recent integrated run_scanner artifacts that already contain both files.
          discovered=[]
          try:
              runs=api("/actions/runs?per_page=100").get("workflow_runs",[])
              for r in runs:
                  if r.get("status")!="completed" or r.get("conclusion")!="success": continue
                  if not str(r.get("path","")).endswith("run_scanner.yml"): continue
                  rid=int(r["id"])
                  discovered.append({"overlay_run_id":rid,"source_run_id":rid,"kind":"RECENT_RUN_SCANNER_DISCOVERY"})
          except Exception as e:
              print("RUN_DISCOVERY_WARN",type(e).__name__,str(e)[:200])

          pairs=[]
          seen_pair=set()
          for x in BOOTSTRAP+discovered:
              k=(x["overlay_run_id"],x["source_run_id"])
              if k not in seen_pair:
                  pairs.append(x);seen_pair.add(k)

          work=Path("/tmp/overlay_outcome_sources")
          rows=[]; diag=[]
          expected_revision=None

          for pair in pairs:
              orid=pair["overlay_run_id"]; srid=pair["source_run_id"]
              odir=work/f"overlay_{orid}"
              sdir=work/f"source_{srid}"
              try:
                  if not odir.exists(): extract_run(orid,odir)
                  if srid==orid:
                      sdir=odir
                  elif not sdir.exists():
                      extract_run(srid,sdir)
                  ov=first(odir,"real_full_research_overlay.csv")
                  meta=first(odir,"real_full_research_overlay_meta.json")
                  src=first(sdir,"real_full_trust_source.csv")
                  if not ov or not src:
                      diag.append({"overlay_run_id":orid,"source_run_id":srid,"status":"MISSING_REQUIRED_FILE",
                                   "overlay_found":bool(ov),"source_found":bool(src),"kind":pair["kind"]})
                      continue

                  m={}
                  if meta:
                      try:m=json.loads(Path(meta).read_text(encoding="utf-8"))
                      except Exception:m={}
                  revision=str(m.get("revision","UNKNOWN"))
                  if expected_revision is None and revision!="UNKNOWN":
                      expected_revision=revision
                  if expected_revision and revision!="UNKNOWN" and revision!=expected_revision:
                      diag.append({"overlay_run_id":orid,"source_run_id":srid,"status":"REVISION_MISMATCH_SKIP",
                                   "revision":revision,"expected_revision":expected_revision,"kind":pair["kind"]})
                      continue

                  q=pd.read_csv(ov,dtype=str,low_memory=False).fillna("")
                  s=pd.read_csv(src,dtype=str,low_memory=False).fillna("")
                  q["code"]=q["code"].map(norm_code); s["code"]=s["code"].map(norm_code)
                  if "signal_date" not in s.columns or "snapshot_price" not in s.columns:
                      diag.append({"overlay_run_id":orid,"source_run_id":srid,"status":"SOURCE_SCHEMA_MISSING",
                                   "kind":pair["kind"]})
                      continue

                  keep=["code","signal_date","snapshot_price"]
                  ss=s[keep].drop_duplicates("code",keep="first")
                  z=q.merge(ss,on="code",how="left",validate="one_to_one")
                  z["overlay_run_id"]=orid
                  z["source_run_id"]=srid
                  z["overlay_revision"]=revision
                  z["source_kind"]=pair["kind"]
                  rows.append(z)

                  diag.append({"overlay_run_id":orid,"source_run_id":srid,"status":"LOADED",
                               "overlay_rows":len(q),"joined_signal_date":int(z["signal_date"].astype(str).str.len().gt(0).sum()),
                               "revision":revision,"kind":pair["kind"]})
              except Exception as e:
                  diag.append({"overlay_run_id":orid,"source_run_id":srid,"status":"ERROR",
                               "error":f"{type(e).__name__}:{str(e)[:300]}","kind":pair["kind"]})

          pd.DataFrame(diag).to_csv(OUT/"source_run_diagnostics.csv",index=False,encoding="utf-8-sig")
          if not rows:
              raise SystemExit("NO_OVERLAY_COHORTS_LOADED")

          ev=pd.concat(rows,ignore_index=True,sort=False)
          ev=ev[ev["signal_date"].astype(str).str.len().gt(0)].copy()
          ev["signal_date"]=pd.to_datetime(ev["signal_date"],errors="coerce").dt.normalize()
          ev["snapshot_price"]=pd.to_numeric(ev["snapshot_price"],errors="coerce")
          ev=ev[ev.signal_date.notna() & ev.snapshot_price.gt(0)].copy()

          # Deduplicate retries of the same source-date/code; research label must agree.
          conflicts=(ev.groupby(["signal_date","code"])["research_level"].nunique()>1)
          bad=set(conflicts[conflicts].index.tolist())
          if bad:
              pd.DataFrame([{"signal_date":str(k[0].date()),"code":k[1]} for k in sorted(bad)]).to_csv(
                  OUT/"research_level_conflicts.csv",index=False,encoding="utf-8-sig")
              raise SystemExit(f"RESEARCH_LEVEL_CONFLICT n={len(bad)}")
          ev=ev.sort_values(["signal_date","code","overlay_run_id"]).drop_duplicates(["signal_date","code"],keep="last")

          # Price history.
          p=Path("vendor/marcap/data/marcap-2026.parquet")
          px=pd.read_parquet(p)
          if "Date" not in px.columns:px=px.reset_index()
          px["Date"]=pd.to_datetime(px["Date"],errors="coerce").dt.normalize()
          px["Code"]=px["Code"].map(norm_code)
          for c in ["Open","High","Low","Close","Volume","Amount"]:
              if c in px.columns:px[c]=pd.to_numeric(px[c],errors="coerce")
          px=px.dropna(subset=["Date","Code","Open","High","Low","Close"])
          px=px[(px.Open>0)&(px.High>0)&(px.Low>0)&(px.Close>0)]
          px=px.sort_values(["Date","Code"]).drop_duplicates(["Date","Code"],keep="last")
          market_dates=sorted(pd.Timestamp(x).normalize() for x in px.Date.unique())
          date_pos={d:i for i,d in enumerate(market_dates)}
          last_date=market_dates[-1]

          by_code={c:g.set_index("Date").sort_index() for c,g in px.groupby("Code",sort=False)}
          outrows=[]

          def is_spac(name):
              s=str(name or "").upper()
              return "스팩" in s or "SPAC" in s

          for _,r in ev.iterrows():
              sd=pd.Timestamp(r.signal_date).normalize(); code=norm_code(r.code)
              if sd not in date_pos: continue
              g=by_code.get(code)
              if g is None: continue
              entry=float(r.snapshot_price)
              pos=date_pos[sd]

              rec=r.to_dict()
              rec["is_spac"]=is_spac(r.get("name",""))
              rec["price_data_last_date"]=last_date.date().isoformat()

              # Audit source snapshot vs official market close if available.
              if sd in g.index:
                  close0=float(g.loc[sd,"Close"])
                  rec["signal_market_close"]=close0
                  rec["snapshot_vs_market_close_pct"]=(entry/close0-1)*100 if close0>0 else np.nan
              else:
                  rec["signal_market_close"]=np.nan
                  rec["snapshot_vs_market_close_pct"]=np.nan

              # 45% adjacent-close discontinuity guard from D-2 through D+10.
              dstart=max(0,pos-2); dend=min(len(market_dates)-1,pos+10)
              check_dates=market_dates[dstart:dend+1]
              closes=[]
              for d in check_dates:
                  if d in g.index:closes.append(float(g.loc[d,"Close"]))
              disc=False
              for a,b in zip(closes,closes[1:]):
                  if a>0 and abs(b/a-1)>=0.45:
                      disc=True;break
              rec["discontinuity45_flag"]=disc

              for h in [1,3,5,10]:
                  mature=(pos+h)<len(market_dates)
                  rec[f"d{h}_calendar_mature"]=mature
                  if not mature:
                      for c in [f"d{h}_close_ret_pct",f"mfe{h}_pct",f"mae{h}_pct"]:
                          rec[c]=np.nan
                      continue
                  target=market_dates[pos+h]
                  rec[f"d{h}_date"]=target.date().isoformat()
                  if target in g.index:
                      rec[f"d{h}_close_ret_pct"]=(float(g.loc[target,"Close"])/entry-1)*100
                  else:
                      rec[f"d{h}_close_ret_pct"]=np.nan

                  win_dates=market_dates[pos+1:pos+h+1]
                  highs=[];lows=[]
                  for d in win_dates:
                      if d in g.index:
                          highs.append(float(g.loc[d,"High"]))
                          lows.append(float(g.loc[d,"Low"]))
                  rec[f"mfe{h}_pct"]=(max(highs)/entry-1)*100 if highs else np.nan
                  rec[f"mae{h}_pct"]=(min(lows)/entry-1)*100 if lows else np.nan

              outrows.append(rec)

          led=pd.DataFrame(outrows)
          if led.empty: raise SystemExit("OUTCOME_LEDGER_EMPTY")
          led.to_csv(OUT/"overlay_outcome_ledger.csv",index=False,encoding="utf-8-sig")

          # Summary: RAW plus GUARDED (non-SPAC, no 45% discontinuity)
          sums=[]
          for scope,base in [
              ("RAW",led),
              ("GUARDED",led[(~led["is_spac"].astype(bool)) & (~led["discontinuity45_flag"].astype(bool))])
          ]:
              for level,g in base.groupby("research_level",dropna=False):
                  for h in [1,3,5,10]:
                      rr=pd.to_numeric(g[f"d{h}_close_ret_pct"],errors="coerce")
                      mfe=pd.to_numeric(g[f"mfe{h}_pct"],errors="coerce")
                      mae=pd.to_numeric(g[f"mae{h}_pct"],errors="coerce")
                      ok=rr.notna()
                      sums.append({
                          "scope":scope,"research_level":level,"horizon":f"D{h}",
                          "cohort_rows":len(g),"n_close":int(ok.sum()),
                          "close_positive_pct":float((rr[ok]>0).mean()*100) if ok.any() else np.nan,
                          "close_mean_pct":float(rr[ok].mean()) if ok.any() else np.nan,
                          "close_median_pct":float(rr[ok].median()) if ok.any() else np.nan,
                          "mfe_ge5_pct":float((mfe.dropna()>=5).mean()*100) if mfe.notna().any() else np.nan,
                          "mfe_ge10_pct":float((mfe.dropna()>=10).mean()*100) if mfe.notna().any() else np.nan,
                          "mfe_median_pct":float(mfe.dropna().median()) if mfe.notna().any() else np.nan,
                          "mae_median_pct":float(mae.dropna().median()) if mae.notna().any() else np.nan,
                      })
          sm=pd.DataFrame(sums)
          sm.to_csv(OUT/"summary_by_research_level.csv",index=False,encoding="utf-8-sig")

          # Cohort-level counts, so immature recent cohorts are visible rather than silently mixed.
          cohort=(led.groupby(["signal_date","research_level"],dropna=False)
                    .agg(n=("code","size"),
                         d1_n=("d1_close_ret_pct",lambda x:pd.to_numeric(x,errors="coerce").notna().sum()),
                         d3_n=("d3_close_ret_pct",lambda x:pd.to_numeric(x,errors="coerce").notna().sum()),
                         d5_n=("d5_close_ret_pct",lambda x:pd.to_numeric(x,errors="coerce").notna().sum()),
                         d10_n=("d10_close_ret_pct",lambda x:pd.to_numeric(x,errors="coerce").notna().sum()))
                    .reset_index())
          cohort.to_csv(OUT/"cohort_maturity.csv",index=False,encoding="utf-8-sig")

          meta={
              "revision":REV,
              "research_only":True,
              "production_changed":False,
              "production_search_changed":False,
              "production_score_changed":False,
              "production_rank_changed":False,
              "production_order_changed":False,
              "same_sample_retuning":False,
              "outcome_only":True,
              "entry_reference":"REAL_FULL real_full_trust_source.snapshot_price on signal_date",
              "signal_date_authority":"REAL_FULL real_full_trust_source.signal_date, not overlay execution date",
              "horizons":["D1","D3","D5","D10"],
              "mfe_mae_window":"next market sessions D1..Dh, signal day excluded",
              "raw_rows":len(led),
              "signal_dates":sorted({str(pd.Timestamp(x).date()) for x in led.signal_date}),
              "overlay_revision":expected_revision,
              "guarded_exclusions":["SPAC name flag","adjacent close discontinuity >=45%"],
              "price_data_last_date":last_date.date().isoformat(),
              "note":"Descriptive validation of frozen research labels only. No production promotion or retuning."
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2,default=str),encoding="utf-8")

          report=["# REAL_FULL Overlay Outcome Ledger R1","",
                  "## Meta","```json",json.dumps(meta,ensure_ascii=False,indent=2,default=str),"```","",
                  "## Cohort maturity","```text",cohort.to_string(index=False),"```","",
                  "## Summary by research level","```text",sm.to_string(index=False),"```"]
          (OUT/"REPORT.md").write_text("\n".join(report),encoding="utf-8")

          print("REAL_FULL_OVERLAY_OUTCOME_LEDGER_PASS")
          print(json.dumps(meta,ensure_ascii=False,default=str))
          print(cohort.to_string(index=False))
          print(sm.to_string(index=False))
          PY

          python /tmp/outcome.py

      - name: Validate research-only invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_real_full_overlay_outcome/meta.json",encoding="utf-8"))
          assert m["revision"]=="REAL_FULL_OVERLAY_OUTCOME_LEDGER_R1_20261002"
          assert m["research_only"] is True
          assert m["production_changed"] is False
          assert m["production_search_changed"] is False
          assert m["production_score_changed"] is False
          assert m["production_rank_changed"] is False
          assert m["production_order_changed"] is False
          assert m["same_sample_retuning"] is False
          assert m["outcome_only"] is True

          q=pd.read_csv("reports/temp_real_full_overlay_outcome/overlay_outcome_ledger.csv")
          assert len(q)>0
          assert {"research_level","signal_date","snapshot_price","d1_close_ret_pct","mfe5_pct","mae5_pct"}.issubset(q.columns)
          print("REAL_FULL_OVERLAY_OUTCOME_INVARIANTS_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_real_full_overlay_outcome/meta.json || true
          echo
          cat reports/temp_real_full_overlay_outcome/REPORT.md || true

      - name: Upload outcome artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-real-full-overlay-outcome-ledger-r1
          path: reports/temp_real_full_overlay_outcome/**
          if-no-files-found: error
          retention-days: 90
