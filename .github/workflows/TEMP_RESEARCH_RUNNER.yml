name: TEMP ODOLI Holding Horizon Curve R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-odoli-holding-horizon-curve-r1
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run holding horizon study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_odoli_holding_horizon_curve

          cat >/tmp/study.py <<'PY'
          from pathlib import Path
          import json,re
          import numpy as np
          import pandas as pd

          OUT=Path("reports/temp_odoli_holding_horizon_curve")
          OUT.mkdir(parents=True,exist_ok=True)
          REV="ODOLI_HOLDING_HORIZON_CURVE_R1_20261002"

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def is_spac(name):
              s=str(name or "").upper()
              return "스팩" in s or "SPAC" in s

          q=pd.read_parquet("vendor/marcap/data/marcap-2026.parquet")
          if "Date" not in q.columns:q=q.reset_index()
          q["Date"]=pd.to_datetime(q["Date"],errors="coerce").dt.normalize()
          q["Code"]=q["Code"].map(norm_code)
          if "Market" in q.columns:
              q["Market"]=q["Market"].astype(str).str.upper()
              q=q[q.Market.isin(["KOSPI","KOSDAQ"])]
          for c in ["Open","High","Low","Close","Volume","Amount"]:
              q[c]=pd.to_numeric(q[c],errors="coerce")
          q=q.dropna(subset=["Date","Code","Open","High","Low","Close"])
          q=q[(q.Open>0)&(q.High>0)&(q.Low>0)&(q.Close>0)]
          q=q.sort_values(["Code","Date"]).drop_duplicates(["Code","Date"],keep="last")

          def feat(g):
              g=g.sort_values("Date").reset_index(drop=True).copy()
              c=pd.to_numeric(g.Close,errors="coerce")
              g["ma5"]=c.rolling(5,min_periods=5).mean()
              g["prev_close"]=c.shift(1); g["prev_ma5"]=g.ma5.shift(1)
              g["prev2_close"]=c.shift(2); g["prev2_ma5"]=g.ma5.shift(2)
              g["prev3_close"]=c.shift(3); g["prev3_ma5"]=g.ma5.shift(3)
              g["pre3_below_ma5_n"]=(
                  (g.prev_close<g.prev_ma5).astype(float)+
                  (g.prev2_close<g.prev2_ma5).astype(float)+
                  (g.prev3_close<g.prev3_ma5).astype(float)
              )
              g["ma5_slope_1d_pct"]=(g.ma5/g.prev_ma5-1)*100
              g["strict_odoli_r1"]=(
                  (g.Close>g.Open)&(g.prev_close<g.prev_ma5)&
                  (g.Close>g.ma5)&(g.ma5_slope_1d_pct>0)&
                  (g.pre3_below_ma5_n>=2)
              )
              return g

          sessions=sorted(pd.Timestamp(x).normalize() for x in q.Date.unique())
          mature_end=sessions[-16]
          sig_dates=[d for d in sessions if d<=mature_end][-40:]
          train=set(sig_dates[:20]); hold=set(sig_dates[20:]); sig_set=set(sig_dates)

          rows=[]

          for code,g0 in q.groupby("Code",sort=False):
              g=feat(g0)
              ma5=pd.to_numeric(g.ma5,errors="coerce")
              amount=pd.to_numeric(g.Amount,errors="coerce")
              hits=g.index[g.Date.isin(sig_set)&g.strict_odoli_r1.fillna(False)]

              for ii in hits:
                  i=int(ii)
                  if i+15>=len(g):continue
                  r0=g.iloc[i]
                  name=str(r0.get("Name","") or "")
                  if is_spac(name):continue

                  win=g.iloc[max(0,i-3):i+16]
                  cr=pd.to_numeric(win.Close,errors="coerce")
                  max_jump=float(cr.pct_change().abs().max()*100) if cr.pct_change().notna().any() else np.nan
                  if pd.notna(max_jump) and max_jump>=45:
                      continue

                  sig_date=pd.Timestamp(r0.Date)
                  split="TRAIN_EARLY" if sig_date in train else "HOLDOUT_LATE"
                  sig_close=float(r0.Close); sig_low=float(r0.Low)

                  d1=g.iloc[i+1]; d2=g.iloc[i+2]
                  fast=bool(
                      float(d2.Low)>float(d1.Low)
                      and pd.notna(ma5.iloc[i+2])
                      and float(d2.Close)>float(ma5.iloc[i+2])
                  )

                  c4=False
                  c4_idx=None
                  for j in range(i+4,i+11):
                      hist=g.iloc[i+1:j+1]
                      survive=bool(pd.to_numeric(hist.Low,errors="coerce").min()>=sig_low)
                      above=bool(pd.notna(ma5.iloc[j]) and float(g.iloc[j].Close)>float(ma5.iloc[j]))
                      hl=bool(float(g.iloc[j].Low)>float(g.iloc[j-1].Low))
                      pre20=amount.iloc[max(0,j-20):j]
                      ama=float(pre20.mean()) if len(pre20) else np.nan
                      ar=float(amount.iloc[j]/ama) if pd.notna(ama) and ama>0 else np.nan
                      if above and hl and pd.notna(ar) and ar>=1.0 and survive:
                          c4=True;c4_idx=j;break

                  if fast:
                      state="FAST"
                      confirm_idx=i+2
                  elif c4:
                      state="SLOW_C4"
                      confirm_idx=c4_idx
                  else:
                      state="OTHER_WATCH"
                      confirm_idx=None

                  base={
                      "split":split,"signal_date":sig_date,"code":code,"name":name,
                      "state":state,"fast":fast,"slow_c4":c4,
                      "confirm_day":(confirm_idx-i) if confirm_idx is not None else np.nan,
                      "signal_close":sig_close,
                  }

                  # Signal-date horizons.
                  for h in [5,7,10,15]:
                      closep=float(g.iloc[i+h].Close)
                      future=g.iloc[i+1:i+h+1]
                      row=base.copy()
                      row.update({
                          "axis":"SIGNAL_DAY",
                          "horizon":f"D{h}",
                          "horizon_days":h,
                          "close_return_pct":(closep/sig_close-1)*100,
                          "mfe_pct":(float(pd.to_numeric(future.High,errors="coerce").max())/sig_close-1)*100,
                          "mae_pct":(float(pd.to_numeric(future.Low,errors="coerce").min())/sig_close-1)*100,
                          "peak_to_close_giveback_pp":(
                              (float(pd.to_numeric(future.High,errors="coerce").max())/sig_close-1)*100
                              - (closep/sig_close-1)*100
                          ),
                      })
                      rows.append(row)

                  # Confirmation-date horizons. Only FAST/SLOW_C4.
                  if confirm_idx is not None:
                      confirm_close=float(g.iloc[confirm_idx].Close)
                      for h in [3,5,10]:
                          if confirm_idx+h>=len(g):continue
                          closep=float(g.iloc[confirm_idx+h].Close)
                          future=g.iloc[confirm_idx+1:confirm_idx+h+1]
                          row=base.copy()
                          row.update({
                              "axis":"CONFIRM_DAY",
                              "horizon":f"C+{h}",
                              "horizon_days":h,
                              "confirm_close":confirm_close,
                              "close_return_pct":(closep/confirm_close-1)*100,
                              "mfe_pct":(float(pd.to_numeric(future.High,errors="coerce").max())/confirm_close-1)*100,
                              "mae_pct":(float(pd.to_numeric(future.Low,errors="coerce").min())/confirm_close-1)*100,
                              "peak_to_close_giveback_pp":(
                                  (float(pd.to_numeric(future.High,errors="coerce").max())/confirm_close-1)*100
                                  - (closep/confirm_close-1)*100
                              ),
                          })
                          rows.append(row)

          df=pd.DataFrame(rows)
          if df.empty:raise SystemExit("NO_ROWS")
          df.to_csv(OUT/"horizon_events.csv",index=False,encoding="utf-8-sig")

          out=[]
          for (sp,state,axis,h),g in df.groupby(["split","state","axis","horizon"],dropna=False):
              out.append({
                  "split":sp,"state":state,"axis":axis,"horizon":h,"n":len(g),
                  "close_positive_pct":(g.close_return_pct>0).mean()*100,
                  "close_mean_pct":g.close_return_pct.mean(),
                  "close_median_pct":g.close_return_pct.median(),
                  "mfe_median_pct":g.mfe_pct.median(),
                  "mae_median_pct":g.mae_pct.median(),
                  "giveback_median_pp":g.peak_to_close_giveback_pp.median(),
                  "plus5_close_pct":(g.close_return_pct>=5).mean()*100,
                  "plus10_close_pct":(g.close_return_pct>=10).mean()*100,
              })
          summary=pd.DataFrame(out)
          summary.to_csv(OUT/"horizon_summary.csv",index=False,encoding="utf-8-sig")

          # Best descriptive horizon by state/split, reported but not promoted.
          best=[]
          for (sp,state,axis),g in summary.groupby(["split","state","axis"],dropna=False):
              gg=g.sort_values(["close_mean_pct","close_median_pct"],ascending=False)
              best.append(gg.iloc[0].to_dict())
          pd.DataFrame(best).to_csv(OUT/"descriptive_best_horizon.csv",index=False,encoding="utf-8-sig")

          meta={
              "revision":REV,
              "research_only":True,
              "production_changed":False,
              "automatic_ordering":False,
              "signal_horizons":[5,7,10,15],
              "confirm_horizons":[3,5,10],
              "states":["FAST","SLOW_C4","OTHER_WATCH"],
              "entry_anchor":"D0_CLOSE for signal axis; confirmation close for confirm axis",
              "same_historical_window_reused":True,
              "true_oos":False,
              "same_sample_tuning":False,
              "note":"Descriptive holding-period curve only. Best horizon is not a promoted rule."
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")

          (OUT/"REPORT.md").write_text(
              "# ODOLI Holding Horizon Curve R1\n\n```json\n"+
              json.dumps(meta,ensure_ascii=False,indent=2)+
              "\n```\n\n## Horizon summary\n```text\n"+
              summary.to_string(index=False)+
              "\n```\n",
              encoding="utf-8"
          )

          print("ODOLI_HOLDING_HORIZON_CURVE_PASS")
          print(json.dumps(meta,ensure_ascii=False))
          print(summary.to_string(index=False))
          PY

          python /tmp/study.py

      - name: Validate identity and horizon integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_odoli_holding_horizon_curve/meta.json",encoding="utf-8"))
          assert m["revision"]=="ODOLI_HOLDING_HORIZON_CURVE_R1_20261002"
          assert m["research_only"] is True
          assert m["production_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["true_oos"] is False
          q=pd.read_csv("reports/temp_odoli_holding_horizon_curve/horizon_events.csv")
          assert len(q)>0
          sig=set(q[q.axis=="SIGNAL_DAY"].horizon.unique())
          assert sig=={"D5","D7","D10","D15"}
          conf=set(q[q.axis=="CONFIRM_DAY"].horizon.unique())
          assert conf=={"C+3","C+5","C+10"}
          print("HOLDING_HORIZON_INTEGRITY_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_odoli_holding_horizon_curve/meta.json || true
          echo
          cat reports/temp_odoli_holding_horizon_curve/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-odoli-holding-horizon-curve-r1
          path: reports/temp_odoli_holding_horizon_curve/**
          if-no-files-found: error
          retention-days: 90
