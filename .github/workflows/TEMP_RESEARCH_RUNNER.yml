name: TEMP ODOLI Prior KKI Symmetry Sidecar R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-odoli-prior-kki-symmetry-sidecar-r1
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' \
            'data/marcap-2025.parquet' \
            'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run prior KKI and symmetry sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_odoli_prior_kki_symmetry

          cat >/tmp/study.py <<'PY'
          from pathlib import Path
          import json,re,math
          import numpy as np
          import pandas as pd

          OUT=Path("reports/temp_odoli_prior_kki_symmetry")
          REV="ODOLI_PRIOR_KKI_SYMMETRY_SIDECAR_R1_20261002"
          H=10

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def is_spac(name):
              s=str(name or "").upper()
              return "스팩" in s or "SPAC" in s

          def load_year(y):
              p=Path(f"vendor/marcap/data/marcap-{y}.parquet")
              if not p.exists(): return pd.DataFrame()
              q=pd.read_parquet(p)
              if "Date" not in q.columns:q=q.reset_index()
              return q

          q=pd.concat([load_year(2025),load_year(2026)],ignore_index=True,sort=False)
          q["Date"]=pd.to_datetime(q["Date"],errors="coerce").dt.normalize()
          q["Code"]=q["Code"].map(norm_code)
          if "Market" in q.columns:
              q["Market"]=q["Market"].astype(str).str.upper()
              q=q[q.Market.isin(["KOSPI","KOSDAQ"])]
          for c in ["Open","High","Low","Close","Volume","Amount"]:
              q[c]=pd.to_numeric(q[c],errors="coerce")
          q=q.dropna(subset=["Date","Code","Open","High","Low","Close"])
          q=q[(q.Open>0)&(q.High>0)&(q.Low>0)&(q.Close>0)]
          q=q.sort_values(["Code","Date"]).drop_duplicates(["Code","Date"],keep="last")

          def feat(g):
              g=g.sort_values("Date").reset_index(drop=True).copy()
              c=g.Close.astype(float)
              g["ma5"]=c.rolling(5,min_periods=5).mean()
              g["prev_close"]=c.shift(1); g["prev_ma5"]=g.ma5.shift(1)
              g["prev2_close"]=c.shift(2); g["prev2_ma5"]=g.ma5.shift(2)
              g["prev3_close"]=c.shift(3); g["prev3_ma5"]=g.ma5.shift(3)
              g["pre3_below_ma5_n"]=(
                  (g.prev_close<g.prev_ma5).astype(float)+
                  (g.prev2_close<g.prev2_ma5).astype(float)+
                  (g.prev3_close<g.prev3_ma5).astype(float)
              )
              g["ma5_slope_1d_pct"]=(g.ma5/g.prev_ma5-1)*100
              g["strict_odoli_r1"]=(
                  (g.Close>g.Open)&(g.prev_close<g.prev_ma5)&
                  (g.Close>g.ma5)&(g.ma5_slope_1d_pct>0)&
                  (g.pre3_below_ma5_n>=2)
              )
              g["ret1"]=(c/c.shift(1)-1)*100
              g["ret3"]=(c/c.shift(3)-1)*100
              g["ret5"]=(c/c.shift(5)-1)*100
              g["amount20"]=g.Amount.rolling(20,min_periods=10).mean()
              g["amount_ratio20"]=g.Amount/g.amount20
              return g

          sessions=sorted(pd.Timestamp(x).normalize() for x in q[q.Date.dt.year==2026].Date.unique())
          mature_end=sessions[-11]
          sig_dates=[d for d in sessions if d<=mature_end][-40:]
          train=set(sig_dates[:20]); hold=set(sig_dates[20:]); sig_set=set(sig_dates)

          rows=[]

          for code,g0 in q.groupby("Code",sort=False):
              g=feat(g0)
              hits=g.index[g.Date.isin(sig_set)&g.strict_odoli_r1.fillna(False)]

              for ii in hits:
                  i=int(ii)
                  if i+H>=len(g) or i<125: continue
                  r0=g.iloc[i]
                  name=str(r0.get("Name","") or "")
                  if is_spac(name): continue

                  # Exclude suspicious split/relisting-like discontinuity around signal/outcome.
                  cr=pd.to_numeric(g.iloc[max(0,i-3):i+H+1].Close,errors="coerce")
                  if cr.pct_change().abs().max()*100 >=45: continue

                  sd=pd.Timestamp(r0.Date)
                  split="TRAIN_EARLY" if sd in train else "HOLDOUT_LATE"
                  entry=float(r0.Close); sig_low=float(r0.Low)

                  # Frozen descriptive outcome state from prior ODOLI studies.
                  d1=g.iloc[i+1]; d2=g.iloc[i+2]
                  fast=bool(
                      float(d2.Low)>float(d1.Low)
                      and pd.notna(g.ma5.iloc[i+2])
                      and float(d2.Close)>float(g.ma5.iloc[i+2])
                  )
                  c4=False
                  c4_day=np.nan
                  for j in range(i+4,i+11):
                      hist=g.iloc[i+1:j+1]
                      survive=bool(hist.Low.min()>=sig_low)
                      above=bool(pd.notna(g.ma5.iloc[j]) and float(g.iloc[j].Close)>float(g.ma5.iloc[j]))
                      hl=bool(float(g.iloc[j].Low)>float(g.iloc[j-1].Low))
                      pre20=g.Amount.iloc[max(0,j-20):j]
                      ama=float(pre20.mean()) if len(pre20) else np.nan
                      ar=float(g.Amount.iloc[j]/ama) if pd.notna(ama) and ama>0 else np.nan
                      if above and hl and pd.notna(ar) and ar>=1.0 and survive:
                          c4=True;c4_day=j-i;break
                  state="FAST" if fast else ("SLOW_C4" if c4 else "OTHER_WATCH")

                  # Point-in-time prior history only; excludes signal day and all future bars.
                  h60=g.iloc[i-60:i].copy()
                  h120=g.iloc[i-120:i].copy()

                  def prior_stats(h):
                      if h.empty:
                          return {}
                      # Strong-wave proxies frozen before looking at outcomes:
                      # 1D >= +10, 3D >= +15, 5D >= +20, amount ratio20 >=3.
                      strong1=(h.ret1>=10)
                      strong3=(h.ret3>=15)
                      strong5=(h.ret5>=20)
                      amt3=(h.amount_ratio20>=3)
                      any_strong=(strong1|strong3|strong5)

                      # Prior forward MFE computed only within prior history:
                      # for each historical day, max High over next 5 trading days, requiring all bars before signal.
                      mfe5=[]
                      for k in range(len(h)-5):
                          base=float(h.Close.iloc[k])
                          if base<=0: continue
                          hi=float(h.High.iloc[k+1:k+6].max())
                          mfe5.append((hi/base-1)*100)
                      return {
                          "strong1_n":int(strong1.sum()),
                          "strong3_n":int(strong3.sum()),
                          "strong5_n":int(strong5.sum()),
                          "strong_any_n":int(any_strong.sum()),
                          "amount3x_n":int(amt3.sum()),
                          "max_ret1":float(pd.to_numeric(h.ret1,errors="coerce").max()),
                          "max_ret3":float(pd.to_numeric(h.ret3,errors="coerce").max()),
                          "max_ret5":float(pd.to_numeric(h.ret5,errors="coerce").max()),
                          "max_amount_ratio20":float(pd.to_numeric(h.amount_ratio20,errors="coerce").max()),
                          "prior_mfe5_max":float(np.nanmax(mfe5)) if mfe5 else np.nan,
                          "prior_mfe5_ge15_n":int(sum(x>=15 for x in mfe5)),
                          "prior_mfe5_ge20_n":int(sum(x>=20 for x in mfe5)),
                      }

                  s60=prior_stats(h60)
                  s120=prior_stats(h120)

                  # Recency of latest strong wave.
                  latest_strong_days=np.nan
                  strong_mask=(h120.ret1>=10)|(h120.ret3>=15)|(h120.ret5>=20)
                  idxs=np.where(strong_mask.fillna(False).to_numpy())[0]
                  if len(idxs):
                      latest_strong_days=len(h120)-1-int(idxs[-1])

                  # Frozen KKI categories.
                  # RECENT_KKI: strong wave in last 60d.
                  # REPEATED_KKI: >=2 strong waves in 120d OR >=2 prior 5d MFE>=20 episodes.
                  # WEAK_KKI: one strong episode in 120d.
                  # NO_PRIOR_KKI: none.
                  recent=bool(s60.get("strong_any_n",0)>=1 or s60.get("prior_mfe5_ge20_n",0)>=1)
                  repeated=bool(s120.get("strong_any_n",0)>=2 or s120.get("prior_mfe5_ge20_n",0)>=2)
                  weak=bool(s120.get("strong_any_n",0)>=1 or s120.get("prior_mfe5_ge15_n",0)>=1)
                  if recent and repeated:
                      kki="RECENT_REPEATED_KKI"
                  elif recent:
                      kki="RECENT_KKI"
                  elif repeated:
                      kki="REPEATED_KKI"
                  elif weak:
                      kki="WEAK_KKI"
                  else:
                      kki="NO_PRIOR_KKI"

                  # Simple symmetry candidate:
                  # current signal's immediate pre-signal 10d wave magnitude compared with strongest prior 3/5d wave.
                  # Descriptive only; no future bars used.
                  pre10=g.iloc[i-10:i]
                  cur_base=float(pre10.Close.min()) if len(pre10) else np.nan
                  cur_peak=float(pre10.High.max()) if len(pre10) else np.nan
                  cur_wave=(cur_peak/cur_base-1)*100 if pd.notna(cur_base) and cur_base>0 else np.nan
                  prior_wave=max(
                      x for x in [
                          s120.get("max_ret3",np.nan),
                          s120.get("max_ret5",np.nan),
                          s120.get("prior_mfe5_max",np.nan)
                      ] if pd.notna(x)
                  ) if any(pd.notna(x) for x in [
                      s120.get("max_ret3",np.nan),
                      s120.get("max_ret5",np.nan),
                      s120.get("prior_mfe5_max",np.nan)
                  ]) else np.nan

                  symmetry_ratio=cur_wave/prior_wave if pd.notna(cur_wave) and pd.notna(prior_wave) and prior_wave>0 else np.nan
                  symmetry_candidate=bool(
                      kki!="NO_PRIOR_KKI"
                      and pd.notna(symmetry_ratio)
                      and 0.45<=symmetry_ratio<=1.25
                  )

                  # Outcomes for descriptive comparison.
                  fut=g.iloc[i+1:i+11]
                  d5_close=(float(g.iloc[i+5].Close)/entry-1)*100
                  d10_close=(float(g.iloc[i+10].Close)/entry-1)*100
                  mfe5=(float(g.iloc[i+1:i+6].High.max())/entry-1)*100
                  mfe10=(float(fut.High.max())/entry-1)*100
                  mae10=(float(fut.Low.min())/entry-1)*100

                  rows.append({
                      "split":split,"signal_date":sd,"code":code,"name":name,
                      "state_reporting_only":state,"fast_d2":fast,"eventual_c4_reporting_only":c4,
                      "kki_class":kki,
                      "recent_kki":recent,"repeated_kki":repeated,
                      "latest_strong_wave_days_ago":latest_strong_days,
                      "symmetry_candidate":symmetry_candidate,
                      "current_pre10_wave_pct":cur_wave,
                      "prior_reference_wave_pct":prior_wave,
                      "symmetry_ratio":symmetry_ratio,
                      "strong_any_60_n":s60.get("strong_any_n",0),
                      "strong_any_120_n":s120.get("strong_any_n",0),
                      "amount3x_60_n":s60.get("amount3x_n",0),
                      "amount3x_120_n":s120.get("amount3x_n",0),
                      "prior_mfe5_ge20_60_n":s60.get("prior_mfe5_ge20_n",0),
                      "prior_mfe5_ge20_120_n":s120.get("prior_mfe5_ge20_n",0),
                      "prior_mfe5_max_120_pct":s120.get("prior_mfe5_max",np.nan),
                      "max_ret1_120_pct":s120.get("max_ret1",np.nan),
                      "max_ret3_120_pct":s120.get("max_ret3",np.nan),
                      "max_ret5_120_pct":s120.get("max_ret5",np.nan),
                      "max_amount_ratio20_120":s120.get("max_amount_ratio20",np.nan),
                      "d5_close_ret_pct":d5_close,
                      "d10_close_ret_pct":d10_close,
                      "mfe5_pct":mfe5,
                      "mfe10_pct":mfe10,
                      "mae10_pct":mae10,
                      "d10_positive":d10_close>0,
                      "mfe10_ge10":mfe10>=10,
                      "mfe10_ge15":mfe10>=15,
                  })

          df=pd.DataFrame(rows)
          if df.empty: raise SystemExit("NO_ROWS")
          df.to_csv(OUT/"prior_kki_events.csv",index=False,encoding="utf-8-sig")

          def summarize(group_cols):
              out=[]
              for keys,g in df.groupby(group_cols,dropna=False):
                  if not isinstance(keys,tuple): keys=(keys,)
                  rec={c:k for c,k in zip(group_cols,keys)}
                  rec.update({
                      "n":len(g),
                      "d10_positive_pct":g.d10_positive.mean()*100,
                      "d10_close_mean_pct":g.d10_close_ret_pct.mean(),
                      "d10_close_median_pct":g.d10_close_ret_pct.median(),
                      "mfe10_ge10_pct":g.mfe10_ge10.mean()*100,
                      "mfe10_ge15_pct":g.mfe10_ge15.mean()*100,
                      "mfe10_median_pct":g.mfe10_pct.median(),
                      "mae10_median_pct":g.mae10_pct.median(),
                  })
                  out.append(rec)
              return pd.DataFrame(out)

          summarize(["split","kki_class"]).to_csv(OUT/"summary_by_kki.csv",index=False,encoding="utf-8-sig")
          summarize(["split","state_reporting_only","kki_class"]).to_csv(OUT/"summary_by_state_kki.csv",index=False,encoding="utf-8-sig")
          summarize(["split","symmetry_candidate"]).to_csv(OUT/"summary_by_symmetry.csv",index=False,encoding="utf-8-sig")
          summarize(["split","state_reporting_only","symmetry_candidate"]).to_csv(OUT/"summary_by_state_symmetry.csv",index=False,encoding="utf-8-sig")

          meta={
              "revision":REV,
              "research_only":True,
              "production_changed":False,
              "automatic_ordering":False,
              "price_policy_changed":False,
              "point_in_time_prior_history_only":True,
              "signal_day_excluded_from_kki_features":True,
              "future_bars_excluded_from_kki_features":True,
              "kki_definition_frozen_for_this_run":{
                  "strong_1d":"+10% or more",
                  "strong_3d":"+15% or more",
                  "strong_5d":"+20% or more",
                  "amount_explosion":"Amount / trailing20 mean >= 3x",
                  "recent":"at least one strong wave or prior 5d MFE>=20 within 60d",
                  "repeated":"at least 2 strong waves in 120d OR at least 2 prior 5d MFE>=20 episodes",
              },
              "symmetry_definition_frozen_for_this_run":{
                  "current_wave":"pre-signal 10d low-to-high wave",
                  "prior_reference":"max(prior 120d 3d return, 5d return, historical 5d MFE)",
                  "candidate":"KKI exists and current/prior ratio between 0.45 and 1.25"
              },
              "same_historical_window_reused":True,
              "true_oos":False,
              "same_sample_tuning":False,
              "note":"Descriptive sidecar only. KKI/symmetry must not be promoted without prospective validation."
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")

          hold=df[df.split=="HOLDOUT_LATE"]
          report=[
              "# ODOLI Prior KKI / Symmetry Sidecar R1","",
              "## Meta","```json",json.dumps(meta,ensure_ascii=False,indent=2),"```","",
              "## HOLDOUT KKI","```text",
              summarize(["split","kki_class"]).query("split=='HOLDOUT_LATE'").to_string(index=False),
              "```","",
              "## HOLDOUT state x KKI","```text",
              summarize(["split","state_reporting_only","kki_class"]).query("split=='HOLDOUT_LATE'").to_string(index=False),
              "```","",
              "## HOLDOUT symmetry","```text",
              summarize(["split","symmetry_candidate"]).query("split=='HOLDOUT_LATE'").to_string(index=False),
              "```"
          ]
          (OUT/"REPORT.md").write_text("\n".join(report),encoding="utf-8")

          print("ODOLI_PRIOR_KKI_SYMMETRY_PASS")
          print(json.dumps(meta,ensure_ascii=False))
          print(summarize(["split","kki_class"]).query("split=='HOLDOUT_LATE'").to_string(index=False))
          PY

          python /tmp/study.py

      - name: Validate sidecar isolation and causality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_odoli_prior_kki_symmetry/meta.json",encoding="utf-8"))
          assert m["revision"]=="ODOLI_PRIOR_KKI_SYMMETRY_SIDECAR_R1_20261002"
          assert m["research_only"] is True
          assert m["production_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["price_policy_changed"] is False
          assert m["point_in_time_prior_history_only"] is True
          assert m["signal_day_excluded_from_kki_features"] is True
          assert m["future_bars_excluded_from_kki_features"] is True
          q=pd.read_csv("reports/temp_odoli_prior_kki_symmetry/prior_kki_events.csv")
          assert len(q)>0
          assert set(q.kki_class).issubset({
              "RECENT_REPEATED_KKI","RECENT_KKI","REPEATED_KKI","WEAK_KKI","NO_PRIOR_KKI"
          })
          print("PRIOR_KKI_SYMMETRY_CAUSAL_ISOLATION_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_odoli_prior_kki_symmetry/meta.json || true
          echo
          cat reports/temp_odoli_prior_kki_symmetry/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-odoli-prior-kki-symmetry-sidecar-r1
          path: reports/temp_odoli_prior_kki_symmetry/**
          if-no-files-found: error
          retention-days: 90
