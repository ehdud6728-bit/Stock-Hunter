name: TEMP ODOLI Shakeout Core Combos R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-odoli-shakeout-core-combos-r1
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run core combo study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_odoli_shakeout_core_combos

          cat >/tmp/core_combo.py <<'PY'
          from pathlib import Path
          import json,re
          import numpy as np
          import pandas as pd

          OUT=Path("reports/temp_odoli_shakeout_core_combos")
          OUT.mkdir(parents=True,exist_ok=True)
          H=10

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def is_spac(name):
              s=str(name or "").upper()
              return ("스팩" in s) or ("SPAC" in s)

          q=pd.read_parquet("vendor/marcap/data/marcap-2026.parquet")
          if "Date" not in q.columns:q=q.reset_index()
          q["Date"]=pd.to_datetime(q["Date"],errors="coerce").dt.normalize()
          q["Code"]=q["Code"].map(norm_code)
          if "Market" in q.columns:
              q=q[q["Market"].astype(str).str.upper().isin(["KOSPI","KOSDAQ"])]
          for c in ["Open","High","Low","Close","Volume","Amount"]:
              q[c]=pd.to_numeric(q[c],errors="coerce")
          q=q.dropna(subset=["Date","Code","Open","High","Low","Close"])
          q=q[(q.Open>0)&(q.High>0)&(q.Low>0)&(q.Close>0)]
          q=q.sort_values(["Code","Date"]).drop_duplicates(["Code","Date"],keep="last")

          def feat(g):
              g=g.sort_values("Date").reset_index(drop=True).copy()
              c=g.Close
              g["ma5"]=c.rolling(5,min_periods=5).mean()
              g["prev_close"]=c.shift(1); g["prev_ma5"]=g.ma5.shift(1)
              g["prev2_close"]=c.shift(2); g["prev2_ma5"]=g.ma5.shift(2)
              g["prev3_close"]=c.shift(3); g["prev3_ma5"]=g.ma5.shift(3)
              g["pre3_below_ma5_n"]=(
                  (g.prev_close<g.prev_ma5).astype(float)
                  +(g.prev2_close<g.prev2_ma5).astype(float)
                  +(g.prev3_close<g.prev3_ma5).astype(float)
              )
              g["ma5_slope_1d_pct"]=(g.ma5/g.prev_ma5-1)*100
              g["strict_odoli_r1"]=(
                  (g.Close>g.Open)&(g.prev_close<g.prev_ma5)&(g.Close>g.ma5)
                  &(g.ma5_slope_1d_pct>0)&(g.pre3_below_ma5_n>=2)
              )
              return g

          sessions=sorted(pd.Timestamp(x).normalize() for x in q.Date.unique())
          mature_end=sessions[-22]
          sig_dates=[d for d in sessions if d<=mature_end][-40:]
          sig_set=set(sig_dates)
          cut=len(sig_dates)//2
          train=set(sig_dates[:cut]); hold=set(sig_dates[cut:])

          rows=[]
          for code,g0 in q.groupby("Code",sort=False):
              g=feat(g0); ma5=g.ma5
              amt=pd.to_numeric(g.Amount,errors="coerce")
              hits=g.index[g.Date.isin(sig_set)&g.strict_odoli_r1.fillna(False)]

              for ii in hits:
                  i=int(ii)
                  if i+21>=len(g):continue
                  name=str(g.iloc[i].get("Name","") or "")
                  if is_spac(name):continue

                  sig_date=pd.Timestamp(g.iloc[i].Date)
                  split="TRAIN_EARLY" if sig_date in train else "HOLDOUT_LATE"
                  sig_low=float(g.iloc[i].Low)
                  d1_low=float(g.iloc[i+1].Low)
                  d2_low=float(g.iloc[i+2].Low)
                  d2_close=float(g.iloc[i+2].Close)
                  if not (d2_low>d1_low and pd.notna(ma5.iloc[i+2]) and d2_close>float(ma5.iloc[i+2])):
                      continue

                  trig=None
                  for j in range(i+3,i+11):
                      if j+1>=len(g):break
                      if pd.notna(ma5.iloc[j]) and float(g.iloc[j].Low)<=float(ma5.iloc[j])*1.005 and float(g.iloc[j].Close)>=float(ma5.iloc[j]):
                          trig=j;break
                  if trig is None:continue
                  entry_idx=trig+1
                  if entry_idx+H>=len(g):continue

                  pre2=g.iloc[max(i+3,trig-1):trig+1]
                  pullback_low=float(pd.to_numeric(pre2.Low,errors="coerce").min())
                  if not np.isfinite(pullback_low) or pullback_low<=0:continue

                  break_idx=None
                  for j in range(entry_idx+1,entry_idx+H+1):
                      if float(g.iloc[j].Low)<=pullback_low:
                          break_idx=j;break
                  if break_idx is None or break_idx+H>=len(g):continue

                  b=g.iloc[break_idx]
                  bclose=float(b.Close)
                  a20=amt.iloc[max(0,break_idx-20):break_idx]
                  ar20=float(amt.iloc[break_idx]/a20.mean()) if len(a20) and pd.notna(a20.mean()) and a20.mean()>0 else np.nan

                  d1=g.iloc[break_idx+1]
                  d2=g.iloc[break_idx+2]
                  d3=g.iloc[break_idx+3]

                  d1_hl=bool(float(d1.Low)>float(b.Low))
                  d2_reclaim=bool(float(d2.Close)>pullback_low)
                  d3_reclaim=bool(float(d3.Close)>pullback_low)

                  combo1=bool(pd.notna(ar20) and ar20<=0.5 and (d2_reclaim or d3_reclaim))
                  combo2=bool(pd.notna(ar20) and ar20<=0.8 and d1_hl and d3_reclaim)
                  combo3=bool(pd.notna(ar20) and ar20>=0.8 and (not d2_reclaim) and (not d3_reclaim))

                  fut=g.iloc[break_idx+1:break_idx+H+1]
                  fhigh=float(pd.to_numeric(fut.High,errors="coerce").max())
                  flow=float(pd.to_numeric(fut.Low,errors="coerce").min())
                  fclose=float(fut.iloc[-1].Close)
                  mfe=(fhigh/bclose-1)*100
                  mae=(flow/bclose-1)*100
                  cret=(fclose/bclose-1)*100

                  rows.append({
                      "split":split,"signal_date":sig_date,"code":code,"name":name,
                      "break_date":b.Date,"amount_ratio20":ar20,
                      "d1_higher_low":d1_hl,"d2_reclaim":d2_reclaim,"d3_reclaim":d3_reclaim,
                      "combo1_amt_le05_reclaim_d2or3":combo1,
                      "combo2_amt_le08_d1hl_d3reclaim":combo2,
                      "combo3_amt_ge08_no_reclaim_d2d3":combo3,
                      "future_mfe_pct":mfe,"future_mae_pct":mae,"future_close_ret_pct":cret,
                      "plus5":mfe>=5,"plus10":mfe>=10,"plus15":mfe>=15
                  })

          ev=pd.DataFrame(rows)
          if ev.empty:raise SystemExit("NO_CORE_COMBO_ROWS")
          ev.to_csv(OUT/"events.csv",index=False,encoding="utf-8-sig")

          combos=[
              ("COMBO1_AMT_LE05_RECLAIM_D2_OR_D3","combo1_amt_le05_reclaim_d2or3"),
              ("COMBO2_AMT_LE08_D1_HL_D3_RECLAIM","combo2_amt_le08_d1hl_d3reclaim"),
              ("COMBO3_AMT_GE08_NO_RECLAIM_D2_D3","combo3_amt_ge08_no_reclaim_d2d3"),
          ]

          out=[]
          for split,g0 in ev.groupby("split"):
              for label,col in combos:
                  for flag in [True,False]:
                      g=g0[g0[col].eq(flag)]
                      if not len(g):continue
                      out.append({
                          "split":split,"combo":label,"match":flag,"n":len(g),
                          "plus5_rate_pct":g.plus5.mean()*100,
                          "plus10_rate_pct":g.plus10.mean()*100,
                          "plus15_rate_pct":g.plus15.mean()*100,
                          "mfe_median_pct":g.future_mfe_pct.median(),
                          "mae_median_pct":g.future_mae_pct.median(),
                          "close_ret_median_pct":g.future_close_ret_pct.median(),
                          "amount_ratio20_median":g.amount_ratio20.median(),
                      })
          s=pd.DataFrame(out)
          s.to_csv(OUT/"summary_core_combos.csv",index=False,encoding="utf-8-sig")

          # Train vs holdout deltas for matched=True only.
          t=s[s["match"].eq(True)&s["split"].eq("TRAIN_EARLY")]
          h=s[s["match"].eq(True)&s["split"].eq("HOLDOUT_LATE")]
          c=t.merge(h,on="combo",suffixes=("_train","_hold"))
          if len(c):
              c["plus10_delta_pp"]=c.plus10_rate_pct_hold-c.plus10_rate_pct_train
              c["plus15_delta_pp"]=c.plus15_rate_pct_hold-c.plus15_rate_pct_train
              c["close_ret_delta_pp"]=c.close_ret_median_pct_hold-c.close_ret_median_pct_train
          c.to_csv(OUT/"temporal_consistency.csv",index=False,encoding="utf-8-sig")

          meta={
              "revision":"ODOLI_SHAKEOUT_CORE_COMBOS_R1_20261001",
              "research_only":True,
              "same_sample_tuning":False,
              "rule_promoted":False,
              "production_changed":False,
              "auto_ordering":False,
              "combos_predeclared":[x[0] for x in combos],
              "outcome":"FORWARD_10_SESSION_ABSOLUTE_MFE_PLUS5_PLUS10_PLUS15",
              "scope":"HISTORICAL_TEMPORAL_ROBUSTNESS_NOT_TRUE_PROSPECTIVE_OOS",
              "event_rows":len(ev),
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
          (OUT/"REPORT.md").write_text(
              "# ODOLI Shakeout Core Combos R1\n\n```text\n"+s.to_string(index=False)+
              "\n```\n\n## Temporal consistency\n```text\n"+
              (c.to_string(index=False) if len(c) else "NO_MATCHED_COMBOS")+"\n```\n",
              encoding="utf-8"
          )

          print("ODOLI_SHAKEOUT_CORE_COMBOS_PASS")
          print(json.dumps(meta,ensure_ascii=False))
          print(s.to_string(index=False))
          print(c.to_string(index=False))
          PY

          python /tmp/core_combo.py

      - name: Validate research identity and anti-leakage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_odoli_shakeout_core_combos/meta.json",encoding="utf-8"))
          assert m["revision"]=="ODOLI_SHAKEOUT_CORE_COMBOS_R1_20261001"
          assert m["research_only"] is True
          assert m["same_sample_tuning"] is False
          assert m["rule_promoted"] is False
          assert m["production_changed"] is False
          q=pd.read_csv("reports/temp_odoli_shakeout_core_combos/events.csv")
          assert len(q)>0
          print("SHAKEOUT_CORE_COMBOS_ANTI_LEAKAGE_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_odoli_shakeout_core_combos/meta.json || true
          echo
          cat reports/temp_odoli_shakeout_core_combos/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-odoli-shakeout-core-combos-r1
          path: reports/temp_odoli_shakeout_core_combos/**
          if-no-files-found: error
          retention-days: 90
