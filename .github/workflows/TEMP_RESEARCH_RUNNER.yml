name: TEMP ODOLI Catalyst Causal Sidecar R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-odoli-catalyst-causal-sidecar-r1
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy exchange-calendars

      - name: Restore latest ODOLI prospective state
        id: odoli_restore
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/odoli_independent_r1
          key: odoli-independent-r1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            odoli-independent-r1-${{ github.ref_name }}-

      - name: Restore latest V73 catalyst state
        id: v73_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/v73_catalyst_source_ledger.csv
            reports/v73_ai_comment_source_ledger.csv
            reports/v73_official_disclosure_ledger.csv
            reports/v73_news_source_ledger.csv
            reports/v73_global_catalyst_ledger.csv
            reports/v73_catalyst_source_capture_audit.csv
            reports/v73_catalyst_query_universe.csv
            reports/v73_catalyst_first_seen_integrity_audit.csv
            reports/v73_market_sector_context_ledger.csv
            reports/v73_market_sector_context_coverage.csv
            reports/v73_market_sector_forward_capture_audit.csv
            reports/catalyst_raw
          key: stockhunter-v73-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stockhunter-v73-state-${{ github.ref_name }}-
            stockhunter-v73-state-

      - name: Run causal catalyst sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_odoli_catalyst_sidecar
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json,re,hashlib
          import numpy as np
          import pandas as pd
          import exchange_calendars as xcals

          OUT=Path("reports/temp_odoli_catalyst_sidecar")
          REV="ODOLI_CATALYST_CAUSAL_SIDECAR_R1_20261002"
          FROZEN_PRICE_POLICY_FP="7c2dbdf0f93340e9445b842aaa5fb62ceee973f9f5b65b2a589390f72fd2c1c0"

          def norm_code(v):
              raw=str(v or "").strip().upper()
              if raw.endswith(".0") and raw[:-2].isdigit(): raw=raw[:-2]
              for suffix in (".KS",".KQ",".KRX"):
                  if raw.endswith(suffix): raw=raw[:-len(suffix)]
              s="".join(ch for ch in raw if ch.isalnum())
              if len(s)==7 and s.startswith("A"): s=s[1:]
              if s.isdigit() and len(s)<=6:return s.zfill(6)
              return s[-6:] if len(s)>=6 else s

          def read_csv(p):
              p=Path(p)
              if not p.exists() or p.stat().st_size==0:return pd.DataFrame()
              try:return pd.read_csv(p,dtype=str,encoding="utf-8-sig",low_memory=False).fillna("")
              except Exception:
                  try:return pd.read_csv(p,dtype=str,low_memory=False).fillna("")
                  except Exception:return pd.DataFrame()

          def parse_ts(s):
              return pd.to_datetime(s,errors="coerce",utc=True)

          now=datetime.now(ZoneInfo("Asia/Seoul"))
          now_ts=pd.Timestamp(now)

          event_path=Path("reports/.cache/odoli_independent_r1/events.csv")
          events=read_csv(event_path)
          if not events.empty:
              events["signal_date"]=pd.to_datetime(events["signal_date"],errors="coerce").dt.normalize()
              events["code"]=events["code"].map(norm_code)
              events=events[events.signal_date.notna() & events.code.ne("")].copy()

          ledger_files=[
              "reports/v73_catalyst_source_ledger.csv",
              "reports/v73_official_disclosure_ledger.csv",
              "reports/v73_news_source_ledger.csv",
              "reports/v73_global_catalyst_ledger.csv",
          ]
          frames=[]
          file_diag=[]
          for fp in ledger_files:
              q=read_csv(fp)
              file_diag.append({"file":fp,"exists":Path(fp).exists(),"rows":len(q)})
              if not q.empty:
                  q["_ledger_file"]=Path(fp).name
                  frames.append(q)
          led=pd.concat(frames,ignore_index=True,sort=False) if frames else pd.DataFrame()

          # Deduplicate stable source identities if possible.
          if not led.empty:
              for c in ["source_key","source_id","code","name","title","summary","published_at","updated_at",
                        "first_seen_at","event_occurred_at","official_at","retrieved_at","causal_mode",
                        "official_source","independent_source","source_name","source_domain","event_type",
                        "materiality","direct_benefit","thesis_validity","new_fact","global_scope"]:
                  if c not in led.columns:led[c]=""
              led["code"]=led["code"].map(norm_code)
              key=led["source_key"].astype(str)
              fallback=(led["source_name"].astype(str)+"|"+led["source_id"].astype(str)+"|"+
                        led["code"].astype(str)+"|"+led["title"].astype(str)+"|"+led["published_at"].astype(str))
              led["_key"]=np.where(key.str.strip().ne(""),key,fallback)
              led=led.drop_duplicates("_key",keep="last").copy()

              for c in ["published_at","updated_at","first_seen_at","event_occurred_at","official_at","retrieved_at"]:
                  led[c+"_ts"]=parse_ts(led[c])

              # Point-in-time availability:
              # FORWARD_CAUSAL is usable only after first_seen/retrieved.
              # OFFICIAL_ARCHIVE_CAUSAL may use official timestamp.
              led["available_at"]=led["first_seen_at_ts"].combine_first(led["retrieved_at_ts"])
              off=(led["causal_mode"].astype(str)=="OFFICIAL_ARCHIVE_CAUSAL")
              led.loc[off,"available_at"]=(
                  led.loc[off,"official_at_ts"]
                  .combine_first(led.loc[off,"published_at_ts"])
                  .combine_first(led.loc[off,"available_at"])
              )
              causal=led["causal_mode"].astype(str).isin(["FORWARD_CAUSAL","OFFICIAL_ARCHIVE_CAUSAL"])
              led=led[causal & led["available_at"].notna()].copy()
              led=led[led["available_at"]<=pd.Timestamp(now_ts).tz_convert("UTC")].copy()

          # First-seen integrity audit.
          first_seen_audit=read_csv("reports/v73_catalyst_first_seen_integrity_audit.csv")
          capture_audit=read_csv("reports/v73_catalyst_source_capture_audit.csv")

          cal=xcals.get_calendar("XKRX")
          rows=[]
          evidence_rows=[]

          if not events.empty:
              for _,e in events.iterrows():
                  sd=pd.Timestamp(e.signal_date).normalize()
                  code=norm_code(e.code)
                  # trading-age as of current date
                  try:
                      sess=cal.sessions_in_range(sd, pd.Timestamp(now.date()))
                      age=max(0,len(sess)-1)
                  except Exception:
                      age=max(0,(pd.Timestamp(now.date())-sd).days)

                  # Stock-specific evidence only. Global rows are not silently assigned to stocks.
                  z=led[led.code.eq(code)].copy() if not led.empty else pd.DataFrame()
                  if not z.empty:
                      z=z.sort_values("available_at")
                      # evidence known on/before now, with emphasis on post-signal and recent pre-signal context.
                      signal_start=pd.Timestamp(sd).tz_localize("Asia/Seoul").tz_convert("UTC")
                      recent_pre=signal_start-pd.Timedelta(days=7)
                      relevant=z[z.available_at>=recent_pre].copy()
                  else:
                      relevant=pd.DataFrame()

                  post_signal=pd.DataFrame()
                  if not relevant.empty:
                      post_signal=relevant[relevant.available_at>=signal_start].copy()

                  # Evidence-state is intentionally conservative:
                  # RECENT_CAUSAL = a causal stock-specific source observed in last 4 calendar days OR post-signal.
                  # STALE_CAUSAL = stock-specific causal evidence exists in 5-20 day lookback.
                  # NO_CAUSAL_EVIDENCE = ledger restored but no stock-specific causal evidence in 20d.
                  # LEDGER_UNAVAILABLE = no causal ledger rows restored at all.
                  if led.empty:
                      state="LEDGER_UNAVAILABLE"
                  else:
                      cutoff4=pd.Timestamp(now_ts).tz_convert("UTC")-pd.Timedelta(days=4)
                      cutoff20=pd.Timestamp(now_ts).tz_convert("UTC")-pd.Timedelta(days=20)
                      recent=z[z.available_at>=cutoff4] if not z.empty else pd.DataFrame()
                      old=z[(z.available_at>=cutoff20)&(z.available_at<cutoff4)] if not z.empty else pd.DataFrame()
                      if len(post_signal)>0 or len(recent)>0:
                          state="RECENT_CAUSAL_EVIDENCE"
                      elif len(old)>0:
                          state="STALE_CAUSAL_EVIDENCE"
                      else:
                          state="NO_CAUSAL_EVIDENCE"

                  official_n=0; independent_n=0; post_n=0; source_n=0
                  latest_available=pd.NaT
                  latest_title=""
                  latest_source=""
                  if not relevant.empty:
                      source_n=len(relevant)
                      official_n=int(relevant.official_source.astype(str).str.lower().isin(["true","1","yes","y"]).sum())
                      independent_n=int(relevant.independent_source.astype(str).str.lower().isin(["true","1","yes","y"]).sum())
                      post_n=len(post_signal)
                      last=relevant.sort_values("available_at").iloc[-1]
                      latest_available=last.available_at
                      latest_title=str(last.title)[:300]
                      latest_source=str(last.source_name)

                      for _,r in relevant.iterrows():
                          evidence_rows.append({
                              "signal_date":sd.date().isoformat(),"code":code,
                              "source_key":r.get("source_key",""),"source_name":r.get("source_name",""),
                              "source_type":r.get("source_type",""),"title":r.get("title",""),
                              "published_at":r.get("published_at",""),"first_seen_at":r.get("first_seen_at",""),
                              "available_at":r.get("available_at",""),"causal_mode":r.get("causal_mode",""),
                              "official_source":r.get("official_source",""),
                              "independent_source":r.get("independent_source",""),
                              "event_type":r.get("event_type",""),"materiality":r.get("materiality",""),
                              "direct_benefit":r.get("direct_benefit",""),"thesis_validity":r.get("thesis_validity",""),
                              "new_fact":r.get("new_fact",""),
                          })

                  rows.append({
                      "signal_date":sd.date().isoformat(),
                      "code":code,
                      "name":e.get("name",""),
                      "prospective_age_trading_days":age,
                      "catalyst_evidence_state":state,
                      "causal_sources_relevant_n":source_n,
                      "causal_sources_post_signal_n":post_n,
                      "official_sources_n":official_n,
                      "independent_sources_n":independent_n,
                      "latest_available_at":"" if pd.isna(latest_available) else str(latest_available),
                      "latest_source_name":latest_source,
                      "latest_title":latest_title,
                      "alive_proxy":state=="RECENT_CAUSAL_EVIDENCE",
                      "weak_proxy":state=="STALE_CAUSAL_EVIDENCE",
                      "unknown_proxy":state in {"NO_CAUSAL_EVIDENCE","LEDGER_UNAVAILABLE"},
                      "used_as_price_gate":False,
                      "used_for_ordering":False,
                  })

          side=pd.DataFrame(rows)
          evd=pd.DataFrame(evidence_rows)

          side.to_csv(OUT/"odoli_catalyst_causal_sidecar.csv",index=False,encoding="utf-8-sig")
          evd.to_csv(OUT/"odoli_catalyst_evidence_rows.csv",index=False,encoding="utf-8-sig")
          pd.DataFrame(file_diag).to_csv(OUT/"ledger_restore_diagnostics.csv",index=False,encoding="utf-8-sig")
          first_seen_audit.to_csv(OUT/"first_seen_integrity_snapshot.csv",index=False,encoding="utf-8-sig")
          capture_audit.to_csv(OUT/"capture_audit_snapshot.csv",index=False,encoding="utf-8-sig")

          counts=side["catalyst_evidence_state"].value_counts(dropna=False).to_dict() if len(side) else {}
          meta={
              "revision":REV,
              "research_only":True,
              "production_changed":False,
              "automatic_ordering":False,
              "price_policy_fingerprint_unchanged":FROZEN_PRICE_POLICY_FP,
              "odoli_state_restored":event_path.exists(),
              "odoli_events":len(events),
              "v73_causal_ledger_rows":len(led),
              "state_counts":counts,
              "point_in_time_availability_enforced":True,
              "forward_causal_uses_first_seen_or_retrieved":True,
              "official_archive_uses_official_time":True,
              "retrospective_rows_excluded":True,
              "global_rows_not_silently_assigned_to_stock":True,
              "alive_is_proxy_not_fact":True,
              "no_evidence_does_not_mean_catalyst_dead":True,
              "used_as_gate":False,
              "used_for_ranking":False,
              "used_for_ordering":False,
              "next_step":"append prospective daily snapshots and compare FAST/C4/OTHER_WATCH outcomes by catalyst evidence state",
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2,default=str),encoding="utf-8")

          lines=[
              "# ODOLI Catalyst Causal Sidecar R1","",
              "This sidecar is descriptive only. It does not change frozen price policy.",
              "",
              "## Meta","```json",json.dumps(meta,ensure_ascii=False,indent=2,default=str),"```","",
          ]
          if len(side):
              cols=["signal_date","code","name","prospective_age_trading_days","catalyst_evidence_state",
                    "causal_sources_relevant_n","causal_sources_post_signal_n","official_sources_n",
                    "independent_sources_n","latest_source_name","latest_title"]
              lines += ["## Current sidecar","```text",side[cols].tail(80).to_string(index=False),"```"]
          (OUT/"REPORT.md").write_text("\n".join(lines),encoding="utf-8")

          print("ODOLI_CATALYST_CAUSAL_SIDECAR_PASS")
          print(json.dumps(meta,ensure_ascii=False,default=str))
          if len(side):
              print(side["catalyst_evidence_state"].value_counts(dropna=False).to_string())
          PY

      - name: Validate causal isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_odoli_catalyst_sidecar/meta.json",encoding="utf-8"))
          assert m["revision"]=="ODOLI_CATALYST_CAUSAL_SIDECAR_R1_20261002"
          assert m["research_only"] is True
          assert m["production_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["point_in_time_availability_enforced"] is True
          assert m["retrospective_rows_excluded"] is True
          assert m["used_as_gate"] is False
          assert m["used_for_ranking"] is False
          assert m["used_for_ordering"] is False
          assert m["price_policy_fingerprint_unchanged"]=="7c2dbdf0f93340e9445b842aaa5fb62ceee973f9f5b65b2a589390f72fd2c1c0"

          p="reports/temp_odoli_catalyst_sidecar/odoli_catalyst_causal_sidecar.csv"
          try:q=pd.read_csv(p)
          except pd.errors.EmptyDataError:q=pd.DataFrame()
          if len(q):
              assert (~q["used_as_price_gate"].astype(bool)).all()
              assert (~q["used_for_ordering"].astype(bool)).all()
          print("CATALYST_SIDECAR_CAUSAL_ISOLATION_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_odoli_catalyst_sidecar/meta.json || true
          echo
          cat reports/temp_odoli_catalyst_sidecar/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-odoli-catalyst-causal-sidecar-r1
          path: reports/temp_odoli_catalyst_sidecar/**
          if-no-files-found: error
          retention-days: 90
