name: TEMP ODOLI Other Watch Checkpoint Anatomy R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-odoli-other-watch-checkpoint-anatomy-r1
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Fetch marcap history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/marcap
          mkdir -p vendor
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/FinanceData/marcap.git vendor/marcap
          cd vendor/marcap
          git sparse-checkout init --no-cone
          printf '%s\n' 'data/marcap-2026.parquet' >/tmp/marcap_paths.txt
          git sparse-checkout set --stdin </tmp/marcap_paths.txt
          git checkout
          cd ../..

      - name: Run OTHER_WATCH checkpoint anatomy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/temp_odoli_other_watch_checkpoint

          cat >/tmp/study.py <<'PY'
          from pathlib import Path
          import json,re
          import numpy as np
          import pandas as pd

          OUT=Path("reports/temp_odoli_other_watch_checkpoint")
          OUT.mkdir(parents=True,exist_ok=True)
          REV="ODOLI_OTHER_WATCH_CHECKPOINT_ANATOMY_R1_20261002"
          H=10

          def norm_code(v):
              s=re.sub(r"\D","",str(v or ""))
              return s[-6:].zfill(6) if s else ""

          def is_spac(name):
              s=str(name or "").upper()
              return "스팩" in s or "SPAC" in s

          q=pd.read_parquet("vendor/marcap/data/marcap-2026.parquet")
          if "Date" not in q.columns:q=q.reset_index()
          q["Date"]=pd.to_datetime(q["Date"],errors="coerce").dt.normalize()
          q["Code"]=q["Code"].map(norm_code)
          if "Market" in q.columns:
              q["Market"]=q["Market"].astype(str).str.upper()
              q=q[q.Market.isin(["KOSPI","KOSDAQ"])]
          for c in ["Open","High","Low","Close","Volume","Amount"]:
              q[c]=pd.to_numeric(q[c],errors="coerce")
          q=q.dropna(subset=["Date","Code","Open","High","Low","Close"])
          q=q[(q.Open>0)&(q.High>0)&(q.Low>0)&(q.Close>0)]
          q=q.sort_values(["Code","Date"]).drop_duplicates(["Code","Date"],keep="last")

          def feat(g):
              g=g.sort_values("Date").reset_index(drop=True).copy()
              c=pd.to_numeric(g.Close,errors="coerce")
              g["ma5"]=c.rolling(5,min_periods=5).mean()
              g["prev_close"]=c.shift(1); g["prev_ma5"]=g.ma5.shift(1)
              g["prev2_close"]=c.shift(2); g["prev2_ma5"]=g.ma5.shift(2)
              g["prev3_close"]=c.shift(3); g["prev3_ma5"]=g.ma5.shift(3)
              g["pre3_below_ma5_n"]=(
                  (g.prev_close<g.prev_ma5).astype(float)+
                  (g.prev2_close<g.prev2_ma5).astype(float)+
                  (g.prev3_close<g.prev3_ma5).astype(float)
              )
              g["ma5_slope_1d_pct"]=(g.ma5/g.prev_ma5-1)*100
              g["strict_odoli_r1"]=(
                  (g.Close>g.Open)&(g.prev_close<g.prev_ma5)&
                  (g.Close>g.ma5)&(g.ma5_slope_1d_pct>0)&
                  (g.pre3_below_ma5_n>=2)
              )
              return g

          sessions=sorted(pd.Timestamp(x).normalize() for x in q.Date.unique())
          mature_end=sessions[-11]
          sig_dates=[d for d in sessions if d<=mature_end][-40:]
          train=set(sig_dates[:20]); hold=set(sig_dates[20:]); sig_set=set(sig_dates)

          rows=[]

          for code,g0 in q.groupby("Code",sort=False):
              g=feat(g0)
              ma5=pd.to_numeric(g.ma5,errors="coerce")
              amount=pd.to_numeric(g.Amount,errors="coerce")
              hits=g.index[g.Date.isin(sig_set)&g.strict_odoli_r1.fillna(False)]

              for ii in hits:
                  i=int(ii)
                  if i+H>=len(g):continue
                  r0=g.iloc[i]
                  name=str(r0.get("Name","") or "")
                  if is_spac(name):continue

                  # price discontinuity guard
                  win=g.iloc[max(0,i-3):i+H+1]
                  cr=pd.to_numeric(win.Close,errors="coerce")
                  max_jump=float(cr.pct_change().abs().max()*100) if cr.pct_change().notna().any() else np.nan
                  if pd.notna(max_jump) and max_jump>=45:
                      continue

                  sig_date=pd.Timestamp(r0.Date)
                  split="TRAIN_EARLY" if sig_date in train else "HOLDOUT_LATE"
                  sig_close=float(r0.Close); sig_low=float(r0.Low)

                  d1=g.iloc[i+1]; d2=g.iloc[i+2]
                  fast=bool(
                      float(d2.Low)>float(d1.Low)
                      and pd.notna(ma5.iloc[i+2])
                      and float(d2.Close)>float(ma5.iloc[i+2])
                  )
                  if fast:
                      continue

                  # Eventual C4 using original frozen definition.
                  eventual_c4=False
                  c4_day=np.nan
                  for j in range(i+4,i+H+1):
                      hist=g.iloc[i+1:j+1]
                      survive=bool(pd.to_numeric(hist.Low,errors="coerce").min()>=sig_low)
                      above=bool(pd.notna(ma5.iloc[j]) and float(g.iloc[j].Close)>float(ma5.iloc[j]))
                      hl=bool(float(g.iloc[j].Low)>float(g.iloc[j-1].Low))
                      pre20=amount.iloc[max(0,j-20):j]
                      ama=float(pre20.mean()) if len(pre20) else np.nan
                      ar=float(amount.iloc[j]/ama) if pd.notna(ama) and ama>0 else np.nan
                      if above and hl and pd.notna(ar) and ar>=1.0 and survive:
                          eventual_c4=True;c4_day=j-i;break

                  d10_ret=(float(g.iloc[i+10].Close)/sig_close-1)*100
                  future=g.iloc[i+1:i+11]
                  mfe=(float(pd.to_numeric(future.High,errors="coerce").max())/sig_close-1)*100
                  mae=(float(pd.to_numeric(future.Low,errors="coerce").min())/sig_close-1)*100

                  for d in [3,4,5]:
                      j=i+d
                      r=g.iloc[j]
                      hist=g.iloc[i+1:j+1]
                      signal_low_alive=bool(pd.to_numeric(hist.Low,errors="coerce").min()>=sig_low)
                      close_above_ma5=bool(pd.notna(ma5.iloc[j]) and float(r.Close)>float(ma5.iloc[j]))
                      higher_low=bool(float(r.Low)>float(g.iloc[j-1].Low))
                      pre20=amount.iloc[max(0,j-20):j]
                      ama=float(pre20.mean()) if len(pre20) else np.nan
                      ar=float(amount.iloc[j]/ama) if pd.notna(ama) and ama>0 else np.nan
                      amount_ge1=bool(pd.notna(ar) and ar>=1.0)
                      amount_le08=bool(pd.notna(ar) and ar<=0.8)
                      close_vs_signal=(float(r.Close)/sig_close-1)*100

                      # Predeclared simple state families; descriptive only.
                      if not signal_low_alive:
                          state="BROKEN_SIGNAL_LOW"
                      elif close_above_ma5 and higher_low:
                          state="ABOVE_MA5_AND_HL"
                      elif close_above_ma5:
                          state="ABOVE_MA5_ONLY"
                      elif higher_low:
                          state="BELOW_MA5_BUT_HL"
                      else:
                          state="BELOW_MA5_NO_HL"

                      rows.append({
                          "split":split,"checkpoint_day":d,
                          "signal_date":sig_date,"code":code,"name":name,
                          "eventual_c4":eventual_c4,"c4_day":c4_day,
                          "state":state,
                          "signal_low_alive":signal_low_alive,
                          "close_above_ma5":close_above_ma5,
                          "higher_low":higher_low,
                          "amount_ratio20":ar,
                          "amount_ge1":amount_ge1,
                          "amount_le08":amount_le08,
                          "checkpoint_close_vs_signal_pct":close_vs_signal,
                          "d10_close_ret_pct":d10_ret,
                          "mfe_d10_pct":mfe,"mae_d10_pct":mae,
                      })

          df=pd.DataFrame(rows)
          if df.empty:raise SystemExit("NO_ROWS")
          df.to_csv(OUT/"checkpoint_events.csv",index=False,encoding="utf-8-sig")

          # State summary
          out=[]
          for (sp,d,state),g in df.groupby(["split","checkpoint_day","state"],dropna=False):
              out.append({
                  "split":sp,"checkpoint_day":d,"state":state,"n":len(g),
                  "eventual_c4_rate_pct":g.eventual_c4.mean()*100,
                  "d10_positive_pct":(g.d10_close_ret_pct>0).mean()*100,
                  "d10_close_median_pct":g.d10_close_ret_pct.median(),
                  "mfe10_median_pct":g.mfe_d10_pct.median(),
                  "mae10_median_pct":g.mae_d10_pct.median(),
              })
          state_summary=pd.DataFrame(out)
          state_summary.to_csv(OUT/"state_summary.csv",index=False,encoding="utf-8-sig")

          # Simple checkpoint policy counterfactuals.
          # Every rule is only based on information observable at that checkpoint.
          policy=[]
          for d in [3,4,5]:
              z=df[df.checkpoint_day==d].copy()
              rules={
                  "CUT_IF_SIGNAL_LOW_BROKEN": ~z.signal_low_alive,
                  "CUT_IF_BELOW_MA5_NO_HL": (z.signal_low_alive & ~z.close_above_ma5 & ~z.higher_low),
                  "CUT_IF_BELOW_MA5_AND_AMOUNT_GE1": (z.signal_low_alive & ~z.close_above_ma5 & z.amount_ge1),
                  "WATCH_IF_ABOVE_MA5_OR_HL": (z.signal_low_alive & (z.close_above_ma5 | z.higher_low)),
              }
              for rule,mask in rules.items():
                  zz=z[mask].copy()
                  for sp,g in zz.groupby("split"):
                      policy.append({
                          "split":sp,"checkpoint_day":d,"rule":rule,"n":len(g),
                          "eventual_c4_rate_pct":g.eventual_c4.mean()*100,
                          "d10_positive_pct":(g.d10_close_ret_pct>0).mean()*100,
                          "d10_close_median_pct":g.d10_close_ret_pct.median(),
                          "mae10_median_pct":g.mae_d10_pct.median(),
                      })
          pol=pd.DataFrame(policy)
          pol.to_csv(OUT/"checkpoint_rule_summary.csv",index=False,encoding="utf-8-sig")

          meta={
              "revision":REV,
              "research_only":True,
              "production_changed":False,
              "automatic_ordering":False,
              "population":"STRICT_ODOLI NONFAST_D2 ONLY",
              "checkpoints":[3,4,5],
              "features":["signal_low_alive","close_above_ma5","higher_low","amount_ratio20"],
              "eventual_c4_definition":"D4-D10 Close>MA5 AND Low>prior Low AND Amount>=prior20 mean AND signal-low survives",
              "state_rules_predeclared":True,
              "same_historical_window_reused":True,
              "true_oos":False,
              "same_sample_tuning":False,
              "note":"Descriptive checkpoint anatomy; no rule promotion. Follow-up must freeze a candidate rule and test on fresh time data."
          }
          (OUT/"meta.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
          (OUT/"REPORT.md").write_text(
              "# ODOLI OTHER_WATCH Checkpoint Anatomy R1\n\n```json\n"+
              json.dumps(meta,ensure_ascii=False,indent=2)+
              "\n```\n\n## State summary\n```text\n"+
              state_summary.to_string(index=False)+
              "\n```\n\n## Checkpoint rule summary\n```text\n"+
              pol.to_string(index=False)+"\n```\n",
              encoding="utf-8"
          )

          print("ODOLI_OTHER_WATCH_CHECKPOINT_ANATOMY_PASS")
          print(json.dumps(meta,ensure_ascii=False))
          print(state_summary.to_string(index=False))
          print(pol.to_string(index=False))
          PY

          python /tmp/study.py

      - name: Validate identity and causal checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open("reports/temp_odoli_other_watch_checkpoint/meta.json",encoding="utf-8"))
          assert m["revision"]=="ODOLI_OTHER_WATCH_CHECKPOINT_ANATOMY_R1_20261002"
          assert m["research_only"] is True
          assert m["production_changed"] is False
          assert m["automatic_ordering"] is False
          assert m["true_oos"] is False
          q=pd.read_csv("reports/temp_odoli_other_watch_checkpoint/checkpoint_events.csv")
          assert len(q)>0
          assert set(pd.to_numeric(q.checkpoint_day,errors="coerce").dropna().astype(int).unique())=={3,4,5}
          assert (~q.get("fast_d2",pd.Series(False,index=q.index)).astype(bool)).all() if "fast_d2" in q.columns else True
          print("OTHER_WATCH_CHECKPOINT_CAUSAL_PASS")
          PY

      - name: Show report
        if: always()
        run: |
          cat reports/temp_odoli_other_watch_checkpoint/meta.json || true
          echo
          cat reports/temp_odoli_other_watch_checkpoint/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-odoli-other-watch-checkpoint-anatomy-r1
          path: reports/temp_odoli_other_watch_checkpoint/**
          if-no-files-found: error
          retention-days: 90
