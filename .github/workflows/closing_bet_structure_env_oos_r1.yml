name: Closing Bet Structure + Environment OOS R1
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed v49.76 BACKTEST run id"
        required: true
        type: string
      discovery_end:
        required: true
        default: "2026-08-18"
        type: string
      oos_start:
        required: true
        default: "2026-08-19"
        type: string
      oos_end:
        required: true
        default: "2026-09-18"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Download source backtest artifacts
        run: |
          mkdir -p source_artifacts
          gh run download "${{ inputs.source_run_id }}" -D source_artifacts
      - name: Run research
        run: |
          python -u closing_bet_structure_env_oos_r1.py --source-root source_artifacts --discovery-end "${{ inputs.discovery_end }}" --oos-start "${{ inputs.oos_start }}" --oos-end "${{ inputs.oos_end }}"
      - name: Validate research-only invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('reports/closebet_structure_env_oos_r1/meta.json',encoding='utf-8'))
          assert m['status']=='PASS'
          assert m['research_only'] and not m['production_eligible']
          assert not m['selection_logic_changed'] and not m['score_rank_changed'] and not m['order_logic_changed']
          assert not m['same_sample_retuning']
          assert m['discovery_end']=='2026-08-18' and m['oos_start']=='2026-08-19' and m['oos_end']=='2026-09-18'
          print('OOS_R1_INVARIANTS PASS',m['discovery_rows'],m['oos_rows'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing-bet-structure-env-oos-r1-${{ github.run_id }}
          path: reports/closebet_structure_env_oos_r1/**
          retention-days: 30
