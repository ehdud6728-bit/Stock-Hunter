name: ODOLI After Session Context R1

on:
  workflow_dispatch:
  schedule:
    # Weekdays 20:10 KST = 11:10 UTC. Research-only AFTER-session snapshot.
    - cron: '10 11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: odoli-after-session-context-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  odoli-after-session-context:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4

      - name: Restore latest ODOLI prospective state
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/odoli_independent_r1
          key: odoli-independent-r1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            odoli-independent-r1-${{ github.ref_name }}-

      - name: Restore AFTER context state
        uses: actions/cache/restore@v4
        with:
          path: reports/.cache/odoli_after_session_r1
          key: odoli-after-session-r1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            odoli-after-session-r1-${{ github.ref_name }}-

      - name: Run ODOLI AFTER_SESSION_CONTEXT sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile odoli_after_session_context_r1.py
          python -u odoli_after_session_context_r1.py \
            --odoli-state-dir reports/.cache/odoli_independent_r1 \
            --after-state-dir reports/.cache/odoli_after_session_r1 \
            --output-dir reports/odoli_after_session_r1

      - name: Validate research isolation
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open("reports/odoli_after_session_r1/meta.json",encoding="utf-8"))
          assert m["signal_close_authority"]=="KRX_1530_CLOSE_FROZEN"
          assert m["after_session_used_as_gate"] is False
          assert m["real_full_changed"] is False
          assert m["core224_changed"] is False
          assert m["production_changed"] is False
          assert m["source_is_observational_only"] is True
          print("ODOLI_AFTER_SESSION_ISOLATION_GUARD PASS",m)
          PY

      - name: Show AFTER context diagnostics
        if: always()
        run: |
          cat reports/odoli_after_session_r1/meta.json || true
          echo
          head -30 reports/odoli_after_session_r1/odoli_after_session_context.csv || true

      - name: Send research summary to DYUL
        if: always()
        env:
          TELEGRAM_BACKTEST_TOKEN: ${{ secrets.TELEGRAM_BACKTEST_TOKEN }}
          TELEGRAM_DYUL_CHAT_ID: ${{ secrets.TELEGRAM_DYUL_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -s reports/odoli_after_session_r1/telegram_message.txt ] || exit 0
          SHOULD="$(python - <<'PY'
          import json
          print("1" if json.load(open("reports/odoli_after_session_r1/meta.json",encoding="utf-8")).get("telegram_should_send") else "0")
          PY
          )"
          [ "$SHOULD" = "1" ] || { echo "ODOLI_AFTER_TELEGRAM_SKIP duplicate/no-data"; exit 0; }
          [ -n "${TELEGRAM_BACKTEST_TOKEN:-}" ] && [ -n "${TELEGRAM_DYUL_CHAT_ID:-}" ] || { echo "ODOLI_AFTER_TELEGRAM_SKIP route-unavailable"; exit 0; }
          python - <<'PY'
          import os,urllib.parse,urllib.request
          from pathlib import Path
          msg=Path("reports/odoli_after_session_r1/telegram_message.txt").read_text(encoding="utf-8")
          data=urllib.parse.urlencode({"chat_id":os.environ["TELEGRAM_DYUL_CHAT_ID"],"text":msg[:3900]}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BACKTEST_TOKEN']}/sendMessage",data=data)
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode("utf-8","replace")
              if r.status!=200:
                  raise RuntimeError(f"telegram http={r.status} {body[:200]}")
          print("ODOLI_AFTER_SESSION_TELEGRAM_SENT_DYUL",len(msg))
          PY

      - name: Save AFTER context state
        if: always() && hashFiles('reports/.cache/odoli_after_session_r1/after_session_history.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/.cache/odoli_after_session_r1
          key: odoli-after-session-r1-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload AFTER context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoli-after-session-context-r1-${{ github.run_id }}
          path: reports/odoli_after_session_r1/**
          if-no-files-found: warn
          retention-days: 90
