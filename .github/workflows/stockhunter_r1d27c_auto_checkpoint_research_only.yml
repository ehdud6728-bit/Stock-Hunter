  # R1-D27D ticker-disjoint 1500 frozen historical flow; RESEARCH ONLY, not OOS / LIVE.
  r1d27d_flow60_auto_1500:
    name: R1-D27D verified 1500 source AUTO 8 x 30 [NO OUTCOMES]
    if: ${{ inputs.scope == 'r1d27d_flow60_auto_1500' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write  # Required only for GitHub workflow_dispatch continuation.
    env:
      RESEARCH_ONLY: '1'
      STOCKHUNTER_LIVE_ENABLE: '0'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_SCORE_RANK_ENABLE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: 'Asia/Seoul'
      GH_TOKEN: ${{ github.token }}
      KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
    steps:
      - name: Checkout sealed source read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies and test frozen source
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'networkx>=2.8' 'pykrx==1.2.9'
          python -m unittest discover -s tests -p 'test_stockhunter_r1d27d.py' -v
      - name: Auto-select best prior sealed checkpoint (never silently reset)
        id: seed
        env:
          R1D27D_SEED_RUN: ${{ inputs.r1d27d_seed_run_id }}
          R1D27D_SEED_PART: ${{ inputs.r1d27d_seed_part }}
          R1D27D_BATCH_LIMIT: ${{ inputs.r1d27d_batch_limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from research_formulas.stockhunter_r1d27d_flow60 import read_event_index
          from research_formulas.stockhunter_r1d27d_autochain import check
          check(os.environ.get('KRX_ID') and os.environ.get('KRX_PW'),'KRX_SECRETS_MISSING')
          v=os.environ['R1D27D_BATCH_LIMIT']
          check(v.isdecimal() and 1 <= int(v) <= 30,'BATCH_LIMIT')
          read_event_index('research_inputs')
          PY
          python -m research_formulas.stockhunter_r1d27d_autochain --action select --output "$GITHUB_OUTPUT"
      - name: Restore last durable 1500-source checkpoint if supplied
        if: ${{ steps.seed.outputs.has_seed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.seed.outputs.seed_name }}
          run-id: ${{ steps.seed.outputs.seed_run }}
          github-token: ${{ github.token }}
          path: reports/r1d27d/previous
      - name: Verify prior 60-session raw investor histories before importing checkpoint
        if: ${{ steps.seed.outputs.has_seed == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,shutil
          from research_formulas.stockhunter_r1d27d_flow60 import read_event_index,load_old,RAW,AUDIT,MAN
          old=pathlib.Path('reports/r1d27d/previous')
          freeze=read_event_index('research_inputs')
          load_old(old,freeze)
          src=old/'reports/r1d27d/result/flow'
          dst=pathlib.Path('reports/r1d27d/result/flow')
          dst.mkdir(parents=True,exist_ok=True)
          for name in [RAW,AUDIT,MAN]:
              shutil.copyfile(src/name,dst/name)
          print('R1D27D_PREVIOUS_SOURCE_REVALIDATED_NO_OUTCOMES')
          PY
      - name: Restore original sealed KRX trading sessions (not future returns)
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-allkrx-price-shard-0
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d27d/input/krx
      - name: Collect and verify new source batch 01
        id: batch_01
        env:
          R1D27D_BATCH_LIMIT: ${{ inputs.r1d27d_batch_limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,json
          from research_formulas.stockhunter_r1d27d_flow60 import collect_batch,MAN
          state=pathlib.Path('reports/r1d27d/result/flow')/MAN
          was_seed=state.is_file()
          m=collect_batch(
              freeze_dir='research_inputs',krx_root='reports/r1d27d/input/krx',out='.',
              batch_size=int(os.environ['R1D27D_BATCH_LIMIT']),
              seed_root='.' if was_seed else None)
          print('R1D27D_BATCH_01_DURABLE_OUTPUT',json.dumps(m,ensure_ascii=False))
          go=(m['n_unattempted']>0 and not m['provider_abort'] and m['batch_attempted']>0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('go='+str(go).lower()+'\n')
          PY
      - name: Upload immutable source checkpoint part 01 BEFORE next provider batch
        if: ${{ steps.batch_01.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-R1D27D-FLOW60-AUTO-PART-01
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/r1d27d/result/flow/**
            reports/r1d27d/R1D27D_STAGE_STATE.json
