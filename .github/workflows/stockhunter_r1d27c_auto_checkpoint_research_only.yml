          import json,pathlib,sys
          p=pathlib.Path('reports/r1d27c/R1D27C_AUTO_STAGE_STATE.json')
          if not p.is_file():
              print('::error::R1D27C_NO_DURABLE_AUTO_CHECKPOINT')
