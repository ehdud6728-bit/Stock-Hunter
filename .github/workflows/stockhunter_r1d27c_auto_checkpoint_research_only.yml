            reports/r1d27c/R1D27C_AUTO_STAGE_STATE.json
            R1D27C_PREDECLARED_PROTOCOL.json
            research_formulas/stockhunter_r1d27c_flow60.py
            research_formulas/stockhunter_r1d27c_auto.py
