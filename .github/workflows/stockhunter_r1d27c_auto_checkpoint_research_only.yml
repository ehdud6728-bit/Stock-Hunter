      - name: "Persist immutable checkpoint part 07 BEFORE requesting next batch"
        if: ${{ steps.batch_07.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-R1D27C-FLOW60-AUTO-PART-07
          retention-days: 90
