      - name: "Persist immutable checkpoint part 08 BEFORE requesting next batch"
        if: ${{ steps.batch_08.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-R1D27C-FLOW60-AUTO-PART-08
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/r1d27c/result/freeze/**
            reports/r1d27c/result/flow/**
            reports/r1d27c/R1D27C_AUTO_STAGE_STATE.json
            R1D27C_PREDECLARED_PROTOCOL.json
            research_formulas/stockhunter_r1d27c_flow60.py
            research_formulas/stockhunter_r1d27c_auto.py
            tests/test_stockhunter_r1d27c_auto.py
      - name: "Research-only checkpoint summary; fail if source provider aborted"
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('reports/r1d27c/R1D27C_AUTO_STAGE_STATE.json')
          if not p.is_file():
              print('::error::R1D27C_NO_DURABLE_AUTO_CHECKPOINT')
              sys.exit(2)
          s=json.loads(p.read_text())
          print('R1D27C_AUTO_FINAL_CHECKPOINT_NOT_PERFORMANCE_RESEARCH',json.dumps(s,ensure_ascii=False))
          if s['provider_abort']:
              print('::error::R1D27C_PROVIDER_ABORT_SAVED_LAST_VALID_CHECKPOINT')
              sys.exit(2)
          if s['n_unattempted']>0:
              print('::warning::R1D27C_MORE_UNATTEMPTED_SOURCE_REMAIN;RESUME_FROM_LAST_AUTO_PART')
