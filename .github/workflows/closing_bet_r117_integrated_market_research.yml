name: Closing Bet R1.17 Partial Denominator x v49.76 x R1.7.9 Shadow (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: closebet-r117-integrated-research-only
  cancel-in-progress: false

jobs:
  audit:
    name: R117 KRX 1907 SHA + 45-day covered cohort + 16 shadow runs (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout research code only
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install fixed analytical libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6' 'pandas==2.2.3'
      - name: Preflight parser, unit tests and source contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/r117_integrated_denominator_audit.py tests/test_r117_integrated_denominator_audit.py
          python -m unittest discover -s tests -p test_r117_integrated_denominator_audit.py -v
          python -m closebet_research.r117_integrated_denominator_audit --help >/dev/null
          test -s closebet_research/r117_source_sha_manifest.json
          test -s closebet_research/r117_shadow_evidence_index.csv
          echo 'R117_PY310_TESTS_PASS'
      - name: Fetch immutable 4 KRX history shards and selected signals (R171 run pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/history evidence/r171
          for i in 0 1 2 3; do
            gh run download 38664095610 --repo "$GITHUB_REPOSITORY" --name "r171-history-$i" --dir "evidence/unpacked_history/$i"
          done
          gh run download 38664095610 --repo "$GITHUB_REPOSITORY" --name "closebet-r17-krx-only-replay-38664095610" --dir evidence/r171
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          for i in range(4):
              src=Path(f'evidence/unpacked_history/{i}');files=sorted(x for x in src.rglob('*') if x.is_file())
              assert len([p for p in files if p.name.endswith('.csv.gz')])>=400,(i,len(files))
              with ZipFile(f'evidence/history/shard_{i}.zip','w',compression=ZIP_STORED) as out:
                  for f in files:out.write(f,f.name)
          print('R117_FOUR_ORIGINAL_KRX_HISTORY_SHARDS_READY')
          PY
      - name: Fetch one pinned parent source and 16 separate shadow executions
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38719156471 --repo "$GITHUB_REPOSITORY" --name "v49.76.6.7.3.2.5.1.2.1-research-reports-241" --dir evidence/parent_unpacked
          mkdir -p evidence/shadow
          python - <<'PY'
          import csv,os,subprocess
          from pathlib import Path
          rows=list(csv.DictReader(open('closebet_research/r117_shadow_evidence_index.csv',encoding='utf-8')))
          assert len(rows)==16
          for r in rows:
              out=Path('evidence/shadow_unpacked')/r['run_id'];out.mkdir(parents=True,exist_ok=True)
              cmd=['gh','run','download',r['run_id'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name',r['artifact_name'],'--dir',str(out)]
              subprocess.run(cmd,check=True)
          print('R117_SHADOW_16_SOURCE_DOWNLOADED')
          PY
      - name: Validate exact inner-file SHA and repackage read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          m=json.loads(Path('closebet_research/r117_source_sha_manifest.json').read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          selected=Path('evidence/r171/v49_76_global_selected_top5.csv')
          assert selected.is_file() and sha(selected)==m['selected_sha256'],'R171_SELECTED_SHA_MISMATCH'
          src=Path('evidence/parent_unpacked')
          assert len(m['parent_expected_files'])==2
          with ZipFile('evidence/parent_source_20261015.zip','w',compression=ZIP_STORED) as z:
              for relative,expect in m['parent_expected_files'].items():
                  f=src/relative
                  assert f.is_file() and sha(f)==expect,('PARENT_SHA_MISMATCH',relative)
                  z.write(f,relative)
          for entry in m['shadow_artifacts']:
              src=Path('evidence/shadow_unpacked')/entry['run_id']
              with ZipFile('evidence/shadow/'+entry['run_id']+'.zip','w',compression=ZIP_STORED) as z:
                  for f in sorted(src.rglob('*')):
                      if f.is_file():z.write(f,str(f.relative_to(src)))
              with ZipFile('evidence/shadow/'+entry['run_id']+'.zip') as z:
                  for relative,expect in entry['expected_files'].items():
                      assert relative in z.namelist(),('MISSING_SHADOW_SOURCE',entry['run_id'],relative)
                      assert hashlib.sha256(z.read(relative)).hexdigest()==expect,('SHADOW_INNER_SHA_MISMATCH',entry['run_id'],relative)
          print('R117_ALL_FIXED_GITHUB_INNER_SOURCE_HASHES_PASS')
          PY
      - name: Compute covered universe D0 features and independent post-event returns
        shell: bash
        run: |
          set -euo pipefail
          python -m closebet_research.r117_integrated_denominator_audit \
            --r171-root evidence/r171 \
            --history-dir evidence/history \
            --shadow-dir evidence/shadow \
            --parent-artifact evidence/parent_source_20261015.zip \
            --child-artifact evidence/shadow/38723653317.zip \
            --out reports/r117
      - name: Strict final research-only evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('reports/r117');m=json.loads((p/'r117_integrity_manifest.json').read_text())
          assert m['status']=='PASS_DESCRIPTIVE_PARTIAL_DENOMINATOR_NO_PROSPECTIVE_EDGE_CLAIM'
          assert m['krx']['sha_days_verified']==1907
          assert m['selected_unique_code_days']==1059 and m['selected_rows']==1133
          assert m['shadow_run_count']==16 and m['shadow_run_status']=={'SKIP_NON_CANDIDATE_LANE':12,'PASS':4}
          assert m['limits']['true_pit_full_market_denominator']=='NOT_PROVEN'
          assert m['research_only'] and not m['live_authority']
          assert m['parent_shadow']['source_rows']==5 and m['parent_shadow']['shadow_rows']==1
          assert m['decision']=='DO_NOT_MODIFY_PRODUCTION_OR_TRADE_ON_OUTPUT'
          for n,h in m['file_sha256'].items():
              assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          print('R117_FINAL_FAIL_CLOSED_EVIDENCE_PASS; LIVE_AUTHORITY=NONE')
          PY
      - name: Upload verified research only
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r117-integrated-source-limited-audit-${{ github.run_id }}
          path: reports/r117/
          if-no-files-found: error
          retention-days: 30
