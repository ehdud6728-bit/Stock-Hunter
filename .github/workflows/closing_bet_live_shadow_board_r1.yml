name: Closing Bet v49.76 Live Shadow Board R1

on:
  workflow_run:
    workflows:
      - closing-bet-v49.76.6.7.3.2.5.1.2.1-final-universe-source-recovery
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: v49.76 source run id (blank = latest successful v49.76 run)
        required: false
        default: ""
      send_telegram:
        description: Send SHADOW board to closing-bet Telegram
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      top_n:
        description: Number of existing candidates to display, preserving source order
        required: true
        default: "10"

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      CLOSING_BET_TOKEN: ${{ secrets.TELEGRAM_CLOSEBET_TOKEN || secrets.TELEGRAM_CLOSE_BET_TOKEN || secrets.CLOSING_BET_TOKEN || secrets.CLOSE_BET_TOKEN || vars.TELEGRAM_CLOSEBET_TOKEN || vars.TELEGRAM_CLOSE_BET_TOKEN }}
      CLOSING_BET_CHAT_ID: ${{ secrets.TELEGRAM_CLOSEBET_CHAT_ID || secrets.TELEGRAM_CLOSE_BET_CHAT_ID || secrets.CLOSING_BET_CHAT_ID || secrets.CLOSE_BET_CHAT_ID || vars.TELEGRAM_CLOSEBET_CHAT_ID || vars.TELEGRAM_CLOSE_BET_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Resolve source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.source_run_id }}" ]; then
            RID="${{ inputs.source_run_id }}"
          else
            RID="$(gh run list --workflow v49.76.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "SOURCE_RUN_ID=$RID"

      - name: Download v49.76 source artifacts
        run: |
          mkdir -p source_run
          gh run download "${{ steps.source.outputs.run_id }}" -D source_run
          find source_run -type f | sort | head -200

      - name: Build Live Shadow Board
        shell: bash
        run: |
          set -euo pipefail
          SEND=""
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ inputs.send_telegram }}" = "true" ]; then
            SEND="--send-telegram"
          fi
          TOPN="${{ inputs.top_n }}"
          if [ -z "$TOPN" ]; then TOPN="10"; fi
          python -u closing_bet_live_shadow_board_r1.py \
            --source-root source_run \
            --output-dir reports/live_shadow_board_r1 \
            --top-n "$TOPN" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            $SEND

      - name: Validate non-invasive invariants
        run: |
          python - <<'PY'
          import json
          p='reports/live_shadow_board_r1/meta.json'
          m=json.load(open(p,encoding='utf-8'))
          if m['status']=='NO_CANDIDATE_SOURCE':
              print('NO_CANDIDATE_SOURCE: observer completed without changing production')
          else:
              assert m['status']=='PASS',m
              assert m['research_only'] and not m['production_eligible']
              assert not m['candidate_membership_changed']
              assert not m['candidate_order_changed']
              assert not m['score_rank_changed']
              assert not m['candidate_filter_created']
              assert not m['order_logic_changed']
              print('LIVE_SHADOW_BOARD_R1 PASS',m['rows'],m['winner_reference_patterns'])
          PY

      - name: Upload Live Shadow Board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-live-shadow-board-r1-${{ github.run_id }}
          path: reports/live_shadow_board_r1/**
          if-no-files-found: warn
          retention-days: 30
