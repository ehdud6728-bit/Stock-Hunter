name: Closing Bet v49.76 R1.8 Winner-Loser Wave/Entry Forensics (READ ONLY)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: R1.7.1 KRX-only finished workflow run ID (must have 4 history + merge artifacts)
        type: string
        required: true
        default: '38664095610'

permissions:
  actions: read
  contents: read

concurrency:
  group: closing-bet-r18-causal-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r18_research:
    name: Independent offline forensic (LIVE unchanged)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Checkout research source only
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3'
      - name: Verify source artifact identity and fetch existing raw evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{8,15}$ ]] || { echo 'R18_SOURCE_RUN_ID_INVALID'; exit 1; }
          mkdir -p evidence/history evidence/merge
          # These artifacts are from a previously completed KRX-only replay.
          # No pykrx, Naver, FDR, Yahoo, or LIVE scanner network calls are made here.
          for i in 0 1 2 3; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "r171-history-${i}" --dir evidence/history
          done
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "closebet-r17-krx-only-replay-${SOURCE_RUN_ID}" --dir evidence/merge
          test -s evidence/merge/r17_krx/native/v49_76_global_selected_top5.csv
          test "$(find evidence/history -name 'krx_history_manifest_*.json' | wc -l)" -eq 4
          echo 'R18 SOURCE_ARTIFACTS_READY 4/4 history + native merge'
      - name: Causal unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_r18_wave_entry_forensic.py' -v
      - name: Run R1.8 offline winner/loser and chronological entry study
        run: |
          set -euo pipefail
          python closebet_research/r18_wave_entry_forensic.py \
            --selected evidence/merge/r17_krx/native/v49_76_global_selected_top5.csv \
            --history-artifacts evidence/history \
            --history-analysis-start 2025-01-02 --asof 2026-10-12 \
            --out reports/r18
      - name: Assert strict pinned evidence and outcome cohort
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('reports/r18/r18_research_manifest.json').read_text())
          assert q['source_all_unique_signal_date_codes']==1059, q
          assert q['input_strategy_rows']==1133, q
          assert q['D20_mature_unique']==570, q
          assert q['D5_recent_unique']==184, q
          assert q['unique_signal_date_codes']==754, q
          assert q['KRX_exact_selected_bar_match'] is True, q
          assert sum(q['outcome_distribution'].values())==570, q
          print('R18_RESEARCH_EVIDENCE_PASS; NOT an OOS or live trading approval')
          PY
      - name: Upload standalone research only outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: closebet-r18-wave-entry-forensics-${{ github.run_id }}
          path: |
            reports/r18/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
