name: EXPORT Complete Fixed run_scanner Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build complete fixed files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile export_complete_fixed_run_scanner.py
          python -u export_complete_fixed_run_scanner.py

      - name: Stage complete upload files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p complete_fixed/.github/workflows
          cp .github/workflows/run_scanner.yml complete_fixed/.github/workflows/run_scanner.yml
          cp apply_real_full_reliable_overlay_patch.py complete_fixed/apply_real_full_reliable_overlay_patch.py

          cat > complete_fixed/UPLOAD_INSTRUCTIONS.txt <<'EOF'
          COMPLETE FIXED FILES

          Upload these two files back to the repository at exactly these paths:

          1) complete_fixed/.github/workflows/run_scanner.yml
             -> .github/workflows/run_scanner.yml

          2) complete_fixed/apply_real_full_reliable_overlay_patch.py
             -> apply_real_full_reliable_overlay_patch.py

          This export is built from the latest checked-out main, so unrelated current changes are preserved.

          Fixes:
          - repairs malformed embedded newline in REAL_FULL Research Overlay Telegram chunker
          - hardens apply_real_full_reliable_overlay_patch.py against recreating the malformed YAML
          - preserves 09:30 / 15:20 / 15:45 scheduled cron entries
          - does not change production search / score / rank / order logic
          EOF

          echo "=== fixed file sizes ==="
          wc -c complete_fixed/.github/workflows/run_scanner.yml
          wc -c complete_fixed/apply_real_full_reliable_overlay_patch.py

      - name: Validate complete files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("complete_fixed/.github/workflows/run_scanner.yml")
          g=Path("complete_fixed/apply_real_full_reliable_overlay_patch.py")
          s=p.read_text(encoding="utf-8")
          q=g.read_text(encoding="utf-8")
          assert len(s) > 200000, f"run_scanner unexpectedly short: {len(s)}"
          assert "cron: '30 00 * * 1-5'" in s
          assert "cron: '20 06 * * 1-5'" in s
          assert "cron: '45 06 * * 1-5'" in s
          assert 'cut=text.rfind("\\n",0,3500)' in s
          assert 'text=text[cut:].lstrip("\\n")' in s
          assert 'cut=text.rfind("\\\\n",0,3500)' in q
          assert 'text=text[cut:].lstrip("\\\\n")' in q
          print("COMPLETE_EXPORT_VALIDATION PASS", len(s), len(q))
          PY

      - name: Upload complete fixed files
        uses: actions/upload-artifact@v4
        with:
          name: COMPLETE-fixed-run-scanner-${{ github.run_id }}
          path: complete_fixed/**
          if-no-files-found: error
          retention-days: 30
