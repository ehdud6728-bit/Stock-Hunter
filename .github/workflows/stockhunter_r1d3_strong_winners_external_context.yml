            artifacts=json.loads(subprocess.check_output(['gh','api',base+'/artifacts?per_page=100']))['artifacts']
            q=[a for a in artifacts if a['id']==p['id'] and a['name']==expected_names[source]]
            assert len(q)==1 and not q[0]['expired'] and q[0]['digest']=='sha256:'+p['sha256'], 'ARTIFACT_DIGEST_DRIFT_'+source
            pathlib.Path('reports/r1d10/pins/'+source+'_run.json').write_text(json.dumps(run),encoding='utf-8')
            pathlib.Path('reports/r1d10/pins/'+source+'_artifact.json').write_text(json.dumps(q[0]),encoding='utf-8')
          print('R1D10_ALL_FOUR_HISTORICAL_ZIP_DIGESTS_PASS')
          PYPIN
