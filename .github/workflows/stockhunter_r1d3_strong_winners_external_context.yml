name: StockHunter Research Lab - R1-D3 / R1-D4 / R1-D5 / R1-D6 / R1-D7 / R1-D8 / R1-D9 / R1-D10 (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Frozen source contracts, R1D3/D4/D5 hindsight review, R1D6 2024-25 OOS, R1D7/8 retrospective, or R1D9 2021-23 OOS"
        type: choice
        required: true
        default: source_check
        options:
          - source_check
          - full_compare
          - r1d4_matched_blind
          - r1d5_support_reaction
          - r1d6_independent_period
          - r1d7_path_risk_audit
          - r1d8_structure_confounds
          - r1d9_independent_2021_23
          - r1d10_accumulated_provenance_audit

permissions:
  contents: read
  actions: read

concurrency:
  group: stockhunter-formula66-r1d3-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RESEARCH_ONLY: '1'
  STOCKHUNTER_LIVE_ENABLE: '0'
  STOCKHUNTER_ORDER_ENABLE: '0'
  STOCKHUNTER_SCORE_RANK_ENABLE: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: Asia/Seoul

jobs:
  read_only_source_check:
    name: 10 local source/temporal contract tests and immutable R1D2 GitHub artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline local dependencies only
        run: pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
      - name: Check root workflow twin, module imports, and regression tests
        run: |
          set -euo pipefail
          cmp .github/workflows/stockhunter_r1d3_strong_winners_external_context.yml stockhunter_r1d3_strong_winners_external_context.yml
          python -m py_compile research_formulas/formula66_r1d3_success_failure_context.py
          python -m unittest discover -s tests -p test_formula66_r1d3_success_failure_context.py -v
          python -m py_compile research_formulas/formula66_r1d6_oos_holdout.py
          python -m unittest discover -s tests -p test_formula66_r1d6_oos_holdout.py -v
      - name: Verify immutable R1D2 and all eight KRX GitHub source artifact digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/r1d3/source
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39873801594" > reports/r1d3/source/r1d2_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39873801594/artifacts?per_page=100" > reports/r1d3/source/r1d2_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197" > reports/r1d3/source/krx_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39295295197/artifacts?per_page=100" > reports/r1d3/source/krx_artifacts.json
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('reports/r1d3/source')
          rd=json.loads((base/'r1d2_run.json').read_text())
          ra=json.loads((base/'r1d2_artifacts.json').read_text())['artifacts']
          kd=json.loads((base/'krx_run.json').read_text())
          ka=json.loads((base/'krx_artifacts.json').read_text())['artifacts']
          assert rd['id']==39873801594 and rd['conclusion']=='success' and rd['head_sha']=='a89c3eb5f3ebf0f80c6de4b60b4f1bf8eefe6678'
          assert kd['id']==39295295197 and kd['conclusion']=='success' and kd['head_sha']=='08e328c101f0774a2236c0a44cc1fdbbaa59e96e'
          e=next(x for x in ra if x['id']==12468095269 and x['name']=='stockhunter-r1d2-recent-krx-downside-stress-recent_4m-daily')
          assert e['digest']=='sha256:a3384e292dfc971f6716861de81f5a03e13f89476e4ddad3fdd3b30e34be84a6' and not e['expired']
          pins={
           0:(12208596109,'84dd5aa62f0c9538cd9c2d0ed0540c8f74063b21be49d9ecfc81e4b1583368b5'),
           1:(12207608558,'3d372eebf915c870badf103356c3700d5fa914a32d79ce8057ef1f4c4f89295b'),
           2:(12209930511,'5c49df64ad10bafbc09dd7ea78b9377804735fda6ad861018750b396ab2a27cb'),
           3:(12209696204,'7a359f5959e2374622c40d068920adf9d695142b4a61b540d0752a8cb9bb4dd8'),
           4:(12208882046,'88b35ea4c9a8a6a0ed4b61250a8018d49ee7ba4489c7345f04012915bb60f997'),
           5:(12208443687,'eb503f7cabcc40991037092c6463437c8a8b71d43fb26fe646ea4f56885b3814'),
           6:(12211336402,'b3cc055d919c7ab92d7f27b1b3ce6d3e56df787b107af961eaa43dedb885d6cd'),
           7:(12212241289,'9563747eb8b27928ba0a0d2b7d3cf02e787acd2e9e4a656d410c286139321478'),
          }
          for n,(id_,sha) in pins.items():
           a=[x for x in ka if x['id']==id_ and x['name']==f'stockhunter-allkrx-price-shard-{n}']
           assert len(a)==1 and a[0]['digest']=='sha256:'+sha and not a[0]['expired'],f'SHARD_DIGEST_DRIFT:{n}'
          print('R1D3_PINS_PASS_R1D2_AND_8_KRX_SHARDS')
          PY
      - name: Upload source check evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d3-pinned-sources
          path: reports/r1d3/source/**
          if-no-files-found: warn
          retention-days: 60

  winner_failure_market_context:
    name: Frozen 1249 episodes + asof KRX OHLCV Amount + market breadth vs completed D20 outcomes
    needs: read_only_source_check
    if: ${{ inputs.scope == 'full_compare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
      - name: Download EXACT immutable R1D2 4 month original research output
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d2-recent-krx-downside-stress-recent_4m-daily
          run-id: 39873801594
          github-token: ${{ github.token }}
          path: reports/r1d3/input/r1d2
      - name: Download 8 ORIGINAL KRX SHA-pinned full-market shards (not a new market data request)
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d3/input/krx
          merge-multiple: true
      - name: Compare only signal-known factors versus post-signal outcome AFTER independent feature extraction
        shell: bash
        run: |
          set -euo pipefail
          python -m research_formulas.formula66_r1d3_success_failure_context \
            --r1d2 reports/r1d3/input/r1d2 \
            --krx-root reports/r1d3/input/krx \
            --out reports/r1d3/result
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/r1d3/result/r1d3_manifest.json')
          m=json.loads(p.read_text())
          x=m['observed_event_counts']
          assert (x['n_episode'],x['n_complete'],x['n_not_complete'],x['strong_n'],x['failure_n'])==(1249,939,310,91,286)
          assert m['strategy_ready'] is False and m['orders_placed']==0
          print('R1D3_FROZEN_SUCCESS_FAILURE_RESEARCH_ONLY_PASS')
          PY
      - name: Upload asof-only context SEPARATELY from outcome-revealed comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d3-winner-failure-asof-and-outcome-audit
          path: reports/r1d3/result/**
          if-no-files-found: warn
          retention-days: 60


  r1d4_outcome_stratified_matched_blind:
    name: R1-D4 same-day matched strong/failure pairs, blinded signal-day 224MA+Amount charts
    needs: read_only_source_check
    if: ${{ inputs.scope == 'r1d4_matched_blind' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated offline research libraries
        run: pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3' 'matplotlib>=3.8,<4'
      - name: Run R1-D4 invariants and anti-future regression tests
        run: |
          set -euo pipefail
          cmp .github/workflows/stockhunter_r1d3_strong_winners_external_context.yml stockhunter_r1d3_strong_winners_external_context.yml
          python -m py_compile research_formulas/formula66_r1d4_matched_blind.py
          python -m unittest discover -s tests -p test_formula66_r1d4_matched_blind.py -v
      - name: Verify exact immutable R1-D3 original artifact and run pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/r1d4/pins
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39884755058" > reports/r1d4/pins/r1d3_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39884755058/artifacts?per_page=100" > reports/r1d4/pins/r1d3_artifacts.json
          python - <<'PYCODE'
          import json,pathlib
          r=pathlib.Path('reports/r1d4/pins')
          q=json.loads((r/'r1d3_run.json').read_text('utf-8'))
          assert q['id']==39884755058 and q['conclusion']=='success' and q['head_sha']=='a368f2e5f9bdc77659c1375d785d3b5368fc3964'
          a=json.loads((r/'r1d3_artifacts.json').read_text('utf-8'))['artifacts']
          m=[x for x in a if x['id']==12471499751 and x['name']=='stockhunter-r1d3-winner-failure-asof-and-outcome-audit']
          assert len(m)==1 and not m[0]['expired'] and m[0]['digest']=='sha256:4732f81ec1023bcf0b35a1df937adc8152206ca983c85462c4f4f5125324a0c5'
          print('R1D4_PINNED_R1D3_SHA256_PASS')
          PYCODE
      - name: Download exact immutable R1-D3 source as-of and revealed labels
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d3-winner-failure-asof-and-outcome-audit
          run-id: 39884755058
          github-token: ${{ github.token }}
          path: reports/r1d4/input/r1d3
      - name: Select one unique-security strong/failure pair per shared signal date
        shell: bash
        run: |
          set -euo pipefail
          python -m research_formulas.formula66_r1d4_matched_blind \
            --mode select --r1d3 reports/r1d4/input/r1d3 \
            --out reports/r1d4/result
          python - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('reports/r1d4/result/sealed_after_reveal/R1D4_MANIFEST.json')
          m=json.loads(p.read_text('utf-8'))
          assert m['n_all_original_episodes']==1249 and m['n_D20_complete']==939
          assert m['n_match_date_pairs']>=25 and m['n_blind_cards']==2*m['n_match_date_pairs']
          assert not m['strategy_ready'] and m['orders_placed']==0
          print('R1D4_MATCHED_SELECTION_RESEARCH_ONLY_VALID',m['n_match_date_pairs'])
          PYCODE
      - name: Download pinned 8-KRX original raw-price shards (no new provider requests)
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d4/input/krx
          merge-multiple: true
      - name: Render images using original historical KRX bars only; no outcome input
        shell: bash
        run: |
          set -euo pipefail
          python -m research_formulas.formula66_r1d4_matched_blind \
            --mode render \
            --selected reports/r1d4/result/internal_only/ASOF_CHART_IDENTIFIERS_DO_NOT_UPLOAD.csv \
            --krx-root reports/r1d4/input/krx \
            --out reports/r1d4/result --max-pairs 31
          rm -rf reports/r1d4/result/internal_only
      - name: Upload truly blinded chart packet independently of sealed labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d4-BLIND-review-chart-pairs-NO-FUTURE
          path: reports/r1d4/result/blind_review/**
          if-no-files-found: warn
          retention-days: 60
          compression-level: 6
      - name: Upload sealed research explanation and evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d4-SEALED-paired-outcomes-and-source
          path: |
            reports/r1d4/result/sealed_after_reveal/**
            reports/r1d4/pins/**
          if-no-files-found: warn
          retention-days: 60


  r1d5_asof_support_and_reaction_research:
    name: R1-D5 support location x rebound confirmation x D20 success/failure [research only]
    needs: read_only_source_check
    if: ${{ inputs.scope == 'r1d5_support_reaction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline data libraries only
        run: pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
      - name: Confirm root/workflow copy, 15 as-of anti-future tests
        run: |
          set -euo pipefail
          cmp .github/workflows/stockhunter_r1d3_strong_winners_external_context.yml stockhunter_r1d3_strong_winners_external_context.yml
          python -m py_compile research_formulas/formula66_r1d5_support_reaction.py
          python -m unittest discover -s tests -p test_formula66_r1d5_support_reaction.py -v
      - name: Pin existing R1-D3 and R1-D4 historical outcomes source digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/r1d5/pins
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39884755058" > reports/r1d5/pins/r1d3_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39884755058/artifacts?per_page=100" > reports/r1d5/pins/r1d3_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39896686387" > reports/r1d5/pins/r1d4_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39896686387/artifacts?per_page=100" > reports/r1d5/pins/r1d4_artifacts.json
          python - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('reports/r1d5/pins')
          for phase,run_id,commit,artifact_id,name,digest in [
             ('r1d3',39884755058,'a368f2e5f9bdc77659c1375d785d3b5368fc3964',12471499751,
             'stockhunter-r1d3-winner-failure-asof-and-outcome-audit',
             '4732f81ec1023bcf0b35a1df937adc8152206ca983c85462c4f4f5125324a0c5'),
             ('r1d4',39896686387,'728f7bf433e6ff2b8ee3241a7af5549ceae63d6d',12476368838,
             'stockhunter-r1d4-SEALED-paired-outcomes-and-source',
             '95e09c3938538e05ded853b4a85a62b165b702f368e51cb6195221b0a0270fb8')]:
            run=json.loads((p/f'{phase}_run.json').read_text())
            assert run['id']==run_id and run['conclusion']=='success' and run['head_sha']==commit
            items=json.loads((p/f'{phase}_artifacts.json').read_text())['artifacts']
            match=[a for a in items if a['id']==artifact_id and a['name']==name]
            assert len(match)==1 and not match[0]['expired'] and match[0]['digest']=='sha256:'+digest
          print('R1D5_BOTH_SOURCE_PINS_PASS',flush=True)
          PYCODE
      - name: Download frozen source as-of features and D20 labels R1-D3
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d3-winner-failure-asof-and-outcome-audit
          run-id: 39884755058
          github-token: ${{ github.token }}
          path: reports/r1d5/input/r1d3
      - name: Download frozen matched 31-pair R1-D4 reveal source
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d4-SEALED-paired-outcomes-and-source
          run-id: 39896686387
          github-token: ${{ github.token }}
          path: reports/r1d5/input/r1d4
      - name: Download 8 SHA-pinned original KRX raw-price shards (no new provider request)
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d5/input/krx
          merge-multiple: true
      - name: Rebuild signal-date support/reaction features before joining outcome labels
        shell: bash
        run: |
          set -euo pipefail
          python -m research_formulas.formula66_r1d5_support_reaction \
            --r1d3 reports/r1d5/input/r1d3 \
            --sealed reports/r1d5/input/r1d4 \
            --shards reports/r1d5/input/krx \
            --out reports/r1d5/result
          python - <<'PYCODE'
          import json,pathlib
          x=json.loads(pathlib.Path('reports/r1d5/result/MANIFEST.json').read_text())
          assert (x['n_episode'],x['n_complete'],x['n_strong'],x['n_fail'],x['n_pairs'])==(1249,939,91,286,31)
          assert not x['strategy_ready'] and x['order_count']==0
          assert x['price_bars_for_each_event']=='ONLY_DATE_LE_SIGNAL_DATE'
          print('R1D5_SUPPORT_REACTION_RESEARCH_ONLY_PASS',flush=True)
          PYCODE
      - name: Upload PRE-signal support features only, no D20 labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d5-ASOF-SUPPORT-ONLY-NO-FUTURE
          path: reports/r1d5/result/ASOF_ONLY_1249_SUPPORT_REACTION_FEATURES.csv.gz
          if-no-files-found: warn
          retention-days: 60
      - name: Upload retrospective comparisons and source manifest separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d5-SEALED-SUPPORT-REBOUND-OUTCOMES
          path: |
            reports/r1d5/result/REVEALED_ONLY_GROUP_AND_SUPPORT_FEATURES.csv.gz
            reports/r1d5/result/OUTCOME_BY_SUPPORT_AND_REACTION_BINARY_DESCRIPTIVE.csv
            reports/r1d5/result/LEVEL_SUPPORT_TOUCH_RECLAIM_FAIL_COMPARISON.csv
            reports/r1d5/result/SEALED_SAME_DATE_31_PAIR_INDICATOR_COMPARISON.csv
            reports/r1d5/result/SEALED_PAIRED_31_SUPPORT_REACTION_DIRECTIONAL.csv
            reports/r1d5/result/BOUNCE_PRICE_AND_AMOUNT_EVENT_COMPARISON.csv
            reports/r1d5/result/SUPPORT_PLUS_REACTION_INTERACTION_EXPLORATORY.csv
            reports/r1d5/result/MANIFEST.json
            reports/r1d5/pins/**
          if-no-files-found: warn
          retention-days: 60

  r1d6_frozen_support_independent_period:
    name: R1-D6 unmodified R1-D1 proxy and R1-D5 support features on 2024-25 KRX [RESEARCH ONLY]
    needs: read_only_source_check
    if: ${{ inputs.scope == 'r1d6_independent_period' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: pip install 'pandas>=2.0,<3' 'numpy>=1.24,<3'
      - name: Compare workflow twins, freeze original feature code, run regressions
        run: |
          set -euo pipefail
          cmp .github/workflows/stockhunter_r1d3_strong_winners_external_context.yml stockhunter_r1d3_strong_winners_external_context.yml
          python -m unittest discover -s tests -p test_formula66_r1d6_oos_holdout.py -v
      - name: Verify historical input artifacts unchanged and not expired
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/r1d6/pins
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39901194216" > reports/r1d6/pins/r1d5_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/39901194216/artifacts?per_page=100" > reports/r1d6/pins/r1d5_artifacts.json
          python - <<'PYCODE'
          import json,pathlib
          from research_formulas.formula66_r1d6_oos_holdout import D5_ARTIFACT_ID,D5_ARTIFACT_SHA,verify_source_frozen
          verify_source_frozen('.')
          d=pathlib.Path('reports/r1d6/pins')
          run=json.loads((d/'r1d5_run.json').read_text())
          assert run['id']==39901194216 and run['conclusion']=='success' and run['head_sha']=='611d2f7ec9441023257254cf27d86adeb8717512'
          items=json.loads((d/'r1d5_artifacts.json').read_text())['artifacts']
          matches=[a for a in items if a['id']==D5_ARTIFACT_ID and a['name']=='stockhunter-r1d5-SEALED-SUPPORT-REBOUND-OUTCOMES']
          assert len(matches)==1 and not matches[0]['expired'] and matches[0]['digest']=='sha256:'+D5_ARTIFACT_SHA
          print('R1D6_SOURCE_D5_AND_FROZEN_SCRIPT_PINS_PASS')
          PYCODE
      - name: Download frozen R1D5 development reference (not a signal generator)
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d5-SEALED-SUPPORT-REBOUND-OUTCOMES
          run-id: 39901194216
          github-token: ${{ github.token }}
          path: reports/r1d6/input/r1d5
      - name: Download SHA-pinned original 8-shard 2019-2026 KRX data
        uses: actions/download-artifact@v4
        with:
          pattern: stockhunter-allkrx-price-shard-*
          run-id: 39295295197
          github-token: ${{ github.token }}
          path: reports/r1d6/input/krx
          merge-multiple: true
      - name: Confirm ALL 1907 daily original file hashes then scan 2024-25 holdout
        run: |
          set -euo pipefail
          python -m research_formulas.formula66_r1d6_oos_holdout \
            --krx-root reports/r1d6/input/krx \
            --reference-d5 reports/r1d6/input/r1d5 \
            --repo-root . --out reports/r1d6/result
          python - <<'PYCODE'
          import json,pathlib
