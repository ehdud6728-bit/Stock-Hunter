          import json,subprocess,pathlib
          from research_formulas import stockhunter_r1d10_prospective_audit as r
          repo='ehdud6728-bit/Stock-Hunter'
          expected_names={
            'realfull':'stockhunter-v1107-4-5-73-3-6-6-24-causal-universe-full-denom-pattern-oos-exit-reports-1681',
