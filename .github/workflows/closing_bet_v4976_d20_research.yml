name: Closing Bet v49.76 D20 Research R1.6.2 (PRICE REGIME FORENSICS / READ ONLY)
on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Evaluation cutoff (YYYY-MM-DD; future days unavailable)' 
        required: true
        default: '2026-10-12'
      input_mode:
        description: 'native_reprice reuses prior complete native v49.76 backtest' 
        required: true
        default: 'native_forensics'
        type: choice
        options: ['native_forensics', 'native_reprice', 'native_backtest', 'historical_audit', 'live_ledger', 'csv']
      start:
        description: 'Start date for delivered signals (YYYY-MM-DD)'
        required: true
        default: '2026-08-03'
      source_run_id:
        description: 'For native_reprice: prior successful D20 research run ID (38561071601)' 
        required: false
        default: '38561071601'
      forensic_run_id:
        description: 'Cached KRX parity-failed run to examine without 46-session refetch'
        required: true
        default: '38574195993'
      signals_path:
        description: 'Repo input CSV path if not using run artifacts'
        required: true
        default: 'research_inputs/signals.csv'
      daily_path:
        description: 'Repo daily OHLCV CSV path if not using run artifacts'
        required: true
        default: 'research_inputs/daily.csv'
permissions:
  contents: read
  actions: write # workflow_dispatch v49.76 native backtest only
concurrency:
  group: closebet-d20-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.0,<3' 'numpy>=1.24,<3' 'yfinance>=0.2.60' google-api-python-client google-auth pykrx
      - name: Discover historical v49.76 evidence (inventory only)
        if: ${{ inputs.input_mode == 'historical_audit' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python closebet_research/discover_historical_sources.py --out reports/closebet_d20 --run-id "$SOURCE_RUN_ID"
      - name: Auto-fetch verified delivered signals and OHLCV (no fabricated replay)
        if: ${{ inputs.input_mode == 'live_ledger' }}
        env:
          GOOGLE_JSON_KEY: ${{ secrets.GOOGLE_JSON_KEY }}
          ASOF: ${{ inputs.asof }}
          START: ${{ inputs.start }}
        run: |
          mkdir -p reports/closebet_d20
          python closebet_research/prepare_live_ledger_inputs.py --start "$START" --asof "$ASOF" --out reports/closebet_d20/input
      - name: Optionally download prior evidence artifacts
        if: ${{ inputs.input_mode == 'csv' && inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p /tmp/closebet_source
          gh run download "$SOURCE_RUN_ID" --dir /tmp/closebet_source
      - name: Resolve exact, non-ambiguous CSV inputs
        if: ${{ inputs.input_mode == 'csv' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SIGNALS_PATH: ${{ inputs.signals_path }}
          DAILY_PATH: ${{ inputs.daily_path }}
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          source = pathlib.Path('/tmp/closebet_source')
          def locate(which, name):
              if os.environ.get('SOURCE_RUN_ID'):
                  found = list(source.rglob(name))
                  if len(found) != 1:
                      raise SystemExit(f'INPUT_{which}_NOT_UNIQUE: {len(found)} {name} files in run artifacts; supply canonical prepared CSV inputs')
                  return found[0]
              path = pathlib.Path(os.environ[which+'_PATH'])
              if not path.is_file():
                  raise SystemExit(f'INPUT_{which}_MISSING: {path}. See research_inputs/README.md; production workflow is unchanged.')
              return path
          for which, name in [('SIGNALS','signals.csv'),('DAILY','daily.csv')]:
              path = locate(which, name)
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write(f'D20_{which}={path.absolute()}\n')
          PY
      - name: Set research input paths (auto ledger)
        if: ${{ inputs.input_mode == 'live_ledger' }}
        run: |
          echo "D20_SIGNALS=reports/closebet_d20/input/signals.csv" >> "$GITHUB_ENV"
          echo "D20_DAILY=reports/closebet_d20/input/daily.csv" >> "$GITHUB_ENV"
      - name: Research-only D+1 through D+20
        if: ${{ inputs.input_mode == 'live_ledger' || inputs.input_mode == 'csv' }}
        env:
          ASOF: ${{ inputs.asof }}
        run: |
          python closebet_research/analyze_v4976_d20.py \
            --signals "$D20_SIGNALS" --daily "$D20_DAILY" \
            --asof "$ASOF" --out reports/closebet_d20
      # Quick forensic mode: reuse exact archived 46-session KRX pricing evidence.
      # No live scan, no new backtest, no price rewrites, no D+20 approval.
      - name: Reuse KRX cross-sectional observations for forensics only
        if: ${{ inputs.input_mode == 'native_forensics' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FORENSIC_RUN_ID: ${{ inputs.forensic_run_id }}
          ASOF: ${{ inputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FORENSIC_RUN_ID" =~ ^[0-9]{8,15}$ ]] || { echo 'FORENSIC_RUN_ID_INVALID'; exit 1; }
          mkdir -p reports/closebet_d20
          gh run download "$FORENSIC_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "closing-bet-v4976-d20-${FORENSIC_RUN_ID}" --dir reports/closebet_d20
          test -s reports/closebet_d20/native/v49_76_global_selected_top5.csv
          test -s reports/closebet_d20/native/v49_76_history_authority_global.csv
          test -s reports/closebet_d20/native_krx_input_prices.csv
          test -s reports/closebet_d20/native_krx_price_audit.json
          python - <<'PY_SOURCE'
          import json,os,pathlib
          root=pathlib.Path('reports/closebet_d20')
          o=json.loads((root/'native_source_manifest.json').read_text(encoding='utf-8'))
          p=json.loads((root/'native_krx_price_audit.json').read_text(encoding='utf-8'))
          if str(o.get('parent_run_id'))!='38561071601' or o.get('child_conclusion')!='success':
              raise SystemExit('FORENSIC_SOURCE_NOT_TRUSTED_V4976_CHILD')
          if str(p.get('asof'))!=os.environ['ASOF'] or p.get('status')!='INVALID_SOURCE_PARITY':
              raise SystemExit('FORENSIC_PRIOR_PARITY_REPORT_NOT_EXPECTED')
          if int(p.get('valid_session_count',0)) != 46 or int(p.get('price_rows',0))!=14260:
              raise SystemExit('FORENSIC_46_SESSION_EVIDENCE_NOT_COMPLETE')
          print('R162_EXACT_KRX_SOURCE_REUSED',o['parent_run_id'],'KRX_BARS',p['price_rows'])
          PY_SOURCE
      - name: Reconcile 2026-09-14 price source regime and probe by-ticker vs by-date
        if: ${{ inputs.input_mode == 'native_forensics' }}
        env:
          ASOF: ${{ inputs.asof }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID || secrets.KRX_USER_ID || secrets.KRX_USERNAME || secrets.KRX_LOGIN_ID || vars.KRX_DATA_ID || vars.KRX_ID || vars.KRX_USER_ID || vars.KRX_USERNAME || vars.KRX_LOGIN_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW || secrets.KRX_PASSWORD || secrets.KRX_PASS || secrets.KRX_LOGIN_PW || secrets.KRX_LOGIN_PASSWORD || vars.KRX_DATA_PW || vars.KRX_PW || vars.KRX_PASSWORD || vars.KRX_PASS || vars.KRX_LOGIN_PW || vars.KRX_LOGIN_PASSWORD }}
          KRX_ID: ${{ secrets.KRX_ID || secrets.KRX_DATA_ID || secrets.KRX_USER_ID || vars.KRX_ID || vars.KRX_DATA_ID || vars.KRX_USER_ID }}
          KRX_PW: ${{ secrets.KRX_PW || secrets.KRX_DATA_PW || secrets.KRX_PASSWORD || vars.KRX_PW || vars.KRX_DATA_PW || vars.KRX_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python closebet_research/native_price_regime_forensics.py \
            --selected reports/closebet_d20/native/v49_76_global_selected_top5.csv \
            --prices reports/closebet_d20/native_krx_input_prices.csv \
            --history reports/closebet_d20/native/v49_76_history_authority_global.csv \
            --asof "$ASOF" --out reports/closebet_d20 \
            --probe-providers --max-probes 14
          echo '### v49.76 after-market regime forensic ONLY — not validated signals' >> "$GITHUB_STEP_SUMMARY"
          cat reports/closebet_d20/r162_price_regime_forensics.json >> "$GITHUB_STEP_SUMMARY"
          cat reports/closebet_d20/r162_provider_probe_summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Run ORIGINAL 8-shard v49.76 backtest (not LIVE)
        if: ${{ inputs.input_mode == 'native_backtest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start }}
          ASOF: ${{ inputs.asof }}
        run: |
          set -euo pipefail
          python -m py_compile closebet_research/native_backtest_orchestrator.py closebet_research/native_backtest_report.py
          python closebet_research/native_backtest_orchestrator.py --start "$START" --end "$ASOF" --hold-days 20 --max-wait-minutes 120 --out reports/closebet_d20
      - name: Reuse original native results without recomputing 8 shards
        if: ${{ inputs.input_mode == 'native_reprice' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{8,15}$ ]] || { echo 'Explicit numeric source_run_id required'; exit 1; }
          mkdir -p reports/closebet_d20
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "closing-bet-v4976-d20-${SOURCE_RUN_ID}" --dir reports/closebet_d20
          test -s reports/closebet_d20/native/v49_76_global_selected_top5.csv
          # The old D20 scores are UNVERIFIED YAHOO subsets; remove before regenerating.
          rm -f reports/closebet_d20/native_d20_*.csv reports/closebet_d20/native_d20_quality.json
          python - <<'PY_REUSE'
          import json,os,pathlib
          p=pathlib.Path('reports/closebet_d20/native_source_manifest.json')
          obj=json.loads(p.read_text())
          if str(obj.get('parent_run_id'))!=str(os.environ['SOURCE_RUN_ID']):
              raise SystemExit('SOURCE_RUN_ID_MANIFEST_IDENTITY_MISMATCH')
          if obj.get('mode')!='NATIVE_V4976_BACKTEST' or obj.get('child_conclusion')!='success':
              raise SystemExit('REUSED_NATIVE_SOURCE_NOT_COMPLETE')
          print('REUSED_ORIGINAL_NATIVE',obj['parent_run_id'],obj['child_run_id'])
          PY_REUSE
      - name: Audit raw source, PIT scope and enforce requested as-of cutoff
        if: ${{ inputs.input_mode == 'native_reprice' || inputs.input_mode == 'native_backtest' }}
        env:
          ASOF: ${{ inputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          python closebet_research/native_source_trust_audit.py \
            --selected reports/closebet_d20/native/v49_76_global_selected_top5.csv \
            --asof "$ASOF" --out reports/closebet_d20
      - name: Re-fetch KRX dated sessions; verify historical source OHLCV parity
        if: ${{ inputs.input_mode == 'native_reprice' || inputs.input_mode == 'native_backtest' }}
        env:
          ASOF: ${{ inputs.asof }}
          # Align historical data identity with the original v49.76 prepare/shard lane.
          # Only pass KRX credentials to this isolated read-only data step.
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID || secrets.KRX_USER_ID || secrets.KRX_USERNAME || secrets.KRX_LOGIN_ID || vars.KRX_DATA_ID || vars.KRX_ID || vars.KRX_USER_ID || vars.KRX_USERNAME || vars.KRX_LOGIN_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW || secrets.KRX_PASSWORD || secrets.KRX_PASS || secrets.KRX_LOGIN_PW || secrets.KRX_LOGIN_PASSWORD || vars.KRX_DATA_PW || vars.KRX_PW || vars.KRX_PASSWORD || vars.KRX_PASS || vars.KRX_LOGIN_PW || vars.KRX_LOGIN_PASSWORD }}
          KRX_ID: ${{ secrets.KRX_ID || secrets.KRX_DATA_ID || secrets.KRX_USER_ID || secrets.KRX_USERNAME || secrets.KRX_LOGIN_ID || vars.KRX_ID || vars.KRX_DATA_ID || vars.KRX_USER_ID || vars.KRX_USERNAME || vars.KRX_LOGIN_ID }}
          KRX_PW: ${{ secrets.KRX_PW || secrets.KRX_DATA_PW || secrets.KRX_PASSWORD || secrets.KRX_PASS || secrets.KRX_LOGIN_PW || secrets.KRX_LOGIN_PASSWORD || vars.KRX_PW || vars.KRX_DATA_PW || vars.KRX_PASSWORD || vars.KRX_PASS || vars.KRX_LOGIN_PW || vars.KRX_LOGIN_PASSWORD }}
          KRX_USER_ID: ${{ secrets.KRX_USER_ID || secrets.KRX_ID || secrets.KRX_DATA_ID || vars.KRX_USER_ID || vars.KRX_ID || vars.KRX_DATA_ID }}
          KRX_PASSWORD: ${{ secrets.KRX_PASSWORD || secrets.KRX_PW || secrets.KRX_DATA_PW || vars.KRX_PASSWORD || vars.KRX_PW || vars.KRX_DATA_PW }}
        shell: bash
        run: |
          set -euo pipefail
          # Presence-only preflight; NEVER print token values.
          python - <<'PY_KRX_AUTH'
          import os
          from pathlib import Path
          has_id=bool((os.getenv('KRX_ID') or os.getenv('KRX_DATA_ID') or os.getenv('KRX_USER_ID') or '').strip())
          has_pw=bool((os.getenv('KRX_PW') or os.getenv('KRX_DATA_PW') or os.getenv('KRX_PASSWORD') or '').strip())
          Path('reports/closebet_d20').mkdir(parents=True,exist_ok=True)
          Path('reports/closebet_d20/krx_secret_presence.txt').write_text(f'KRX_ID_PRESENT={has_id}\nKRX_PW_PRESENT={has_pw}\n',encoding='utf-8')
          print('KRX_AUTH_PREFLIGHT ID=', 'PRESENT' if has_id else 'MISSING', 'PW=', 'PRESENT' if has_pw else 'MISSING')
          if not (has_id and has_pw):
              raise SystemExit('KRX_CREDENTIALS_MISSING_IN_RESEARCH_JOB; main v49.76 prepare lane has configured KRX secrets, align read-only research env')
          PY_KRX_AUTH
          python -m py_compile closebet_research/prepare_native_krx_prices.py closebet_research/native_backtest_report.py
          python closebet_research/prepare_native_krx_prices.py \
            --selected reports/closebet_d20/native/v49_76_global_selected_top5.csv \
            --asof "$ASOF" --out reports/closebet_d20
      # This runs EVEN IF parity fails. Preserve exit failure and all trust guards.
      # 2026-09-14: KRX aftermarket introduced; KRX regular close and last trade
      # after 20:00 can differ. Never silently exchange one for the other.
      - name: Forensic source comparison on failed or successful KRX parity
        if: ${{ always() && (inputs.input_mode == 'native_reprice' || inputs.input_mode == 'native_backtest') }}
        env:
          ASOF: ${{ inputs.asof }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID || secrets.KRX_USER_ID || secrets.KRX_USERNAME || secrets.KRX_LOGIN_ID || vars.KRX_DATA_ID || vars.KRX_ID || vars.KRX_USER_ID || vars.KRX_USERNAME || vars.KRX_LOGIN_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW || secrets.KRX_PASSWORD || secrets.KRX_PASS || secrets.KRX_LOGIN_PW || secrets.KRX_LOGIN_PASSWORD || vars.KRX_DATA_PW || vars.KRX_PW || vars.KRX_PASSWORD || vars.KRX_PASS || vars.KRX_LOGIN_PW || vars.KRX_LOGIN_PASSWORD }}
          KRX_ID: ${{ secrets.KRX_ID || secrets.KRX_DATA_ID || secrets.KRX_USER_ID || vars.KRX_ID || vars.KRX_DATA_ID || vars.KRX_USER_ID }}
          KRX_PW: ${{ secrets.KRX_PW || secrets.KRX_DATA_PW || secrets.KRX_PASSWORD || vars.KRX_PW || vars.KRX_DATA_PW || vars.KRX_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/closebet_d20
          if [ -s reports/closebet_d20/native_krx_input_prices.csv ] && [ -s reports/closebet_d20/native/v49_76_global_selected_top5.csv ]; then
            python closebet_research/native_price_regime_forensics.py \
              --selected reports/closebet_d20/native/v49_76_global_selected_top5.csv \
              --prices reports/closebet_d20/native_krx_input_prices.csv \
              --history reports/closebet_d20/native/v49_76_history_authority_global.csv \
              --asof "$ASOF" --out reports/closebet_d20 \
              --probe-providers --max-probes 14
          else
            echo 'R162_PRICE_INPUTS_UNAVAILABLE; no false diagnosis' | tee reports/closebet_d20/r162_no_price_inputs.txt
          fi
      - name: Evaluate verified D+1 through D+20 with official trading-day calendar
        if: ${{ inputs.input_mode == 'native_reprice' || inputs.input_mode == 'native_backtest' }}
        env:
          ASOF: ${{ inputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          python closebet_research/native_backtest_report.py \
            --source-root reports/closebet_d20/native --asof "$ASOF" --out reports/closebet_d20 \
            --prices-csv reports/closebet_d20/native_krx_input_prices.csv \
            --sessions-csv reports/closebet_d20/native_krx_session_coverage.csv \
            --require-krx-parity-json reports/closebet_d20/native_krx_price_audit.json
          echo '### Native historical D+20: KRX daily-source parity checked' >> "$GITHUB_STEP_SUMMARY"
          cat reports/closebet_d20/native_source_trust_audit.json >> "$GITHUB_STEP_SUMMARY"
          cat reports/closebet_d20/native_krx_price_audit.json >> "$GITHUB_STEP_SUMMARY"
          cat reports/closebet_d20/native_d20_quality.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-bet-v4976-d20-${{ github.run_id }}
          path: reports/closebet_d20/
          retention-days: 30
          if-no-files-found: warn
