schema: 1
spec_version: search-spec-v1
purpose: "의도한 검색식, LIVE 구현, BACKTEST 구현의 일치 감사"
authority:
  primary_strategy_priority: [L, LP, SLOCK, S, G, IT, H, I, A, B1, B2, C]
  preserve_all_matches: true
  live_auto_order: false
  operation_mode: PAPER
common:
  universe: "KOSPI200 또는 KOSDAQ150 또는 시가총액 예외 기준"
  minimum_price_constant: MIN_PRICE
  amount_source_preference: [ACTUAL_AMOUNT, CLOSE_X_VOLUME_FILL, CLOSE_X_VOLUME]
  freshness_fields: [data_date, expected_trading_date, bar_is_today, bar_freshness]
strategies:
  G:
    label: 모랄레스갭
    independent_predicate: true
    conditions:
      - "갭상승 GAP_MIN_PCT 이상 GAP_MAX_PCT 이하"
      - "Vol50 GAP_VOL50_MULT 이상"
      - "갭/전일종가 지지"
      - "시가 지지와 캔들 중간 이상 종가"
      - "60일 박스 또는 120일 신고가 돌파"
      - "20일 이격, 20일 상승률, 윗꼬리 클라이맥스 제외"
  L:
    label: 대형주리더갭
    independent_predicate: true
    conditions:
      - "KOSPI200/대형시총/초대형거래대금 중 하나"
      - "LEADER_GAP_MIN_AMOUNT_B 이상"
      - "갭, Vol50, 갭구간, 시가지지, 종가위치, 신고가권 조건"
  LP:
    label: 리더갭눌림재지지
    independent_predicate: false
  SLOCK:
    label: 상단잠김
    independent_predicate: false
  S:
    label: 고점권재응축
    independent_predicate: false
  IT:
    label: I-TRIGGER
    independent_predicate: false
    duplicate_pool_rule: "IT는 I pool에 중복 포함하지 않는다"
  H:
    label: 신고가거자름/전고재돌파
    independent_predicate: false
  I:
    label: 시대중심주
    independent_predicate: false
  A:
    label: 돌파
    independent_predicate: false
  B1:
    label: 엔벨로프엄격
    independent_predicate: false
  B2:
    label: 볼린저확장
    independent_predicate: false
  C:
    label: 역매공파
    independent_predicate: false
audit_contract:
  live_vs_backtest_same_ohlcv: required
  independent_spec: [G, L]
  boundary_tests: required
  false_negative_gate: 0
  false_positive_gate: 0
  primary_mismatch_gate: 0
  complex_negative_scope: "결정적 표본감사이며 전수 0건으로 표현하지 않는다"
outputs:
  - reports/v49_56_search_intent_parity.csv
  - reports/v49_56_search_condition_audit.csv
  - reports/v49_56_search_boundary_tests.csv
  - reports/v49_56_search_spec_manifest.json
