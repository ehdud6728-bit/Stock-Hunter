name: StockHunter R1-D17 Frozen Historical Green Grade x MA Compression x Pullback (RESEARCH ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical_grade_repro:
    name: R1-D17 immutable 12-day labels x R143 returns x TRUST QA [NOT NEW OOS]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RESEARCH_ONLY: '1'
      STOCKHUNTER_ORDER_ENABLE: '0'
      STOCKHUNTER_LIVE_ENABLE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check ROOT protocol, matching YML copies, isolated tests and frozen Git blobs
        run: |
          set -euo pipefail
          test -f R1D17_PREDECLARED_PROTOCOL.json || { echo R1D17_ROOT_PROTOCOL_MISSING; exit 52; }
          cmp -s stockhunter_r1d17_frozen_green_integrated.yml .github/workflows/stockhunter_r1d17_frozen_green_integrated.yml
          echo 'f245d410134f467c521a7e66ba2db2af3d7df0c65874eb3d415ad6e12a0e0339  R1D17_PREDECLARED_PROTOCOL.json' | sha256sum -c -
          python -m pip install --disable-pip-version-check numpy pandas
          python -m unittest discover -s tests -p test_stockhunter_r1d17_integrated_frozen.py -v
          python - <<'PYCHK'
          from research_formulas.stockhunter_r1d17_integrated_frozen import load_protocol,audit_repo_readonly
          p=load_protocol('R1D17_PREDECLARED_PROTOCOL.json')
          assert audit_repo_readonly('.',p)
          print('R1D17_FROZEN_SOURCE_PROTOCOL_AND_WORKFLOW_TWINS_PASS')
          PYCHK
      - name: Verify immutable historical run heads and artifact ZIP SHA256 metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYLOCK'
          import json,os,urllib.request,pathlib
          p=json.load(open('R1D17_PREDECLARED_PROTOCOL.json',encoding='utf-8'))
          sources=p['daily_sources']+list(p['pinned_sources'].values())
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
            rq=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(rq,timeout=30) as response:return json.load(response)
          out=pathlib.Path('reports/r1d17/pins');out.mkdir(parents=True,exist_ok=True)
          for item in sources:
            run=get('/actions/runs/'+str(item['run_id']))
            assert run['id']==item['run_id'] and run['conclusion']=='success' and run['head_sha']==item['head_sha'],'R1D17_RUN_HEAD_DRIFT_'+str(item['run_id'])
            arts=get('/actions/runs/'+str(item['run_id'])+'/artifacts?per_page=100')['artifacts']
            match=[z for z in arts if z['id']==item['artifact_id'] and z['name']==item['artifact_name'] and z['digest']=='sha256:'+item['zip_sha256'] and not z['expired']]
            assert len(match)==1,'R1D17_ARCHIVE_DIGEST_DRIFT_'+str(item['run_id'])
            (out/(str(item['run_id'])+'_artifact.json')).write_text(json.dumps(match[0],ensure_ascii=False,sort_keys=True),encoding='utf-8')
          print('R1D17_ALL_14_GITHUB_RUN_HEAD_AND_ARTIFACT_DIGEST_PINS_PASS')
          PYLOCK
      - name: Download frozen REAL_FULL grade day 20261002 (run 37008576778)
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-v1107-4-5-73-3-6-6-24-causal-universe-full-denom-pattern-oos-exit-reports-1589
          run-id: '37008576778'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/r1d17/input/historic/20261002
      - name: Download frozen REAL_FULL grade day 20261008 (run 37785940981)
