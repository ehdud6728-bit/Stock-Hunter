      - name: Download frozen R1D13 artifact
        uses: actions/download-artifact@v4
        with:
          name: stockhunter-r1d13-FROZEN-FULLCOHORT-CONTAMINATION-SCOPE-NOT-OOS
          run-id: '40096795372'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/r1d17/input/r1d13
      - name: Deterministic full 12-day historical grade x R143 x quality reproduction
        run: |
          set -euo pipefail
          python -m research_formulas.stockhunter_r1d17_integrated_frozen \
            --archives reports/r1d17/input/historic \
            --r143 reports/r1d17/input/r143 \
            --r1d13 reports/r1d17/input/r1d13 \
            --protocol R1D17_PREDECLARED_PROTOCOL.json \
            --repo-root . --out reports/r1d17/result
          python - <<'PYASSERT'
          import json,pandas as pd
          m=json.load(open("reports/r1d17/result/R1D17_MANIFEST.json"))
          assert m["historical_graded_signal_rows"]==180 and m["r143_matched_seed_signals"]==150
          assert m["matured_outcome_horizon_rows"]==345 and m["n_d5_mature"]==75 and m["n_d10_mature"]==30
          assert m["production_unchanged"] and m["orders_placed"]==0 and m["not_new_oos"]
          g=pd.read_csv("reports/r1d17/result/R1D17_GRADE_WINRATES.csv")
          assert len(g)==12 and int(g[(g.horizon_td==10)&(g.grade=="GREEN")].wins.iloc[0])==6
          print("R1D17_REAL_GITHUB_FROZEN_180_GRADE_345_HORIZON_REPLAY_PASS")
          PYASSERT
      - name: Upload frozen historical evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockhunter-r1d17-FROZEN-12DAY-GREEN-FEATURE-GIVEBACK-NOT-NEW-OOS
          retention-days: 60
          if-no-files-found: warn
          path: |
            reports/r1d17/result/**
            reports/r1d17/pins/**
            R1D17_PREDECLARED_PROTOCOL.json
